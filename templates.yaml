        states('sensor.sovrummet_lufttryck') | float,
        states('sensor.wc_lufttryck') | float,
        states('sensor.annas_rum_lufttryck') | float,
        states('sensor.koket_lufttryck') | float,
        states('sensor.skafferiet_lufttryck') | float,
        states('sensor.eriks_rum_lufttryck') | float,
        states('sensor.badrummet_lufttryck') | float,
        states('sensor.tvattstugan_lufttryck') | float,
        states('sensor.forradet_lufttryck') | float
      ] %} {{ sensors | select('is_number') | min | round(1) }}
    unit_of_measurement: hPa
  - default_entity_id: sensor.lufttryck_inomhus_max
    unique_id: indoor_pressure_max_05s6df0a1sg0asg8dd1asgr1aaasg
    name: Lufttryck inomhus max
    state: |
      {% set sensors = [
        states('sensor.ilias_rum_lufttryck') | float,
        states('sensor.netatmo_bennani_vs_inomhus_pressure') | float,
        states('sensor.sovrummet_lufttryck') | float,
        states('sensor.wc_lufttryck') | float,
        states('sensor.annas_rum_lufttryck') | float,
        states('sensor.koket_lufttryck') | float,
        states('sensor.skafferiet_lufttryck') | float,
        states('sensor.eriks_rum_lufttryck') | float,
        states('sensor.badrummet_lufttryck') | float,
        states('sensor.tvattstugan_lufttryck') | float,
        states('sensor.forradet_lufttryck') | float
      ] %} {{ sensors | select('is_number') | max | round(1) }}
    unit_of_measurement: hPa
  - default_entity_id: sensor.ljusstyrka_framsidan_maximal
    unique_id: 05s6df0a1sg0asg8dd1asgr1aaasgddda
    name: Ljusstyrka framsidan maximal
    state: "{% set framsidan = states(\"sensor.utomhus_framsidan_ljusstyrka\") | float %} {% set fonstret = states(\"sensor.ilias_fonster_ljusstyrka\") | float %} {% if is_state(\"light.ljusslingan_pa_balkongen\",\"on\") %} {{ states(\"sensor.utomhus_framsidan_ljusstyrka\") | float }} {% else %} {{ [ framsidan , fonstret ] | max }} {% endif %} \n"
    unit_of_measurement: lx
  - default_entity_id: sensor.blixtinfo
    name: Info om den senaste blixten
    state: |
      {{ states("sensor.blitzortung_lightning_counter") }}
    attributes:
      nr: |
        {{ states("sensor.blitzortung_lightning_counter") }}
      latitude: |
        {{ state_attr("sensor.blitzortung_lightning_azimuth", "lat") }}
      longitude: |
        {{ state_attr("sensor.blitzortung_lightning_azimuth", "lon") }}
  - default_entity_id: sensor.ilias_nara_hemmet
    name: Ilias är nära hemmet
    state: |
      {{  states.device_tracker.ilias_s23_ultra and states.zone.home and
          distance(states.device_tracker.ilias_s23_ultra, states.zone.home) < 7 }}
  - default_entity_id: sensor.anna_nara_hemmet
    name: Anna är nära hemmet
    state: |
      {{  states.device_tracker.anna_s22_ultra and states.zone.home and
          distance(states.device_tracker.anna_s22_ultra, states.zone.home) < 7 }}
- binary_sensor:
  - default_entity_id: binary_sensor.soligt
    name: Det är soligt
    state: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int >= states(''input_number.settings_ljusstyrka_soligt_ute'') | int or states(''sensor.utomhus_baksidan_ljusstyrka'') | int >= states(''input_number.settings_ljusstyrka_soligt_ute'') | int}}'
    icon: "{% if states('sensor.utomhus_framsidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int \n    or states('sensor.utomhus_baksidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int  %}\n  mdi:weather-sunny\n{% else %}\n  mdi:weather-cloudy\n{% endif %}        "
    delay_off:
      minutes: 15
  - default_entity_id: binary_sensor.soligt_framsidan
    name: Det är soligt på framsidan
    state: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int >= 13000 }}'
    icon: "{% if states('sensor.utomhus_framsidan_ljusstyrka') | int >= 13000 %}\n  mdi:weather-sunny\n{% else %}\n  mdi:weather-cloudy\n{% endif %}           "
    delay_off:
      minutes: 15
  - default_entity_id: binary_sensor.soligt_baksidan
    name: Det är soligt på baksidan
    state: '{{ states(''sensor.utomhus_baksidan_ljusstyrka'') | int >= 13000 }}'
    icon: "{% if states('sensor.utomhus_baksidan_ljusstyrka') | int >= 13000 %}\n  mdi:weather-sunny\n{% else %}\n  mdi:weather-cloudy\n{% endif %}           "
    delay_off:
      minutes: 15
  - default_entity_id: binary_sensor.solen_lyser_in_genom_fonstren_pa_framsidan
    name: Solen lyser in genom fönstren på framsidan
    state: |
      {{ is_state("input_select.house_time_modes","Dag") and is_state("binary_sensor.soligt_framsidan","on") and (states("sensor.sun_azimuth") | float > states("input_number.settings_rullgardiner_framsidan_azimuth") | int or states("sensor.sun_elevation") | float < states("input_number.settings_rullgardiner_framsidan_elevation") | int) }}
  - default_entity_id: binary_sensor.solen_lyser_in_genom_fonstren_pa_baksidan
    name: Solen lyser in genom fönstren på baksidan
    state: |
      {{ is_state("input_select.house_time_modes","Dag")  and is_state("binary_sensor.soligt_baksidan","on") and states("sensor.sun_azimuth") | int < states("input_number.settings_rullgardiner_annas_rum_azimuth_upp") | int and states("sensor.sun_elevation") | int > states("input_number.settings_rullgardiner_annas_rum_elevation_ner") | int }}
  - default_entity_id: binary_sensor.ljust_pa_framsidan_dagtid_pa_vintern
    name: Det är ljust på framsidan dagtid (vinter och snö)
    state: "{{ is_state(\"input_select.house_time_modes\",\"Dag\") \n    and states(\"sensor.netatmo_bennani_vs_utomhus_temperature\") | int < -1 \n    and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int > 8000 }}\n"
  - default_entity_id: binary_sensor.brevladans_lucka
    name: Brevlådans lucka
    state: |
      {{ is_state("sensor.brevladans_lucka","22") }}
  - default_entity_id: binary_sensor.julbelysning
    name: julbelysning
    state: |
      {% set year = now().year %} {% set christmas_day = strptime(year ~ '-12-25', '%Y-%m-%d') %} {% set first_advent = christmas_day - timedelta(days=(christmas_day.weekday() + 22)) %} {% set friday_before_first_advent = first_advent - timedelta(days=2) %} {% set next_year = now().year + 1 %} {% set jan_6 = strptime(next_year ~ '-01-06', '%Y-%m-%d') %} {% set end_date = jan_6 if jan_6.weekday() == 6 else (jan_6 + timedelta(days=(6 - jan_6.weekday()))) %}
      {{ now().replace(tzinfo=None) >= friday_before_first_advent and now().replace(tzinfo=None) <= end_date }}
  - default_entity_id: binary_sensor.tvattmaskinen_aktiv
    name: Tvättmaskinen är aktiv
    state: |
      {% set power = states('sensor.tvattmaskinen_switch_power') | float %} {% if power >= 600 %}
        true
      {% elif power <= 5 %}
        false
      {% else %}
        states('binary_sensor.tvattmaskinen_aktiv') == 'on'
      {% endif %}
    device_class: running
    delay_on: 00:03:00
    delay_off: 00:02:00
