    state: '{{ states.device_tracker | selectattr(''state'', ''eq'', ''home'')  | rejectattr( ''entity_id'', ''in'',  [''device_tracker.04_db_56_e7_fa_2a'', ''device_tracker.50338bfc2eb9'', ''device_tracker.546009d0b9da'', ''device_tracker.546009fa5416'', ''device_tracker.606dc75b9e85'', ''device_tracker.albins_dell_16_2'', ''device_tracker.amazonee0d363a9'', ''device_tracker.b8_27_eb_a4_b6_c1'', ''device_tracker.anneliesipad'', ''device_tracker.broadlink_outlett1eba119'', ''device_tracker.chromecastaudio'', ''device_tracker.galaxywatch5875'', ''device_tracker.desktop_n7v6eee'' ''device_tracker.galaxytabs4'', ''device_tracker.googlehome'', ''device_tracker.googlehome_2'', ''device_tracker.googlehome_3'', ''device_tracker.googlehome_4'', ''device_tracker.googlehome_5'', ''device_tracker.google_nest_mini'', ''device_tracker.iliasprivatadator'', ''device_tracker.ringpro96'', ''device_tracker.40_b0_76_06_ab_a1'']) | list | count }}                   '
    unit_of_measurement: st
  - default_entity_id: sensor.opened_doors_and_windows_count
    name: Öppnade fönster och dörrar
    state: '{% set sensors = expand(''group.opened_doors_and_windows'') %} {% set opened_count = sensors | selectattr(''state'', ''eq'', ''on'') | list | length %} {{ opened_count }}'
    unit_of_measurement: st
  - default_entity_id: sensor.family_people_home_count
    name: Hur många familjemedlemmar är hemma
    state: '{{ states|selectattr(''entity_id'',''in'',state_attr(''group.family_phones'',''entity_id''))|selectattr(''state'',''eq'',''home'')|list|count }}'
    unit_of_measurement: personer
  - default_entity_id: sensor.diskmaskinen_diskar
    name: Diskmaskinen diskar
    state: |
      {% if   states("sensor.diskmaskin_switch_power") | float >  60  %} true             {% elif states("sensor.diskmaskin_switch_power") | float <= 60
          and states("sensor.diskmaskin_switch_power") | float > states("input_number.settings_diskmaskinen_energi_klar") | float
          and is_state("sensor.diskmaskinen_diskar","true")  %} {{ states("sensor.diskmaskinen_diskar") }}
      {% elif states("sensor.diskmaskin_switch_power") | float < states("input_number.settings_diskmaskinen_energi_klar") | float
          and is_state("sensor.diskmaskinen_diskar","true") %} false
      {% else %} false {% endif %}
  - default_entity_id: sensor.luftavfuktaren_torkar
    name: Luftavfuktaren torkar
    state: |
      {% if   states("sensor.luftavfuktare_switch_power") | float >  100  %} true             {% elif states("sensor.luftavfuktare_switch_power") | float <= 100
          and states("sensor.luftavfuktare_switch_power") | float > states("input_number.settings_luftavfuktaren_energi_klar") | float
          and is_state("sensor.luftavfuktaren_torkar","true")  %} {{ states("sensor.luftavfuktaren_torkar") }}
      {% elif states("sensor.luftavfuktare_switch_power") | float < states("input_number.settings_luftavfuktaren_energi_klar") | float
          and is_state("sensor.luftavfuktaren_torkar","true") %} false
      {% else %} false {% endif %}
  - default_entity_id: sensor.sony_tv_current_source
    name: Sony-tv current source
    state: |-
      {% if is_state("media_player.sony_tv_i_vardagsrummet","off") %}
        off
      {% else %}
        {{ states.media_player.sony_tv_i_vardagsrummet.attributes.media_content_id }}
      {% endif %}
  - default_entity_id: sensor.google_home_current_volume
    name: Google Home current volume
    state: |-
      {% if is_state("media_player.googlehome_koket","off") %}
        off
      {% else %}
        {{ states.media_player.googlehome_koket.attributes.volume_level | round(2) * 100 | int }}
      {% endif %}
  - default_entity_id: sensor.fejk_mobil
    name: Fejkosensor/mobil
    state: '{% if 1 %} home {% else %} home {% endif %}'
  - default_entity_id: sensor.utomhus_ljusstyrka_differens
    name: Differens i ljusstyrka mellan framsidan och baksidan. Alltid positiva värden
    state: '{{ ((states(''sensor.utomhus_framsidan_ljusstyrka'') | int) - (states(''sensor.utomhus_baksidan_ljusstyrka'') | int)) | abs }}'
  - default_entity_id: sensor.utomhus_ljusstyrka_differens_procent
    name: Differens i procent för ljusstyrkan mellan framsidan och baksidan. Alltid positiva värden
    state: |-
      {% set front = states('sensor.utomhus_baksidan_ljusstyrka') | float %} {% set back = states('sensor.utomhus_framsidan_ljusstyrka') | float %} {% if front == 0 and back == 0 %}
        0
      {% elif front == 0 or back == 0 %}
        100
      {% else %}
        {% set difference = front - back if front > back else back - front %}
        {{ ((difference / ((front + back) / 2)) * 100) | round(1) }}
      {% endif %}
    unit_of_measurement: '%'
  - default_entity_id: sensor.utomhus_ljusstyrka_genomsnitt
    name: Genomsnittlig ljusstyrka mellan framsidan och baksidan. Alltid positiva värden
    state: '{{ ((states(''sensor.utomhus_baksidan_ljusstyrka'') | int + states(''sensor.utomhus_framsidan_ljusstyrka'') | int) / 2) | int }}'
  - default_entity_id: sensor.elpriset_denna_timme
    name: Nordpool elpris SE3 denna timme
    state: '{% set tid = now().strftime(''%H'') | int %} {{ state_attr("sensor.nordpool_kwh_se3_sek_3_10_025","today")[tid] }}'
  - default_entity_id: sensor.elkostnad_denna_timme
    name: El-kostnad denna timme
    state: '{% set tid = now().strftime(''%H'') | int %} {{ (states(''sensor.accumulated_consumption_current_hour_eksharadsgatan_6'') | float) }}'
  - default_entity_id: sensor.dishwasher_cheapest_interval
    name: Dishwasher Cheapest Interval
    state: >
      {% set run_time_minutes = states('input_number.dishwasher_run_time') | int %}
      {% set price_cap = 3 %}
      {% set prices = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_today') %}
      {% set cheapest_interval = none %}
      {% set lowest_sum = float('inf') %}

      {% for i in range(prices | length - 1) %}
        {% set interval_start = as_datetime(prices[i].start) %}
        {% set interval_end = interval_start + timedelta(minutes=run_time_minutes) %}
        {% set total_price = 0 %}
        {% set valid_interval = true %}

        {% for hour in prices %}
          {% set hour_start = as_datetime(hour.start) %}
          {% set hour_end = as_datetime(hour.end) %}
          {% if hour_start >= interval_start and hour_end <= interval_end %}
            {% if hour.value > price_cap %}
              {% set valid_interval = false %}
            {% else %}
              {% set total_price = total_price + hour.value %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if valid_interval and total_price < lowest_sum %}
          {% set lowest_sum = total_price %}
          {% set cheapest_interval = [interval_start.isoformat(), interval_end.isoformat()] %}
        {% endif %}
      {% endfor %}
      {{ cheapest_interval[0] if cheapest_interval is not none else 'No valid interval' }}
    attributes:
      cheapest_interval: >
        {{ cheapest_interval if cheapest_interval is not none else [] }}
      lowest_sum: >
        {{ lowest_sum if cheapest_interval is not none else 'N/A' }}
  - default_entity_id: sensor.ljust_utomhus_framsidan
    name: Hur ljust är det på framsidan?
    state: "{% if states(\"sensor.utomhus_framsidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_soligt_ute\") | int %} soligt {% elif states(\"sensor.utomhus_framsidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_soligt_ute\") | int \n  and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_ljust_ute\") | int %} ljust\n{% elif states(\"sensor.utomhus_framsidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_ljust_ute\") | int \n  and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_morkt_ute\") | int %} {{ states(\"sensor.ljust_utomhus_framsidan\") }}\n{% elif states(\"sensor.utomhus_framsidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_morkt_ute\") | int\n  and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_nattljus_ute\") | int %} mörkt\n{% else %} nattljus {% endif\
      \ %} \n"
  - default_entity_id: sensor.ljust_utomhus_baksidan
    name: Hur ljust är det på baksidan?
    state: "{% if states(\"sensor.utomhus_baksidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_soligt_ute\") | int %} soligt {% elif states(\"sensor.utomhus_baksidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_soligt_ute\") | int \n  and states(\"sensor.utomhus_baksidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_ljust_ute\") | int %} ljust\n{% elif states(\"sensor.utomhus_baksidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_ljust_ute\") | int \n  and states(\"sensor.utomhus_baksidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_morkt_ute\") | int %} {{ states(\"sensor.ljust_utomhus_framsidan\") }}\n{% elif states(\"sensor.utomhus_baksidan_ljusstyrka\") | int <= states(\"input_number.settings_ljusstyrka_morkt_ute\") | int\n  and states(\"sensor.utomhus_baksidan_ljusstyrka\") | int > states(\"input_number.settings_ljusstyrka_nattljus_ute\") | int %} mörkt\n{% else %} nattljus {% endif %} \n"
  - default_entity_id: sensor.lufttryck_inomhus
