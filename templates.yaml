    name: Solnedgång
    state: '{{ as_timestamp(states.sun.sun.attributes.next_setting)  | timestamp_custom("%H:%M") }}'
  - default_entity_id: sensor.sunrise_time
    name: Soluppgång
    state: '{{ as_timestamp(states.sun.sun.attributes.next_rising)  | timestamp_custom("%H:%M") }}'
  - default_entity_id: sensor.sun_elevation
    name: Sol elvation
    state: '{{ states.sun.sun.attributes.elevation }}'
  - default_entity_id: sensor.sun_azimuth
    name: Sol azimuth
    state: '{{ states.sun.sun.attributes.azimuth }}'
  - default_entity_id: sensor.sun_next_noon
    name: Sol maxhöjd
    state: '{{ as_timestamp(states.sun.sun.attributes.next_noon)  | timestamp_custom("%H:%M") }}'
  - default_entity_id: sensor.sun_next_midnight
    name: Midnatt
    state: '{{ as_timestamp(states.sun.sun.attributes.next_midnight)  | timestamp_custom("%H:%M") }}'
