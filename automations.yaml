            and is_state("media_player.denon_avr_x2800h","off")
            and not is_state("input_select.vardagsrummet_belysning","Släckt")
            and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed) | int(default = 0) ) > (60 * 15) %} 
          Släckt
          {% elif states("input_select.house_time_modes") in ["Morgon","Dag"]
            and is_state("group.rorelse_i_vardagsrummet","on") 
            and not is_state("input_select.vardagsrummet_belysning","Släckt")
            and (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0)) < 15
            and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed) | int(default = 0) ) 
                < (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0) ) %} 
          Släckt
          {% else %}
          {{ states("input_select.vardagsrummet_belysning") }}
          {% endif %}


# Styr lampan i övre trappan beroende på olika förhållanden
