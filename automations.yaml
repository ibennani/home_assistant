      value: 'false'
- id: automation_vardagsrum_rullgardiner_automatic_logic
  alias: 'Rullgardiner: Styr rullgardinerna i vardagsrummet (Solskydd)'
  description: Hanterar rena solskyddsgardiner baserat på solinsläpp, TV-status, ljusstyrka
    och husläge. TV måste vara aktiv i minst 30 sekunder innan gardiner dras ner. Lux under
    300 i 10 minuter öppnar gardinerna även med TV på. TV av öppnar direkt om solskydd inte
    gäller.
  triggers:
  - id: rullgardiner_ner_tv
    trigger: template
    value_template: '{% set lux = states(''sensor.utomhus_framsidan_ljusstyrka'')
      | float(-1) %} {% set tv_aktiv = states(''media_player.sony_tv_i_vardagsrummet'')
      in [''playing'', ''on'', ''idle'', ''paused''] %} {{ tv_aktiv and lux >= 300 }}

      '
    for: '00:00:30'
  - id: rullgardiner_ner_sol_framsidan
    trigger: state
    entity_id: binary_sensor.solen_lyser_in_genom_fonstren_pa_framsidan
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - id: rullgardiner_ner_sol_vinter
    trigger: state
    entity_id: binary_sensor.ljust_pa_framsidan_dagtid_pa_vintern
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - id: rullgardiner_upp_lux
    trigger: template
    value_template: '{% set lux = states(''sensor.utomhus_framsidan_ljusstyrka'')
      | float(-1) %} {% set tv_aktiv = states(''media_player.sony_tv_i_vardagsrummet'')
      in [''playing'', ''on'', ''idle'', ''paused''] %} {{ lux < 300 and not tv_aktiv
      and lux >= 0 }}

      '
    for:
      minutes: 10
  - id: rullgardiner_upp_lux_tv
    trigger: template
    value_template: '{% set lux = states(''sensor.utomhus_framsidan_ljusstyrka'')
      | float(-1) %} {% set tv_aktiv = states(''media_player.sony_tv_i_vardagsrummet'')
      in [''playing'', ''on'', ''idle'', ''paused''] %} {{ lux < 300 and tv_aktiv
      and lux >= 0 }}

      '
    for:
      minutes: 10
  - id: rullgardiner_upp_sol_framsidan
    trigger: state
    entity_id: binary_sensor.solen_lyser_in_genom_fonstren_pa_framsidan
    to: 'off'
    not_from:
    - unavailable
    - unknown
  - id: rullgardiner_upp_sol_vinter
    trigger: state
    entity_id: binary_sensor.ljust_pa_framsidan_dagtid_pa_vintern
    to: 'off'
    not_from:
    - unavailable
    - unknown
  - id: rullgardiner_upp_tv_av
    trigger: state
    entity_id: media_player.sony_tv_i_vardagsrummet
    not_from:
    - unavailable
    - unknown
    - playing
    - 'on'
    - idle
    - paused
    not_to:
    - unavailable
    - unknown
  - id: rullgardiner_upp_huslage
    trigger: state
    entity_id: input_select.house_time_modes
    to:
    - Kväll
    - Natt
    not_from:
    - unavailable
    - unknown
  actions:
  - variables:
      tv_aktiv: "{{ states('media_player.sony_tv_i_vardagsrummet') in ['playing', 'on', 'idle', 'paused'] }}"
      sol_framsidan: "{{ is_state('binary_sensor.solen_lyser_in_genom_fonstren_pa_framsidan', 'on') }}"
      sol_vinter: "{{ is_state('binary_sensor.ljust_pa_framsidan_dagtid_pa_vintern', 'on') }}"
      solskydd: "{{ sol_framsidan or sol_vinter }}"
      gardiner_att_stanga: >
        {{ expand(['cover.rullgardin_vardagsrummet', 'cover.rullgardin_balkongdorren'])
           | selectattr('state', 'ne', 'closed') | map(attribute='entity_id') | list }}
      gardiner_att_opena: >
        {{ expand(['cover.rullgardin_vardagsrummet', 'cover.rullgardin_balkongdorren'])
           | selectattr('state', 'ne', 'open') | map(attribute='entity_id') | list }}
  - choose:
    - conditions:
      - condition: template
        value_template: >
          {% if trigger.id == 'rullgardiner_ner_tv' %}
            true
          {% elif trigger.id in ['rullgardiner_ner_sol_framsidan', 'rullgardiner_ner_sol_vinter'] %}
            {{ not tv_aktiv }}
          {% else %}
            false
          {% endif %}
      sequence:
      - condition: template
        value_template: "{{ gardiner_att_stanga | length > 0 }}"
      - action: cover.close_cover
        target:
          entity_id: "{{ gardiner_att_stanga }}"
    - conditions:
      - condition: template
        value_template: >
          {% if trigger.id in ['rullgardiner_upp_lux', 'rullgardiner_upp_lux_tv', 'rullgardiner_upp_huslage'] %}
            true
          {% elif trigger.id in ['rullgardiner_upp_sol_framsidan', 'rullgardiner_upp_sol_vinter', 'rullgardiner_upp_tv_av'] %}
            {{ not tv_aktiv and not solskydd }}
          {% else %}
            false
          {% endif %}
      sequence:
      - condition: template
        value_template: "{{ gardiner_att_opena | length > 0 }}"
      - action: cover.open_cover
        target:
          entity_id: "{{ gardiner_att_opena }}"
  mode: restart
