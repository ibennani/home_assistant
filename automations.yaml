      / 255 * 100) | round(0) | int(0) }}'
    handfat_pct: '{{ ((state_attr(''light.wc_handfat'',''brightness'') | int(0)) /
      255 * 100) | round(0) | int(0) }}'
    max_mode: "{{ is_state('light.taklampa_wc','on')\n   and is_state('light.wc_spegelskap','on')\n
      \  and is_state('light.wc_handfat','on')\n   and tak_pct == 100\n   and spegel_pct
      == 100\n   and handfat_pct == 100 }}\n"
    lux_thresholds:
    - 100
    - 300
    - 1000
    - 2000
    - 5000
    - 13000
    - 25000
    bri_tak_auto_pct: '{% if lux < 100 %} 10 {% elif lux < 300 %} 20 {% elif lux <
      1000 %} 25 {% elif lux < 2000 %} 30 {% elif lux < 5000 %} 35 {% else %} 0 {%
      endif %}'
    bri_spegel_auto_pct: "{% if lux < 100 %}\n  {% if is_night %} 5 {% else %} 50
      {% endif %}\n{% elif lux < 300 %} 50 {% elif lux < 1000 %} 50 {% elif lux <
      2000 %} 90 {% elif lux < 5000 %} 95 {% elif lux <= 13000 %} 90 {% else %} 0
      {% endif %}"
    bri_handfat_auto_pct: "{% if lux < 100 %}\n  {% if is_night %} 5 {% else %} 30
      {% endif %}\n{% elif lux < 300 %} 40 {% elif lux < 1000 %} 40 {% elif lux <
      2000 %} 50 {% elif lux < 5000 %} 90 {% elif lux <= 13000 %} 99 {% else %} 0
      {% endif %}"
    bri_tak_btn_pct: '{{ bri_tak_auto_pct }}'
    bri_spegel_btn_pct: "{% if lux < 100 %}\n  {% if is_night %} 5 {% else %} 50 {%
      endif %}\n{% elif lux < 300 %} 50 {% elif lux < 1000 %} 50 {% elif lux < 2000
      %} 90 {% elif lux < 5000 %} 95 {% elif lux <= 13000 %} 90 {% elif lux < 25000
      %} 99 {% else %} 0 {% endif %}"
    bri_handfat_btn_pct: "{% if lux < 100 %}\n  {% if is_night %} 5 {% else %} 30
      {% endif %}\n{% elif lux < 300 %} 40 {% elif lux < 1000 %} 40 {% elif lux <
      2000 %} 50 {% elif lux < 5000 %} 90 {% elif lux <= 13000 %} 99 {% elif lux <
      25000 %} 99 {% else %} 0 {% endif %}"
    tak_auto_on: '{{ (bri_tak_auto_pct | int(0)) > 0 }}'
    spegel_auto_on: '{{ (bri_spegel_auto_pct | int(0)) > 0 }}'
    handfat_auto_on: '{{ (bri_handfat_auto_pct | int(0)) > 0 }}'
    tak_btn_on: '{{ (bri_tak_btn_pct | int(0)) > 0 }}'
    spegel_btn_on: '{{ (bri_spegel_btn_pct | int(0)) > 0 }}'
    handfat_btn_on: '{{ (bri_handfat_btn_pct | int(0)) > 0 }}'
