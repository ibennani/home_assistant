#####   433-fjärren  #####
- alias: "Belysning: 433-fjärrkontrollen styr belysningen i köket"
  id: '790264970'
  mode: restart
  triggers:
    - trigger: state
      entity_id: 
        - switch.433_fjarr_knapp_a
        - switch.433_fjarr_knapp_b
        - switch.433_fjarr_knapp_c
        - switch.433_fjarr_knapp_d
      # - sensor.433_fjarr_a_signalstyrka # Används för att trigga när fjärren försvunnit ifrån systemet
    - trigger: template
      value_template: >
        {{ states("sensor.433_fjarr_a_signalstyrka") | int(default = 0) < -80 }}
  action:
    - choose:
        # Måltid
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_a" and trigger.to_state.state == "on" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Måltid"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
            # - action: >
            #     {% if not is_state("input_boolean.gaster_hemma", "on") %} script.turn_on
            #     {% else %} script.do_nothing
            #     {% endif %}
            #   target:
            #     entity_id: script.stang_av_ps4_efter_forvarning
            #   data:
            #     variables:
            #       message_text: "Nu är maten strax klar nere i köket."
            - action: >
                {% if is_state('input_select.house_time_modes', 'Morgon') %} script.do_nothing
                {% elif is_state('input_select.house_time_modes', 'Dag') %}
                  {% if now().strftime('%T') < "12:00:00" %} script.do_nothing
                  {% else %} media_player.turn_off
                  {% endif %}
                {% elif is_state('input_select.house_time_modes', 'Kväll') %} media_player.turn_off
                {% else %} script.do_nothing
                {% endif %}
              target:
                entity_id: media_player.hogtalarna_i_koket
            - action: light.turn_off
              target:
                entity_id: light.takspottarna_hallen_level
        # Mysigt
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_a" and trigger.to_state.state == "off" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Mysigt"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
            - action: light.turn_off
              target:
                entity_id: light.takspottarna_hallen_level
        # Buffé
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_b" and trigger.to_state.state == "on" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Buffé"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
            - action: light.turn_off
              target:
                entity_id: light.takspottarna_hallen_level
        # Släckt
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_b" and trigger.to_state.state == "off" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Släckt"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
            - action: light.turn_off
              target:
                entity_id: light.takspottarna_hallen_level
        # Spelkväll
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_c" and trigger.to_state.state == "on" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Spelkväll"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
        # Används inte
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_c" and trigger.to_state.state == "off" }}
          sequence:
            - action: script.turn_on
              target:
                entity_id: script.do_nothing
        # Arbete - fullt upptänt
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_d" and trigger.to_state.state == "on" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Maxbelysning"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
        # Normalt
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.entity_id == "switch.433_fjarr_knapp_d" and trigger.to_state.state == "off" }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.koket_belysning
              data:
                option: "Normalt"
            - action: script.turn_on
              target:
                entity_id: script.koket_stall_in_belysningen
              data:
                variables:
                  rapid_transition: "on"
        # Om fjärren är för långt bort
        - conditions:
            - condition: template
              value_template: >
                {{ states("sensor.433_fjarr_a_signalstyrka") | int(default = 0) < -80 }}
          sequence:
            - action: notify.mobile_app_ilias_s23_ultra
              data:
