# NFC-blipp eller Eriks belysningsmönster → samma besökarlogik (senaste händelsen vinner)
- alias: "Mobilnotis: NFC Badrummet under spegeln"
  id: nfc_badrum_blipp
  description: >-
    Sätter badrummet_vem via NFC-blipp (Anna/Erik/Ilias) eller när Erik släcker takspotten
    och bara LED-lampor är kvar. Senaste identifieringen gäller alltid.
  mode: single
  triggers:
    - trigger: state
      id: nfc
      entity_id: tag.badrummet_under_spegeln
      not_from:
      - unavailable
      - unknown
      not_to:
      - unavailable
      - unknown
    - trigger: template
      id: erik_belysning
      value_template: >-
        {{ is_state('light.takspottar_badrummet', 'off')
        and is_state('light.takspott_duschen', 'off')
        and is_state('light.led_badrummet_handfatet', 'on')
        and is_state('light.led_badrummet_kommoden', 'on')
        and is_state('binary_sensor.badrummet_rorelse', 'on')
        and not is_state('input_select.house_time_modes', 'Natt')
        and is_state('input_boolean.stadning_pagar', 'off') }}
      for:
        seconds: 20
  variables:
    device_map:
      "929526afaef9a2acb0e5becc290d7c34": Anna
      "bf89f3a7b19d34ddd87e5cf49c752ca7": Erik
      "e258bafb30239f66c247b133a4522e9f": Ilias
    person: >-
      {% if trigger.id == 'erik_belysning' %}Erik
      {% else %}{{ device_map.get(trigger.to_state.attributes.last_scanned_by_device_id, 'Okänd') }}
      {% endif %}
    metod: >-
      {% if trigger.id == 'erik_belysning' %}släck takspottar{% else %}NFC{% endif %}
  actions:
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ person in ['Anna', 'Erik', 'Ilias'] }}"
        sequence:
        - action: script.badrum_satt_besokare
          data:
            person: "{{ person }}"
            metod: "{{ metod }}"
      default:
      - action: notify.mobile_app_ilias_s23_ultra
        data:
          title: Badrummet under spegeln
          message: "{{ person }} blippade taggen {{ now().strftime('%H:%M:%S') }}"
          data:
            ttl: 0
            priority: high

