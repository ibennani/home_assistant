# Tänd / släck strålkastaren om något rör sig på framsidan
# Primär: ring-mqtt (binary_sensor.front_door_motion_2). Backup: event.front_door_motion.
# Släckning kräver 3 min utan rörelse och att båda dörrarna är stängda.
- alias: "Belysning: Tänd och Släck strålkastaren vid rörelse på framsidan"
  id: '7918151123333574'
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door_motion_2
      to: 'on'
      id: rorelse
      not_from:
      - unavailable
      - unknown
    - trigger: state
      entity_id: event.front_door_motion
      id: rorelse_event_backup
      not_from:
      - unavailable
      - unknown
      not_to:
      - unavailable
      - unknown
    - trigger: time_pattern
      minutes: "/1"
      id: kontroll
    - trigger: state
      entity_id:
        - binary_sensor.ytterdorren
        - binary_sensor.altandorr_koket
      to: "off"
      id: dorr_stangs
      not_from:
      - unavailable
      - unknown
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id:
                - rorelse
                - rorelse_event_backup
            - condition: template
              value_template: >
                {% if trigger.id == 'rorelse_event_backup' %}
                  {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
                     and trigger.from_state.state not in ['unavailable', 'unknown', 'none']
                     and trigger.to_state.state != trigger.from_state.state }}
                {% else %}
                  true
                {% endif %}
            - condition: state
              entity_id: input_select.house_alarm_modes
              state:
                - Nattlarm
                - Huset är larmat
            - condition: numeric_state
              entity_id: sensor.utomhus_framsidan_ljusstyrka
              below: 300
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.stralkastaren
        - conditions:
            - condition: trigger
              id:
                - kontroll
                - dorr_stangs
            - condition: state
              entity_id: light.stralkastaren
              state: "on"
            - condition: state
              entity_id: binary_sensor.ytterdorren
              state: "off"
            - condition: state
              entity_id: binary_sensor.altandorr_koket
              state: "off"
            - condition: template
              value_template: >
                {{ (now() - states.binary_sensor.front_door_motion_2.last_changed).total_seconds() > 180 }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.stralkastaren


