  - condition: template
    value_template: '{{ trigger.to_state.state | int(0) < 20 }}

      '
  action:
  - variables:
      toner_rader: "{% set toner = [\n  ('Svart', states('sensor.hp_color_laserjet_mfp_m277dw_black_cartridge_hp_cf400x')
        | int(100)),\n  ('Cyan', states('sensor.hp_color_laserjet_mfp_m277dw_cyan_cartridge_hp_cf401x')
        | int(100)),\n  ('Magenta', states('sensor.hp_color_laserjet_mfp_m277dw_magenta_cartridge_hp_cf403x')
        | int(100)),\n  ('Gul', states('sensor.hp_color_laserjet_mfp_m277dw_yellow_cartridge_hp_cf402x')
        | int(100))\n] %}\n{% set ns = namespace(rader=[]) %}\n{% for namn, niva
        in toner %}\n{% if niva < 20 %}\n{% set ns.rader = ns.rader + [namn ~ ': '
        ~ niva ~ ' %'] %}\n{% endif %}\n{% endfor %}\n{{ ns.rader | join('\\n') }}\n"
  - action: script.skrivare_mobilnotis
    data:
      meddelande: "Låg toner i HP-skrivaren (under 20 %):\n{{ toner_rader }}\n"
