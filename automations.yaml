# Styr nattbelysningen i vardagsrummet så det är tänt så länge någon sitter där. 
# eller släck på morgonen om någon är där (dvs sover på soffan och viftar på armarna)
- alias: "Belysning: Styr nattbelysningen i vardagrsummet på natten"
  id: '791834867489'
  mode: restart
  triggers: 
    - trigger: template # Om lamporn släcks på natten så är det bara att vifta på armarna för att det ska tändas igen. 
      value_template: >
        {{ is_state("input_select.house_time_modes","Natt")
          and is_state("group.rorelse_i_vardagsrummet","on") 
          and is_state("input_select.vardagsrummet_belysning","Släckt")
          and (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0) ) < 15
          and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed) | int(default = 0) ) 
              < (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0) ) }} 
    - trigger: template # Släck vardagsrummet när ingen rört sig på en stund.
      value_template: >
        {{ is_state("input_select.house_time_modes","Natt")
          and is_state("group.rorelse_i_vardagsrummet","off") 
          and is_state("media_player.denon_avr_x2800h","off")
          and not is_state("input_select.vardagsrummet_belysning","Släckt")
          and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed) | int(default = 0) ) > (60 * 15) }} 
    - trigger: template # Släck i vardagsrummet genom att vifta. Behövs om det tänds på morgonen om nåogon sover på soffan
      value_template: >
        {{ states("input_select.house_time_modes") in ["Morgon","Dag"]
          and is_state("group.rorelse_i_vardagsrummet","on") 
          and not is_state("input_select.vardagsrummet_belysning","Släckt")
          and (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0)) < 15
          and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed) | int(default = 0) ) 
              < (as_timestamp(now()) - as_timestamp(states.input_select.vardagsrummet_belysning.last_changed) | int(default = 0) ) }} 
  action: 
    - action: input_select.select_option
      target:
        entity_id: input_select.vardagsrummet_belysning
      data:
        option: >
          {% if is_state("input_select.house_time_modes","Natt")
            and is_state("group.rorelse_i_vardagsrummet","on") 
