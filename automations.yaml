# Sthyr belysningen i övre WC
- alias: "Belysning: Styr belysningen i övre WC"
  id: "styr_belysning_ovre_wc"
  mode: restart
  triggers:
    # trigger som tänder beslysningen i övre WC
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.wc_rorelse", "on") 
        and is_state("binary_sensor.wc_dorr", "on") 
        and is_state("input_boolean.stadning_pagar","off")
        and state_attr("light.taklampa_wc", "brightness") != 255
        and (now() - states.binary_sensor.wc_dorr.last_changed).total_seconds() > 5 }} 
    # Trigger som släcker taklampan vid ingen rörelse
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.wc_rorelse", "off") and 
          (as_timestamp(now()) - as_timestamp(states.binary_sensor.wc_rorelse.last_changed)) > 2*60 and
          is_state("binary_sensor.wc_dorr", "on") }}
    # Trigger som släcker taklampan om det är mer än 13000 lux på baksidan (solen lyser in genom fönstret)
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) >= 13000 }}
    # Trigger som tänder badrumskåp och handfat på max om taklampan är på max
    - trigger: template
      value_template: >
        {{ state_attr("light.taklampa_wc", "brightness") == 255  }}
    # Trigger som släcker badrumskåp och handfata när taklampan släcks
    - trigger: state
      entity_id: light.taklampa_wc
      from: "on"
      to: "off"
  action:
    - choose:   
        # Dimma skåp och handfat till max om taklampan är dimmad till max
        - conditions:
            - condition: template
              value_template: >
                {{ state_attr("light.taklampa_wc", "brightness") == 255 }}           
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.wc_skap_och_handfat
              data:
                brightness_pct: 100
                transition: 0 
        # Tänd taklampan vid rörelse och dörren är öppen
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("binary_sensor.wc_rorelse", "on")
                and is_state("binary_sensor.wc_dorr", "on")
                and state_attr("light.taklampa_wc", "brightness") != 255
                and trigger.from_state.state == "off" and trigger.to_state.state == "on"
                }}           
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampa_wc
              data:
                brightness_pct: >
                  {% set lux = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set time_now = now().strftime('%R') %}
                  {% set is_vacation_mode = is_state("input_boolean.vacation_mode", "on") %}
                  {% set is_weekday = now().weekday() in [0, 1, 2, 3, 4] %}

                  {# Maxbelysning vid städning #}
                  {% if is_state("input_boolean.stadning_pagar","on") %} 100

                  {# Mörkt så Anna kan sminka sig utan att lamporna tänds #}
                  {% elif not is_vacation_mode 
                      and lux >= 100 
                      and (
                          (now().isoweekday() in [1, 2, 3, 4] and time_now < "07:15") or
                          (now().isoweekday() in [5] and time_now < "07:45") or
                          (now().isoweekday() in [6, 7] and time_now < "09:00")
                      ) 
                  %} 0

                  {% elif states("input_select.house_time_modes") in ["Morgon", "Dag", "Kväll"] %}
                    {% set is_friday_or_saturday = now().weekday() in [4, 5] %}
                    {% set morning_cutoff = "06:30" if is_weekday and not is_vacation_mode else "08:00" %}
                    {% set evening_cutoff = "23:00" if is_vacation_mode or is_friday_or_saturday else "21:00" %}
                    {% set lower_value_condition = is_state("var.morgoninfo_koket_redan_upplast", "false") %}

                    {% if lux < 100 %}
                      {{ 1 if time_now < morning_cutoff or time_now > evening_cutoff or lower_value_condition else 30 }}
                    {% elif lux >= 100 and lux < 300 %}
                      {{ 1 if time_now <= morning_cutoff or time_now >= evening_cutoff or lower_value_condition else 40 }}
                    {% elif lux >= 300 and lux < 1000 %}
                      45
                    {% elif lux >= 1000 and lux < 2000 %}
                      50
                    {% elif lux >= 2000 and lux < 5000 %}
                      0
                    {% elif lux >= 5000 and lux <= 13000 %}
                      0
                    {% else %}
                      0
                    {% endif %}

                  {% elif states("input_select.house_time_modes") in ["Natt"] %} 
                    {{ (state_attr("light.taklampa_wc", "brightness") / 255 * 100) | round(0) if state_attr("light.taklampa_wc", "brightness") else 0 }}
                  {% else %} 0
                  {% endif %}
                transition: >
                  {% if trigger.from_state.state == 'on' %} 15
                  {% else %} 1
                  {% endif %}
            - action: light.turn_on
              target:
                entity_id: light.wc_spegelskap
              data:
                brightness_pct: >
                  {% set lux = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set time_now = now().strftime('%R') %}
                  {% set is_vacation_mode = is_state("input_boolean.vacation_mode", "on") %}
                  {% set is_weekday = now().weekday() in [0, 1, 2, 3, 4] %}
                  {% set is_friday_or_saturday = now().weekday() in [4, 5] %}
                  {% set house_mode = states("input_select.house_time_modes") %}
                  {% set lower_value_condition = is_state("var.morgoninfo_koket_redan_upplast", "false") %}

                  {% set morning_cutoff = "06:30" if is_weekday and not is_vacation_mode else "08:00" %}
                  {% set evening_cutoff = "23:00" if is_vacation_mode or is_friday_or_saturday else "21:00" %}

                  {# Städning pågår: maxljus #}
                  {% if is_state("input_boolean.stadning_pagar", "on") %} 100

                  {# Mörkt så Anna kan sminka sig utan att lamporna tänds #}
                  {% elif not is_vacation_mode
                      and lux >= 100 
                      and (
                          (now().isoweekday() in [1, 2, 3, 4] and time_now < "07:15") or
                          (now().isoweekday() in [5] and time_now < "07:45") or
                          (now().isoweekday() in [6, 7] and time_now < "09:00")
                          ) 
                  %} 0

                  {# Lux-baserad logik under aktiva huslägen #}
                  {% elif house_mode in ["Morgon", "Dag", "Kväll"] %}
                    {% if lux < 100 %}
                      {{ 20 if time_now < morning_cutoff or time_now > evening_cutoff or lower_value_condition else 80 }}
                    {% elif lux >= 100 and lux < 300 %}
                      {{ 20 if time_now < morning_cutoff or time_now > evening_cutoff or lower_value_condition else 80 }}
                    {% elif lux >= 300 and lux < 1000 %}
                      100
                    {% elif lux >= 1000 and lux < 2000 %}
                      100
                    {% elif lux >= 2000 and lux < 5000 %}
                      100
                    {% elif lux >= 5000 and lux <= 13000 %}
                      100
                    {% else %}
                      0
                    {% endif %}

                  {# Nattläge: behåll nuvarande ljusstyrka #}
                  {% elif house_mode == "Natt" %}
                    {{ (state_attr("light.taklampa_wc", "brightness") / 255 * 100) | round(0) if state_attr("light.taklampa_wc", "brightness") else 0 }}

                  {# Fallback #}
                  {% else %}
                    0
                  {% endif %}
            
                transition: >
                  {% if trigger.from_state.state == 'on' %} 15
                  {% else %} 1
                  {% endif %}
            - action: light.turn_on
              target:
                entity_id: light.wc_handfat
              data:
                brightness_pct: >
                  {% set lux = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set time_now = now().strftime('%R') %}
                  {% set is_vacation_mode = is_state("input_boolean.vacation_mode", "on") %}
                  {% set is_weekday = now().weekday() in [0, 1, 2, 3, 4] %}

                  {# Maxbelysning vid städning #}
                  {% if is_state("input_boolean.stadning_pagar","on") %} 100

                  {# Mörkt så Anna kan sminka sig utan att lamporna tänds #}
                  {% elif not is_vacation_mode 
                      and lux >= 100 
                      and (
                          (now().isoweekday() in [1, 2, 3, 4] and time_now < "07:15") or
                          (now().isoweekday() in [5] and time_now < "07:45") or
                          (now().isoweekday() in [6, 7] and time_now < "09:00")
                          ) 
                  %} 0
                  
                  {% elif states("input_select.house_time_modes") in ["Morgon", "Dag", "Kväll"] %}
                    {% set is_vacation_mode = is_state("input_boolean.vacation_mode", "on") %}
                    {% set is_friday_or_saturday = now().weekday() in [4, 5] %}
                    {% set is_weekday = now().weekday() in [0, 1, 2, 3, 4] %}
                    {% set morning_cutoff = "06:30" if is_weekday and not is_vacation_mode else "08:00" %}
                    {% set evening_cutoff = "23:00" if is_vacation_mode or is_friday_or_saturday else "21:00" %}
                    {% set lower_value_condition = is_state("var.morgoninfo_koket_redan_upplast", "false") %}

                    {% if lux < 100 %}
                      {{ 10 if time_now < morning_cutoff or time_now > evening_cutoff or lower_value_condition else 50 }}
                    {% elif lux >= 100 and lux < 300 %}
                      {{ 10 if time_now <= morning_cutoff or time_now >= evening_cutoff or lower_value_condition else 50 }}
                    {% elif lux >= 300 and lux < 1000 %}
                      100
                    {% elif lux >= 1000 and lux < 2000 %}
                      100
                    {% elif lux >= 2000 and lux < 5000 %}
                      100
                    {% elif lux >= 5000 and lux <= 13000 %}
                      70
                    {% else %}
                      0
                    {% endif %}
                  {% elif states("input_select.house_time_modes") in ["Natt"] %} 
                    {{ (state_attr("light.taklampa_wc", "brightness") / 255 * 100) | round(0) if state_attr("light.taklampa_wc", "brightness") else 0 }}
                  {% else %} 0
                  {% endif %}                
                transition: >
                  {% if trigger.from_state.state == 'on' %} 15
                  {% else %} 1
                  {% endif %}

        # Släck ljuset om dörren är öppen och ingen rörelse på X minuter,
        # eller om solen lyser in genom fönstret så det blir ljust i badrummet
        - conditions:
            - or:
              - condition: template
                value_template: >
                  {{ is_state("binary_sensor.wc_rorelse", "off") and 
                    (as_timestamp(now()) - as_timestamp(states.binary_sensor.wc_rorelse.last_changed)) > 2*60 and
                    is_state("binary_sensor.wc_dorr", "on") }}
              - condition: template
                value_template: >
                  {{ states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) >= 13000 }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: 
                  - light.taklampa_wc
                  - light.wc_skap_och_handfat
              data:
                transition: 10        
        
        # Släck skåp och handfat om taklampan släcks
        - conditions:
          - condition: state
            entity_id: light.taklampa_wc
            state: "off"
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.wc_skap_och_handfat
              data:
                transition: 1   


    



