# Starta morgonrutin i köket första gången när någon rör sig vid arbetsbänken i köket,
# men bara vid vissa tidpunkter
- alias: "Media: Starta morgonrutin i köket vid rörelse"
  id: '79183480484080800008888674'
  mode: queued
  triggers:
  # Vardagar när vi inte är lediga
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.koket_arbetsbanken_rorelse","on")
        and is_state("var.morgoninfo_koket_redan_upplast","false")
        and is_state("input_boolean.vacation_mode","off")
        and now().strftime('%u') | int in [1,2,3,4,5] 
        and now().strftime("%T") >= "06:00:00" 
        and now().strftime("%T") < "11:00:00" }}
  # Vardagar när vi är lediga
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.koket_arbetsbanken_rorelse","on")
        and is_state("var.morgoninfo_koket_redan_upplast","false")
        and is_state("input_boolean.vacation_mode","on")
        and now().strftime('%u') | int in [ 1,2,3,4,5 ] 
        and now().strftime("%T") >= "08:00:00" 
        and now().strftime("%T") < "11:00:00"}}
  # Lördagar och söndagar
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.koket_arbetsbanken_rorelse","on")
        and is_state("var.morgoninfo_koket_redan_upplast","false")
        and now().strftime('%u') | int in [6,7]
        and now().strftime("%T") >= "08:00:00" 
        and now().strftime("%T") < "11:00:00" }}
  action:
    - action: var.set # Detta för att automationnen bara ska köras en gång per dygn.
      data: 
        entity_id: var.morgoninfo_koket_redan_upplast
        value: "true"
    - action: input_select.select_option
      target:
        entity_id: input_select.koket_belysning
      data:
        option: "Morgon"
    - action: script.turn_on
      target:
        entity_id: script.ovre_trappan_stall_in_belysningen
    - action: input_select.select_option
      target:
        entity_id: input_select.koket_belysning
      data:
        option: >
          {% if states("input_select.house_time_modes") in ["Morgon","Dag"] %} Morgon
          {% else %} {{ states("input_select.koket_belysning") }}
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.koket_stall_in_belysningen
      data:
        variables:
          rapid_transition: "on" 

    # Tänd viss belysning i övriga huset om vi har "gått upp".
    - action: input_select.select_option
      target:
        entity_id: input_select.vardagsrummet_belysning
      data:
        option: >
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 
              or is_state("input_boolean.julbelysning","on") %} Tänt
          {% elif states("input_select.vardagsrummet_belysning") in ["Dämpat","Städning","Träning","PS4","TV"] %} {{ states("input_select.vardagsrummet_belysning") }}
          {% else %} Släckt
          {% endif %}

    - action: script.turn_on
      target:
        entity_id: script.skapa_begriplig_tid
    - action: script.turn_on
      target:
        entity_id: script.skapa_dagens_vaderprognos
        
    - action: script.turn_on
      target:
        entity_id: script.las_text_i_valfri_device
      data:
        variables:
          hogtalare: media_player.googlehome_koket
          volym: 0.3
          voice: "MattiasNeural"
          meddelande: >-
            {%- if not is_state("weather.smhi_farsta", "unavailable") -%}
              {%- if states("sensor.time") < "09:00" -%}
                God morgon.
              {%- else -%}
                God förmiddag.
              {%- endif %}
      
              {{ states("input_text.aktuell_tid_begriplig") }}.
      
              {%- if is_state("calendar.helgdagar", "0") -%}
                Idag är det {{ state_attr("calendar.helgdagar", "next_holiday") }} och
              {%- endif %}
      
              det är {{ states("sensor.netatmo_bennani_vs_utomhus_temperature") | float(default=0) | round(0) }} grader utomhus.
      
              {%- if states("sensor.netatmo_regn_utomhus_sedan_midnatt") | float(default=0) > 0.1 -%}
                Det har regnat {{ states("sensor.netatmo_regn_utomhus_sedan_midnatt") | float(default=0) | round(1, 'ceil') | replace('.', ' komma ') }} millimeter sedan midnatt.
              {%- endif %}
      
              {{ states("input_text.dagens_vader_begriplig") }}.
            {% else %}
              Något är fel - kontrollera Home Assistant.
            {% endif %}
  
    # # # Vänta på att infotexten blivit uppläst
    # # - wait_template: "{{ is_state('script.las_text_i_valfri_device', 'on') }}"
    # # - wait_template: "{{ is_state('script.las_text_i_valfri_device', 'off') }}"

    # Vänta på att pucken i köket börjar spela upp texten innan vi fortsätter.
    - wait_template: >
        {{ is_state("media_player.googlehome_koket", "playing") }}
      timeout: '00:00:30'
      continue_on_timeout: true

    # Vänta på att texten har blivit uppläst och att pucken i köket är tyst innan vi fortsätter.
    - wait_template: >
        {{ (not is_state("media_player.googlehome_koket", "playing")) and
          (is_state("input_select.chromecast_audio_kitchen", "Tyst") or 
            is_state("media_player.hogtalarna_i_koket", "off")) }}
      timeout: '00:00:30'  # Valfri timeout på 30 sekunder, kan justeras.
      continue_on_timeout: true  # Automationen fortsätter även om timeout uppnås.

    # Slå på radion i köket när morgoininfon har blivit uppläst. 
    - action: script.turn_on
      target:
        entity_id: script.vad_ska_spelas_i_koket
      data: 
        variables:
          powerswitch: "on" 
          medievolym: 0.09





