      station_url: "{% set streams = {\n  \"Sveriges Radio P1\": \"library://radio/9\",\n
        \ \"Sveriges Radio P2\": \"library://radio/10\",\n  \"Sveriges Radio P3\":
        \"library://radio/11\",\n  \"Sveriges Radio P4 Stockholm\": \"library://radio/12\",\n
        \ \"Sveriges Radio P4 PLUS\": \"library://radio/13\",\n  \"Sveriges Radio
        Ekot Direkt\": \"library://radio/14\"\n} %}\n{{ streams.get(station) }}"
      target_entity: "{% set targets = {\n  \"Högtalarna i köket\": \"media_player.hogtalarna_i_koket_mass\",\n
        \ \"Morgonhögtalarna\": \"media_player.morgonhogtalarna_mass\",\n  \"Pucken
        i Ilias rum\": \"media_player.pucken_i_ilias_rum\"\n} %} {{ targets.get(target_name)
        }}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ station == ''Tyst'' }}'
      sequence:
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id:
          - media_player.hogtalarna_i_koket_mass
          - media_player.morgonhogtalarna_mass
          - media_player.pucken_i_ilias_rum
    - conditions:
      - condition: template
        value_template: "{{ station_url is not none \n   and station_url != ''\n   and
          target_name == 'Morgonhögtalarna' }}\n"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.media_morgonradio_tyst_start
        data:
          variables:
            station: '{{ station }}'
    - conditions:
      - condition: template
        value_template: "{{ station_url is not none \n   and station_url != ''\n   and
          target_name == 'Högtalarna i köket' }}\n"
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.media_koksradio_tyst_start
        data:
          variables:
            station: '{{ station }}'
    - conditions:
      - condition: template
        value_template: "{{ station_url is not none \n   and station_url != ''\n   and
          target_entity is not none \n   and target_entity != ''\n   and target_name
          not in ['Morgonhögtalarna', 'Högtalarna i köket'] }}\n"
      sequence:
      - action: media_player.media_stop
        continue_on_error: true
        target:
          entity_id: "{% set targets = [\n  \"media_player.hogtalarna_i_koket_mass\",\n
            \ \"media_player.morgonhogtalarna_mass\",\n  \"media_player.pucken_i_ilias_rum\"\n]
            %}\n{{ targets | reject('eq', target_entity) | list }}"
      - action: media_player.volume_set
        data:
          entity_id: '{{ target_entity }}'
          volume_level: 0
      - action: media_player.play_media
        data:
          entity_id: '{{ target_entity }}'
          media:
            media_content_id: '{{ station_url }}'
            media_content_type: music
            metadata: {}
      - wait_template: '{{ is_state(target_entity, ''playing'') }}'
        timeout:
          seconds: 10
      - action: media_player.volume_set
        data:
          entity_id: '{{ target_entity }}'
          volume_level: 0.15
