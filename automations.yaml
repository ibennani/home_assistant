# Uppdatera info om när städerskan är hemma
# Detta styr belysning och lite annat.
# OBS: Bygger på antagandet att städerskan är här varannan onsdag mellan 7:55 och 12:00
- alias: "HA: Styr hemmet när städerskan är hemma"
  id: '7918348063096363641545sdfs86'
  trigger:
    - trigger: template
      value_template: >
        {{ (now().isocalendar().week - 3) % 4 == 0
            and now().isocalendar().weekday == 4
            and is_state("sensor.time", "07:55") }}
    - trigger: template
      value_template: >
        {{ (now().isocalendar().week - 3) % 4 == 0
            and now().isocalendar().weekday == 4
            and is_state("sensor.time", "12:00") }}
  action:
    - choose:
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("sensor.time", "07:55") }}
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.stadning_pagar
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("sensor.time", "12:00") }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.stadning_pagar





