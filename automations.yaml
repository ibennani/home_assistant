- id: 79180597fsdgrgsv74
  alias: 'Belysning: Styr belysningen i Ilias rum'
  triggers:
  - trigger: state
    entity_id: input_select.ilias_rum_belysning
    id: apply_isabelle
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_ilias_rum
      event: 1001
    id: remote_event
  - trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_ilias_rum
      event: 1002
    id: remote_event
  - trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_ilias_rum
      event: 2002
    id: remote_event
  - trigger: state
    entity_id:
    - sensor.ilias_s23_ultra_charger_type
    - input_select.house_time_modes
    - input_boolean.stadning_pagar
    - input_boolean.julbelysning
    - input_boolean.gaster_hemma
    - sensor.ilias_aktiv_zon
    - sensor.isabelle_aktiv_zon
    id: context_state_change
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: numeric_state
    entity_id: sensor.utomhus_framsidan_ljusstyrka
    below: 2000
    id: lux_below_2000
  - trigger: numeric_state
    entity_id: sensor.utomhus_framsidan_ljusstyrka
    above: 2000
    id: lux_above_2000
  conditions:
  - condition: template
    value_template: '{{ states(''sensor.time_online'') not in [''unknown'', ''unavailable'',
      ''none'', ''''] }}'
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states(''sensor.time_online'')
      | default(now()))) > 60 }}'
  actions:
  - wait_template: "{{ states('sensor.isabelle_aktiv_zon') not in ['unknown', 'unavailable',
      'none', '']\n   and states('input_select.house_time_modes') not in ['unknown',
      'unavailable', 'none', ''] }}"
    timeout: 00:00:10
  - variables:
      current_mode: '{{ states(''input_select.ilias_rum_belysning'') | trim }}'
      huslage: '{{ states(''input_select.house_time_modes'') | trim }}'
      utomhus_ljus: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) }}'
      gaster_hemma: '{{ is_state(''input_boolean.gaster_hemma'', ''on'') }}'
      isabelle_hemma: '{{ is_state(''binary_sensor.isabelle_hemma'', ''on'') }}'
      ilias_hemma: '{{ is_state(''binary_sensor.ilias_hemma'', ''on'') }}'
      laddare_typ: '{{ states(''sensor.ilias_s23_ultra_charger_type'') | trim | lower
        }}'
      julbelysning: '{{ is_state(''input_boolean.julbelysning'', ''on'') }}'
      stadning: '{{ is_state(''input_boolean.stadning_pagar'', ''on'') }}'
      morgoninfo_redan_upplast: '{{ is_state(''var.morgoninfo_koket_redan_upplast'',
        ''true'') }}'
      system_ready: '{{ states(''sensor.isabelle_aktiv_zon'') not in [''unknown'', ''unavailable'']
        and states(''zone.home'') not in [''unknown'', ''unavailable''] }}'
  - variables:
      ac_ska_slacka_ilias_rum: "{% set tid = now().strftime('%H:%M') %} {% set
        veckodag = now().weekday() %} {% set kvall_efter_midnatt = tid < '12:00' %}
        {% set kvall_efter_tidsgrans =\n  (veckodag in [4, 5] and tid >= '23:00')\n
        \ or (veckodag not in [4, 5] and tid >= '21:30')\n%} {{ laddare_typ == 'ac'\n
        \  and not isabelle_hemma\n   and (\n     huslage == 'Natt'\n     or (\n       huslage
        == 'Kväll'\n       and (kvall_efter_midnatt or kvall_efter_tidsgrans)\n     )\n
        \  )\n}}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''apply_isabelle'' }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.ilias_rum_stall_in_belysningen
      - stop: 'Apply-only: input_select ändrades → applicerar via script'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote_event'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ trigger.event.data.event | int(0) == 2002 }}'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.vardagsrummet_belysning
            data:
              option: '{{ ''Släckt'' if states(''input_select.vardagsrummet_belysning'')
                != ''Släckt'' else ''Tänt'' }}'
          - action: script.turn_on
            target:
              entity_id: script.vardagsrummet_stall_in_belysningen
          - stop: Fjärr 2002 hanterad
        - conditions:
          - condition: template
            value_template: '{{ trigger.event.data.event | int(0) == 1001 }}'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.ilias_rum_belysning
            data:
              option: "{% if huslage == 'Natt' and laddare_typ == 'ac' %}\n  {{ 'Släckt'
                if current_mode == 'Myslampan' else 'Myslampan' }}\n{% elif huslage
                == 'Natt' %}\n  {{ 'Tänt' if current_mode == 'Myslampan' else 'Myslampan'
                }}\n{% else %}\n  {{ 'Släckt' if current_mode == 'Tänt' else 'Tänt'
                }}\n{% endif %}"
          - stop: Fjärr 1001 hanterad
        - conditions:
          - condition: template
            value_template: '{{ trigger.event.data.event | int(0) == 1002 }}'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.ilias_rum_belysning
            data:
              option: "{% if huslage == 'Natt' and laddare_typ == 'ac' %}\n  {{ 'Myslampan'
                if current_mode == 'Släckt' else 'Släckt' }}\n{% else %}\n  {% if
                current_mode != 'Släckt' %}\n    Släckt\n  {% else %}\n    {% if huslage
                == 'Morgon' %}\n      Tänt\n    {% elif huslage == 'Dag' %}\n      {{
                'Tänt' if utomhus_ljus <= 2000 else 'Sängen' }}\n    {% elif huslage
                == 'Kväll' %}\n      Tänt\n    {% elif huslage == 'Natt' %}\n      Myslampan\n
                \   {% else %}\n      Släckt\n    {% endif %}\n  {% endif %}\n{% endif
                %}"
          - stop: Fjärr 1002 hanterad
      - stop: Fjärr-event utan matchad eventkod
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ac_ska_slacka_ilias_rum | bool(false) }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ current_mode != ''Släckt'' }}'
        then:
        - action: input_select.select_option
          target:
            entity_id: input_select.ilias_rum_belysning
          data:
            option: Släckt
      - stop: 'AC-regel aktiv: håller Ilias rum släckt'
  - variables:
      next_option: "{# 1. ÖVERORDNADE REGLER (Gäller oavsett tid på dygnet) #}\n{%
        if stadning %}\n  Städning\n{% elif gaster_hemma %}\n  {{ current_mode }}\n
        \ \n{# FAREBLIND SÄKERHET: Om systemet inte är redo, eller ingen har hunnit
        registreras som hemma än under boot, rör inget! #}\n{% elif not system_ready
        or (not isabelle_hemma and not ilias_hemma and states('zone.home')|int(0)
        == 0) %}\n  {{ current_mode }}\n\n{# 2. TIDSLÄGEN (Körs bara om systemet är
        stabilt och folk är hemma) #}\n{% elif huslage == 'Morgon' %}\n  {% if isabelle_hemma
        %}\n    {{ current_mode }}\n  {% elif ilias_hemma and laddare_typ == 'ac'
        %}\n    {{ current_mode }}\n  {% elif ilias_hemma and morgoninfo_redan_upplast
        %}\n    Tänt\n  {% else %}\n    {{ current_mode }}\n  {% endif %}\n\n{% elif
        huslage == 'Dag' %}\n  {% if isabelle_hemma %}\n    {{ 'Sängen' if current_mode
        in ['Tänt', 'Sängen'] else 'Släckt' }}\n  {% elif ilias_hemma and laddare_typ
        == 'ac' %}\n    {{ 'Sängen' if current_mode in ['Tänt', 'Sängen'] else 'Släckt'
        }}\n  {% elif utomhus_ljus >= 2000 and not julbelysning %}\n    Släckt\n  {%
        else %}\n    Tänt\n  {% endif %}\n\n{% elif huslage == 'Kväll' %}\n  Tänt\n\n{%
        elif huslage == 'Natt' %}\n  {% if isabelle_hemma %}\n    Myslampan\n  {%
        elif ilias_hemma and laddare_typ == 'ac' %}\n    {{ current_mode }}\n  {%
        elif ilias_hemma and current_mode != 'Släckt' %}\n    Myslampan\n  {% else
        %}\n    Släckt\n  {% endif %}\n\n{% else %}\n  {{ current_mode }}\n{% endif
        %}"
  - if:
    - condition: template
      value_template: '{{ (next_option | trim) != current_mode }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.ilias_rum_belysning
      data:
        option: '{{ next_option | trim }}'
  mode: restart
- alias: 'Belysning: Kör script som styr belysningen i vardagsrummet'
  id: fsaldsjss050980sdgag059dgs5g98dfgssdd3333sdf98e
  mode: restart
  triggers:
    trigger: state
    entity_id:
    - input_select.vardagsrummet_belysning
  action:
  - action: script.turn_on
    target:
      entity_id: script.vardagsrummet_stall_in_belysningen
