  triggers:
  - trigger: template
    value_template: "\n{% set kvart = now().strftime(\"%M:%S\") in [\"00:00\", \"15:00\",
      \"30:00\", \"45:00\"] %} {% set vardagar = (now().strftime(\"%T\") >= \"06:00\"
      and now().strftime(\"%T\") <= \"22:01\" and now().strftime('%u') | int in [1,2,3,4,5])
      %} {% set helger = (now().strftime(\"%T\") >= \"09:00\" and now().strftime(\"%T\")
      <= \"22:01\" and now().strftime('%u') | int in [6,7] and is_state(\"var.morgoninfo_koket_redan_upplast\",
      \"true\")) %} {% set giltig_tid = (vardagar or helger) and states(\"input_select.house_time_modes\")
      in [\"Morgon\",\"Dag\",\"Kväll\"] %} {% set gaster_borta = is_state(\"input_boolean.gaster_hemma\",
      \"off\") %} {% set vacation_mode = ( is_state(\"input_boolean.vacation_mode\",
      \"off\") or \n                        (\n                            is_state(\"input_boolean.vacation_mode\",
      \"on\") and \n                            is_state('binary_sensor.ilias_hemma', 'on') and\n
      \                           is_state('binary_sensor.anna_borta_kand', 'on') and\n
      \                           is_state('binary_sensor.erik_borta_kand', 'on') and\n
      \                           is_state('binary_sensor.isabelle_borta_kand', 'on')\n
      \                       )) %}\n{% set annelies_iphone_borta = is_state('binary_sensor.isabelle_borta_kand', 'on') %} {% set nagon_ar_hemma = not is_state(\"zone.home\", \"0\") %} {%
      set googlehome_fritt = not is_state(\"media_player.googlehome_ilias_rum\",
      \"playing\") %}\n{{ kvart and giltig_tid and gaster_borta and vacation_mode
      and annelies_iphone_borta and nagon_ar_hemma and googlehome_fritt }}\n"
  action:
  - action: script.turn_on
    target:
      entity_id: script.las_upp_tiden
    data:
      variables:
        hogtalare: "{% set familj_hemma = [\n  is_state('binary_sensor.ilias_hemma', 'on'),\n  is_state('binary_sensor.anna_hemma', 'on'),\n  is_state('binary_sensor.erik_hemma', 'on'),\n  is_state('binary_sensor.isabelle_hemma', 'on')\n] | select('true') | list | count %}\n{% if familj_hemma == 1 and is_state('binary_sensor.ilias_hemma', 'on') %}\n  {% set vem_ar_hemma = \"ilias\" %}\n{% elif familj_hemma > 1 and is_state('binary_sensor.ilias_hemma', 'on') %}\n  {% set vem_ar_hemma = \"flera\" %}\n{% else %}\n  {% set vem_ar_hemma = \"ointressant\" %}\n{% endif %} {% if vem_ar_hemma == \"ilias\"
          \n  and is_state(\"input_boolean.stadning_pagar\",\"off\") %} media_player.googlehome_alla_puckar
          \n{% else %} media_player.googlehome_ilias_rum {% endif %}\n"
        volym: "{% set familj_hemma = [\n  is_state('binary_sensor.ilias_hemma', 'on'),\n  is_state('binary_sensor.anna_hemma', 'on'),\n  is_state('binary_sensor.erik_hemma', 'on'),\n  is_state('binary_sensor.isabelle_hemma', 'on')\n] | select('true') | list | count %}\n{% if familj_hemma == 1 and is_state('binary_sensor.ilias_hemma', 'on') %}\n  {% set vem_ar_hemma = \"ilias\" %}\n{% elif familj_hemma > 1 and is_state('binary_sensor.ilias_hemma', 'on') %}\n  {% set vem_ar_hemma = \"flera\" %}\n{% else %}\n  {% set vem_ar_hemma = \"ointressant\" %}\n{% endif %} {% if vem_ar_hemma == \"ilias\"
          %} 0.15 {% else %} 0.10 {% endif %}\n"
