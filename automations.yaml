  action:
    - parallel:
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_isabelles_rum
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_vardagsrummet
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_sovrummet
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_eriks_rum
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_koket
        - action: script.tysta_kopplingspling_vid_casting
          data: 
            hogtalare: media_player.googlehome_albins_rum
    - wait_template: >
        {{  is_state("media_player.googlehome_isabelles_rum","idle")
        and is_state("media_player.googlehome_vardagsrummet","idle") 
        and is_state("media_player.googlehome_sovrummet","idle") 
        and is_state("media_player.googlehome_eriks_rum","idle") 
