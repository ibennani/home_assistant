# Styr golvvärmen i badrummet, dvs slå på och av vissa tider.
- alias: "Termostat: Styr golvvärmen i badrummet"
  id: 'styr_golvvarme_badrum'
  mode: queued
  triggers:
    # Vilka tider ska automatiseringen köras
    - trigger: template
      value_template: >
        {{
          (
            (states("sensor.time") == "05:00" and now().strftime('%u')|int in [1, 2, 3, 4, 5]) or
            (states("sensor.time") == "07:45" and now().strftime('%u')|int in [1, 2, 3, 4]) or
            (states("sensor.time") == "08:45" and now().strftime('%u')|int == 5) or
            (states("sensor.time") == "16:00" and now().strftime('%u')|int in [1, 2, 3, 4, 5]) or
            (states("sensor.time") == "22:00" and now().strftime('%u')|int in [1, 2, 3, 4, 7]) or
            (states("sensor.time") == "07:30" and now().strftime('%u')|int in [6, 7]) or
            (states("sensor.time") == "23:00" and now().strftime('%u')|int in [5, 6])
          )
        }}
    # När Anna eller Ilias börjar närma sig hemmet
    - trigger: state
      entity_id:
        - sensor.anna_nara_hemmet
        - sensor.ilias_nara_hemmet
      from: "False"
      to: "True"
    # Trigga även på om vi har gäster hemma eller om någon kommer hem eller går hemmifrån
    - trigger: state
      entity_id:
        - input_boolean.gaster_hemma
        - input_boolean.vacation_mode
        - zone.home
    # Trigga på el-priset
    - trigger: template
      value_template: >
        {{ states("sensor.elpriset_denna_timme")|float < 5.0 }}
    - trigger: template
      value_template: >
        {{ states("sensor.elpriset_denna_timme")|float >= 5.0 }}
  action:
    - choose:
        # Slå på golvvärmen
        - conditions:          
            - condition: template
              value_template: >
                {{
                  (
                    states("sensor.elpriset_denna_timme")|float < 5.0 and
                    (
                      (
                        "05:00" <= states("sensor.time") < "07:45" and
                        now().strftime('%u')|int in [1, 2, 3, 4] and
                        (states("zone.home")|int > 0 or is_state("input_boolean.gaster_hemma", "on"))
                      )
                      or
                      (
                        "05:00" <= states("sensor.time") < "08:45" and
                        now().strftime('%u')|int == 5 and
                        (states("zone.home")|int > 0 or is_state("input_boolean.gaster_hemma", "on"))
                      )
                      or
                      (
                        "16:00" <= states("sensor.time") < "22:00" and
                        now().strftime('%u')|int in [1, 2, 3, 4] and
                        is_state("input_boolean.vacation_mode", "off")
                      )
                      or
                      (
                        "16:00" <= states("sensor.time") < "23:00" and
                        now().strftime('%u')|int == 5 and
                        is_state("input_boolean.vacation_mode", "off")
                      )
                      or
                      (
                        "07:30" <= states("sensor.time") < "23:00" and
                        now().strftime('%u')|int == 6 and
                        (states("zone.home")|int > 0 or is_state("input_boolean.vacation_mode", "on"))
                      )
                      or
                      (
                        "07:30" <= states("sensor.time") < "22:00" and
                        now().strftime('%u')|int == 7 and
                        (states("zone.home")|int > 0 or is_state("input_boolean.gaster_hemma", "on"))
                      )
                    )
                  )
                }}
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.golvvarmen_i_badrummet
              data:
                hvac_mode: heat
            - action: climate.set_temperature
              target:
                entity_id: climate.golvvarmen_i_badrummet
              data:
                temperature: 25
        # Stäng av golvvärmen
        - conditions:          
            - condition: template
              value_template: >
                {{
                  (
                    (
                      states("sensor.time") in ["07:45", "08:45", "22:00"] and 
                      is_state("input_boolean.vacation_mode", "off") and
                      (
                        (states("sensor.time") == "07:45" and now().strftime('%u')|int in [1, 2, 3, 4]) or
                        (states("sensor.time") == "08:45" and now().strftime('%u')|int == 5) or
                        (states("sensor.time") == "22:00" and now().strftime('%u')|int in [1, 2, 3, 4, 7])
                      )
                    )
                    or
                    (
                      states("sensor.time") == "23:00" and 
                      (
                        now().strftime('%u')|int in [5, 6] or
                        is_state("input_boolean.vacation_mode", "on")
                      )
                    )
                    or
                    (
                      states("zone.home")|int == 0 and 
                      is_state("input_boolean.gaster_hemma", "off")
                    )
                    or
                    (
                      states("sensor.elpriset_denna_timme")|float >= 5.0
                    )
                  )
                }}
          sequence:
            - action: climate.turn_off
              target:
                entity_id: climate.golvvarmen_i_badrummet




# Kontrollera elementet i sovrummet
- alias: "Termostat: Styr elementet i sovrummet"
  id: "sdljgsagwrojgwrglsapasjwrglkg"
  trigger:
    # Trigger som reagerar på förändringar i zone.home och vacation_mode
    - trigger: template
      value_template: >
        {{
          states('zone.home') == '0' or
          (
            states('zone.home') != '0' and (
              states('input_boolean.vacation_mode') == 'on' or
              states('input_boolean.vacation_mode') == 'off'
            )
          )
        }}
    # Trigger som reagerar på uppdatering av morgoninfo
    - trigger: template
      value_template: >
        {{ states('var.morgoninfo_koket_redan_upplast') }}
    # Trigger som reagerar på om klockan är 20:00 eller 22:00
    - trigger: template
      value_template: >
        {{ now().strftime('%H:%M') in ['20:00', '22:00'] }}
    # Trigger som reagerar på om termostaten går från unavailable (så att detta körs och elemetet får rätt state)
    - trigger: template
      value_template: >
        {{ trigger.entity_id == 'climate.elementet_i_sovrummet' and trigger.from_state.state == 'unavailable' and trigger.to_state.state != 'unavailable' }}
  action:
    - choose:
        # Om ingen är hemma (zone.home är 0), slå på elementet
        - conditions:
            - condition: template
              value_template: "{{ states('zone.home') == '0' }}"
          sequence:
            - action: climate.set_hvac_mode
              target:
                entity_id: climate.elementet_i_sovrummet
              data:
                hvac_mode: heat
            - action: notify.foraldrar
              data:
                message: |
                  HEMMET {{ now().strftime('%R') }}:
                  Elementet är på (ingen hemma)
                ttl: 0
                priority: high

        # Om någon är hemma (zone.home != 0)
        - conditions:
            - condition: template
              value_template: "{{ states('zone.home') != '0' }}"
          sequence:
            - choose:
                # Om vi är lediga (vacation_mode är on)
                - conditions:
                    - condition: template
                      value_template: >
                        {{
                          states('input_boolean.vacation_mode') == 'on' and
                          states('var.morgoninfo_koket_redan_upplast') == 'true' and
                          now().strftime('%H:%M') < '22:00' 
                        }}
                  sequence:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: climate.elementet_i_sovrummet
                      data: 
                        hvac_mode: heat

                # Om vi inte är lediga (vacation_mode är off)
                - conditions:
                    - condition: template
                      value_template: >
                        {{
                          states('input_boolean.vacation_mode') == 'off' and
                          states('var.morgoninfo_koket_redan_upplast') == 'true' and
                          (
                            (
                              now().weekday() in [0, 1, 2, 3] and
                              now().strftime('%H:%M') < '20:00' 
                            ) or
                            (
                              now().weekday() in [4, 5] and
                              now().strftime('%H:%M') < '22:00' 
                            ) or
                            (
                              now().weekday() == 6 and
                              now().strftime('%H:%M') < '20:00' 
                            )
                          )
                        }}
                  sequence:
                    - action: climate.set_hvac_mode
                      target:
                        entity_id: climate.elementet_i_sovrummet
                      data:
                        hvac_mode: heat

              # Lägg till en nested default här
              default:
                - action: climate.set_hvac_mode
                  target:
                    entity_id: climate.elementet_i_sovrummet
                  data:
                    hvac_mode: "off"

      # Standardläge: elementet är av
      default:
        - action: climate.set_hvac_mode
          target:
            entity_id: climate.elementet_i_sovrummet
          data:
            hvac_mode: "off"




    

#####   Test-automatiseringar  #####


# Dimma taklampan i badrummet
- alias: Fjärrkontroll för badrumslampa
  description: Hantera toggling, dimning och växlande riktning för badrumslampa.
  id: "sgksajgdoisadglrwjgojegegji"
  mode: restart
  trigger:
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_badrummet
  action:
    - choose:
        # Toggla lampan (1002)
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event == 1002 }}"
          sequence:
            - action: light.toggle
              target:
                entity_id: light.taklampan_badrummet
        # Start dimning (1001)
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event == 1001 }}"
          sequence:
            - choose:
                # Dimma upp
                - conditions:
                    - condition: state
                      entity_id: input_boolean.vagglampor_badrummet_dimma_upp
                      state: "on"
                  sequence:
                    - repeat:
                        while:
                          - condition: template
                            value_template: >
                              {{ not is_state_attr('sensor.last_deconz_event', 'event', '1003') }}
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: light.taklampan_badrummet
                            data:
                              brightness_step_pct: 10
                              transition: 1
                              kelvin: >
                                {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                                {% set mode = states("input_select.house_time_modes") %}
              
                                {% if mode in ["Morgon","Dag","Kväll"] %} 
                                  {% if ljusstyrka >= 2000 %} 3200
                                  {% else %} 2500
                                  {% endif %} 
                                {% else %} 2500
                                {% endif %}
                          - delay: "00:00:01"
                # Dimma ner
                - conditions:
                    - condition: state
                      entity_id: input_boolean.vagglampor_badrummet_dimma_upp
                      state: "off"
                  sequence:
                    - repeat:
                        while:
                          - condition: template
                            value_template: >
                              {{ not is_state_attr('sensor.last_deconz_event', 'event', '1003') }}
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: light.taklampan_badrummet
                            data:
                              brightness_step_pct: -10
                              transition: 1
                              kelvin: >
                                {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                                {% set mode = states("input_select.house_time_modes") %}
              
                                {% if mode in ["Morgon","Dag","Kväll"] %} 
                                  {% if ljusstyrka >= 2000 %} 3200
                                  {% else %} 2500
                                  {% endif %} 
                                {% else %} 2500
                                {% endif %}
                          - delay: "00:00:01"
        # Stoppa dimning och växla riktning (1003)
        - conditions:
            - condition: template
              value_template: "{{ trigger.event.data.event == 1003 }}"
          sequence:
            - action: input_boolean.toggle
              target:
                entity_id: input_boolean.vagglampor_badrummet_dimma_upp



# Automatisera dimningsriktning baserat på ljusstyrkan
- alias: Ställ in dimningsriktning för taklampan
  description: Uppdatera dimningsriktningen automatiskt baserat på ljusstyrkan.
  id: "dimmer_riktning_taklampa"
  mode: restart
  trigger:
    - trigger: template
      value_template: >
        {{ state_attr('light.taklampan_badrummet', 'brightness') | int (default=0) >= 254 or
            is_state('light.taklampan_badrummet', 'off') }}
  action:
    - choose:
        # Om ljusstyrkan är max (255), ställ in dimning till ner
        - conditions:
            - condition: template
              value_template: >
                {{ state_attr('light.taklampan_badrummet', 'brightness') | int >= 2 }}
          sequence:
            - action: input_boolean.turn_off
              target:
                entity_id: input_boolean.vagglampor_badrummet_dimma_upp
        # Om lampan är av (ljusstyrka saknas), ställ in dimning till upp
        - conditions:
            - condition: template
              value_template: >
                {{ is_state('light.taklampan_badrummet', 'off') }}
          sequence:
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.vagglampor_badrummet_dimma_upp


























