# Styr steron i köket med runda IKEA-fjärren
- alias: "Media: Styr steron i köket med runda IKEA-fjärren"
  id: "01509159854ddddd9498fsf890"
  mode: restart
  trigger:
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_stereon_i_koket
  action:
  # Slå på/av med mittenknappen
    - action: >
        {% if trigger.event.data.event | int(default = 0)  == 1002 %} script.vad_ska_spelas_i_koket
        {% else %} script.do_nothing
        {% endif %}
      data: 
        powerswitch: >
          {% if is_state("media_player.hogtalarna_i_koket","off") %} on
          {% else %} off
          {% endif %}
        medievolym: 0.10
  # Föregående nästa-knapparna  
    - action: > # När vi lyssnar på radio
        {% if (state_attr("media_player.hogtalarna_i_koket","app_name") in ["Default Media Receiver", "TuneIn Free"] ) %}
          {% if trigger.event.data.event | int(default = 0)  == 5002 %} input_select.select_next
          {% elif trigger.event.data.event | int(default = 0)  == 4002 %} input_select.select_previous
          {% else %} script.do_nothing
          {% endif %}
        {% else %} script.do_nothing
        {% endif %}
      entity_id: input_select.chromecast_audio_kitchen
    - action: > # När vi lyssnar på någon streamingtjänst
        {% if (state_attr("media_player.hogtalarna_i_koket","app_name") in ["Spotify","YouTube Music"] ) %}
          {% if trigger.event.data.event | int(default = 0)  == 5002 %} media_player.media_next_track
          {% elif trigger.event.data.event | int(default = 0)  == 4002 %} media_player.media_previous_track
          {% else %} script.do_nothing
          {% endif %}        
        {% else %} script.do_nothing
        {% endif %}
      entity_id: media_player.hogtalarna_i_koket
    # Öka/minska volymen 
    - action: media_player.volume_set 
      data: 
        volume_level: >
          {% if   trigger.event.data.event | int(default = 0)  == 2002 %} {{ (state_attr("media_player.hogtalarna_i_koket","volume_level")) | float(default = 0) | round(2, default = 0) + 0.01 }}
          {% elif trigger.event.data.event | int(default = 0)  == 3002 %} {{ (state_attr("media_player.hogtalarna_i_koket","volume_level")) | float(default = 0) | round(2, default = 0) - 0.01 }}
          {% elif trigger.event.data.event | int(default = 0)  == 1002 and is_state("media_player.hogtalarna_i_koket","on") %} "0.15"
          {% else %} script.do_nothing
          {% endif %}
      entity_id: media_player.hogtalarna_i_koket


