# Mobilnotis: Posten har kommit
- alias: 'Mobilnotis: Posten har kommit'
  id: '7918365089098048674'
  mode: restart
  triggers:
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.rorelse_i_brevladan","on")
          and is_state("input_boolean.kolla_posten","off")
          and (as_timestamp(now()) - as_timestamp(states.input_boolean.kolla_posten.last_changed)) | int(default = 0)  > (15 * 60)  }}
  action:
    - action: script.turn_on
      target:
        entity_id: script.las_text_i_valfri_device
      data:
        variables:
          hogtalare: media_player.googlehome_infopuckarna
          meddelande: "Nu har posten kommit"  
          volym:  >
            {% if is_state("media_player.sony_tv_i_vardagsrummet","playing") %} {{ states.input_number.google_home_volume_setting_dag.state | float(default = 0) / 100  }}
            {% else %} {{ states.input_number.google_home_volume_setting_notiser.state | float(default = 0) / 100  }}
            {% endif %}
          voice: "MattiasNeural"
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          Posten har kommit
        data:
          ttl: 0
          priority: high
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.kolla_posten
    - delay: "00:05:00"
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.kolla_posten


# Mobilnotis: Diskmaskinen startar när det är billigast
- alias: "Mobilnotis: Diskmaskinen fjärrstart"
  mode: queued
  id: "5551111dasg5sg"
  trigger:
    - trigger: template # Räkna ut när diskmaskinen ska starta (billigast)
      value_template: >
        {{ is_state('binary_sensor.diskmaskin_lucka', 'off') and
          is_state('binary_sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_remotecontrolstartallowed', 'on') and
          states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_operationstate').split('.')[-1] == 'Ready' }}
    - trigger: template # Diskmaskinen startar på den uträknade tiden. 
      value_template: >
        {{ is_state('binary_sensor.diskmaskin_lucka', 'off') and
          is_state('binary_sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_remotecontrolstartallowed', 'on') and
          now().strftime('%Y-%m-%d %H:%M') == states('input_text.diskmaskin_tid_fjarrstart') }}
    - trigger: template # Knappen för fjärrstyrning stängs av, dvs fjärrstyrning inaktiverad
      value_template: >
        {{ is_state("binary_sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_remotecontrolstartallowed","off") and
          not is_state("input_text.diskmaskin_tid_fjarrstart","") }}
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: "0" # Första triggern
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.diskmaskin_tid_fjarrstart
              data:
                value: >
                  {# Hämta priser #}
                  {% set today_prices = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_today') %}
                  {% set tomorrow_prices = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_tomorrow') %}
                  {% set tomorrow_valid = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'tomorrow_valid') %}
                  {% set all_prices = (today_prices + tomorrow_prices) if tomorrow_valid else today_prices %}
                  
                  {# Regler för tidsgränser #}
                  {% set weekday_today_last_start = "15:00" %}
                  {% set weekday_tomorrow_last_start = "05:00" %}
                  {% set weekend_last_start = "06:00" %}
                  {% set current_time = now() %}
                  {% set is_weekday_today = current_time.weekday() < 5 %}
                  {% set is_weekday_tomorrow = (current_time + timedelta(days=1)).weekday() < 5 %}
                  {% set is_holiday_today = not is_weekday_today %}
                  
                  {# Sätt senaste möjliga starttid baserat på regler #}
                  {% if is_holiday_today and current_time.time() < strptime(weekend_last_start, '%H:%M').time() %}
                    {% set latest_start_time = current_time.replace(hour=6, minute=0, second=0, microsecond=0) %}
                  {% elif is_weekday_today and current_time.time() < strptime(weekday_today_last_start, '%H:%M').time() %}
                    {% set latest_start_time = current_time.replace(hour=15, minute=0, second=0, microsecond=0) %}
                  {% elif is_weekday_tomorrow and current_time >= current_time.replace(hour=21, minute=0, second=0, microsecond=0) %}
                    {% set latest_start_time = (current_time + timedelta(days=1)).replace(hour=5, minute=0, second=0, microsecond=0) %}
                  {% elif tomorrow_valid %}
                    {% set latest_start_time = (current_time + timedelta(days=1)).replace(hour=23, minute=59, second=59, microsecond=0) %}
                  {% else %}
                    {% set latest_start_time = current_time.replace(hour=23, minute=59, second=59, microsecond=0) %}
                  {% endif %}
                  
                  {# Iterera genom priser för att hitta lokala dalar #}
                  {% set data = namespace(local_dip_time=None, local_dip_cost=None) %}
                  {%- for i in range(1, all_prices | length - 1) -%}
                    {%- set prev_price = all_prices[i-1] -%}
                    {%- set current_price = all_prices[i] -%}
                    {%- set next_price = all_prices[i+1] -%}
                    {%- set start_time = as_datetime(current_price.start) | as_local -%}
                  
                    {# Kontrollera om aktuellt pris är en lokal dal och inom tidsgränsen #}
                      {%- if start_time >= current_time and start_time <= latest_start_time and current_price.value < prev_price.value and current_price.value < next_price.value -%}
                      {% if data.local_dip_cost is none or current_price.value < data.local_dip_cost %}
                        {% set data.local_dip_time = start_time %}
                        {% set data.local_dip_cost = current_price.value %}
                      {% endif %}
                    {%- endif %}
                  {%- endfor %}
                  
                  
                  {# Utmatning av bästa lokal dal och dess kostnad #}
                  {% if data.local_dip_time %}
                    {{ data.local_dip_time.strftime('%Y-%m-%d %H:%M') }}
                  {% else %}
                    Ingen lokal dal hittades.
                  {% endif %}
            - action: notify.mobile_app_ilias_s23_ultra
              data:
                message: |
                  {# Hämta priser #}
                  {% set today_prices = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_today') %}
                  {% set tomorrow_prices = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_tomorrow') %}
                  {% set tomorrow_valid = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'tomorrow_valid') %}
                  {% set all_prices = (today_prices + tomorrow_prices) if tomorrow_valid else today_prices %}

                  {# Regler för tidsgränser #}
                  {% set weekday_today_last_start = "15:00" %}
                  {% set weekday_tomorrow_last_start = "05:00" %}
                  {% set weekend_last_start = "06:00" %}
                  {% set current_time = now() %}
                  {% set is_weekday_today = current_time.weekday() < 5 %}
                  {% set is_weekday_tomorrow = (current_time + timedelta(days=1)).weekday() < 5 %}
                  {% set is_holiday_today = not is_weekday_today %}

                  {# Sätt senaste möjliga starttid baserat på regler #}
                  {% if is_holiday_today and current_time.time() < strptime(weekend_last_start, '%H:%M').time() %}
                    {% set latest_start_time = current_time.replace(hour=6, minute=0, second=0, microsecond=0) %}
                  {% elif is_weekday_today and current_time.time() < strptime(weekday_today_last_start, '%H:%M').time() %}
                    {% set latest_start_time = current_time.replace(hour=15, minute=0, second=0, microsecond=0) %}
                  {% elif is_weekday_tomorrow and current_time >= current_time.replace(hour=21, minute=0, second=0, microsecond=0) %}
                    {% set latest_start_time = (current_time + timedelta(days=1)).replace(hour=5, minute=0, second=0, microsecond=0) %}
                  {% elif tomorrow_valid %}
                    {% set latest_start_time = (current_time + timedelta(days=1)).replace(hour=23, minute=59, second=59, microsecond=0) %}
                  {% else %}
                    {% set latest_start_time = current_time.replace(hour=23, minute=59, second=59, microsecond=0) %}
                  {% endif %}

                  {# Iterera genom priser för att hitta lokala dalar #}
                  {% set data = namespace(local_dip_time=None, local_dip_cost=None) %}
                  {%- for i in range(1, all_prices | length - 1) -%}
                    {%- set prev_price = all_prices[i-1] -%}
                    {%- set current_price = all_prices[i] -%}
                    {%- set next_price = all_prices[i+1] -%}
                    {%- set start_time = as_datetime(current_price.start) | as_local -%}

                    {# Kontrollera om aktuellt pris är en lokal dal och inom tidsgränsen #}
                    {%- if start_time >= current_time and start_time <= latest_start_time and current_price.value < prev_price.value and current_price.value < next_price.value -%}
                      {% if data.local_dip_cost is none or current_price.value < data.local_dip_cost %}
                        {% set data.local_dip_time = start_time %}
                        {% set data.local_dip_cost = current_price.value %}
                      {% endif %}
                    {%- endif %}
                  {%- endfor %}

                  HEMMET {{ now().strftime('%R') }}:
                  {%- set input_value = states('input_text.diskmaskin_tid_fjarrstart') -%}
                  {% set is_valid_format = input_value and input_value | regex_match('^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$') -%}
                  {% if is_valid_format -%}
                    Diskmaskinen kommer starta klockan {{ input_value[-5:] }} då timpriset är {{ data.local_dip_cost }} kr.

                  {% else -%}
                    Hittade ingen lämplig tid att starta diskmaskinen
                  {% endif %}
                data:
                  ttl: 0
                  priority: high                      
            - action: script.turn_on
              target:
                entity_id: script.las_text_i_valfri_device
              data:
                variables:
                  hogtalare: media_player.googlehome_infopuckarna
                  meddelande: >
                    Diskmaskinen kommer starta klockan {{ states('input_text.diskmaskin_tid_fjarrstart').split(' ')[1] }}
                  volym: >
                    {% if is_state('media_player.sony_tv_i_vardagsrummet', 'playing') %}
                      {{ states('input_number.google_home_volume_setting_dag') | float(default=0) / 100 }}
                    {% else %}
                      {{ states('input_number.google_home_volume_setting_notiser') | float(default=0) / 100 }}
                    {% endif %}
                  voice: 'MattiasNeural'
        - conditions:
            - condition: trigger
              id: "1" # Andra triggern
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.diskmaskin_tid_fjarrstart
              data:
                value: ""
            - action: select.select_option
              data:
                entity_id: select.bosch_sma67md06e_68a40e70cb46_programs
                option: Dishcare.Dishwasher.Program.Eco50
            - delay: "00:00:05"
            - action: switch.turn_on
              data:
                entity_id: switch.bosch_sma67md06e_68a40e70cb46_dishcare_dishwasher_option_variospeedplus
            - delay: "00:00:05"
            - action: button.press
              target:
                entity_id: button.bosch_sma67md06e_68a40e70cb46_start_pause
            - action: notify.mobile_app_ilias_s23_ultra
              data:
                message: |
                  HEMMET {{ now().strftime('%R') }}:
                  Nu startar diskmaskinen (fjärrstart)
                data:
                  ttl: 0
                  priority: high
        - conditions:
            - condition: trigger
              id: "2" # Tredje triggern
          sequence:
            - action: input_text.set_value
              target:
                entity_id: input_text.diskmaskin_tid_fjarrstart
              data:
                value: ""
            - action: notify.mobile_app_ilias_s23_ultra
