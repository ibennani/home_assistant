- alias: 'Mobilnotis Anna: Vilka kommer hem och går hemifrån'
  id: '791834010101014158674'
  description: Hemma-notiser till Anna via aktiv_zon (mittpunkt i zone.home).
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - sensor.erik_aktiv_zon
    - sensor.isabelle_aktiv_zon
    - sensor.ilias_aktiv_zon
  conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.to_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.from_state.state != trigger.to_state.state
         and ('zone.home' in [trigger.from_state.state, trigger.to_state.state]) }}
  actions:
  - variables:
      notification_message: >
                {%- if trigger.entity_id == 'sensor.erik_aktiv_zon' -%}
                  {%- set person = 'Erik' -%}
                {%- elif trigger.entity_id == 'sensor.isabelle_aktiv_zon' -%}
                  {%- set person = 'Isabelle' -%}
                {%- elif trigger.entity_id == 'sensor.ilias_aktiv_zon' -%}
                  {%- set person = 'Ilias' -%}
                {%- else -%}
                  {%- set person = 'Okänd' -%}
                {%- endif -%}
                {%- if trigger.to_state.state == 'zone.home' -%}
                  {{ person }} är hemma
                {%- elif trigger.from_state.state == 'zone.home' -%}
                  {{ person }} har gått hemifrån
                {%- endif -%}
  - action: notify.mobile_app_anna_s22_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: 
{{ notification_message }}"
      data:
        ttl: 0
        priority: high

- alias: 'Mobilnotis: Posten har kommit'
  id: '7918365089098048674'
  mode: single
  max_exceeded: silent
  triggers:
  - trigger: state
    entity_id: binary_sensor.rorelse_i_brevladan
    to: 'on'
    for: 00:00:05
    not_from:
    - unavailable
    - unknown
  conditions:
  - condition: template
    value_template: "{% set last_triggered = state_attr(this.entity_id, 'last_triggered')
      %} {{ last_triggered == none or\n   (as_timestamp(now()) - as_timestamp(last_triggered))
      > (15 * 60) }}\n"
  actions:
  - parallel:
    - sequence:
      - action: script.turn_on
        target:
          entity_id: script.las_text_i_valfri_device
        data:
          variables:
            hogtalare: media_player.googlehome_infopuckarna
            meddelande: Nu har posten kommit
            volym: "{% if is_state('media_player.sony_tv_i_vardagsrummet', 'playing')
              %}\n  {{ states('input_number.google_home_volume_setting_dag') | float(default=0)
              / 100 }}\n{% else %}\n  {{ states('input_number.google_home_volume_setting_notiser')
              | float(default=0) / 100 }}\n{% endif %}\n"
            voice: MattiasNeural
    - sequence:
      - action: notify.mobile_app_ilias_s23_ultra
        data:
          message: 'HEMMET {{ now().strftime(''%H:%M'') }}:  Posten har kommit

            '
          data:
            ttl: 0
            priority: high
- id: 5551111dasg5sg
  alias: 'Mobilnotis: Diskmaskinen fjärrstart'
  triggers:
  - trigger: template
    id: rakna_ut_starttid
    value_template: "{{\n  is_state('binary_sensor.diskmaskin_lucka', 'off') and\n
      \ is_state('binary_sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_remotecontrolstartallowed',
      'on')\n}}"
  - trigger: time_pattern
    minutes: /1
    id: fjarrstarta_diskmaskinen
  - trigger: homeassistant
    event: start
    id: fjarrstarta_diskmaskinen
  - trigger: template
    id: avbruten_fjarrstart
    value_template: "{{\n  is_state('binary_sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_remotecontrolstartallowed','off')
      and\n  not is_state('input_text.diskmaskin_tid_fjarrstart','')\n}}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: rakna_ut_starttid
      sequence:
      - variables:
          cycle_duration_minutes: 66
          slot_len_min: 15
          dishwasher_program: Dishcare.Dishwasher.Program.Eco50
          use_speed_option: true
          speed_option_entity: switch.bosch_sma67md06e_68a40e70cb46_dishcare_dishwasher_option_variospeedplus
          weekday_morning_deadline: 6
          weekday_afternoon_deadline: 16
          weekend_deadline: 8
          heavy_load_percentage: 0.75
          heavy_weight: 1
          light_weight: 0.5
      - variables:
          num_slots: '{{ (cycle_duration_minutes / slot_len_min) | round(0,''ceil'')
            | int }}'
          num_heavy_slots: '{{ (num_slots * heavy_load_percentage) | round(0,''ceil'')
            | int }}'
          num_light_slots: '{{ (num_slots - num_heavy_slots) | int }}'
          total_weight_unnormalized: '{{ num_heavy_slots * heavy_weight + num_light_slots
            * light_weight }}'
          heavy_factor: '{{ (heavy_weight / total_weight_unnormalized) | float }}'
          light_factor: '{{ (light_weight / total_weight_unnormalized) | float }}'
      - variables:
          next_deadline: "{% set current = now() %} {% set cycle_min = cycle_duration_minutes
            %}  {% set is_weekday = current.weekday() < 5 %}  {% set finish_time =
            current + timedelta(minutes=cycle_min) %}  {% if is_weekday %}\n  {% set
            morning = current.replace(hour=weekday_morning_deadline, minute=0, second=0,
            microsecond=0) %}\n  {% set afternoon = current.replace(hour=weekday_afternoon_deadline,
            minute=0, second=0, microsecond=0) %}\n  {{ morning if finish_time <=
            morning else (afternoon if finish_time <= afternoon else (\n    (current
            + timedelta(days=1)).replace(\n      hour=(weekday_morning_deadline if
            (current + timedelta(days=1)).weekday() < 5 else weekend_deadline),\n
            \     minute=0, second=0, microsecond=0))) }}\n{% else %}\n  {% set today_deadline
            = current.replace(hour=weekend_deadline, minute=0, second=0, microsecond=0)
            %}\n  {{ today_deadline if finish_time <= today_deadline else\n    ((current
            + timedelta(days=1)).replace(\n      hour=(weekday_morning_deadline if
            (current + timedelta(days=1)).weekday() < 5 else weekend_deadline),\n
            \     minute=0, second=0, microsecond=0)) }}\n{% endif %}"
      - variables:
          first_allowed_ts: '{% set base = (now() | as_datetime).replace(second=0,
            microsecond=0) %}  {% set m = base.minute % (slot_len_min | int) %}  {{
            as_timestamp(base if m == 0 else (base + timedelta(minutes=(slot_len_min
            | int) - m))) | float }}'
          latest_allowed_ts: '{% set dt = ((next_deadline | as_datetime) - timedelta(minutes=cycle_duration_minutes))
            | as_datetime %}  {% set floorm = (dt.minute // (slot_len_min | int))
            * (slot_len_min | int) %}  {{ as_timestamp(dt.replace(minute=floorm, second=0,
            microsecond=0)) | float }}'
      - variables:
          best_start_iso: "{# ---- 1) Läs priser robust ---- #}  {% set np = 'sensor.nordpool_kwh_se3_sek_3_10_025'
            %}  {% set tv_raw = state_attr(np, 'today') | default([]) %}  {% set tm_raw
            = state_attr(np, 'tomorrow') | default([]) %}  {% set tmr = state_attr(np,
            'tomorrow_valid') | default(false) %}  {% set tm_ok = (tmr is boolean
            and tmr) or (tmr is string and tmr | lower == 'true') %}  {% set tv_list
            = tv_raw if tv_raw is sequence and tv_raw is not string else (tv_raw |
            replace(' ','') | replace('\\n','') | split(',')) %}  {% set tm_list =
            tm_raw if tm_raw is sequence and tm_raw is not string else (tm_raw | replace('
            ','') | replace('\\n','') | split(',')) %}  {% set vals = (tv_list + (tm_list
            if tm_ok else [])) | map('float') | list %}  {% set n = vals | count %}\n{#
            ---- 2) Indexfönster (15-min) mot dagens midnatt ---- #}  {% set slot_len
            = (slot_len_min | int) %}  {% set slot_secs = slot_len * 60 %}  {% set
            base_midnight = (now() | as_datetime).replace(hour=0, minute=0, second=0,
            microsecond=0) %}  {% set base_ts = as_timestamp(base_midnight) | float
            %}  {% set fi = (((first_allowed_ts | float) - base_ts) / slot_secs) |
            round(0,'ceil') | int %}  {% set li = (((latest_allowed_ts | float) -
            base_ts) / slot_secs) | round(0,'floor') | int %}  {% set max_start =
            (n - (num_slots | int)) | int %}  {% set start_i = 0 if fi < 0 else fi
            %}  {% set end_i = (max_start if li > max_start else li) %}\n{# ---- 3)
            Sök billigaste fönster (viktat) ---- #}  {% set ns = namespace(best_i=-1,
            best_cost=None, hs=0.0, ls=0.0) %}  {% if n >= (num_slots | int) and end_i
            >= start_i %}\n  {% for i in range(start_i, end_i + 1) %}\n    {% set
            ns.hs = 0.0 %}\n    {% for j in range(0, (num_heavy_slots | int)) %}\n
            \     {% set ns.hs = ns.hs + (vals[i+j] | float) %}\n    {% endfor %}\n
            \   {% set ns.ls = 0.0 %}\n    {% for j in range((num_heavy_slots | int),
            (num_slots | int)) %}\n      {% set ns.ls = ns.ls + (vals[i+j] | float)
            %}\n    {% endfor %}\n    {% set cost = ns.hs * (heavy_factor | float)
            + ns.ls * (light_factor | float) %}\n    {% if ns.best_cost is none or
            cost < ns.best_cost %}\n      {% set ns.best_cost = cost %}\n      {%
            set ns.best_i = i %}\n    {% endif %}\n  {% endfor %}\n  {% if ns.best_i
            < 0 %}\n    {% set ns.best_i = start_i %}\n  {% endif %}\n{% endif %}\n{#
            ---- 4) Returnera ISO ---- #}  {% if ns.best_i >= 0 %}\n  {% set dt =
            (base_midnight + timedelta(minutes=slot_len*ns.best_i)) | as_local %}\n
            \ {{ dt.strftime('%Y-%m-%dT%H:%M:00') }}\n{% else %}\n  {{ '' }}\n{% endif
            %}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ best_start_iso != '''' }}'
          sequence:
          - variables:
              avg_run_price: "{% set np = 'sensor.nordpool_kwh_se3_sek_3_10_025' %}
                \ {% set tv_raw = state_attr(np, 'today') | default([]) %}  {% set
                tm_raw = state_attr(np, 'tomorrow') | default([]) %} {% set tmr =
                state_attr(np, 'tomorrow_valid') | default(false) %}  {% set tm_ok
                = (tmr is boolean and tmr) or (tmr is string and tmr | lower == 'true')
                %}  {% set tv_list = tv_raw if tv_raw is sequence and tv_raw is not
                string else (tv_raw | replace(' ','') | replace('\\n','') | split(','))
                %}  {% set tm_list = tm_raw if tm_raw is sequence and tm_raw is not
                string else (tm_raw | replace(' ','') | replace('\\n','') | split(','))
                %}  {% set vals = (tv_list + (tm_list if tm_ok else [])) | map('float')
                | list %}  {% set slot_len = (slot_len_min | int) %}  {% set slot_secs
                = slot_len * 60 %}  {% set base_midnight = (now() | as_datetime).replace(hour=0,
                minute=0, second=0, microsecond=0) %}  {% set base_ts = as_timestamp(base_midnight)
                | float %}  {% set bi = (((as_timestamp(best_start_iso | as_datetime)
                | float) - base_ts) / slot_secs) | round(0,'floor') | int %}  {% set
                ns = namespace(s=0.0) %}  {% for k in range(bi, bi + (num_slots |
                int)) %}\n  {% set ns.s = ns.s + (vals[k] | float) %}\n{% endfor %}
                \ {{ (ns.s / (num_slots | int)) | float }}"
          - action: input_text.set_value
            target:
              entity_id: input_text.diskmaskin_tid_fjarrstart
            data:
