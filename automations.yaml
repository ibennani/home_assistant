  action:
  - action: homeassistant.turn_on
    entity_id: light.takspottarna_hallen_level
    data:
      brightness_pct: "{% set städning = is_state('input_boolean.stadning_pagar',
        'on') %} {% set tid = states('input_select.house_time_modes') %} {% set utelux
