### Styr belysningen i Eriks rum med IKEA-fjärren ###

# Styr belysningen i Eriks rum
- alias: "Belysning: Styr belysningen i Eriks rum"
  id: "015091598558904098dg498fsf890"
  mode: restart
  triggers:
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_eriks_rum
    - trigger: state
      entity_id: device_tracker.anna_s22_ultra
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) >= 2000 }}
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 2000
          or states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) >= 1000 }}
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 1000 }}
  action:
    # Ändra ljuset beronde på ljusstyrkan
    - action: >
        {% if trigger.entity_id == "sensor.utomhus_baksidan_ljusstyrka" %} script.eriks_rum_stall_in_belysningen
        {% else %} script.do_nothing
        {% endif %}
    # Anna är hemma eller har gått hemifrån
    - action: input_select.select_option      
      target: 
        entity_id: input_select.eriks_rum_belysning
      data:
        option: >
          {% if trigger.entity_id == "device_tracker.anna_s22_ultra"
            and trigger.to_state.state != trigger.from_state.state
            and states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) >= 2000 
            and is_state("input_select.house_time_modes","Dag") %}
              {% if is_state("device_tracker.anna_s22_ultra","home") %} Trådkorgarna normalbelysning
              {% else %} Släckt
              {% endif %}
          {% else %} {{ states("input_select.eriks_rum_belysning") }}
          {% endif %}      
    # Enkeltryck uppåt (nedsänkta knappen)
    - action: >
        {% if trigger.event.data.event | int(default = 0)  == 1002 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data: 
        entity_id: input_select.eriks_rum_belysning
        option: >
          {% if states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] %}
            {% if states("input_select.eriks_rum_belysning") in ["Släckt","Mysigt","Trådkorgarna maxbelysning"] %} Tänt
            {% else %} Släckt
            {% endif %}
          {% elif states("input_select.house_time_modes") in ["Natt"] %} 
            {% if states("input_select.eriks_rum_belysning") in ["Släckt"] %} Tänt
            {% else %} Släckt
            {% endif %}        
          {% else %} Släckt
          {% endif %}  
    # Långtryck uppåt (nedsänkta knappen)
    - action: >
        {% if trigger.event.data.event | int(default = 0) in [1001,1003] %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data: 
        entity_id: input_select.eriks_rum_belysning
        option: >
          {% if is_state("input_select.eriks_rum_belysning","Mysigt") %} Tänt
          {% else %} Mysigt
          {% endif %}
    # Enkeltryck nedåt 
    - action: >
        {% if trigger.event.data.event | int(default = 0) in [2002] %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data: 
        entity_id: input_select.eriks_rum_belysning
        option: >
          {% if states("input_select.eriks_rum_belysning") not in ["Trådkorgarna maxbelysning"] %} Trådkorgarna maxbelysning
          {% else %} 
            {% if   states("input_select.house_time_modes") in ["Morgon","Kväll"] %} Tänt
            {% elif states("input_select.house_time_modes") in ["Dag"] %} 
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) >= 2000 %} 
                {% if is_state("device_tracker.anna_s22_ultra","home") %} Trådkorgarna normalbelysning
                {% else%} Släckt
                {% endif %}
              {% else %} Tänt
              {% endif %}
            {% else %} Släckt
            {% endif %}
          {% endif %}


# Tänd Eriks myshörna på max när Anna är hemma på dagen
- alias: "Belysning: Välj Trådkorgarna normalbelysning när Anna är hemma på dagen"
  id: "015091598558904098dg498fsf890dgdgr"
  triggers:
    - trigger: state
      entity_id: person.anna_bennani
    - trigger: state
      entity_id: input_select.house_time_modes
  action:
    - delay: "00:00:05"
    - action: input_select.select_option
      target:
        entity_id: input_select.eriks_rum_belysning
      data:
        option: >
          {% set anna_home = is_state('person.anna_bennani', 'home') %}
          {% set time_mode_day = is_state('input_select.house_time_modes', 'Dag') %}
          {% set light_intensity_high = states('sensor.utomhus_framsidan_ljusstyrka')|float >= 2000 %}
          {% set vakna = states("var.morgoninfo_koket_redan_upplast") == "true" %}
          
