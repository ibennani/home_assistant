- id: '7917348670004'
  alias: 'Mobilnotis: Home Assistant har startat'
  triggers:
  - trigger: homeassistant
    event: start
  actions:
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nHA omstartat\nIP: {{ states('sensor.local_ip')
        | string }}\nVersion: {{ states('sensor.current_version') | string }}\n"
      data:
        ttl: 0
        priority: high
  - action: var.set
    data:
      entity_id: var.tid_solen_mitt_pa_dagen
      value: '{{ states("sensor.sun_next_noon") + ":00" }}

        '
  - action: automation.trigger
    target:
      entity_id: automation.belysning_styr_belysningen_utomhus
  - action: input_number.set_value
    data:
      entity_id: input_number.google_home_volume_setting_notiser
      value: "{% if is_state('var.morgoninfo_koket_redan_upplast', 'true') %}\n  {{
        states('input_number.google_home_volume_setting_dag') | float(default=0) }}\n{%
        elif is_state('input_select.house_time_modes', 'Natt') %}\n  {{ states('input_number.google_home_volume_setting_natt')
        | float(default=0) }}\n{% else %}\n  {{ states('input_number.google_home_volume_setting_dag')
        | float(default=0) }}\n{% endif %}\n"
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.googlehome_ilias_rum
      - media_player.googlehome_vardagsrummet
      - media_player.googlehome_sovrummet
      - media_player.googlehome_annas_rum
      - media_player.googlehome_koket
      - media_player.googlehome_eriks_rum
    data:
      volume_level: '{{ states("input_number.google_home_volume_setting_notiser")
        | int(default=0) / 100 }}

        '
  - action: script.turn_on
    target:
      entity_id: "{% if is_state(\"input_select.house_time_modes\",\"Morgon\") %}\n
        \ script.morgonbelysning\n{% elif is_state(\"input_select.house_time_modes\",\"Dag\")
        and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int(default=0) >= 2000
        %} \n  {% if is_state(\"input_boolean.julbelysning\",\"on\") %}\n    script.kvallsbelysning\n
        \ {% else %}\n    script.dagsbelysning\n  {% endif %}\n{% elif is_state(\"input_select.house_time_modes\",\"Dag\")
        and states(\"sensor.utomhus_framsidan_ljusstyrka\") | int(default=0) < 2000
        %}\n  script.kvallsbelysning\n{% elif is_state(\"input_select.house_time_modes\",\"Kväll\")
        %}\n  script.kvallsbelysning\n{% elif is_state(\"input_select.house_time_modes\",\"Natt\")
        %}\n  script.nattbelysning\n{% else %}\n  script.do_nothing\n{% endif %}\n"
- id: '7918348695'
  alias: 'Huset: Styr huslägen (house_time_modes) - Triggerbaserad'
  description: Uppdaterar husets läge baserat på händelser istället för konstant skanning.
  triggers:
  - trigger: time
    at:
    - 02:00:00
    - '21:30:00'
    - '22:30:00'
  - trigger: time
    at: input_datetime.huset_morgontid_vardagar
  - trigger: time
    at: input_datetime.huset_morgontid_helger
  - trigger: time
    at: input_datetime.huset_morgontid_lediga
  - trigger: time
    at: input_datetime.huset_nattid_son_tor
  - trigger: time
    at: input_datetime.huset_nattid_fre_lor
  - trigger: time
    at: input_datetime.huset_nattid_lediga
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: input_number.settings_solvinkel_dag
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: input_number.settings_solvinkel_dag
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: input_number.settings_solvinkel_kvall
  - trigger: numeric_state
    entity_id: sun.sun
    attribute: elevation
    above: input_number.settings_solvinkel_kvall
  - trigger: numeric_state
    entity_id: sensor.utomhus_framsidan_ljusstyrka
    above: 2000
  - trigger: numeric_state
    entity_id: sensor.utomhus_framsidan_ljusstyrka
    below: 2000
  - trigger: state
    entity_id:
    - sensor.ilias_aktiv_zon
    - sensor.anna_aktiv_zon
    to: zone.home
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - sensor.ilias_aktiv_zon
    - sensor.anna_aktiv_zon
    from: zone.home
    for: 00:02:00
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id:
    - sensor.ilias_s23_ultra_charger_type
    - sensor.anna_s22_ultra_charger_type
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: input_boolean.vacation_mode
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: homeassistant
    event: start
  actions:
  - action: input_select.select_option
    target:
      entity_id: input_select.house_time_modes
    data:
      option: "{# ------------------------------ #} {# Grunddata                      #}
        {# ------------------------------ #} {% set now_dt = now() %} {% set now_ts
        = as_timestamp(now_dt) %} {% set veckodag = now_dt.isoweekday() %} {% set
        _bad = ['unknown','unavailable','none',''] %}\n{% set t_morgon_vardagar =
        states('input_datetime.huset_morgontid_vardagar') %} {% set morgontid_vardagar_ts
        = as_timestamp(today_at(t_morgon_vardagar)) if t_morgon_vardagar not in _bad
        else none %}\n{% set t_morgon_helger = states('input_datetime.huset_morgontid_helger')
        %} {% set morgontid_helger_ts = as_timestamp(today_at(t_morgon_helger)) if
        t_morgon_helger not in _bad else none %}\n{% set t_morgon_lediga = states('input_datetime.huset_morgontid_lediga')
        %} {% set morgontid_lediga_ts = as_timestamp(today_at(t_morgon_lediga)) if
        t_morgon_lediga not in _bad else none %}\n{% set t_natt_son_tor = states('input_datetime.huset_nattid_son_tor')
        %} {% set nattid_son_tor_ts = as_timestamp(today_at(t_natt_son_tor)) if t_natt_son_tor
        not in _bad else none %}\n{% set t_natt_fre_lor = states('input_datetime.huset_nattid_fre_lor')
        %} {% set nattid_fre_lor_ts = as_timestamp(today_at(t_natt_fre_lor)) if t_natt_fre_lor
        not in _bad else none %}\n{% set t_natt_lediga = states('input_datetime.huset_nattid_lediga')
        %} {% set nattid_lediga_ts = as_timestamp(today_at(t_natt_lediga)) if t_natt_lediga
        not in _bad else none %}\n{% set ljusstyrka_framsidan = states('sensor.utomhus_framsidan_ljusstyrka')
        | int(0) %}\n{% set ilias_hemma = is_state('binary_sensor.ilias_hemma', 'on')
        %} {% set anna_hemma  = is_state('binary_sensor.anna_hemma', 'on') %} {% set någon_hemma
        = ilias_hemma or anna_hemma %}\n{% set ilias_mobil_laddar = is_state('sensor.ilias_s23_ultra_charger_type','ac')
        %} {% set annas_mobil_laddar = is_state('sensor.anna_s22_ultra_charger_type','ac')
        %}\n{# Robust hantering av laddvillkor beroende på vem som är hemma #} {%
        set laddvillkor_ok =\n  (ilias_hemma and anna_hemma and ilias_mobil_laddar
        and annas_mobil_laddar)\n  or (ilias_hemma and not anna_hemma and ilias_mobil_laddar)\n
        \ or (not ilias_hemma and anna_hemma and annas_mobil_laddar)\n%}\n{% set solvinkel_dag
        \  = states('input_number.settings_solvinkel_dag') | float(0) %} {% set solvinkel_kvall
        = states('input_number.settings_solvinkel_kvall') | float(0) %} {% set elevation
        \      = state_attr('sun.sun','elevation') | float(0) %}\n{# ------------------------------
        #} {# Sol-noon för \"före/efter lunch\"#} {# ------------------------------
        #} {% set nn = state_attr('sun.sun','next_noon') %} {% set nn_dt = as_datetime(nn)
        if nn else none %} {% set noon_today_dt = (nn_dt if (nn_dt and nn_dt.date()
        == now_dt.date()) else (nn_dt - timedelta(days=1))) if nn_dt else none %}
        {% set noon_today_ts = as_timestamp(noon_today_dt) if noon_today_dt else none
        %}\n{# ------------------------------ #} {# Dynamisk cutoff och laddtid baserat
        på om vi är i \"tidig morgon\"-fasen #} {# ------------------------------
        #} {% set cutoff_time_str = '02:00:00' %}\n{# Om klockan är mellan 00:00 och
        12:00 (lunch), så hör timmarna före 02:00 till IGÅR (tekniskt sett) men vi
        vill att cutoff kl 02:00 idag ska gälla för den natt vi befinner oss i nu
        #} {% if now_dt.hour < 12 %}\n  {% set cutoff_today_dt = today_at(cutoff_time_str)
        %}\n  {% set laddtid_str = '21:30:00' if (now_dt - timedelta(days=1)).isoweekday()
        in [7,1,2,3,4] else '22:30:00' %}\n  {% set laddtid_ref_dt = today_at(laddtid_str)
        - timedelta(days=1) %}\n{% else %}\n  {% set cutoff_today_dt = today_at(cutoff_time_str)
        + timedelta(days=1) %}\n  {% set laddtid_str = '21:30:00' if veckodag in [7,1,2,3,4]
        else '22:30:00' %}\n  {% set laddtid_ref_dt = today_at(laddtid_str) %}\n{%
        endif %}\n{% set cutoff_ts = as_timestamp(cutoff_today_dt) %} {% set laddtid_ts
        = as_timestamp(laddtid_ref_dt) %}\n{% set current_mode = states('input_select.house_time_modes')
        %} {% set ns = namespace(mode=current_mode) %}\n{# ============================================================
        #} {# Regelmotor: VACATION OFF                                     #} {# ============================================================
        #} {% if is_state('input_boolean.vacation_mode','off') %}\n\n  {# Tvinga kvar
        Kväll fram till cutoff eller tills laddvillkor uppfylls #}\n  {% set keep_evening
        =\n    current_mode == 'Kväll'\n    and någon_hemma\n    and now_ts < cutoff_ts\n
        \   and not (now_ts >= laddtid_ts and laddvillkor_ok)\n  %}\n\n  {% if keep_evening
        %}\n    {% set ns.mode = 'Kväll' %}\n  {% else %}\n\n    {# Natt före morgontid
        #}\n    {% if veckodag in [1,2,3,4,5] and morgontid_vardagar_ts is not none
        and now_ts < morgontid_vardagar_ts and (not någon_hemma or now_ts >= cutoff_ts
        or current_mode == 'Natt') %}\n      {% set ns.mode = 'Natt' %}\n    {% elif
        veckodag in [6,7] and morgontid_helger_ts is not none and now_ts < morgontid_helger_ts
        and (not någon_hemma or now_ts >= cutoff_ts or current_mode == 'Natt') %}\n
        \     {% set ns.mode = 'Natt' %}\n\n    {# Morgon/Dag före lunch #}\n    {%
        elif veckodag in [1,2,3,4,5]\n          and morgontid_vardagar_ts is not none
        and now_ts >= morgontid_vardagar_ts\n          and noon_today_ts is not none
        and now_ts < noon_today_ts\n          and elevation < solvinkel_dag %}\n      {%
        set ns.mode = 'Morgon' %}\n    {% elif veckodag in [6,7]\n          and morgontid_helger_ts
        is not none and now_ts >= morgontid_helger_ts\n          and noon_today_ts
        is not none and now_ts < noon_today_ts\n          and elevation < solvinkel_dag
        %}\n      {% set ns.mode = 'Morgon' %}\n    {% elif veckodag in [1,2,3,4,5]\n
        \         and morgontid_vardagar_ts is not none and now_ts >= morgontid_vardagar_ts\n
        \         and noon_today_ts is not none and now_ts < noon_today_ts\n          and
        elevation >= solvinkel_dag %}\n      {% set ns.mode = 'Dag' %}\n    {% elif
        veckodag in [6,7]\n          and morgontid_helger_ts is not none and now_ts
        >= morgontid_helger_ts\n          and noon_today_ts is not none and now_ts
        < noon_today_ts\n          and elevation >= solvinkel_dag %}\n      {% set
        ns.mode = 'Dag' %}\n\n    {# Efter lunch #}\n    {% elif veckodag in [7,1,2,3,4]\n
        \         and noon_today_ts is not none and now_ts >= noon_today_ts\n          and
        nattid_son_tor_ts is not none and now_ts < nattid_son_tor_ts\n          and
        (elevation > solvinkel_kvall or ljusstyrka_framsidan > 2000) %}\n      {%
        set ns.mode = 'Dag' %}\n    {% elif veckodag == 5\n          and noon_today_ts
        is not none and now_ts >= noon_today_ts\n          and nattid_fre_lor_ts is
        not none and now_ts < nattid_fre_lor_ts\n          and (elevation > solvinkel_kvall
        or ljusstyrka_framsidan > 2000) %}\n      {% set ns.mode = 'Dag' %}\n\n    {#
        Dag -> Kväll när det blir mörkt #}\n    {% elif veckodag in [7,1,2,3,4]\n
        \         and current_mode == 'Dag'\n          and noon_today_ts is not none
        and now_ts >= noon_today_ts\n          and nattid_son_tor_ts is not none and
        now_ts < nattid_son_tor_ts\n          and elevation < solvinkel_kvall\n          and
        ljusstyrka_framsidan < 2000 %}\n      {% set ns.mode = 'Kväll' %}\n    {%
        elif veckodag in [5,6]\n          and current_mode == 'Dag'\n          and
        noon_today_ts is not none and now_ts >= noon_today_ts\n          and nattid_fre_lor_ts
        is not none and now_ts < nattid_fre_lor_ts\n          and elevation < solvinkel_kvall\n
        \         and ljusstyrka_framsidan < 2000 %}\n      {% set ns.mode = 'Kväll'
        %}\n\n    {# Kväll -> Natt #}\n    {% elif current_mode == 'Kväll' and någon_hemma
        and now_ts >= laddtid_ts and laddvillkor_ok %}\n      {% set ns.mode = 'Natt'
        %}\n    {% elif current_mode == 'Kväll' and någon_hemma and now_ts >= cutoff_ts
        %}\n      {% set ns.mode = 'Natt' %}\n\n    {# Ingen hemma #}\n    {% elif
        not någon_hemma and veckodag in [7,1,2,3,4]\n          and nattid_son_tor_ts
        is not none and now_ts >= nattid_son_tor_ts %}\n      {% set ns.mode = 'Natt'
        %}\n    {% elif not någon_hemma and veckodag in [5,6]\n          and nattid_fre_lor_ts
        is not none and now_ts >= nattid_fre_lor_ts %}\n      {% set ns.mode = 'Natt'
        %}\n    {% endif %}\n\n  {% endif %}\n\n{# ============================================================
        #} {# Regelmotor: VACATION ON                                      #} {# ============================================================
        #} {% elif is_state('input_boolean.vacation_mode','on') %}\n\n  {% set keep_evening
        =\n    current_mode == 'Kväll'\n    and någon_hemma\n    and now_ts < cutoff_ts\n
        \   and not (now_ts >= laddtid_ts and laddvillkor_ok)\n  %}\n\n  {% if keep_evening
        %}\n    {% set ns.mode = 'Kväll' %}\n  {% else %}\n\n    {# Natt före morgontid
        (lediga) #}\n    {% if morgontid_lediga_ts is not none and now_ts < morgontid_lediga_ts
        and (not någon_hemma or now_ts >= cutoff_ts or current_mode == 'Natt') %}\n
        \     {% set ns.mode = 'Natt' %}\n\n    {# Morgon/Dag före lunch (lediga)
        #}\n    {% elif morgontid_lediga_ts is not none and now_ts >= morgontid_lediga_ts\n
        \         and noon_today_ts is not none and now_ts < noon_today_ts\n          and
        elevation < solvinkel_dag %}\n      {% set ns.mode = 'Morgon' %}\n    {% elif
        morgontid_lediga_ts is not none and now_ts >= morgontid_lediga_ts\n          and
        noon_today_ts is not none and now_ts < noon_today_ts\n          and elevation
        >= solvinkel_dag %}\n      {% set ns.mode = 'Dag' %}\n\n    {# Efter lunch
        (lediga) #}\n    {% elif noon_today_ts is not none and now_ts >= noon_today_ts\n
        \         and nattid_lediga_ts is not none and now_ts < nattid_lediga_ts\n
        \         and (elevation > solvinkel_kvall or is_state('binary_sensor.soligt','on'))
        %}\n      {% set ns.mode = 'Dag' %}\n    {% elif noon_today_ts is not none
        and now_ts >= noon_today_ts\n          and nattid_lediga_ts is not none and
        now_ts < nattid_lediga_ts\n          and elevation < solvinkel_kvall\n          and
        ljusstyrka_framsidan < 2000 %}\n      {% set ns.mode = 'Kväll' %}\n\n    {#
        Kväll -> Natt (lediga) #}\n    {% elif current_mode == 'Kväll' and någon_hemma
        and now_ts >= laddtid_ts and laddvillkor_ok %}\n      {% set ns.mode = 'Natt'
        %}\n    {% elif current_mode == 'Kväll' and någon_hemma and now_ts >= cutoff_ts
        %}\n      {% set ns.mode = 'Natt' %}\n\n    {# Ingen hemma -> Natt (lediga)
        #}\n    {% elif not någon_hemma and nattid_lediga_ts is not none and now_ts
        >= nattid_lediga_ts %}\n      {% set ns.mode = 'Natt' %}\n    {% endif %}\n\n
        \ {% endif %}\n\n{% endif %}\n{# Slutgiltig failsafe #} {{ (ns.mode if ns.mode
        in ['Morgon','Dag','Kväll','Natt']\n   else (current_mode if current_mode
        in ['Morgon','Dag','Kväll','Natt'] else 'Natt')) | string }}\n"
  mode: restart
- alias: 'Husläge: Till morgon'
  id: '7918368674'
  triggers:
  - trigger: state
    entity_id: input_select.house_time_modes
    to: Morgon
    not_from:
    - unavailable
    - unknown
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(''var.morgoninfo_koket_redan_upplast'', ''false'')
          }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: Dämpat
  - action: script.turn_on
    target:
      entity_id: script.morgonbelysning
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nHusläge till morgon.\nTemperatur
        {{ states('sensor.framsidan_temperatur') | float | round(1) | string | replace('.',
        ',') }} grader.\nLjus {{ states('sensor.utomhus_framsidan_ljusstyrka') | float
        | round(0) | string | replace('.', ',') }} lux.\nElevation {{ states('sensor.sun_elevation')
        | string | replace('.', ',') }} grader.\nAzimuth {{ states(\"sensor.sun_azimuth\")
        | string | replace('.', ',') }} grader.\n"
      data:
        ttl: 0
        priority: high
- alias: 'Husläge: Till dag'
  id: '1918348674'
  triggers:
  - trigger: state
    entity_id: input_select.house_time_modes
    to: Dag
    not_from:
    - unavailable
    - unknown
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(''var.morgoninfo_koket_redan_upplast'', ''false'')
          }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: Dämpat
  - action: script.turn_on
    target:
      entity_id: "{% if states(\"sensor.utomhus_framsidan_ljusstyrka\") | int(default=0)
        < 2000 %}\n  script.kvallsbelysning\n{% elif states(\"sensor.utomhus_framsidan_ljusstyrka\")
        | int(default=0) >= 2000 \n    and is_state(\"input_boolean.vacation_mode\",\"on\")
        \n    and is_state(\"input_boolean.julbelysning\",\"on\") %}\n      script.kvallsbelysning\n{%
        else %}\n  script.dagsbelysning\n{% endif %}\n"
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nHusläge till dag.\nTemperatur
        {{ states('sensor.framsidan_temperatur') | float | round(1) | string | replace('.',
        ',')}} grader.\nLjus {{ states('sensor.utomhus_framsidan_ljusstyrka') | float
        | round(0) | string | replace('.', ',') }} lux.\nElevation {{ states('sensor.sun_elevation')
        | string | replace('.', ',') }} grader.\nAzimuth {{ states(\"sensor.sun_azimuth\")
        | string | replace('.', ',') }} grader.\n"
      data:
        ttl: 0
        priority: high
- alias: 'Husläge: Till kväll'
  id: 0918348674
  triggers:
  - trigger: state
    entity_id: input_select.house_time_modes
    to: Kväll
    not_from:
    - unavailable
    - unknown
  action:
  - action: script.turn_on
    target:
      entity_id: script.kvallsbelysning
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nHusläge till kväll.\nTemperatur
        {{ states('sensor.utomhus_baksidan_temperature') | float | round(1) | string
        | replace('.', ',') }} grader.\nLjus {{ states('sensor.utomhus_framsidan_ljusstyrka')
        | float | round(0) | string | replace('.', ',') }} lux.\nElevation {{ states('sensor.sun_elevation')
        | string | replace('.', ',') }} grader.\nAzimuth {{ states(\"sensor.sun_azimuth\")
        | string | replace('.', ',') }} grader.\n"
      data:
        ttl: 0
        priority: high
- alias: 'Husläge: Till natt'
  id: '7918348674'
  triggers:
  - trigger: state
    entity_id: input_select.house_time_modes
    to: Natt
    not_from:
    - unavailable
    - unknown
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ is_state('group.rorelse_i_koket', 'on')\n  or (as_timestamp(now())
          - as_timestamp(state_attr('group.rorelse_i_koket', 'last_changed') or now())
          | int(0) <= 60 * 15) }}\n"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: Dämpat
  - action: script.turn_on
    target:
      entity_id: script.nattbelysning
  - action: script.turn_on
    target:
      entity_id: script.koksflakten_stang_av_och_sla_pa
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state("zone.honme", "0") }}

          '
      sequence:
      - action: media_player.turn_off
        target:
          entity_id: media_player.appletv
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nHusläge till natt.\nTemperatur
        {{ states('sensor.framsidan_temperatur') | float | round(1) | string | replace('.',
        ',') }} grader.\nLjus {{ states('sensor.utomhus_framsidan_ljusstyrka') | float
        | round(0) | string | replace('.', ',') }} lux.\nElevation {{ states('sensor.sun_elevation')
        | string | replace('.', ',') }} grader.\nAzimuth {{ states(\"sensor.sun_azimuth\")
