- id: 015091598558904098dg498dgfsfa000dddsaaage0
  alias: 'Belysning: Styr belysningen och rullgardinen i Eriks rum'
  triggers:
  - id: remote_event
    trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_eriks_rum
  - id: remote_event
    trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_2_eriks_rum
  - id: erik_home
    trigger: state
    entity_id: sensor.erik_aktiv_zon
    to: zone.home
  - id: erik_away
    trigger: state
    entity_id: sensor.erik_aktiv_zon
    from: zone.home
  actions:
  - variables:
      house_mode: '{{ states(''input_select.house_time_modes'') }}'
      lux_back: '{{ states(''sensor.utomhus_baksidan_ljusstyrka'') | int(0) }}'
      current_mode: '{{ states(''input_select.eriks_rum_belysning'') }}'
      remote_event_code: '{{ trigger.event.data.event | int(0) if trigger.id == ''remote_event''
        else 0 }}'
      default_mode_when_erik_away: "{% if states('zone.home') | int(0) == 0 %}\n  Släckt\n{%
        elif house_mode in ['Morgon', 'Kväll'] %}\n  Mysigt\n{% elif house_mode ==
        'Dag' %}\n  {% if lux_back > 2000 %} Släckt {% else %} Mysigt {% endif %}\n{%
        else %}\n  Släckt\n{% endif %}"
      default_mode_when_erik_home: Mysigt
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote_event'' and remote_event_code ==
          1002 }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.eriks_rum_satt_lage
        data:
          variables:
            force: true
            lage: "{% if current_mode != 'Släckt' %}\n  Släckt\n{% else %}\n  {% if
              house_mode == 'Morgon' %}\n    Taklamporna\n  {% elif house_mode == 'Dag'
              %}\n    {% if lux_back > 2000 %} Taklamporna {% else %} Tänt {% endif
              %}\n  {% elif house_mode in ['Kväll', 'Natt'] %}\n    Tänt\n  {% else
              %}\n    Släckt\n  {% endif %}\n{% endif %}"
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote_event'' and remote_event_code ==
          1001 }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.eriks_rum_satt_lage
        data:
          variables:
            force: true
            lage: "{% if current_mode == 'Mysigt' %}\n  {% if lux_back > 2000 %} Taklamporna
              {% else %} Tänt {% endif %}\n{% else %}\n  Mysigt\n{% endif %}"
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote_event'' and remote_event_code ==
          2002 }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''cover.rullgardin_eriks_rum'', ''open'')
              }}'
          sequence:
          - condition: template
            value_template: "{{ not is_state('cover.rullgardin_eriks_rum', 'closed') }}"
          - action: cover.close_cover
            target:
              entity_id: cover.rullgardin_eriks_rum
        default:
        - condition: template
          value_template: "{{ not is_state('cover.rullgardin_eriks_rum', 'open') }}"
        - action: cover.open_cover
          target:
            entity_id: cover.rullgardin_eriks_rum
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote_event'' and remote_event_code ==
          2001 }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.eriks_rum_satt_lage
        data:
          variables:
            force: true
            lage: Läsning
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''erik_home'', ''erik_away''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.eriks_rum_satt_lage
        data:
          variables:
            lage: "{% if trigger.id == 'erik_home' %}\n  {{ default_mode_when_erik_home
              }}\n{% else %}\n  {{ default_mode_when_erik_away }}\n{% endif %}"
    default: []
  mode: restart
