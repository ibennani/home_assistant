      property_key: '001'
      value: KeyPressed2x
    id: sang_s1_dubbel
  - trigger: event
    event_type: zwave_js_value_notification
    event_data:
      device_id: b9089fd44259fa7aba3f6fcd18ea384c
      property_key: '002'
      value: KeyPressed2x
    id: sang_s2_dubbel
  actions:
  - variables:
      lampa: "{% if trigger.id.startswith('fonster') %}\n  light.taklampan_eriks_fonster_level\n{%
        else %}\n  light.taklampan_eriks_sang_level\n{% endif %}\n"
      bada_tak_slackta: '{{ is_state(''light.taklampan_eriks_fonster_level'', ''off'')
        and is_state(''light.taklampan_eriks_sang_level'', ''off'') }}'
      ovrig_alla_slackta: '{{ not (
        is_state(''light.eriks_myslampa'', ''on'')
        or is_state(''light.eriks_jordglob'', ''on'')
        or is_state(''light.led_strip_ovanfor_fotoljen'', ''on'')
        or is_state(''light.led_under_eriks_byra'', ''on'')
        ) }}'
      nuvarande_lage: '{{ states(''input_select.eriks_rum_belysning'') }}'
