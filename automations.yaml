- alias: 'Mobilnotis: Morgondagens el-priser är publicerade'
  id: 000215dd59kbbqq
  triggers:
  - trigger: template
    value_template: '{{ (state_attr(''sensor.nordpool_kwh_se3_sek_3_10_025'',''tomorrow'')
      | count) >= 92 }}'
  action:
  - variables:
      values: '{{ (state_attr(''sensor.nordpool_kwh_se3_sek_3_10_025'',''tomorrow'')
        or []) | map(''float'') | list }}'
      n: '{{ values | count }}'
      avg_all: '{{ (values|sum / n) if n > 0 else 0 }}'
      avg_night: '{{ (values[:24]|sum / (values[:24]|count)) if (values|count) >=
        24 else 0 }}'
      avg_day: "{% if n >= 80 %}\n  {{ (values[40:80]|sum / (values[40:80]|count))
        }}\n{% else %}0{% endif %}"
      vmin: '{{ values|min if n > 0 else None }}'
      vmax: '{{ values|max if n > 0 else None }}'
      i_min: '{{ values.index(values|min) if n > 0 else None }}'
      i_max: '{{ values.index(values|max) if n > 0 else None }}'
      vmin_day: "{% if n >= 40 %}\n  {% set end = 80 if n >= 80 else n %}\n  {% set
        window = values[40:end] %}\n  {{ window|min if (window|count) > 0 else None
        }}\n{% else %}None{% endif %}"
      i_min_day: "{% if n >= 40 %}\n  {% set end = 80 if n >= 80 else n %}\n  {% set
        window = values[40:end] %}\n  {% if (window|count) > 0 %}{{ 40 + window.index(window|min)
        }}{% else %}None{% endif %}\n{% else %}None{% endif %}"
      smin_start: '{{ ''%02d:%02d'' | format((i_min // 4), (i_min % 4) * 15) if i_min
        is not none else None }}'
      smax_start: '{{ ''%02d:%02d'' | format((i_max // 4), (i_max % 4) * 15) if i_max
        is not none else None }}'
      smin_day_start: '{{ ''%02d:%02d'' | format((i_min_day // 4), (i_min_day % 4)
        * 15) if i_min_day is not none else None }}'
      smin_end: '{{ ''%02d:%02d'' | format(((i_min + 1) // 4), ((i_min + 1) % 4) *
        15) if i_min is not none else None }}'
      smax_end: '{{ ''%02d:%02d'' | format(((i_max + 1) // 4), ((i_max + 1) % 4) *
        15) if i_max is not none else None }}'
