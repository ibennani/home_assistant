### Mobilnotiser vid särskilda händerlser ###

# Skicka notis till Ilias mobil om någon batteridriven enhet behöver nytt batteri
- alias: "Mobilnotis: Batteribyte behövs"
  id: '7918308674'
  triggers:
    - trigger: time
      at: '06:00:00'
    - trigger: time
      at: '12:00:00'
    - trigger: time
      at: '18:00:00'      
  action:
    - action: var.set
      data: 
        entity_id: var.change_batteries_message
        value: ""
    - action: var.set
      data:
        entity_id: var.change_batteries_message
        value: |
          {% for entity_id in states.group.battery_levels.attributes.entity_id  
              if (  states(entity_id) != 'unknown' 
                and states(entity_id) != 'unavailable' 
                and states(entity_id) | int(default = 0)  < 40 ) %}
          {% set parts = entity_id.split('.') -%}
          * {{ states[parts[0]][parts[1]].name }}: {{ states(entity_id) }} %
          {%- endfor %} 

          {% for x in expand('group.temp_sensors_with_bad_battery_indicators') 
          if x.state == "unavailable"
          or (((as_timestamp(now()) - (as_timestamp(x.last_updated)) | int(default = 0)) / (12 * 3600)) | int(default = 0) > 0 ) -%}
          {%- set tid = ((as_timestamp(now()) - (as_timestamp(x.last_updated)) | int(default = 0)) / 3600) | int(default = 0) %} 
          {%- if loop.first -%}Följande sensorer behöver troligtvis byta batteri:
          {% else -%}
          {% endif -%}
          *  {{ x.attributes.friendly_name }}
          {%- if x.state == "unavailable" %} är offline
          {% else -%} 
          {% endif -%}
          {%- endfor %}

          {%- for x in expand('group.other_sensors_with_bad_battery_indicators')
          if x.state == "unavailable" -%}
          {% if loop.first -%}Följande sensorer är offline:
          {%- else -%}
          {%- endif %}
          * {{ x.attributes.friendly_name }}
          {%- endfor %} 
    - action: >
        {% if states("var.change_batteries_message") != "" %} notify.mobile_app_ilias_s23_ultra
        {% else %} script.do_nothing
        {% endif %}
      data: 
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          Batterybyte behövs:
          {{ states("var.change_batteries_message") }}




# Skicka mobilnotis när en kritisk HA-mjukvara har en "Uppdatera beskrivning av ljuset utomhus"
- alias: "Mobilnotis: Ny version av kritisk mjukvara"
  id: '7918345465560808077sdg8670'
  triggers:
    - trigger: state
      entity_id:
        - update.home_assistant_core_update
        - update.home_assistant_operating_system_update
        - update.home_assistant_supervisor_update
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state == "on" 
        and trigger.from_state.state != trigger.to_state.state}}
  action:
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          Systemuppdatering.
          {{ trigger.to_state.attributes.title }} går att uppdatera.
          Från {{ trigger.to_state.attributes.installed_version | string }} till {{ trigger.to_state.attributes.latest_version | string }}.
        data:
          ttl: 0
          priority: high



# Skicka mobilnotis när blixten slagit ner någonstans i närheten
- alias: "Mobilnotis: Blixtnedslag"
  id: "sfsk05sfs0g61sg"
  initial_state: on
  triggers:
    - trigger: state
      entity_id: sensor.blitzortung_lightning_counter
  condition:
    - condition: template
      value_template: >
        {{  states("sensor.blitzortung_lightning_counter") | int(default = 0)  > 0 
        and states("sensor.blitzortung_lightning_distance") | int(default = 0) <= 10 }}
  action:
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: |
          {%- if states("sensor.blitzortung_lightning_distance") | int(default = 0) == "unknown" -%}
            {%- set avstand = distance('zone.home','sensor.blixtinfo') | float | round(1) -%}            
          {%- else -%}
            {%- set avstand = states("sensor.blitzortung_lightning_distance") -%}
          {%- endif -%} 
          HEMMET {{ now().strftime('%R') }}: 
          Blixtnedslag kl {{ states.sensor.blitzortung_lightning_distance.last_updated.strftime('%H:%M:%S') }}.
          Avstånd: {{ avstand }} km.
          Riktning: {{ states("sensor.blitzortung_lightning_azimuth") }} grader.
          Totalt: {{ states("sensor.blitzortung_lightning_counter") }} stycken.
        data:
          ttl: 0
          priority: high          
    - action: >
        {%- if states("sensor.blitzortung_lightning_distance") | int(default = 0) == "unknown" -%}
          {%- set avstand = distance('zone.home','sensor.blixtinfo') | float | round(1) -%}            
        {%- else -%}
          {%- set avstand = states("sensor.blitzortung_lightning_distance") -%}
        {%- endif -%} 
        {% if avstand | int(default = 0) < 5 
              and not is_state("input_select.house_time_modes","Natt")
              and is_state("var.morgoninfo_koket_redan_upplast","true") %} 
            script.las_text_i_valfri_device
        {% else %} script.do_nothing
        {% endif %} 
      data: 
        hogtalare: media_player.googlehome_infopuckarna
        volym: '{{ (states("input_number.google_home_volume_setting_notiser") | float(default = 0) / 100) }}'
        voice: "SofieNeural"
        meddelande: >-
          Blixten är 
          {% if avstand | float(default = 0)  >= 1 %} {{ avstand }} kilometer bort.
          {% elif avstand | float(default = 0)  < 1 and avstand | float(default = 0)  > 0 %} {{ ((avstand | float(default = 0) ) * 1000 ) | round(0, default = 0)  }} meter bort.
          {% elif avstand | float(default = 0)  == 0 %} bara några meter bort. Var försiktig! 
          {% else %} på ett okänt ställe.
          {% endif %}


# Skapa en custom device_tracker när en blixt registreras
- alias: "geo: Skapa en devicetracker för varje blixt"
  id: "sdlksalfkjssdasg65ttsm09yty54"
  initial_state: on
  mode: restart
  triggers:
    - trigger: state
      entity_id: sensor.blitzortung_lightning_distance
  action: 
    - action: device_tracker.see
      data:
        source_type: gps
        dev_id: blixtar
        gps:
          - '{{ state_attr("sensor.blitzortung_lightning_distance","lat") | float | round(7,default = 0) }}'
          - '{{ state_attr("sensor.blitzortung_lightning_distance","long") | float | round(7,default = 0) }}'


# Mobilnotis till ilias när en enhet blir unavailable (t.ex. när batteriet dör)
- alias: "Mobilnotis: Enhet unavailable"
  id: "sdlksalfkjsdflgrittsm09yty54"
  initial_state: on
  mode: restart
  triggers:
    - trigger:  state
      entity_id:
        - sensor.skafferiet_temp
        - sensor.isabelles_rum_temp
      to: "unavailable"
#      for: "00:05:00"
    - trigger: state
      entity_id:
        - sensor.skafferiet_temp
        - sensor.isabelles_rum_temp
      from: "unavailable"  
  action:
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          {% if trigger.to_state.state == "unavailable" %} {{ trigger.to_state.attributes.friendly_name }} har gått offline.
          {% else %} {{ trigger.to_state.attributes.friendly_name }} är online igen.
          {% endif %}
        data:
          ttl: 0
          priority: high


