# Stäng av huslarmet när någon godkänd person/mobil kommer hem 
- alias: "Larmet: Stäng av huslarmet (inte nattlarmet) när godkänd person kommer hem"
  id: '7918048674'
  initial_state: on
  triggers:
    - trigger: template
      value_template: >
        {{  not is_state("zone.home", "0") 
            and is_state("input_select.house_alarm_modes", "Huset är larmat") }}
  action:     
