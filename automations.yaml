    - wait_template: >
        {{  is_state("media_player.googlehome_isabelles_rum","idle")
        and is_state("media_player.googlehome_vardagsrummet","idle") 
        and is_state("media_player.googlehome_sovrummet","idle") 
        and is_state("media_player.googlehome_eriks_rum","idle") 
        and is_state("media_player.googlehome_koket","idle") 
        and is_state("media_player.googlehome_albins_rum","idle") }}
      timeout: "00:00:30"
      continue_on_timeout: false
    - action: media_player.turn_off
      target:
        entity_id:
          - media_player.googlehome_isabelles_rum
          - media_player.googlehome_vardagsrummet
          - media_player.googlehome_sovrummet
          - media_player.googlehome_eriks_rum
          - media_player.googlehome_koket
          - media_player.googlehome_albins_rum    


# Mobilnotis till alla högtalare om internet ligger nere (ingen anslutning)
- alias: "Media: Info till vissa puckar att internet ligger nere"
  id: "asdfa5011987001500000gsfa69404413066"
  mode: parallel
  triggers:
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.ping_8_8_8_8","off") }}
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.ping_8_8_8_8","on") }}
  action:
    action: >
      {% if is_state("binary_sensor.ping_8_8_8_8","off")  %} notify.mobile_app_ilias_s23_ultra
      {% else %} service.notify_puckenaction: notify.pucken_i_isabelles_rum
      {% endif %}
    data:
      message: >
        {% if is_state("binary_sensor.ping_8_8_8_8","off")  %} Internetanslutningen fungerar inte. kontrollera routern.
        {% else %} Nu fungerar internetanslutningen igen.
        {% endif %}


# Test: Läs upp text i en högtalare om denna automatisering triggas
- alias: "Test: Trigger via URL"
  id: "asasdger5011987001500000gsfa69404413066"
  mode: parallel
  triggers:
    - trigger: webhook
      webhook_id: testtrigger
      allowed_methods:
        - POST
        - PUT
        - GET
      local_only: false      
  action:
    - action: script.turn_on
      target:
        entity_id: script.las_text_i_valfri_device
      data:
        variables:
          hogtalare: media_player.googlehome_isabelles_rum
          meddelande: >
            {% if trigger.platform == 'webhook' %}
              Detta fungerar också bra!
            {% else %}
              Automation triggad av något annat.
            {% endif %}
          volym: 0.2
          voice: "MattiasNeural"






