    hallen_dag: 100
    hallen_kvall: 50
    hallen_natt: 0
    dag_lux_grans: 2000
    avstangnings_lux_grans: 13000
  conditions:
  - condition: template
    value_template: >
      {% if trigger.entity_id == 'event.front_door_ding' %}
        {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
           and trigger.from_state.state not in ['unavailable', 'unknown', 'none']
           and trigger.to_state.state != trigger.from_state.state
           and (as_timestamp(now()) - as_timestamp(trigger.to_state.state)) < 60 }}
      {% elif trigger.entity_id == 'binary_sensor.front_door_ding' %}
        {{ trigger.from_state.state not in ['unavailable', 'unknown', 'none']
           and trigger.from_state.attributes.lastDing is defined
           and trigger.to_state.attributes.lastDing is defined
           and trigger.to_state.attributes.lastDing != trigger.from_state.attributes.lastDing
           and (as_timestamp(now()) - as_timestamp(trigger.to_state.attributes.lastDing)) < 60 }}
