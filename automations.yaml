# Ställ in volymen för alla Google Home så de bl.a. är tystare på nätterna.
- alias: "Google Home: Reglera notis-volymen automatiskt"
  id: '790122608918348674'
  triggers:
    - trigger: template
      value_template: '{{ states("sensor.time") == states.input_datetime.google_home_to_day_volume.state[0:5] }}'
    - trigger: template
      value_template: '{{ states("sensor.time") == states.input_datetime.google_home_to_night_volume.state[0:5] }}'
    - trigger: state
      entity_id: input_select.house_alarm_modes
      to: "Nattlarm"
  action:
    - action: input_number.set_value
      entity_id: input_number.google_home_volume_setting_notiser
      data:
        value: >-
          {% if states("sensor.time") >= states.input_datetime.google_home_to_day_volume.state[0:5] 
                and states("sensor.time") < states.input_datetime.google_home_to_night_volume.state[0:5] %} 
            {{ states("input_number.google_home_volume_setting_dag") }}
          {% else %} 
            {{ states("input_number.google_home_volume_setting_natt") }}
          {% endif %} 
    - action: media_player.volume_set
      entity_id: 
        - media_player.googlehome_vardagsrummet
        - media_player.googlehome_isabelles_rum
        - media_player.googlehome_eriks_rum
        - media_player.googlehome_koket
        - media_player.googlehome_albins_rum
        - media_player.googlehome_sovrummet
      data: 
        volume_level: '{{ states("input_number.google_home_volume_setting_notiser") | int(default = 0)  / 100 }}'



# Läs upp tiden regelbundet
- alias: "Google home: Läs upp tiden regelbundet"
  id: "6s561635sdf651fdadddg65g"
  triggers:
    - trigger: template
      value_template: >
      
        {% set kvart = now().strftime("%M:%S") in ["00:00", "15:00", "30:00", "45:00"] %}
        {% set vardagar = (now().strftime("%T") >= "06:00" and now().strftime("%T") <= "22:01" and now().strftime('%u') | int in [1,2,3,4,5]) %}
        {% set helger = (now().strftime("%T") >= "09:00" and now().strftime("%T") <= "22:01" and now().strftime('%u') | int in [6,7] and is_state("var.morgoninfo_koket_redan_upplast", "true")) %}
        {% set giltig_tid = (vardagar or helger) and states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] %}
        {% set gaster_borta = is_state("input_boolean.gaster_hemma", "off") %}
        {% set vacation_mode = ( is_state("input_boolean.vacation_mode", "off") or 
                                (
                                    is_state("input_boolean.vacation_mode", "on") and 
                                    is_state("zone.home", "1") and 
                                    state_attr("zone.home", "persons")[0] == "person.ilias_bennani"
                                )) %}
        {% set annelies_iphone_borta = not is_state("device_tracker.annelies_iphone", "home") %}
        {% set nagon_ar_hemma = not is_state("zone.home", "0") %}
        {% set googlehome_fritt = not is_state("media_player.googlehome_isabelles_rum", "playing") %}

        {{ kvart and giltig_tid and gaster_borta and vacation_mode and annelies_iphone_borta and nagon_ar_hemma and googlehome_fritt }}

  action: 
    - action: script.turn_on
      target:
        entity_id: script.las_upp_tiden
      data:
        variables:
          hogtalare: >          
            {% if is_state("zone.home","1")
              and state_attr("zone.home","persons")[0] == "person.ilias_bennani" %} 
              {% set vem_ar_hemma = "ilias" %}
            {% elif states("zone.home") | int > 1 
              and states("device_tracker.ilias_s23_ultra") == "home" %}
              {% set vem_ar_hemma = "flera" %}
            {% else %}
              {% set vem_ar_hemma = "ointressant" %}
            {% endif %}
            {% if vem_ar_hemma == "ilias" 
              and is_state("input_boolean.stadning_pagar","off") %} media_player.googlehome_alla_puckar 
            {% else %} media_player.googlehome_isabelles_rum
            {% endif %}
          volym: >
            {% if is_state("zone.home","1")
              and state_attr("zone.home","persons")[0] == "person.ilias_bennani" %} 
              {% set vem_ar_hemma = "ilias" %}
            {% elif states("zone.home") | int > 1 
              and states("device_tracker.ilias_s23_ultra") == "home" %}
              {% set vem_ar_hemma = "flera" %}
            {% else %}
              {% set vem_ar_hemma = "ointressant" %}
            {% endif %}
            {% if vem_ar_hemma == "ilias" %} 0.15
            {% else %} 0.10
            {% endif %}


