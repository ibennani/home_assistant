              transition: '{{ [((100 - handfat_pct | int(0)) / 15) | float, 1] | max
                | round(1) }}'
        default:
        - action: light.turn_on
          target:
            entity_id: light.wc_handfat
          data:
            brightness_pct: 1
            transition: '{{ [((handfat_pct | int(0) - 1) / 15) | float, 1] | max | round(1)
              }}'
    - conditions:
      - condition: trigger
        id: s2_release
      sequence:
      - variables:
          release_pct: "{% set start = states('input_number.wc_handfat_hold_start_pct')
            | float(0) %}\n{% set t0 = states('input_number.wc_handfat_hold_start_ts')
            | float(0) %}\n{% set elapsed = as_timestamp(now()) - t0 %}\n{% set up
            = is_state('input_boolean.wc_s2_session_dim_up', 'on') %}\n{% if up %}\n
            \ {{ [start + elapsed * 15, 100] | min | round(0) | int }}\n{% else %}\n
            \ {{ [start - elapsed * 15, 1] | max | round(0) | int }}\n{% endif %}\n"
      - action: light.turn_on
        target:
          entity_id: light.wc_handfat
        data:
          brightness_pct: '{{ release_pct }}'
          transition: 0
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.wc_s2_session_dim_up
            state: 'on'
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.wc_handfat_dimma_upp
        default:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.wc_handfat_dimma_upp
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.wc_s2_block_tap
      - delay: 00:00:01
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wc_s2_block_tap
  mode: parallel
  variables:
