            - condition: template
              value_template: '{{ house_mode == ''Natt'' and lux < 5 }}'
            sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ light_entity }}'
              data:
                brightness_pct: 15
                transition: 0
          - conditions:
            - condition: template
              value_template: '{{ lux >= 1 and lux <= 999 }}'
            sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ light_entity }}'
              data:
                brightness_pct: 50
                transition: 0
          - conditions:
            - condition: template
              value_template: '{{ lux >= 1000 and lux <= 1999 }}'
            sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ light_entity }}'
              data:
                brightness_pct: 75
                transition: 0
          - conditions:
            - condition: template
              value_template: '{{ lux >= 2000 }}'
            sequence:
            - action: light.turn_on
              target:
                entity_id: '{{ light_entity }}'
              data:
                brightness_pct: 100
                transition: 0
          default:
          - action: light.turn_on
            target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_pct: 75
              transition: 0
    - conditions:
      - condition: template
        value_template: '{{ event_code == 1004 }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ light_entity }}'
        data:
          brightness_pct: 100
          transition: 0
      - action: input_boolean.turn_on
        target:
          entity_id: '{{ dir_helper }}'
    - conditions:
      - condition: template
        value_template: '{{ event_code == 1001 }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ states(light_entity) != ''on'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_pct: 15
              transition: 0
      - variables:
          current_pct: "{% set b = state_attr(light_entity, 'brightness') %} {% if
            b is number %}\n  {{ ((b / 255) * 100) | round(0) | int }}\n{% else %}\n
            \ 0\n{% endif %}"
          dim_direction: "{% if current_pct >= 99 %}\n  down\n{% else %}\n  {% if
            is_state(dir_helper, 'on') %}\n    down\n  {% else %}\n    up\n  {% endif
            %}\n{% endif %}"
      - repeat:
          count: '{{ dim_max_ticks }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{% set b = state_attr(light_entity, ''brightness'')
                  %} {% set pct = ((b / 255) * 100) if (b is number) else 0 %} {{
                  dim_direction == ''up'' and pct >= 99 }}

                  '
              sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: '{{ dir_helper }}'
              - stop: 'Stoppar dimning: nådde >=99%.'
            - conditions:
              - condition: template
                value_template: '{% set b = state_attr(light_entity, ''brightness'')
                  %} {% set pct = ((b / 255) * 100) if (b is number) else 0 %} {{
                  dim_direction == ''down'' and pct <= 1 }}

                  '
              sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: '{{ dir_helper }}'
              - stop: 'Stoppar dimning: nådde <=1%.'
          - action: light.turn_on
            target:
              entity_id: '{{ light_entity }}'
            data:
              brightness_step_pct: '{{ dim_step_pct if dim_direction == ''up'' else
                (0 - dim_step_pct) }}

                '
          - wait_for_trigger:
            - trigger: event
              event_type: deconz_event
              event_data:
                id: fjarr_taklampan_i_ilias_rum
                event: 1003
            timeout:
              seconds: '{{ dim_tick_seconds }}'
            continue_on_timeout: true
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ wait.completed }}'
              sequence:
              - choose:
                - conditions:
                  - condition: template
                    value_template: '{{ dim_direction == ''up'' }}'
                  sequence:
                  - action: input_boolean.turn_on
                    target:
                      entity_id: '{{ dir_helper }}'
                - conditions:
                  - condition: template
                    value_template: '{{ dim_direction == ''down'' }}'
                  sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: '{{ dir_helper }}'
              - stop: 'Stoppar dimning: knappen släpptes.'
    default: []
  mode: restart
  variables:
    event_code: '{{ trigger.event.data.event | int(0) }}'
    house_mode: '{{ states(''input_select.house_time_modes'') }}'
    lux: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) }}'
    light_entity: light.taklampan_ilias_rum_level
    dir_helper: input_boolean.input_boolean_ilias_rum_taklampa_dim_senast_upp
    dim_step_pct: 2
    dim_tick_seconds: 0.1
    dim_max_ticks: 80
- id: '1767296601267'
  alias: 'Belysning: Dimma eller släck i köket vid inaktivitet'
  description: >-
    Normalt och Morgon → Mysigt när group.rorelse_i_koket varit av i 15 min. Måltid,
    Buffé, Maxbelysning och Spelkväll → Mysigt när gruppen varit av i 30 min. Läge
    kollas när for-triggern löper ut, inte vid lägesbyte. Kort rörelse nollställer
    for-timern i Home Assistant — inga delay-timers i automationen.
  triggers:
  - trigger: state
    entity_id: group.rorelse_i_koket
    to: 'off'
    for: '00:15:00'
    id: inaktiv_15
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id: group.rorelse_i_koket
    to: 'off'
    for: '00:30:00'
    id: inaktiv_30
    not_from:
    - unavailable
    - unknown
  actions:
  - variables:
      is_natt: '{{ is_state(''input_select.house_time_modes'', ''Natt'') }}'
      nytt_lage: "{% if is_natt %}\n  Släckt\n{% else %}\n  Mysigt\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: trigger
        id: inaktiv_15
      - condition: state
        entity_id: input_select.koket_belysning
        state:
        - Normalt
        - Morgon
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: '{{ nytt_lage }}'
      - action: script.turn_on
        target:
          entity_id: script.koket_stall_in_belysningen
        data:
          variables:
            rapid_transition: 'on'
    - conditions:
      - condition: trigger
        id: inaktiv_30
      - condition: state
        entity_id: input_select.koket_belysning
        state:
        - Måltid
        - Buffé
        - Maxbelysning
        - Spelkväll
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: '{{ nytt_lage }}'
      - action: script.turn_on
        target:
          entity_id: script.koket_stall_in_belysningen
        data:
          variables:
            rapid_transition: 'on'
  mode: single
  initial_state: true
