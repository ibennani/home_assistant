                    Diskmaskinens fjärrstart har stängts av när du öppnade luckan. Aktivera fjärrstart igen.
                  volym: >
                    {% if is_state('media_player.sony_tv_i_vardagsrummet', 'playing') %}
                      {{ states('input_number.google_home_volume_setting_dag') | float(default=0) / 100 }}
                    {% else %}
                      {{ states('input_number.google_home_volume_setting_notiser') | float(default=0) / 100 }}
                    {% endif %}
                  voice: 'MattiasNeural'


# Mobilnotis: Diskmaskinen diskar
- alias: 'Mobilnotis: Diskmaskinen diskar'
  id: '791023035850948348674'
  trigger:
    - trigger: template
      value_template: >
        {{
          is_state('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress', '0') and
          states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress') not in ['unknown', 'unavailable'] and
          is_state('binary_sensor.diskmaskin_lucka', 'off') and
          states('input_text.diskmaskin_sluttid').strip() == '' 
        }}
  action:
    - action: input_text.set_value
      target:
        entity_id: input_text.diskmaskin_sluttid
      data:
        value: >
          {% set sluttid_raw = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime') %}
          {% set sluttid = sluttid_raw | as_datetime if sluttid_raw not in ['unknown', 'unavailable', None] else None %}
          
          {% set fordrojning_raw = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative') %}
          {% if fordrojning_raw and ':' in fordrojning_raw %}
            {% set fordrojning_parts = fordrojning_raw.split(':') %}
            {% set fordrojning_timmar = fordrojning_parts[0] | int(default=0) %}
            {% set fordrojning_minuter = fordrojning_parts[1] | int(default=0) %}
            {% set fordrojning = timedelta(hours=fordrojning_timmar, minutes=fordrojning_minuter) %}
          {% else %}
            {% set fordrojning = timedelta() %}
          {% endif %}
          
          {% set extra_timmar = 2 if now().utcoffset().total_seconds() == 7200 else 1 %}
          
          {% if fordrojning_raw == '0:00' %}
            {{ states('input_text.diskmaskin_sluttid') if states('input_text.diskmaskin_sluttid') not in ['', 'unknown', None] else (sluttid + timedelta(hours=extra_timmar)).strftime('%H:%M') }}
          {% else %}
            {{ (sluttid + fordrojning + timedelta(hours=extra_timmar)).strftime('%H:%M') }}
          {% endif %}

    - action: input_text.set_value
      target:
        entity_id: input_text.diskmaskin_meddelandetext
      data:
        value: >           
          {% set sluttid = states('input_text.diskmaskin_sluttid') %}
          {% set fordrojning_raw = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative') %}
          
          {% set diskmaskin_meddelande = (
              "Diskmaskinen kommer starta klockan " ~ (
                (now() + timedelta(
                  hours=fordrojning_raw.split(':')[0]|int(default=0), 
                  minutes=fordrojning_raw.split(':')[1]|int(default=0)
                )).strftime('%H:%M') ~ 
                " och vara färdig klockan " ~ sluttid ~ "."
              ) if sluttid and fordrojning_raw != '0:00' else 
              ("Nu startar diskmaskinen, kommer vara färdig klockan " ~ sluttid ~ ".") if sluttid else 
              "Tidsdata för diskmaskinen är inte tillgänglig just nu.") %}
          {{- diskmaskin_meddelande -}}
        
    - action: script.turn_on
      target:
        entity_id: script.las_text_i_valfri_device
      data:
        variables:
          hogtalare: media_player.googlehome_infopuckarna
          meddelande: >
            {{ states('input_text.diskmaskin_meddelandetext') }}
          volym: >
            {% if is_state('media_player.sony_tv_i_vardagsrummet', 'playing') %}
              {{ states('input_number.google_home_volume_setting_dag') | float(default=0) / 100 }}
            {% else %}
              {{ states('input_number.google_home_volume_setting_notiser') | float(default=0) / 100 }}
            {% endif %}
          voice: 'MattiasNeural'
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: >
          HEMMET {{ now().strftime('%R') }}:
            
          {{ states('input_text.diskmaskin_meddelandetext') }}
        data:
          ttl: 0
          priority: high
    - action: input_text.set_value
      target:
        entity_id: input_text.diskmaskin_tid_fjarrstart
      data:
        value: ""


