      anna_home: '{{ is_state(''binary_sensor.anna_hemma'', ''on'') }}'
      ev: '{{ trigger.event.data.event | int(0) if trigger.id == ''remote'' else 0
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''select_changed'', ''lux_above_2000'',
          ''lux_below_2000''] }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.annas_rum_stall_in_belysningen
    - conditions:
      - condition: template
        value_template: "{{ trigger.id == 'anna_state'\n   and lux >= 2000\n   and
          is_state('input_select.house_time_modes','Dag') }}\n"
      sequence:
