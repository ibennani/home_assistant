# Detta händer när larmet är avstängt
- alias: "Larmet: Detta händer när larmet är avstängt (Hemma)"
  id: '2918318674'
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_select.house_alarm_modes
      to: "Larmet är avstängt"
  action:
    - action: switch.turn_off
      entity_id:
        - siren.brandvarnare_ovre_trappan   
    - action: switch.turn_off
      entity_id: siren.brandvarnare_ovre_trappan
    - action: var.set
      data: 
        entity_id: var.alarm_textmessage
        value: |
          {%- set antal_oppna = states|selectattr('entity_id','in',state_attr('group.opened_doors_and_windows','entity_id'))|selectattr('state','eq','on')|list|count -%}
          Larmet är avstängt
          {%- if antal_oppna > 0  -%}
          , men du måste kontrollera {{ antal_oppna }}
          {% if antal_oppna == 1 %} enhet:
          {% elif antal_oppna > 1 %} enheter:
          {%- endif %}  
          {% set open_entities = expand('group.opened_doors_and_windows') | selectattr('state', 'eq', 'on') | map(attribute='name') | list -%}
          {%- if antal_oppna == 1 -%}
            {{ open_entities[0] }}
          {%- elif antal_oppna == 2 -%}
            {{ open_entities[0] }} och {{ open_entities[1] }}
          {%- else -%}
            {{ open_entities[:-1] | join(', ') }} och {{ open_entities[-1] }}
          {%- endif -%}
          {% endif %}
          {%- if antal_oppna == 1 %}, som är öppet
          {%- elif antal_oppna > 1 %}, som är öppnade.
          {%- endif %}
    - action: switch.turn_on
      entity_id: switch.larmlampan_switch
    - action: script.turn_on
      target:
        entity_id: script.las_text_i_valfri_device
      data:
        variables:
          hogtalare: media_player.googlehome_infopuckarna
          meddelande: 'Larmet är avstängt!' 
          volym: >
            {% if is_state("media_player.sony_tv_i_vardagsrummet","playing") %} {{ states.input_number.google_home_volume_setting_dag.state | float(default = 0) / 100 }}
            {% elif now().strftime('%R') > "01:00" and now().strftime('%R') < "08:00" %} 0.1
            {% else %} {{ states.input_number.google_home_volume_setting_notiser.state | float(default = 0) /100 }}
            {% endif %}
          voice: "MattiasNeural"
    - action: notify.foraldrar
      data:
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          {{ states("var.alarm_textmessage") }}
        data:
          ttl: 0
          priority: high     


