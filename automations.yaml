      maltemperatur: "{% if narvaro_override_aktiv %}\n  {{ 20.0 if antal_hemma ==
        0 else 24.0 }}\n{% elif semester_aktiv %}\n  {{ 24.0 if (tid_minuter >= 420
        and tid_minuter < 1380) else 20.0 }}\n{% else %}\n  {% if veckodag in [0,1,2,3]
        %}\n    {% if tid_minuter >= 300 and tid_minuter < 480 %}\n      24.0\n    {%
