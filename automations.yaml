      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.play_radiostation_target
        data:
          option: Ingen högtalare
    - conditions:
      - condition: template
        value_template: "{{ trigger.entity_id == 'input_select.play_radiostation'\n   and
          states('input_select.play_radiostation_target') == 'Ingen högtalare'\n   and
          states('input_select.play_radiostation') != 'Tyst' }}\n"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.play_radiostation
        data:
          option: Tyst
