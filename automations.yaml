        %} {% set lamp_dimmad = is_state("input_boolean.settings_lamporna_i_garderoben_dimmade","on")
        %} {% set avstangd_from = strptime(states("input_datetime.settings_lamporna_i_garderoben_avstangda_from"),
        "%H:%M:%S") %} {% set avstangd_tom = strptime(states("input_datetime.settings_lamporna_i_garderoben_avstangda_tom"),
        "%H:%M:%S") %} {% set dimmad_from = strptime(states("input_datetime.settings_lamporna_i_garderoben_dimmade_from"),
        "%H:%M:%S") %} {% set dimmad_tom = strptime(states("input_datetime.settings_lamporna_i_garderoben_dimmade_tom"),
        "%H:%M:%S") %} {% set rullgardin_closed = is_state("cover.rullgardin_sovrummet","closed")
        %} {% set utomhus_ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka")
        | int(default=0) %}

        {% if (house_time_mode in ["Kväll", "Natt"]) and not ilias_lamp_on and not
        annas_lamp_on %} 0 {% elif lamp_avstangd and (now().strftime("%T") <= avstangd_tom.strftime("%T")
        or now().strftime("%T") >= avstangd_from.strftime("%T")) %} 0 {% elif lamp_dimmad
        and (now().strftime("%T") <= dimmad_tom.strftime("%T") or now().strftime("%T")
        >= dimmad_from.strftime("%T")) %} 1 {% elif rullgardin_closed %} 50 {% elif
        (utomhus_ljusstyrka < 1000 ) %} 50 {% elif (utomhus_ljusstyrka < 2000 and
        utomhus_ljusstyrka >= 1000 ) %} 75 {% else %} 100 {% endif %}

        '
