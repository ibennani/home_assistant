#####   HOME ASSISTANT GENERELLA HÄNDELSER  #####

# Home Assistant har startat om
- alias: "Mobilnotis: Home Assistant har startat"
  id: '7917348670004' 
  triggers:
    - trigger: homeassistant
      event: start
  action:
    # Mobilnotis till Ilias om att HA startat om
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: | 
          HEMMET {{ now().strftime('%R') }}: 
          HA omstartat
          IP: {{ states('sensor.local_ip') | string }}
          Version: {{ states('sensor.current_version') | string }}
        data:
          ttl: 0
          priority: high
    # Ange när det är "mitt på dagen" så att rätt husläge kan väljas senare
    - action: var.set
      data: 
        entity_id: var.tid_solen_mitt_pa_dagen
        value: > 
          {{ states("sensor.sun_next_noon") + ":00" }}
    # Tänd eller släck utebelysningen på framsidan om det är mörkt ute
    - action: automation.trigger
      entity_id: automation.belysning_styr_belysningen_utomhus
    # Ställ in belysningen inomhus baserat på tid på dagen och ljusstyrka
    - action: script.turn_on
      target:
        entity_id: >
          {% if is_state("input_select.house_time_modes","Morgon") %} script.morgonbelysning
          {% elif is_state("input_select.house_time_modes","Dag") and states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) >= 2000 %} 
            {% if is_state("input_boolean.julbelysning","on") %} script.kvallsbelysning
            {% else %} script.dagsbelysning
            {% endif %}
          {% elif is_state("input_select.house_time_modes","Dag") and states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) < 2000 %} script.kvallsbelysning
          {% elif is_state("input_select.house_time_modes","Kväll") %} script.kvallsbelysning
          {% elif is_state("input_select.house_time_modes","Natt") %} script.nattbelysning
          {% else %} script.do_nothing
          {% endif %}
    # Sätt volymen på alla Google Home-enheter beroende på tid på dagen
    - action: input_number.set_value
      data:
        entity_id: input_number.google_home_volume_setting_notiser
        value: >
          {% if states("sensor.time") > states.input_datetime.google_home_to_day_volume.state[0:5] and states("sensor.time") < states.input_datetime.google_home_to_night_volume.state[0:5] %}
            {{ states("input_number.google_home_volume_setting_dag") | int(default=0) }}
          {% else %}
            {{ states("input_number.google_home_volume_setting_natt") | int(default=0) }}
          {% endif %}
    # Justera volymen på specifika Google Home-enheter
    - action: media_player.volume_set
      target:
        entity_id: 
          - media_player.googlehome_isabelles_rum
          - media_player.googlehome_vardagsrummet
          - media_player.googlehome_sovrummet
          - media_player.googlehome_eriks_rum
          - media_player.googlehome_koket
          - media_player.googlehome_albins_rum
      data: 
        volume_level: '{{ states("input_number.google_home_volume_setting_notiser") | int(default=0) / 100 }}'



#####   SÄTT HUSET I OLIKA LÄGEN (morgon, dag, kväll eller natt)  #####
#####   Detta styr belysning mm mm                                #####

# Aktiera husläge
- alias: "Huset: Styr house_time_modes"
  id: '7918348695'
  mode: restart
  triggers:
    - trigger: time_pattern
      seconds: '/5'
  action:
    - action: input_select.select_option
      target:
        entity_id: input_select.house_time_modes
      data:
        option: >
          {% set tiden_just_nu = now().strftime('%T') %}
          {% set veckodag = now().strftime('%u') | int %}
          {% set morgontid_vardagar = states("input_datetime.huset_morgontid_vardagar") %}
          {% set morgontid_helger = states("input_datetime.huset_morgontid_helger") %}
          {% set klockan_tolv = states("var.tid_solen_mitt_pa_dagen") %}
          {% set nattid_son_tor = states("input_datetime.huset_nattid_son_tor") %}
          {% set nattid_fre_lor = states("input_datetime.huset_nattid_fre_lor") %}
          {% set morgontid_lediga = states("input_datetime.huset_morgontid_lediga") %}
          {% set nattid_lediga = states("input_datetime.huset_nattid_lediga") %}
          {% set ljusstyrka_framsidan = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
          {% set ilias_hemma = is_state("device_tracker.ilias_s23_ultra","home") %}
          {% set anna_hemma = is_state("device_tracker.anna_s22_ultra","home") %}
          {% set ilias_mobil_laddar = is_state("sensor.ilias_s23_ultra_charger_type","ac") %}
          {% set annas_mobil_laddar = is_state("sensor.anna_s22_ultra_charger_type","ac") %}
          
          {% if is_state("input_boolean.vacation_mode","off") %}
            {% if veckodag in [1,2,3,4,5] and tiden_just_nu < morgontid_vardagar %}
              Natt
            {% elif veckodag in [6,7] and tiden_just_nu < morgontid_helger %}
              Natt    
            {% elif veckodag in [1,2,3,4,5] and tiden_just_nu >= morgontid_vardagar and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Morgon
            {% elif veckodag in [6,7] and tiden_just_nu >= morgontid_helger and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Morgon
            {% elif veckodag in [1,2,3,4,5] and tiden_just_nu >= morgontid_vardagar and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation >= states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Dag
            {% elif veckodag in [6,7] and tiden_just_nu >= morgontid_helger and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation >= states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Dag 
            {% elif veckodag in [7,1,2,3,4] and tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_fre_lor and states.sun.sun.attributes.elevation > states("input_number.settings_solvinkel_kvall") | float(default=0) and ljusstyrka_framsidan > 2000 %}
              Dag
            {% elif veckodag == 5 and tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_fre_lor and states.sun.sun.attributes.elevation > states("input_number.settings_solvinkel_kvall") | float(default=0) and ljusstyrka_framsidan > 2000 %}
              Dag              
            {% elif veckodag in [7,1,2,3,4] and is_state("input_select.house_time_modes","Dag") and tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_son_tor and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_kvall") | float(default=0) and ljusstyrka_framsidan < 2000 %}
              Kväll
            {% elif veckodag in [5,6] and is_state("input_select.house_time_modes","Dag") and tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_fre_lor and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_kvall") | float(default=0) and ljusstyrka_framsidan < 2000 %}
              Kväll
            {% elif is_state("input_select.house_time_modes","Kväll") and veckodag in [7,1,2,3,4] and tiden_just_nu >= "21:30" and states("media_player.denon_avr_x2800h") in ["off","unavailable","unknown"] and ((ilias_hemma and anna_hemma and ilias_mobil_laddar and annas_mobil_laddar) or (ilias_hemma and not anna_hemma and ilias_mobil_laddar) or (not ilias_hemma and anna_hemma and annas_mobil_laddar)) %}
              Natt
            {% elif is_state("input_select.house_time_modes","Kväll") and veckodag in [5,6] and tiden_just_nu >= "22:30" and states("media_player.denon_avr_x2800h") in ["off","unavailable","unknown"] and ((ilias_hemma and anna_hemma and ilias_mobil_laddar and annas_mobil_laddar) or (ilias_hemma and not anna_hemma and ilias_mobil_laddar) or (not ilias_hemma and anna_hemma and annas_mobil_laddar)) %}
              Natt
            {% elif veckodag in [7,1,2,3,4] and tiden_just_nu >= nattid_son_tor %}
              Natt
            {% elif veckodag in [5,6] and tiden_just_nu >= nattid_fre_lor %}
              Natt
            {% endif %}
          {% endif %}
          
          {% if is_state("input_boolean.vacation_mode","on") %}
            {% if tiden_just_nu < morgontid_lediga %}
              Natt      
            {% elif tiden_just_nu >= morgontid_lediga and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Morgon
            {% elif tiden_just_nu >= morgontid_lediga and tiden_just_nu < klockan_tolv and states.sun.sun.attributes.elevation >= states("input_number.settings_solvinkel_dag") | float(default=0) %}
              Dag
            {% elif tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_lediga and states.sun.sun.attributes.elevation > states("input_number.settings_solvinkel_kvall") | float(default=0) and is_state("binary_sensor.soligt","on") %}
              Dag 
            {% elif tiden_just_nu >= klockan_tolv and tiden_just_nu < nattid_lediga and states.sun.sun.attributes.elevation < states("input_number.settings_solvinkel_kvall") | float(default=0) and ljusstyrka_framsidan < 2000 %}
              Kväll
            {% elif is_state("input_select.house_time_modes","Kväll") and tiden_just_nu >= "22:00" and states("media_player.pucken_bakom_stereon_i_vardagsrummet") in ["off","unavailable","unknown"] and ((ilias_hemma and anna_hemma and ilias_mobil_laddar and annas_mobil_laddar) or (ilias_hemma and not anna_hemma and ilias_mobil_laddar) or (not ilias_hemma and anna_hemma and annas_mobil_laddar)) %}
              Natt
            {% elif tiden_just_nu >= nattid_lediga %}
              Natt
            {% endif %}
          {% endif %}



# När huset övergår till "Morgon"
- alias: "Husläge: Till morgon"
  id: '7918368674'
  triggers:
    - trigger: state
      entity_id: input_select.house_time_modes
      to: "Morgon"
  action:
    - action: script.turn_on
      target:
        entity_id: script.morgonbelysning
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          Husläge till morgon.
          Temperatur {{ states('sensor.netatmo_bennani_vs_utomhus_temperature') | float | round(1) | string | replace('.', ',') }} grader.
          Ljus {{ states('sensor.utomhus_framsidan_ljusstyrka') | float | round(0) | string | replace('.', ',') }} lux.
          Elevation {{ states('sensor.sun_elevation') | string | replace('.', ',') }} grader.
          Azimuth {{ states("sensor.sun_azimuth") | string | replace('.', ',') }} grader.
        data:
          ttl: 0
          priority: high      


