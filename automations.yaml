      - condition: template
        value_template: '{{ nuvarande_lage != ''Tänt'' }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.eriks_rum_satt_lage_ui
        data:
          variables:
            lage: Tänt
    - conditions:
      - condition: template
        value_template: '{{ bada_tak_slackta }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ovrig_alla_slackta }}'
          - condition: template
            value_template: '{{ nuvarande_lage != ''Släckt'' }}'
          sequence:
          - action: script.turn_on
            target:
              entity_id: script.eriks_rum_satt_lage_ui
            data:
              variables:
                lage: Släckt
        - conditions:
          - condition: template
            value_template: '{{ not ovrig_alla_slackta }}'
          - condition: template
            value_template: '{{ nuvarande_lage in [''Tänt'', ''Taklamporna''] }}'
          - condition: template
            value_template: '{{ nuvarande_lage != ''Mysigt'' }}'
          sequence:
          - action: script.turn_on
            target:
              entity_id: script.eriks_rum_satt_lage
            data:
              variables:
                force: true
                lage: Mysigt
