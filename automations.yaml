### Styr belysningen i Albins rum med IKEA-fjärren ###   

# Styr Albins rum med rörelse eller med den fyrkantiga IKEA-fjärren, rörelse eller solljus
- alias: "Belysning: Styr Albins rum med rörelse, med den fyrkantiga IKEA-fjärren, eller solljus in genom fönstret"
  id: "015091598558904098dg498dgfsfa000dddsaaage0"
  mode: restart
  triggers:
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_albins_rum
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_2_albins_rum
    - trigger: state
      entity_id: binary_sensor.solen_lyser_in_genom_fonstren_pa_baksidan
    - trigger: template
      value_template: >
        {{ trigger.entity_id == "device_tracker.erik_s23"
        and trigger.from_state.state != trigger.to_state.state 
        and (trigger.from_state.state in ["home"] or trigger.to_state.state in ["home"]) }}
    - trigger: template
      value_template: >
        {% set room_state = is_state("binary_sensor.albins_rum_rorelse", "on") or 
                          (is_state("binary_sensor.albins_rum_rorelse", "off") and 
                            states.binary_sensor.albins_rum_rorelse.last_updated < now() - timedelta(minutes=3)) %}
        {{ room_state and
          not is_state("device_tracker.erik_s23", "home") and
          is_state("input_boolean.stadning_pagar", "off") and
          is_state("input_boolean.gaster_hemma", "off") and
          is_state("var.morgoninfo_koket_redan_upplast", "true") and
          not is_state("input_select.house_time_modes", "Natt") }}
  action:
    # Erik är hemma / har gått hemifrån 
    - action: >
        {% if trigger.platform == "state" and trigger.entity_id == "device_tracker.erik_s23" %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data: 
        entity_id: input_select.albins_rum_belysning
        option: >
          {% if is_state("device_tracker.erik_s23", "home") %} Mysigt
          {% else %}
            {% if is_state("binary_sensor.albins_rum_rorelse", "off") %} 
              {% if states("input_select.house_time_modes") in ["Morgon", "Kväll"] %} Mysigt
              {% elif states("input_select.house_time_modes") in ["Dag"] %}
                {% if is_state("binary_sensor.solen_lyser_in_genom_fonstren_pa_baksidan", "on") %} Släckt
                {% else %} Mysigt
                {% endif %}
              {% else %} Släckt
              {% endif %}
            {% else %} {{ states("input_select.albins_rum_belysning") }}
            {% endif %}
          {% endif %}
    # Rörelse
    - action: >
        {% if trigger.platform == "state" and trigger.entity_id == "binary_sensor.albins_rum_rorelse" and not is_state("device_tracker.erik_s23", "home") %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.albins_rum_belysning
        option: >
          {% if is_state("binary_sensor.albins_rum_rorelse", "on") %}
            {% if states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] %} Tänt
            {% else %} {{ states("input_select.albins_rum_belysning") }}
            {% endif %}
          {% else %}
            {% if states("input_select.house_time_modes") in ["Morgon","Kväll"] %} Mysigt
            {% elif states("input_select.house_time_modes") in ["Dag"] %}
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) > 2000 %} Släckt
              {% else %} Mysigt
              {% endif %}
            {% else %} Släckt
            {% endif %}
          {% endif %}
    # Kort tryck uppåt (blanka ytan)
    - action: >
        {% if trigger.platform == "event" and trigger.event.data.event | int(default=0) == 1002 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.albins_rum_belysning
        option: >
          {% if not states("input_select.albins_rum_belysning") in ["Släckt"] %} Släckt
          {% else %}
            {% if states("input_select.house_time_modes") in ["Morgon"] %} Taklamporna
            {% elif states("input_select.house_time_modes") in ["Dag"] %}
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) > 2000 %} Taklamporna
              {% else %} Tänt
              {% endif %}
            {% elif states("input_select.house_time_modes") in ["Kväll"] %} Tänt
            {% elif states("input_select.house_time_modes") in ["Natt"] %} Tänt
            {% else %} Släckt
            {% endif %}
          {% endif %}
    # Långt tryck uppåt (blanka ytan)
    - action: >
        {% if trigger.platform == "event" and trigger.event.data.event | int(default=0) == 1001 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.albins_rum_belysning
        option: >
          {% if is_state("input_select.albins_rum_belysning", "Mysigt") %} 
            {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) > 2000 %} Taklamporna
            {% else %} Tänt
            {% endif %}
          {% else %} Mysigt
          {% endif %}
    # Kort tryck nedåt (matta ytan)
    - action: >
        {% if trigger.platform == "event" and trigger.event.data.event | int(default=0) == 2002 %} 
          {% if is_state("cover.rullgardin_albins_rum","open") %} cover.close_cover
          {% else %} cover.open_cover
          {% endif %}
        {% else %} script.do_nothing
        {% endif %}
      target:
        entity_id: cover.rullgardin_albins_rum
    # Långt tryck nedåt (matta ytan)
    - action: >
        {% if trigger.platform == "event" and trigger.event.data.event | int(default=0) == 2001 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.albins_rum_belysning
        option: Läsning




