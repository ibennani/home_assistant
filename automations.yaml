              \         'binary_sensor.ovre_trappan_rorelse',\n          'binary_sensor.sovrummet_rorelse',\n
              \         'binary_sensor.wc_rorelse',\n          'binary_sensor.annas_rum_rorelse',\n
              \         'binary_sensor.koket_rorelse',\n          'binary_sensor.koket_arbetsbanken_rorelse',\n
              \         'binary_sensor.koksbordet_rorelse',\n          'binary_sensor.hallen_rorelse',\n
              \         'binary_sensor.nedre_trappan_rorelse',\n          'binary_sensor.eriks_rum_rorelse',\n
              \         'binary_sensor.tvattstugan_rorelse') | selectattr('state',
              'eq', 'on') | list | length >= 2 }}\n"
          - action: script.turn_on
            target:
              entity_id: script.om_huslarmet_triggas
- id: '1768504246221'
  alias: 'Belysning: Återställ arbets- och WC-belysning om någon släcks (alltid aktiv)'
  description: "Detta är till för att led-striparna inte ska hamna i släckt läge om
    dess \"master toggle\" av nån anledning lämnar state \"on\". \nOm någon av utpekade
    lampor lämnar state 'on' och förblir i annat state i 5 minuter, tänds alla igen
    och notifiering skickas med state vid trigger + bekräftelse efter åtgärd.\n"
  triggers:
  - trigger: state
    entity_id: light.led_ovanfor_lilla_arbetsbanken_master
    from: 'on'
    for: 00:05:00
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: light.led_ovanfor_stora_arbetsbanken_master
    from: 'on'
    for: 00:05:00
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: light.led_strippar_i_badrummet_master
    from: 'on'
    for: 00:05:00
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: light.wc_led_master
    from: 'on'
    for: 00:05:00
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
  - variables:
      trig_entity: '{{ trigger.entity_id }}'
      trig_state_at_trigger: '{{ trigger.to_state.state if trigger.to_state is not
        none else ''unknown'' }}'
      lights:
      - light.led_ovanfor_lilla_arbetsbanken_master
      - light.led_ovanfor_stora_arbetsbanken_master
      - light.led_strippar_i_badrummet_master
      - light.wc_led_master
  - action: light.turn_on
    target:
      entity_id: '{{ lights }}'
  - wait_template: "{{\n  lights | map('states') | select('eq', 'on') | list | count
      == (lights | count)\n}}"
    timeout: 00:00:10
    continue_on_timeout: true
  - variables:
      trig_state_now: '{{ states(trig_entity) }}'
      not_on_now: "{{\n  lights\n  | reject('is_state', 'on')\n  | list\n}}"
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: 'HEMMET {{ now().strftime(''%R'') }}: Trigger: {{ trig_entity }} State
        vid trigger: {{ trig_state_at_trigger }} State efter återställning: {{ trig_state_now
        }} {% if not_on_now | count > 0 %} OBS: Fortfarande inte ''on'': {{ not_on_now
        | join('', '') }} {% else %} OK: Samtliga är ''on'' {% endif %}'
      data:
        ttl: 0
        priority: high
  mode: single
- id: '1780140607388'
  alias: 'Z-Wave: Övervaka nod-tapp och eskalera'
  description: Sätter en baslinje 3 min efter start. Om antalet aktiva noder minskar,  erbjuds
    omstart av HA via interaktiv notifiering till S23 Ultra.
  triggers:
  - trigger: homeassistant
    event: start
    id: ha_startad
  - trigger: template
    value_template: '{{ states(''sensor.aktiva_z_wave_enheter'') | int(0) < states(''input_number.z_wave_noder_vid_start'')
      | int(0) }}'
    for:
      minutes: 3
    id: noder_har_tappats
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: RESTART_HA_ZWAVE_CRASH
    id: mobil_knapptryck
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: ha_startad
      sequence:
      - delay:
          minutes: 3
      - action: input_number.set_value
        target:
          entity_id: input_number.z_wave_noder_vid_start
        data:
          value: '{{ states(''sensor.aktiva_z_wave_enheter'') | int(0) }}'
    - conditions:
      - condition: trigger
        id: noder_har_tappats
      - condition: template
        value_template: '{{ states(''input_number.z_wave_noder_vid_start'') | int(0)
          > 0 }}'
      sequence:
      - action: notify.mobile_app_ilias_s23_ultra
        data:
          message: "HEMMET {{ now().strftime('%R') }}: \nZ-Wave kräver åtgärd!\nAktiva
            noder: {{ states('sensor.aktiva_z_wave_enheter') }} (Ska vara: {{ states('input_number.z_wave_noder_vid_start')
            }})\nVill du starta om Home Assistant?\n"
          data:
            ttl: 0
            priority: high
            actions:
            - action: RESTART_HA_ZWAVE_CRASH
              title: Starta om HA
    - conditions:
      - condition: trigger
        id: mobil_knapptryck
      sequence:
      - action: homeassistant.restart
  mode: queued
  max: 10
- id: '1783637970062'
  alias: 'Mobilnotis: Vattenspridaren frågar om omstart efter avstängning'
  description: 'Skickar en mobilnotis när vattenspridaren har stängts av efter minst
    25 minuter och låter notisknappen starta den igen.

    '
  triggers:
  - trigger: state
    entity_id: switch.vattenslang_framsidan
    from: 'on'
    to: 'off'
  conditions:
  - condition: template
    value_template: "{{\n  trigger.from_state is not none\n  and trigger.to_state
      is not none\n  and (\n    as_timestamp(trigger.to_state.last_changed)\n    -
      as_timestamp(trigger.from_state.last_changed)\n  ) >= 25 * 60\n}}\n"
  actions:
  - alias: Skicka notis med startknapp
    action: notify.mobile_app_ilias_s23_ultra
    data:
      message: 'HEMMET {{ now().strftime(''%R'') }}: Vattenspridaren har stängts av.
        Vill du starta vattenspridaren igen?'
      data:
        ttl: 0
        priority: high
        tag: vattenspridare_framsidan_starta_igen
        actions:
        - action: STARTA_VATTENSPRIDARE_FRAMSIDAN
          title: Starta vattenspridaren
  - alias: Vänta på svar från notisen
    wait_for_trigger:
    - trigger: event
      event_type: mobile_app_notification_action
      event_data:
        action: STARTA_VATTENSPRIDARE_FRAMSIDAN
    timeout: 00:10:00
    continue_on_timeout: true
  - alias: Starta vattenspridaren om knappen trycktes
    choose:
    - conditions:
      - condition: template
        value_template: "{{\n  wait.trigger is not none\n  and is_state('switch.vattenslang_framsidan',
          'off')\n}}\n"
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.vattenslang_framsidan
  - alias: Rensa mobilnotisen
    action: notify.mobile_app_ilias_s23_ultra
    data:
      message: clear_notification
      data:
        tag: vattenspridare_framsidan_starta_igen
  mode: restart

# HomeKit: dölj parkopplingsnotiser utan att ta bort integrationen
- alias: "HomeKit: Dismiss parkopplingsnotiser"
  id: '808502072001'
  description: Tar bort HomeKit parkopplingsnotiser vid omstart. Bron och integrationen behålls.
  mode: parallel
  max: 5
  triggers:
    - trigger: homeassistant
      event: start
      id: ha_start
    - trigger: persistent_notification
      update_type:
        - added
      id: hk_notice
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: hk_notice
            - condition: template
              value_template: "{{ trigger.notification.title == 'HomeKit Pairing' }}"
          sequence:
            - action: persistent_notification.dismiss
              data:
                notification_id: "{{ trigger.notification.notification_id }}"
        - conditions:
            - condition: trigger
              id: ha_start
          sequence:
            - delay: "00:00:45"
            - repeat:
                for_each:
                  - f791823a10164a1b3af1ba0799feef85
                  - d229821a6f7e9a52c87c89425366a567
                  - 6cf97911c820237def1d1eb6a6cd8e2e
                  - a9512680495ddf54f8dcd038685bbaa4
                sequence:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: "{{ repeat.item }}"
                    continue_on_error: true
            - delay: "00:01:00"
            - repeat:
                for_each:
                  - f791823a10164a1b3af1ba0799feef85
                  - d229821a6f7e9a52c87c89425366a567
                  - 6cf97911c820237def1d1eb6a6cd8e2e
                  - a9512680495ddf54f8dcd038685bbaa4
                sequence:
                  - action: persistent_notification.dismiss
                    data:
                      notification_id: "{{ repeat.item }}"
                    continue_on_error: true

