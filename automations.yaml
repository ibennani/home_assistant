# Styr sovrummet med den fyrkantiga IKEA-fjärren
- alias: "Belysning: Styr sovrummet med den fyrkantiga IKEA-fjärren"
  id: "015091598558904098dg498fsfasge0"
  mode: restart
  triggers:
    - trigger: event
      event_type: deconz_event
      event_data:
        id: fjarr_sovrummet
    - trigger: state
      entity_id: cover.rullgardin_sovrummet
  action:
    # Enkeltryck uppåt (blanka ytan)
    - action: >
        {% if trigger.event.data.event | int(default = 0)  == 1002 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.sovrummet_belysning
        option: >
          {% if not states("input_select.sovrummet_belysning") in ["Släckt"] %} Släckt
          {% else %}
            {% if states("input_select.house_time_modes") in ["Morgon"] %} Tänt
            {% elif states("input_select.house_time_modes") in ["Dag"] %} Tänt
            {% elif states("input_select.house_time_modes") in ["Kväll"] %} Tänt
            {% elif states("input_select.house_time_modes") in ["Natt"] %} Sänglamporna
            {% else %} Släckt
            {% endif %}  
          {% endif %}
    # Långtryck uppåt (blanka ytan)
    - action: >
        {% if trigger.event.data.event | int(default = 0)  == 1001 %} input_select.select_option
        {% else %} script.do_nothing
        {% endif %}
      data:
        entity_id: input_select.sovrummet_belysning
        option: >
          {% if states("input_select.sovrummet_belysning") in ["Tänt","Släckt"] %} Mysigt
          {% else %} Tänt
          {% endif %}
    # State på rullgardinen
    - action: >
        {% if trigger.platform == "state" and trigger.entity_id == "cover.rullgardin_sovrummet" %}
          {% if is_state("cover.rullgardin_sovrummet","open") 
              and (states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) < 2000 or is_state("input_boolean.julbelysning","on") ) 
              and is_state("var.morgoninfo_koket_redan_upplast","true")
              and not is_state("zone.home","0") %} Tänt
          {% else %} {{ states("input_select.sovrummet_belysning") }}
          {% endif %}
        {% else %} script.do_nothing
        {% endif %}


