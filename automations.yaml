        < 1380 %}\n      24.0\n    {% else %}\n      20.0\n    {% endif %}\n  {% elif
        veckodag == 5 %}\n    {{ 24.0 if (tid_minuter >= 420 and tid_minuter < 1380)
        else 20.0 }}\n  {% else %}\n    {{ 24.0 if (tid_minuter >= 420 and tid_minuter
        < 1320) else 20.0 }}\n  {% endif %}\n{% endif %}\n"
      aktuell_setpoint: '{{ state_attr(''climate.golvvarmen_i_badrummet'',''temperature'')
