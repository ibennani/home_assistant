# Översvämningar: Olika meddelanden för olika triggers
- alias: "Larm: Översvämning"
  id: '3218348006809914'
  initial_state: on
  triggers:
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.oversvamning_tvattstugan","on") 
        or is_state("binary_sensor.oversvamning_diskmaskinen","on") 
        or is_state("binary_sensor.oversvamning_albins_fonster","on") }}
    - trigger: template
      value_template: >
        {{  is_state("binary_sensor.oversvamning_tvattstugan","off") 
        and is_state("binary_sensor.oversvamning_diskmaskinen","off") 
        and is_state("binary_sensor.oversvamning_albins_fonster","off") }}
  action: 
    - action: > # Bryt strömmen till tvättmaskinen när det är översvämning i tvättstugan
        {% if is_state("binary_sensor.oversvamning_tvattstugan","on") %} switch.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id: switch.tvattmaskinen_switch  
    - action: > # Bryt strömmen till diskmaskinen när det är översvämning i köket
        {% if is_state("binary_sensor.oversvamning_diskmaskinen","on") %} switch.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id: switch.diskmaskinen_switch
    - action: > # Slå på/stäng av sirenen
        {%  if is_state("binary_sensor.oversvamning_tvattstugan","on") 
            or is_state("binary_sensor.oversvamning_diskmaskinen","on") 
            or is_state("binary_sensor.oversvamning_albins_fonster","on") %} siren.turn_on
        {%  elif is_state("binary_sensor.oversvamning_tvattstugan","off") 
            and is_state("binary_sensor.oversvamning_diskmaskinen","off") 
            and is_state("binary_sensor.oversvamning_albins_fonster","off") %} siren.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id: siren.brandvarnare_ovre_trappan
    - action: > # Meddela att det är översvämning
        {%  if is_state("binary_sensor.oversvamning_tvattstugan","on") 
            or is_state("binary_sensor.oversvamning_diskmaskinen","on") 
            or is_state("binary_sensor.oversvamning_albins_fonster","on") %} script.las_text_i_valfri_device
          {% else %} script.do_nothing
          {% endif %}
      data:
        hogtalare: media_player.googlehome_alla_puckar
        meddelande: >-
          {{ trigger.to_state.attributes.friendly_name }}.
          {{ trigger.to_state.attributes.friendly_name }}.
          {{ trigger.to_state.attributes.friendly_name }}.
          {{ trigger.to_state.attributes.friendly_name }}.
          {{ trigger.to_state.attributes.friendly_name }}.
        volym: '0.99'    
        voice: "MattiasNeural"
    - action: >
        {%  if is_state("binary_sensor.oversvamning_tvattstugan","on") 
            or is_state("binary_sensor.oversvamning_diskmaskinen","on") 
            or is_state("binary_sensor.oversvamning_albins_fonster","on") %} notify.foraldrar
        {% else %} script.do_nothing
        {% endif %}
      data:        
        message: |
          HEMMET {{ now().strftime('%R') }}: 
          {%- if trigger.to_state.state == "on" %}
          *** {{ trigger.to_state.attributes.friendly_name }} ***
          {%- else %}
          Översvämningen är åtgärdad, men du måste slå på strömmen för disk- och tvättmaskinerna.
          {% endif %}   
        data:
          ttl: 0
          priority: high
          tag: fraga_vitvaror_el_pa_efter_oversvamning
          actions: 
            - action: VITVAROR_EL_PA
              title: "Slå på på strömmen"


# Slå på strömmen för tvättmaskinen och diskmaskinen efter översvämning
- alias: "Hantera mobilnotis: Slå på strämmen för tvättmaskinen och diskmaskinen efter översvämning"
  id: "asdfasdf9404000598480669404413066A"
  triggers:
