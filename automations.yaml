# Framsida-rörelse: primär ring-mqtt (binary_sensor.front_door_motion_2).
# Backup: event.front_door_motion (Ring push) och sensor.front_door_last_activity (poll).
# Inte dörrklocka/live view — filtrera on_demand; ding via binary_sensor.front_door_ding (lastDing).
- id: '8348674'
  alias: 'Belysning: Blinka i WC och badrummet vid rörelse på framsidan'
  mode: queued
  max: 3
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_motion_2
    to: 'on'
    id: ring_motion_mqtt
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id: event.front_door_motion
    id: ring_motion_event
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: sensor.front_door_last_activity
    id: ring_last_activity_motion
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions:
  - condition: template
    value_template: >
      {% if trigger.id == 'ring_motion_mqtt' %}
        {{ trigger.to_state.state == 'on'
           and trigger.from_state.state not in ['unavailable', 'unknown'] }}
      {% elif trigger.id == 'ring_motion_event' %}
        {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
           and trigger.from_state.state not in ['unavailable', 'unknown', 'none'] }}
      {% else %}
        {% set mqtt_ts = as_timestamp(states.binary_sensor.front_door_motion_2.last_changed) %}
        {% set event_ts = as_timestamp(states.event.front_door_motion.state)
           if states.event.front_door_motion.state not in ['unavailable', 'unknown', 'none', ''] else 0 %}
        {% set latest = mqtt_ts if event_ts < mqtt_ts else event_ts %}
        {{ trigger.to_state.attributes.get('category') == 'motion'
           and trigger.to_state.state not in ['unavailable', 'unknown', 'none', '']
           and trigger.from_state.state not in ['unavailable', 'unknown', 'none', '']
           and trigger.to_state.state != trigger.from_state.state
           and (as_timestamp(trigger.to_state.state) - latest) > 120 }}
      {% endif %}
  actions:
  - alias: Spara nuvarande ljusläge
    action: scene.create
    data:
      scene_id: framsida_blink_restore
      snapshot_entities:
      - light.takspott_duschen
      - light.takspottar_badrummet
      - light.taklampa_wc
  - variables:
      expected_duschen_on: "{{ is_state('light.takspott_duschen', 'on') }}"
      expected_duschen_brightness: "{{ state_attr('light.takspott_duschen', 'brightness') | int(0) }}"
      expected_badrummet_on: "{{ is_state('light.takspottar_badrummet', 'on') }}"
      expected_badrummet_brightness: "{{ state_attr('light.takspottar_badrummet', 'brightness') | int(0) }}"
      expected_wc_on: "{{ is_state('light.taklampa_wc', 'on') }}"
      expected_wc_brightness: "{{ state_attr('light.taklampa_wc', 'brightness') | int(0) }}"
      duschen_blink_brightness: "{% set level = state_attr('light.takspott_duschen',
        'brightness') | int(0) %} {% if is_state('light.takspott_duschen', 'on') and
        level > 125 %}\n  0\n{% elif is_state('input_select.house_time_modes', 'Natt')
        %}\n  150\n{% else %}\n  240\n{% endif %}"
      badrummet_blink_brightness: "{% set level = state_attr('light.takspottar_badrummet',
        'brightness') | int(0) %} {% if is_state('light.takspottar_badrummet', 'on')
        and level > 125 %}\n  0\n{% elif is_state('input_select.house_time_modes',
        'Natt') %}\n  150\n{% else %}\n  240\n{% endif %}"
      wc_blink_brightness: "{% set level = state_attr('light.taklampa_wc', 'brightness')
        | int(0) %} {% if is_state('light.taklampa_wc', 'on') and level > 125 %}\n
        \ 0\n{% elif is_state('input_select.house_time_modes', 'Natt') %}\n  150\n{%
        else %}\n  240\n{% endif %}"
  - parallel:
    - sequence:
      - alias: Blinka duschen
        choose:
        - conditions:
          - condition: template
            value_template: '{{ (duschen_blink_brightness | int(0)) == 0 }}'
          sequence:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: light.takspott_duschen
        default:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: light.takspott_duschen
          data:
            brightness: '{{ duschen_blink_brightness | int(0) }}'
    - sequence:
      - alias: Blinka badrummet
        choose:
        - conditions:
          - condition: template
            value_template: '{{ (badrummet_blink_brightness | int(0)) == 0 }}'
          sequence:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: light.takspottar_badrummet
        default:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: light.takspottar_badrummet
          data:
            brightness: '{{ badrummet_blink_brightness | int(0) }}'
    - sequence:
      - alias: Blinka WC
        choose:
        - conditions:
          - condition: template
            value_template: '{{ (wc_blink_brightness | int(0)) == 0 }}'
          sequence:
          - action: light.turn_off
            continue_on_error: true
            target:
              entity_id: light.taklampa_wc
        default:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: light.taklampa_wc
          data:
            brightness: '{{ wc_blink_brightness | int(0) }}'
  - delay: 00:00:02
  - alias: Återställ lampor från snapshot
    action: scene.turn_on
    continue_on_error: true
    target:
      entity_id: scene.framsida_blink_restore
  - alias: Verifiera återställning — fortsätt tills lamporna matchar snapshot
    repeat:
      count: 15
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: >
              {% set d_ok = (expected_duschen_on | bool and is_state('light.takspott_duschen', 'on')
                and (state_attr('light.takspott_duschen', 'brightness') | int(0)) == (expected_duschen_brightness | int(0)))
                or (not expected_duschen_on | bool and is_state('light.takspott_duschen', 'off')) %}
              {% set b_ok = (expected_badrummet_on | bool and is_state('light.takspottar_badrummet', 'on')
                and (state_attr('light.takspottar_badrummet', 'brightness') | int(0)) == (expected_badrummet_brightness | int(0)))
                or (not expected_badrummet_on | bool and is_state('light.takspottar_badrummet', 'off')) %}
              {% set w_ok = (expected_wc_on | bool and is_state('light.taklampa_wc', 'on')
                and (state_attr('light.taklampa_wc', 'brightness') | int(0)) == (expected_wc_brightness | int(0)))
                or (not expected_wc_on | bool and is_state('light.taklampa_wc', 'off')) %}
              {{ d_ok and b_ok and w_ok }}
          sequence:
          - stop: Lampor återställda till snapshot-läge
        default: []
      - delay: 00:00:02
      - action: scene.turn_on
        continue_on_error: true
        target:
          entity_id: scene.framsida_blink_restore
      - parallel:
        - sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ expected_duschen_on | bool }}'
              sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.takspott_duschen
                data:
                  brightness: '{{ expected_duschen_brightness | int(0) }}'
            default:
            - action: light.turn_off
              continue_on_error: true
              target:
                entity_id: light.takspott_duschen
        - sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ expected_badrummet_on | bool }}'
              sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.takspottar_badrummet
                data:
                  brightness: '{{ expected_badrummet_brightness | int(0) }}'
            default:
            - action: light.turn_off
              continue_on_error: true
              target:
                entity_id: light.takspottar_badrummet
        - sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ expected_wc_on | bool }}'
              sequence:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: light.taklampa_wc
                data:
                  brightness: '{{ expected_wc_brightness | int(0) }}'
            default:
            - action: light.turn_off
              continue_on_error: true
              target:
                entity_id: light.taklampa_wc
- id: ring_reload_motion_event_8c5c
  alias: 'Ring: Ladda om integration vid trasigt motion-event'
  description: >
    Ring push (FCM) kan tystna. Reload när event unavailable, dagligen 04:00/10:00,
    eller när last_activity visar motion men MQTT/event hänger kvar på gammal tid.
  mode: single
  triggers:
  - trigger: state
    entity_id: event.front_door_motion
    to: unavailable
    for:
      minutes: 2
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id: sensor.front_door_last_activity
    id: stale_motion_event
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: time
    at: "04:00:00"
    id: daglig_reload
  - trigger: time
    at: "10:00:00"
    id: daglig_reload_morgon
  conditions:
  - condition: template
    value_template: >
      {% if trigger.id == 'stale_motion_event' %}
        {% set mqtt_ts = as_timestamp(states.binary_sensor.front_door_motion_2.last_changed) %}
        {% set event_ts = as_timestamp(states.event.front_door_motion.state)
           if states.event.front_door_motion.state not in ['unavailable', 'unknown', 'none', ''] else 0 %}
        {% set latest = mqtt_ts if event_ts < mqtt_ts else event_ts %}
        {{ trigger.to_state.attributes.get('category') == 'motion'
           and trigger.to_state.state not in ['unavailable', 'unknown', 'none', '']
           and latest > 0
           and (as_timestamp(trigger.to_state.state) - latest) > 300 }}
      {% else %}
        true
      {% endif %}
  actions:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: '01K8XPBX3QCW9K57MHCF2T84MY'
# Engångs: notis till mobil när nästa framsida-rörelse sker — blink-automationen fungerade eller inte.
# Stängs av automatiskt efter notis (input_boolean.ring_blink_verifiering).
- id: ring_blink_verifiering_8c5c
  alias: 'Test: Verifiera blink i badrum vid framsida-rörelse (engångs)'
  mode: single
  triggers:
    - trigger: state
      entity_id: binary_sensor.front_door_motion_2
      to: 'on'
      id: ring_motion_mqtt
      not_from:
      - unavailable
      - unknown
    - trigger: state
      entity_id: event.front_door_motion
      id: ring_motion_event
      not_from:
      - unavailable
      - unknown
      not_to:
      - unavailable
      - unknown
    - trigger: state
      entity_id: sensor.front_door_last_activity
      id: ring_last_activity_motion
      not_from:
      - unavailable
      - unknown
      not_to:
      - unavailable
      - unknown
  conditions:
    - condition: state
      entity_id: input_boolean.ring_blink_verifiering
      state: "on"
    - condition: template
      value_template: >
        {% if trigger.id == 'ring_motion_mqtt' %}
          {{ trigger.to_state.state == 'on'
             and trigger.from_state.state not in ['unavailable', 'unknown'] }}
        {% elif trigger.id == 'ring_motion_event' %}
          {{ trigger.to_state.state not in ['unavailable', 'unknown', 'none']
             and trigger.from_state.state not in ['unavailable', 'unknown', 'none'] }}
        {% else %}
          {% set mqtt_ts = as_timestamp(states.binary_sensor.front_door_motion_2.last_changed) %}
          {% set event_ts = as_timestamp(states.event.front_door_motion.state)
             if states.event.front_door_motion.state not in ['unavailable', 'unknown', 'none', ''] else 0 %}
          {% set latest = mqtt_ts if event_ts < mqtt_ts else event_ts %}
          {{ trigger.to_state.attributes.get('category') == 'motion'
             and trigger.to_state.state not in ['unavailable', 'unknown', 'none', '']
             and trigger.from_state.state not in ['unavailable', 'unknown', 'none', '']
             and trigger.to_state.state != trigger.from_state.state
             and (as_timestamp(trigger.to_state.state) - latest) > 120 }}
        {% endif %}
  actions:
    - variables:
        motion_at: "{{ trigger.to_state.last_changed }}"
    - delay: "00:00:15"
    - variables:
        blink_ok: >
          {% set blink = 'automation.belysning_blinka_i_wc_och_badrummet_vid_rorelse_pa_framsidan' %}
          {% set triggered = state_attr(blink, 'last_triggered') %}
          {% if triggered is none or triggered in ['unknown', 'unavailable', 'None'] %}
            false
          {% else %}
            {{ as_timestamp(triggered) >= as_timestamp(motion_at) - 2
               and (as_timestamp(states[blink].last_updated) - as_timestamp(triggered)) >= 3 }}
          {% endif %}
    - action: notify.mobile_app_ilias_s23_ultra
      data:
        message: >
          {% if blink_ok | bool %}
          Automatsäkringen fungerar.
          {% else %}
          Automatsäkringen fungerar inte.
          {% endif %}
        data:
          ttl: 0
          priority: high
    - action: input_boolean.turn_off
      target:
        entity_id: input_boolean.ring_blink_verifiering
- alias: 'Belysning: Lamporna ovanför Ilias säng blinkar till vid rörelse på balkongen'
  id: sdfsksdgsd56dgsd16sddga6s068sg
