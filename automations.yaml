                  433 fjärren är för långt bort.
                  Signalstyrka {{ states("sensor.433_fjarr_a_signalstyrka") | int(default = 0) }} dBm.
                data:
                  ttl: 0
                  priority: high
      default:
        - action: script.turn_on
          target:
            entity_id: script.do_nothing


