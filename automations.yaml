# Styr ljuset inomhus på dagtid beroende på ljusstyrkan utomhus
- alias: "Belysning: Styr ljuset inomhus på dagtid beroende på ljusstyrkan utomhus"
  id: '9998348670'
  mode: queued  
  triggers: 
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 2000 }}
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  >= 2000 }}
  condition:
    - condition: template
      value_template: >-
        {{ is_state("input_select.house_time_modes","Dag") }}
  action: 
    - action: >
        {% set ljusstyrka = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
        {% set hemma = states("zone.home") | int(default=0) > 0 or is_state("input_boolean.gaster_hemma", "on") %}
        {% set morgoninfo_redan_upplast = states("var.morgoninfo_koket_redan_upplast") %}
        {% set julbelysning_aktiv = is_state("input_boolean.julbelysning","on") %}
        
        {% if ljusstyrka < 2000 and hemma and morgoninfo_redan_upplast %}
          script.kvallsbelysning
        {% elif ljusstyrka >= 2000 and julbelysning_aktiv and hemma %}
          script.kvallsbelysning
        {% else %}
          script.dagsbelysning
        {% endif %}
    
    # - action: notify.mobile_app_ilias_s23_ultra
    #   data:
    #     message: |
    #       HEMMET {{ now().strftime('%R') }}: 
    #       Ändrad ljusstyrka på framsidan {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  }}
    #     data:
    #       ttl: 0
    #       priority: high  





# Styr utebelysningen beroende på ljusstyrka utomhus framsidan
- alias: "Belysning: Styr belysningen utomhus"
  id: '7918355ddd40574'
  mode: restart
  triggers: 
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) > 1000 }}
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 1000
        and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) > 300 }}
    - trigger: template
      value_template: >
        {{ states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 300 }}
    - trigger: state
      entity_id: input_select.house_time_modes
    - trigger: state
      entity_id: input_select.isabelles_rum_belysning
  action: 
    # Styr 
    - action: light.turn_on
      entity_id: light.fasadbelysningen
      data:
        brightness_pct: >
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 300 %} 1
          {% else %} 0
          {% endif %}
    # Styr ljusslingan på balkongen
    - action: >
        {% set current_week = now().strftime('%V') | int %}
        {% set current_weekday = now().strftime('%u') | int %}
        {% set current_time = now().strftime('%H') | int %}

        {% if ((current_week == 46 and current_weekday == 5 and current_time >= 12) or
              (current_week == 46 and current_weekday > 5) or
              (current_week > 46 or current_week < 10) or
              (current_week == 10)) %}
            {% if   states("input_select.house_time_modes") in ["Natt"] %} light.turn_off
            {% elif states("input_select.house_time_modes") in ["Kväll"]
                and states("input_select.isabelles_rum_belysning") in ["Sängen","Myslampan","Släckt"] %} light.turn_off
            {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 1000 %} light.turn_on
            {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) > 1000 %} light.turn_off
            {% else %} light.turn_off
            {% endif %}
        {% else %} light.turn_off
        {% endif %}
      entity_id: light.ljusslingan_pa_balkongen

            
    - action: >
        {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 300
          and not is_state("input_select.house_time_modes","Natt") %} light.turn_on
        {% else %} light.turn_off
        {% endif %}
      entity_id: 
          - light.trad_och_buskar_pa_framsidan
    - action: >
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 300 %} light.turn_off
          {% else %} script.do_nothing
          {% endif %}
      entity_id: 
          - light.stralkastaren
#          - light.ljusslingan_pa_balkongen
#          - light.fasadbelysningen
          - light.lampan_baksidan 
#          - light.trad_och_buskar_pa_framsidan



# Tänd mysbelysning i sovrummen om det är morgon i huset och om det är mörkt ute
- alias: "Belysning: Tänd sovrummen på morgonen när det är mörkt ute"
  id: '7918001074'
  initial_state: on
  triggers:     
    - trigger: template
      value_template: >
        {{ (  (states("sensor.time") == "06:00" and now().strftime('%u') | int | int(default = 0) in [1,2,3,4,5] ) or 
              (states("sensor.time") == "07:00" and now().strftime('%u') | int | int(default = 0) in [1,2,3,4,5] ) or 
              (states("sensor.time") == "07:15" and now().strftime('%u') | int | int(default = 0) in [1,2,3,4] ) or
              (states("sensor.time") == "08:15" and now().strftime('%u') | int | int(default = 0) in [5] ) or
              (states("sensor.time") == "09:15" and now().strftime('%u') | int | int(default = 0) in [6,7] ) )
          and is_state("input_boolean.vacation_mode","off")
          and is_state("input_boolean.gaster_hemma","off")
          and is_state("var.morgoninfo_koket_redan_upplast","true")
          and is_state("media_player.hogtalarna_i_koket","playing") }}
  action: 
    # Isabelles rum
    - action: input_select.select_option
      target:
        entity_id: input_select.isabelles_rum_belysning
      data:
        option: >
          {% if (states("sensor.time") == "06:00" or states("sensor.time") == "07:00") 
                and now().strftime('%u') | int(default=0) in [1,2,3,4,5] 
                and states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 2000 %}
            {% if is_state("device_tracker.annelies_iphone", "home") %} {{ states('input_select.isabelles_rum_belysning') }}
            {% elif is_state("sensor.ilias_s23_ultra_charger_type", "ac") %} Lamporna i fönstret
            {% else %} Tänt
            {% endif %}
          {% else %} {{ states('input_select.isabelles_rum_belysning') }}
          {% endif %}
    # Sovrummet
    - action: input_select.select_option
      target:
        entity_id: input_select.sovrummet_belysning
      data:
        option: >
          {% if states("sensor.time") == "07:00" 
            and now().strftime('%u') | int(default=0) in [1,2,3,4,5] %}
            {% if is_state("cover.rullgardin_sovrummet", "closed") %}
              Tänt
            {% else %}
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) < 2000 %}
                Tänt
              {% else %}
                Släckt
              {% endif %}
            {% endif %}
          {% else %}
            {{ states('input_select.sovrummet_belysning') }}
          {% endif %}
    # Eriks rum
    - action: input_select.select_option
      target:
        entity_id: input_select.eriks_rum_belysning
      data:
        option: >
          {% if states("sensor.time") == "07:00" 
            and now().strftime('%u') | int(default=0) in [1,2,3,4,5] 
            and states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 2000%} Tänt
          {% else %} {{ states('input_select.eriks_rum_belysning') }}
          {% endif %}
    # Albins rum
    - action: input_select.select_option
      target:
        entity_id: input_select.albins_rum_belysning
      data:
        option: >
          {% if (states("sensor.time") == "07:15" 
            and now().strftime('%u') | int | int(default = 0) in [1,2,3,4] )
            and states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 2000 %} Mysigt
          {% elif (states("sensor.time") == "08:15" 
            and now().strftime('%u') | int | int(default = 0) in [5] ) 
            and states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 2000 %} Mysigt
          {% else %} {{ states("input_select.albins_rum_belysning") }}
          {% endif %}

