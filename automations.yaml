    value_template: "{{\n  states(\"sensor.apple_tv_wall_plug_power\") | float(default=999)
      <= 2\n  and states(\"media_player.playstation_4\") in [\"standby\", \"off\",
      \"unavailable\", \"unknown\"]\n  and states(\"media_player.pucken_bakom_stereon_i_vardagsrummet\")
      in [\"off\", \"unavailable\", \"unknown\"]\n}}\n"
    for: 00:00:15
  - trigger: template
    id: appletv_aktiv
    value_template: "{{\n  states(\"media_player.appletv\") not in [\"standby\", \"off\",
      \"unavailable\", \"unknown\"]\n  and states(\"sensor.apple_tv_wall_plug_power\")
      | float(default=0) >= 3\n}}\n"
    for: 00:00:03
  - trigger: template
    id: ps4_aktiv
    value_template: "{{\n  states(\"media_player.playstation_4\")\n  not in [\"standby\",
      \"off\", \"unavailable\", \"unknown\"]\n}}\n"
    for: 00:00:03
  - trigger: template
    id: chromecast_audio_aktiv
    value_template: "{{\n  states(\"media_player.pucken_bakom_stereon_i_vardagsrummet\")\n
      \ not in [\"off\", \"unavailable\", \"unknown\"]\n}}\n"
    for: 00:00:03
  - trigger: template
    id: ljusniva_andrad
    value_template: '{{ states("sensor.utomhus_framsidan_ljusstyrka") | int(0) < 2000
      }}

      '
