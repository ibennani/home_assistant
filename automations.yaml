- id: '1765189880184'
  alias: Styr belysningen i tvättstugan
  description: ''
  triggers:
  - id: motion_on
    trigger: template
    value_template: '{{ is_state(''binary_sensor.tvattstugan_rorelse'', ''on'') }}'
  - id: no_motion_300s
    trigger: template
    value_template: "{{\n  is_state('binary_sensor.tvattstugan_rorelse', 'off')\n
      \ and\n  ( now() - states.binary_sensor.tvattstugan_rorelse.last_changed ).total_seconds()
      > 300\n}}"
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''motion_on'' }}'
      - condition: template
        value_template: '{{ is_state(''light.taklampa_tvattstugan'', ''off'') }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.taklampa_tvattstugan
        data:
          transition: 1
          brightness_pct: "{{\n  100 if is_state('input_boolean.stadning_pagar', 'on')\n  else 1 if is_state('input_select.house_time_modes', 'Natt')\n  else 50 if (states('sensor.utomhus_framsidan_ljusstyrka') | float(0)) < 2000\n  else 99\n}}"
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''no_motion_300s'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.taklampa_tvattstugan
        data:
          transition: 5
  mode: single
- id: '1765582268846'
  alias: 'Belysning: Styr belysningen på framsidan'
  description: 'Släcker fasad, träd/buskar och strålkastare om lux > 300, även vid manuell tändning.'
  triggers:
  - id: front_lux_gt_1000
    trigger: template
    value_template: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) >=
      1000 }}

      '
  - id: front_lux_lt_1000
    trigger: template
    value_template: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) <
      1000 }}

      '
  - id: front_lux_le_300
    trigger: template
    value_template: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) <=
      300 }}

      '
  - id: front_lux_gt_300
    trigger: template
    value_template: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) >
      300 }}

      '
  - id: house_time_mode_changed
    trigger: state
    entity_id: input_select.house_time_modes
  - id: ilias_rum_belysning_changed
    trigger: state
    entity_id: input_select.ilias_rum_belysning
  - id: stralkastaren_state_changed
    trigger: state
    entity_id: light.stralkastaren
    to: "on"
  - id: fasadbelysningen_state_changed
    trigger: state
    entity_id: light.fasadbelysningen
    to: "on"
  - id: trad_och_buskar_state_changed
    trigger: state
    entity_id: light.trad_och_buskar_pa_framsidan
    to: "on"
  actions:
  - variables:
      front_lux: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) }}'
      house_time_mode: '{{ states(''input_select.house_time_modes'') }}'
      ilias_belysning_lage: '{{ states(''input_select.ilias_rum_belysning'')
        }}'
      front_lux_low_threshold: 300
      front_lux_mid_threshold: 1000
      balkong_season_ok: "{% set iso = now().isocalendar() %} {% set w = iso.week
        | int %} {% set d = iso.weekday | int %} {% set h = now().hour | int %} {{
        (w > 46)\n   or (w == 46 and (d > 5 or (d == 5 and h >= 12)))\n   or (w <
        11) }}\n"
      fasad_should_be_on: '{{ front_lux <= front_lux_low_threshold }}

        '
      trad_och_buskar_should_be_on: '{{ (front_lux <= front_lux_low_threshold) and
        (house_time_mode != ''Natt'') }}

        '
      stralkastare_should_turn_off: '{{ front_lux > front_lux_low_threshold }}

        '
      balkong_allowed_evening: '{{ (ilias_belysning_lage in [''Tänt'', ''Städning'',
        ''Lamporna i fönstret'']) | bool }}

        '
      balkong_should_be_on: "{% if not balkong_season_ok %}\n  {{ false }}\n{% elif
        house_time_mode == 'Natt' %}\n  {{ false }}\n{% elif house_time_mode in ['Morgon',
        'Dag'] %}\n  {{ (front_lux < front_lux_mid_threshold) | bool }}\n{% elif house_time_mode
        == 'Kväll' %}\n  {{ ((front_lux < front_lux_mid_threshold) and (balkong_allowed_evening
        | bool)) | bool }}\n{% else %}\n  {{ false }}\n{% endif %}\n"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ fasad_should_be_on\n   and (\n     not is_state('light.fasadbelysningen',
          'on')\n     or (state_attr('light.fasadbelysningen', 'brightness') | int(0))
          > 3\n   ) }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.fasadbelysningen
        data:
          brightness_pct: 1
    - conditions:
      - condition: template
        value_template: '{{ (not fasad_should_be_on) and is_state(''light.fasadbelysningen'',
          ''on'') }}

          '
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.fasadbelysningen
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ (balkong_should_be_on | bool) and not is_state(''light.ljusslingan_pa_balkongen'',
          ''on'') }}

          '
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.ljusslingan_pa_balkongen
    - conditions:
      - condition: template
        value_template: '{{ (not (balkong_should_be_on | bool)) and is_state(''light.ljusslingan_pa_balkongen'',
          ''on'') }}

          '
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.ljusslingan_pa_balkongen
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ trad_och_buskar_should_be_on\n   and not is_state('light.trad_och_buskar_pa_framsidan',
          'on') }}\n"
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.trad_och_buskar_pa_framsidan
    - conditions:
      - condition: template
        value_template: "{{ (not trad_och_buskar_should_be_on)\n   and is_state('light.trad_och_buskar_pa_framsidan',
          'on') }}\n"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.trad_och_buskar_pa_framsidan
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ stralkastare_should_turn_off and is_state(''light.stralkastaren'',
          ''on'') }}

          '
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.stralkastaren
  mode: restart
- id: '1765582338276'
  alias: 'Belysning: Styr belysningen på baksidan'
  description: Synkar mysbelysning och altandörren mot lux (≤300 lx tänder mysbelysning).
    Ignorerar unavailable/unknown på lux. Synkar mysbelysning när lampan återkommer
    från unavailable.
  triggers:
  - id: back_lux_changed
    trigger: state
    entity_id: sensor.utomhus_baksidan_ljusstyrka
  - id: mysbelysning_back_available
    trigger: state
    entity_id: light.mysbelysning_baksidan
    from:
    - unavailable
    - unknown
  - id: house_time_mode_changed
    trigger: state
    entity_id: input_select.house_time_modes
  - id: lampan_baksidan_state_changed
    trigger: state
    entity_id: light.lampan_baksidan
  actions:
  - variables:
      back_lux_threshold: 300
      back_lux_valid: '{{ states(''sensor.utomhus_baksidan_ljusstyrka'') not in [''unavailable'',
        ''unknown''] }}'
      back_lux: '{{ states(''sensor.utomhus_baksidan_ljusstyrka'') | float(0) }}'
      house_time_mode: '{{ states(''input_select.house_time_modes'') }}'
      mysbelysning_back_should_be_on: '{{ back_lux_valid and (back_lux <= back_lux_threshold)
        and (house_time_mode != ''Natt'') }}'
      lampan_back_must_be_off_due_to_lux: '{{ back_lux_valid and (back_lux > back_lux_threshold)
        }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ back_lux_valid }}'
      - condition: template
        value_template: '{{ trigger.id in [''back_lux_changed'', ''mysbelysning_back_available'',
          ''house_time_mode_changed''] }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ mysbelysning_back_should_be_on\n   and not is_state('light.mysbelysning_baksidan',
              'on') }}\n"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.mysbelysning_baksidan
        - conditions:
          - condition: template
            value_template: "{{ (not mysbelysning_back_should_be_on)\n   and is_state('light.mysbelysning_baksidan',
              'on') }}\n"
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.mysbelysning_baksidan
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ back_lux_valid and trigger.id in [''back_lux_changed'',
          ''lampan_baksidan_state_changed'', ''mysbelysning_back_available''] }}'
      - condition: template
        value_template: "{{ lampan_back_must_be_off_due_to_lux\n   and is_state('light.lampan_baksidan',
          'on') }}\n"
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.lampan_baksidan
  mode: restart
- id: '1765585518927'
  alias: 'Status: Någon duschar'
  description: 'Hanterar duschstatus i tre steg. Kandidat kräver stängd badrumsdörr,
    duschdörr öppen 3-300 sekunder och 120 sekunder efter stängd duschdörr utan rörelse
    vid timerutgång. Kandidat ligger kvar tills badrums- eller duschdörr öppnas, eller
    rörelse avbryter. Kraftig fuktökning bekräftar till Någon duschar. Bekräftad session
    avslutas endast när badrumsdörren öppnas. Fukt spåras under session för toppvärde
    och för att släppa ljuslås efter paus. Detektion startar inte när alla badrumslampor
    är tända och de fem dimmbara lyser på max (binary_sensor.badrum_fullt_upplyst_manuellt).

    '
  triggers:
  - trigger: state
    id: duschdorr_oppnad
    entity_id: binary_sensor.duschdorren
    to: 'on'
    for: 00:00:03
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: duschdorr_stangd
    entity_id: binary_sensor.duschdorren
    to: 'off'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: kandidat_rorelse_on
    entity_id: binary_sensor.badrummet_rorelse
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: fukt_andrad
    entity_id: sensor.badrummet_luftfuktighet
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: state
    id: badrumsdorr_oppnad
    entity_id: binary_sensor.badrumsdorren
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: event
    id: badrum_dusch_120s_klar
    event_type: timer.finished
    event_data:
      entity_id: timer.badrum_dusch_120s
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschdorr_oppnad'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''input_select.nagon_duschar'', ''Någon kanske
              duschar'') }}'
          sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.nagon_duschar
            data:
              option: Ingen duschar
          - action: input_number.set_value
            target:
              entity_id: input_number.duschsession_fukt_topp
            data:
              value: 0
          - action: input_number.set_value
            target:
              entity_id: input_number.duschsession_fukt_nedgang_ts
            data:
              value: 0
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.duschsession_start
            data:
              datetime: '1970-01-01 00:00:00'
          - action: logbook.log
            data:
              name: Duschstatus
              message: Duschkandidat avslutades när duschdörren öppnades.
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.duschsekvens_giltig
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duschdorr_oppnad_ts
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duschdorr_stangd_ts
        data:
          datetime: '1970-01-01 00:00:00'
      - action: timer.cancel
        target:
          entity_id: timer.badrum_dusch_120s
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschdorr_stangd'' }}'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duschdorr_stangd_ts
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - choose:
        - conditions:
          - condition: template
            value_template: "{% set now_ts = as_timestamp(now()) %} {% set open_raw
              = states('input_datetime.duschdorr_oppnad_ts') %} {% set open_ts = as_timestamp(open_raw)
              if open_raw not in ['unknown', 'unavailable', 'none', 'None', ''] else
              0 %} {% set duration = (now_ts - open_ts) if open_ts > 0 else 0 %} {{
              is_state('binary_sensor.badrumsdorren', 'off') and open_ts > 0 and duration
              >= 3 and duration <= 300 }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.duschsekvens_giltig
        default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.duschsekvens_giltig
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ is_state('binary_sensor.badrumsdorren', 'off') and is_state('input_select.nagon_duschar', 'Ingen duschar') and is_state('input_boolean.duschsekvens_giltig', 'on') }}"
          - condition: state
            entity_id: binary_sensor.badrum_fullt_upplyst_manuellt
            state: 'off'
          sequence:
          - action: timer.start
            target:
              entity_id: timer.badrum_dusch_120s
            data:
              duration: 00:02:00
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''badrum_dusch_120s_klar'' }}'
      - condition: template
        value_template: '{{ is_state(''input_select.nagon_duschar'', ''Ingen duschar'')
          }}'
      - condition: template
        value_template: '{{ is_state(''input_boolean.duschsekvens_giltig'', ''on'')
          }}'
      - condition: template
        value_template: '{{ is_state(''binary_sensor.badrumsdorren'', ''off'') }}'
      - condition: template
        value_template: '{{ is_state(''binary_sensor.duschdorren'', ''off'') }}'
      - condition: template
        value_template: '{{ is_state(''binary_sensor.badrummet_rorelse'', ''off'') }}'
      - condition: state
        entity_id: binary_sensor.badrum_fullt_upplyst_manuellt
        state: 'off'
      sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.duschsession_start
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.nagon_duschar
        data:
          option: Någon kanske duschar
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.duschsekvens_giltig
      - action: notify.mobile_app_ilias_s23_ultra
        data:
          message: "{% set vem = states('input_select.badrummet_vem') %}{% set namn = vem if vem in ['Anna', 'Erik', 'Ilias'] else 'Någon' %}HEMMET {{ now().strftime('%R') }}:\n\n{{ namn }} kanske duschar.\n\n"
          data:
            ttl: 0
            priority: high
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''kandidat_rorelse_on'' }}'
      - condition: template
        value_template: '{{ is_state(''input_select.nagon_duschar'', ''Någon kanske
          duschar'') }}'
      - condition: template
        value_template: "{% set now_ts = as_timestamp(now()) %} {% set shower_changed_ts
          = as_timestamp(states.binary_sensor.duschdorren.last_changed, 0) %} {{
          is_state('binary_sensor.badrumsdorren', 'off') and (now_ts - shower_changed_ts)
          > 120 }}"
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.nagon_duschar
        data:
          option: Ingen duschar
      - action: input_number.set_value
        target:
          entity_id: input_number.duschsession_fukt_topp
