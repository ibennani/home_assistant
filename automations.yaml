            \ {{ 'Tänt' if jul else 'Släckt' }}\n{% endif %}\n"
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''remote'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ ev == 1002 }}'
          sequence:
          - action: input_select.select_option
            data:
              entity_id: input_select.annas_rum_belysning
              option: "{% if mode_house in ['Morgon','Dag','Kväll'] %}\n  {% if current
                in ['Släckt','Mysigt','Trådkorgarna maxbelysning'] %} Tänt\n  {% else
                %} Släckt\n  {% endif %}\n{% elif mode_house == 'Natt' %}\n  {% if
                current == 'Släckt' %} Tänt\n  {% else %} Släckt\n  {% endif %}\n{%
                else %} Släckt {% endif %}\n"
        - conditions:
          - condition: template
            value_template: '{{ ev in [1001, 1003] }}'
          sequence:
          - action: input_select.select_option
            data:
              entity_id: input_select.annas_rum_belysning
              option: '{% if current == ''Mysigt'' %} Tänt {% else %} Mysigt {% endif
                %}

                '
        - conditions:
          - condition: template
            value_template: '{{ ev == 2002 }}'
          sequence:
          - action: input_select.select_option
            data:
              entity_id: input_select.annas_rum_belysning
              option: "{% if current != 'Trådkorgarna maxbelysning' %}\n  Trådkorgarna
                maxbelysning\n{% else %}\n  {% if mode_house in ['Morgon','Kväll']
                %}\n    Tänt\n  {% elif mode_house == 'Dag' %}\n    {% if lux >= 2000
                %}\n      {% if anna_home %} Trådkorgarna normalbelysning\n      {%
                else %} Släckt\n      {% endif %}\n    {% else %}\n      Tänt\n    {%
                endif %}\n  {% else %}\n    Släckt\n  {% endif %}\n{% endif %}\n"
        default:
        - action: script.turn_on
          target:
            entity_id: script.do_nothing
    default:
    - action: script.turn_on
      target:
        entity_id: script.do_nothing
  mode: restart
