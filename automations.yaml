# Nattlarmet är triggat
- alias: "Larmet: Nattlarm - något har öppnats"
  id: '7900000674'
  mode: parallel
  initial_state: on
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.balkongdorren
        - binary_sensor.altandorr_baksidan
        - binary_sensor.altandorr_koket
        - binary_sensor.ytterdorren
        - binary_sensor.isabelles_fonster
        - binary_sensor.vardagsrummet_fonster
        - binary_sensor.wc_fonster
        - binary_sensor.eriks_fonster
        - binary_sensor.albins_fonster
        - binary_sensor.badrummet_fonster
  condition:
    - condition: template
      value_template: >
        {{ is_state('input_select.house_alarm_modes', 'Nattlarm') and
            trigger.to_state.state == 'on' and trigger.from_state.state == 'off' }}
  action:
    - delay: '00:00:10' # Vänta 10 sekunder innan kontroll
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ is_state(trigger.entity_id, 'on') }}"
          sequence:
            - action: switch.turn_on
              entity_id: siren.brandvarnare_ovre_trappan
            - action: var.set
              data:
                entity_id: var.alarm_triggered_message
                value: "{{ trigger.to_state.attributes.friendly_name }}"
            - action: notify.foraldrar
              data:
                message: >-
                  HEMMET {{ now().strftime('%R') }}:
                  *** Nattlarm ***
                  {{ states('var.alarm_triggered_message') }} har öppnats.
                data:
                  ttl: 0
                  priority: high
            - delay: "00:00:05"
            - action: script.turn_on
              target:
                entity_id: script.las_text_i_valfri_device
              data:
                variables:
                  hogtalare: media_player.googlehome_alla_puckar
                  meddelande: >-
                    Nattlarm! {{ states('var.alarm_triggered_message') }} har öppnats.
                    Nattlarm! {{ states('var.alarm_triggered_message') }} har öppnats.
                    Nattlarm! {{ states('var.alarm_triggered_message') }} har öppnats.
                    Nattlarm! {{ states('var.alarm_triggered_message') }} har öppnats.
                    Nattlarm! {{ states('var.alarm_triggered_message') }} har öppnats.
                  volym: '0.99'
                  voice: "MattiasNeural"
            - action: >
                {% if is_state('input_select.house_alarm_modes', 'Nattlarm') and is_state(trigger.entity_id, 'on') %}
                  switch.turn_on
                {% else %}
                  switch.turn_off
                {% endif %}
              entity_id: siren.brandvarnare_ovre_trappan
      default:
        - action: notify.foraldrar
          data:
            message: >-
              HEMMET {{ now().strftime('%R') }}:
              *** Nattlarm ***
              Triggat av {{ trigger.to_state.attributes.friendly_name }} som nu är stängt.
            data:
              ttl: 0
              priority: high




# Mobilnotis om någon dörr eller något fönster öppnats eller stängts när ingen förälder är hemma.
# Bra för att hålla koll på vad barnen och hantverkarna gör. 
- alias: "Mobilnotis: Någonting har öppnats eller stängts när ingen förälder är hemma"
  id: '7918398765050dd006'
  initial_state: on
  triggers:
    - trigger: state
      entity_id: 
        - binary_sensor.balkongdorren
        - binary_sensor.altandorr_baksidan
        - binary_sensor.altandorr_koket
        - binary_sensor.ytterdorren
        - binary_sensor.isabelles_fonster
        - binary_sensor.vardagsrummet_fonster
        - binary_sensor.wc_fonster
        - binary_sensor.eriks_fonster
        - binary_sensor.albins_fonster   
        - binary_sensor.badrummet_fonster 
        - binary_sensor.skafferidorren
  condition: 
    - condition: template
      value_template: >
        {{    not is_state("device_tracker.ilias_s23_ultra","home")
          and not is_state("device_tracker.anna_s22_ultra","home") 
          and not trigger.to_state.attributes.friendly_name == "None" 
          and not trigger.to_state.attributes.friendly_name == "False" }}
  action: 
    - action: >
        {% if (trigger.to_state.state == 'on' and trigger.from_state.state == 'off')
        or  (trigger.to_state.state == 'off'  and trigger.from_state.state == 'on') %} 
          notify.foraldrar
        {% else %} 
          script.do_nothing
        {% endif %}       
      data:
        message: >
          HEMMET {{ now().strftime('%R') }}: 
          {{ trigger.to_state.attributes.friendly_name }} har
          {% if trigger.to_state.state == "on" %}öppnats
          {% else %}stängts
          {% endif %}
        data:
          ttl: 0
          priority: high
          


# Uppdatera antalet familjemedlemmar som är hemma
- alias: 'Larmet: Uppdatera antalet familjemedlemmar som är hemma'
  id: '7918348673'
  initial_state: on
  mode: restart
  triggers:
    - trigger: state
      entity_id: 
        #- device_tracker.ilias_galaxynote8  # Ilias mobil
        - device_tracker.ilias_s23_ultra # ilias mobil (genom appen)
        - device_tracker.anna_s22_ultra  # Annas mobil 
        - device_tracker.albins_iphone_12_gps_tracker  # Albins mobil
        - device_tracker.annelies_iphone  # Isabelles mobil 
        - device_tracker.erik_s23 # Eriks mobil
  action:
    - action: homeassistant.update_entity
      entity_id: sensor.family_people_home_count

      
# Om det bara är en familjemedlem hema, spara undan data om den personen
# Används som påminnelse så att sista personen som gått hemmifrån utan att stänga alla dörrar och fönster får en mobilnotis.
- alias: "Larmet: Ta reda på vem som är ensam hemma"
  id: '32183486740'
  initial_state: on
  mode: queued
  triggers: 
    - trigger: template
      value_template: >
        {{ is_state("zone.home","1") }}
  action:
    - action: var.set
      data:  
        entity_id: var.vem_ar_ensam_hemma
        value: >
          {% set persons = state_attr('zone.home', 'persons') %}
          {{ persons | map('replace', 'person.', '') | map('regex_replace', '_.*', '') | map('capitalize') | join(', ') }}

# Mobilnotis till föraldrarna och till den som var hemma sist om att ett fönster eller en dörr är öppen
- alias: "Moiblnotis: Alla har gått hemifrån men något föster eller någon dörr är öppen"
  id: 'ACVASDG3218348006809914'
  initial_state: on
  triggers: 
    - trigger: template
      value_template: >
        {{ is_state("zone.home","0") }}
    - trigger: state
      entity_id: input_boolean.stadning_pagar
      from: "on"
      to: "off"
  condition:
    - condition: template
      value_template: >-
        {{ is_state("group.opened_doors_and_windows","on")
        and is_state("input_boolean.stadning_pagar","off") }}
  action: 
    # Meddelan den som gick sist hemmifrån
    - action: >
        {% if is_state('var.vem_ar_ensam_hemma','Ilias') %} notify.mobile_app_ilias_s23_ultra
        {% elif is_state('var.vem_ar_ensam_hemma','Anna') %} notify.mobile_app_anna_s22_ultra
        {% elif is_state('var.vem_ar_ensam_hemma','Albin') %} notify.mobile_app_iphone_12_pro_max
        {% elif is_state('var.vem_ar_ensam_hemma','Isabelle') %} notify.mobile_app_ashers_iphone
