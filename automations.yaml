- id: '7918348674111555999'
  alias: 'Mobilnotis Ilias: Vilka kommer hem och går hemifrån'
  description: Platsnotiser via aktiv_zon (mittpunkt i zon, en zon åt gången).
  mode: parallel
  triggers:
  - trigger: state
    entity_id:
    - sensor.anna_aktiv_zon
    - sensor.erik_aktiv_zon
    - sensor.isabelle_aktiv_zon
  conditions:
  - condition: template
    value_template: >
      {{ trigger.from_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.to_state.state not in ['unknown', 'unavailable', 'none']
         and trigger.from_state.state != trigger.to_state.state }}
  actions:
  - variables:
      notification_message: >
                {%- if trigger.entity_id == 'sensor.anna_aktiv_zon' -%}
                  {%- set person = 'Anna' -%}
                {%- elif trigger.entity_id == 'sensor.erik_aktiv_zon' -%}
                  {%- set person = 'Erik' -%}
                {%- elif trigger.entity_id == 'sensor.isabelle_aktiv_zon' -%}
                  {%- set person = 'Isabelle' -%}
                {%- else -%}
                  {%- set person = 'Okänd' -%}
                {%- endif -%}
                {%- set from_slug = trigger.from_state.state.replace('zone.', '') if trigger.from_state.state.startswith('zone.') else trigger.from_state.state -%}
                {%- set to_slug = trigger.to_state.state.replace('zone.', '') if trigger.to_state.state.startswith('zone.') else trigger.to_state.state -%}
                {%- if to_slug == 'not_home' and from_slug == 'home' -%}
                  {{ person }} har gått hemifrån
                {%- elif to_slug == 'not_home' and from_slug == 'annas_jobb' -%}
