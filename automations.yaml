# Styr belysningen i badrummet
- alias: "Belysning: Styr belysningen i badrummet"
  id: 'sdfsksdgsd5616sd6s068sg'
  mode: restart
  triggers:
    - trigger: state
      entity_id: binary_sensor.badrumsdorren
      to: "on"
    - trigger: template
      value_template: >
        {{ 
          is_state('binary_sensor.badrumsdorren', 'on') and
          is_state('binary_sensor.badrummet_rorelse', 'on')  
        }}
    - trigger: template
      value_template: >
        {{ 
          is_state('binary_sensor.badrumsdorren', 'off') and
          is_state('binary_sensor.badrummet_rorelse', 'on') and
          (as_timestamp(now()) - as_timestamp(states.binary_sensor.badrumsdorren.last_changed)) < (10) 
        }}
    - trigger: template
      value_template: >
        {{
          is_state('binary_sensor.badrumsdorren', 'on') and 
          is_state('binary_sensor.badrummet_rorelse', 'off') and
          (as_timestamp(now()) - as_timestamp(states.binary_sensor.badrummet_rorelse.last_changed)) > (5*60) and
          is_state('input_boolean.stadning_pagar', 'off')
        }}

    # Trigga när vägglamporna har 100 % brightness
    - trigger: template
      value_template: >
        {{ state_attr('light.vagglampor_badrummet', 'brightness') | default(0) | int(0) == 255 }}    
        
    # # trigga på ingen rörelse, olika tider beroende på vägglampornas ljysstyrka
    # - trigger: state
    #   entity_id: binary_sensor.badrummet_rorelse
    #   to: "off"
    #   for:
    #     minutes: >
    #       {{ 15 if state_attr('light.vagglampor_badrummet', 'brightness') is not none and 
    #             state_attr('light.vagglampor_badrummet', 'brightness') | int == 255 else 5 }}
        
    #   # trigga när ljusstyrkan för vägglamporna ändras (så taklampan följer vägglamporna)
    # - trigger: template
    #   value_template: >
    #     {{  state_attr('light.vagglampor_badrummet', 'brightness') | default(0) | int(0) !=
    #         state_attr('light.taklampan_badrummet', 'brightness') | default(0) | int(0) }}

  action:
    - choose:
        # Tänd lamporna när dörren är öppen och rörelse detekteras
        - conditions:
            - condition: template
              value_template: >
                {{ 
                  trigger.entity_id == 'binary_sensor.badrummet_rorelse' and
                  trigger.from_state.state == 'off' and
                  trigger.to_state.state == 'on' and
                  is_state('binary_sensor.badrumsdorren', 'on') and                  
                  is_state('light.vagglampor_badrummet', 'off') and
                  is_state('input_boolean.stadning_pagar', 'off')
                }}              
          sequence:
            - action: light.turn_on
              entity_id: light.vagglampor_badrummet
              data:
                brightness_pct: >
                  {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set mode = states("input_select.house_time_modes") %}
                  
                  {% if mode == "Morgon" %}
                    {{ 15 if ljusstyrka < 100 else 30 }}
                  {% elif mode == "Dag" %}
                    {{ 99 if ljusstyrka > 2000 else 50 }}
                  {% elif mode == "Kväll" %}
                    {{ 50 if ljusstyrka > 300 else 30 }}
                  {% elif mode == "Natt" %}
                    {{ 50 if ljusstyrka > 300 else 15 }}
                  {% else %} 40
                  {% endif %}
                transition: >
                  {% if is_state("light.vagglampor_badrummet", "off") %} 0
                  {% else %} 3
                  {% endif %}

            - action: light.turn_on
              entity_id: light.taklampan_badrummet
              data: 
                brightness_pct: >
                  {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set mode = states("input_select.house_time_modes") %}
                  
                  {% if mode == "Morgon" %}
                    {{ 20 if ljusstyrka > 2000 else 1 }}
                  {% elif mode == "Dag" %}
                    {{ 30 if ljusstyrka > 13000 else 20 if ljusstyrka > 2000 else 10 }}
                  {% elif mode == "Kväll" %}
                    {{ 20 if ljusstyrka > 2000 else 10 }}
                  {% elif mode == "Natt" %} 0
                  {% else %} 15
                  {% endif %}
                transition: >
                  {% if is_state("light.taklampan_badrummet", "off") %} 0 
                  {% else %} 1
                  {% endif %}
                kelvin: >
                  {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set mode = states("input_select.house_time_modes") %}

                  {% if mode in ["Morgon","Dag","Kväll"] %} 
                    {% if ljusstyrka >= 2000 %} 3200
                    {% else %} 2500
                    {% endif %} 
                  {% else %} 2500
                  {% endif %}

        # Släck lampor efter x minuters inaktivitet och dörren är öppen.
        # Om ljusstyrkan är 100 % så ska fördröjningen vara längre än om ljusstyrkan är lägre. 
        - conditions:
            - condition: template
              value_template: >
                {{ 
                  is_state('binary_sensor.badrummet_rorelse', 'off') and
                  is_state('binary_sensor.badrumsdorren', 'on') and
                  (as_timestamp(now()) - as_timestamp(states.binary_sensor.badrummet_rorelse.last_changed)) > (5 * 60) and
                  is_state('input_boolean.stadning_pagar', 'off')
                }}
          sequence:
            - action: light.turn_off
              target:
                entity_id:
                  - light.vagglampor_badrummet
                  - light.taklampan_badrummet
              data:
                transition: 1
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state('binary_sensor.forradet_dorr', 'off') }}
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.forradet

        # Släck lampor när dörren öppnas, rörelse har detekterats och lamporna är tända
        - conditions:
            - condition: template
              value_template: >
                {{ 
                  trigger.entity_id == 'binary_sensor.badrumsdorren' and
                  trigger.from_state.state == 'off' and 
                  trigger.to_state.state == 'on' and
                  is_state('binary_sensor.badrummet_rorelse', 'on') and
                  (as_timestamp(now()) - as_timestamp(states.binary_sensor.badrummet_rorelse.last_changed)) > 2 and
                  is_state('input_boolean.stadning_pagar', 'off')
                }}
          sequence:
            - action: light.turn_off
              entity_id:
                - light.vagglampor_badrummet
                - light.taklampan_badrummet
              data:
                transition: 1
            - choose:
                - conditions:
                    - condition: template
                      value_template: >
                        {{ is_state('binary_sensor.forradet_dorr', 'off') }}
                  sequence:
                    - action: light.turn_off
                      target:
                        entity_id: light.forradet

        # Om vägglamporna dimmas till max (Erik brukar göra det) så dimma även taklampan till max.
        - conditions:
          - condition: template
            value_template: >
              {{ state_attr('light.vagglampor_badrummet', 'brightness') | default(0) | int == 255 }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_badrummet
              data:
                brightness: 255
                transition: 1
                kelvin: >
                  {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
                  {% set mode = states("input_select.house_time_modes") %}

                  {% if mode in ["Morgon","Dag","Kväll"] %} 
                    {% if ljusstyrka >= 2000 %} 3200
                    {% else %} 2700
                    {% endif %} 
                  {% else %} 2700
                  {% endif %}

    # # Taklampans ljusstyrka följer vägglampornas ljysstyrka
    # - choose:
    #   - conditions:
    #       - condition: template
    #         value_template: >
    #           {{ state_attr('light.vagglampor_badrummet', 'brightness') | default(0) | int > 0 }}
    #     sequence:
    #       - action: light.turn_on
    #         target:
    #           entity_id: light.taklampan_badrummet
    #         data:
    #           brightness: >
    #             {{ state_attr('light.vagglampor_badrummet', 'brightness') | int }}
    #           transition: >
    #             {% if is_state("light.taklampan_badrummet", "off") %} 0 
    #             {% else %} 3
    #             {% endif %}
    #           kelvin: >
    #             {% set ljusstyrka = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
    #             {% set mode = states("input_select.house_time_modes") %}
  
    #             {% if mode in ["Morgon","Dag","Kväll"] %} 
    #               {% if ljusstyrka >= 2000 %} 3200
    #               {% else %} 2700
    #               {% endif %} 
    #             {% else %} 2700
    #             {% endif %}
    #   - conditions:
    #       - condition: template
    #         value_template: >
    #           {{ state_attr('light.vagglampor_badrummet', 'brightness') | default(0) | int(0) == 0 }}
