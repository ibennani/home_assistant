- id: sdljgsagwrojgwrglsapasjwrglkg
  alias: 'Termostat: Styr elementet i sovrummet'
  triggers:
  - trigger: time
    at: '20:00:00'
  - trigger: time
    at: '22:00:00'
  - trigger: state
    entity_id: zone.home
    from: '0'
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: zone.home
    to: '0'
    for: 00:15:00
    not_from:
    - unavailable
    - unknown
  - trigger: state
    entity_id: var.morgoninfo_koket_redan_upplast
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  - trigger: state
    entity_id: climate.elementet_i_sovrummet
    from: unavailable
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
  - variables:
      home_count: '{{ states(''zone.home'') | int(0) }}'
      morninginfo: '{{ states(''var.morgoninfo_koket_redan_upplast'') | lower }}'
      outdoor_temp: '{{ states(''sensor.framsidan_temperatur'') | float(none) }}'
      wd: '{{ now().weekday() }}'
      now_minutes: '{{ now().hour * 60 + now().minute }}'
      threshold_minutes: '{{ 20*60 if wd in [0,1,2,3,6] else 22*60 }}'
      is_after_threshold: '{{ now_minutes >= threshold_minutes }}'
      is_night_mode: '{{ is_after_threshold or morninginfo == ''false'' }}'
      outdoor_ok: '{{ outdoor_temp is not none and outdoor_temp > -5 }}'
      away_seconds: '{{ (as_timestamp(now()) - as_timestamp(states.zone.home.last_changed))
        | int(0) }}'
      away_long_enough: '{{ home_count == 0 and away_seconds >= 15*60 }}'
      current_setpoint: '{{ state_attr(''climate.elementet_i_sovrummet'', ''temperature'')
        | float(25) }}'
      desired_temp: "{% if home_count > 0 %}\n  {% if is_night_mode and outdoor_ok
        %}\n    7\n  {% else %}\n    25\n  {% endif %}\n{% else %}\n  {% if away_long_enough
        %}\n    25\n  {% else %}\n    {{ current_setpoint }}\n  {% endif %}\n{% endif
        %}"
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.elementet_i_sovrummet
    data:
      hvac_mode: heat
  - action: climate.set_temperature
    target:
      entity_id: climate.elementet_i_sovrummet
    data:
      temperature: '{{ desired_temp | float(25) }}'
  mode: single
- alias: Fjärrkontroll för badrumslampa
  description: Hantera toggling, dimning och växlande riktning för badrumslampa.
  id: sgksajgdoisadglrwjgojegegji
  mode: restart
  trigger:
  - trigger: event
    event_type: deconz_event
    event_data:
      id: fjarr_badrummet
  action:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.event == 1002 }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.taklampan_badrummet
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.event == 1001 }}'
      sequence:
      - choose:
        - conditions:
          - condition: state
            entity_id: input_boolean.vagglampor_badrummet_dimma_upp
            state: 'on'
          sequence:
          - repeat:
              while:
              - condition: template
                value_template: '{{ not is_state_attr(''sensor.last_deconz_event'',
                  ''event'', ''1003'') }}

                  '
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_badrummet
                data:
                  brightness_step_pct: 10
                  transition: 1
                  kelvin: "{% set ljusstyrka = states(\"sensor.utomhus_baksidan_ljusstyrka\")
                    | int(default=0) %} {% set mode = states(\"input_select.house_time_modes\")
                    %}\n{% if mode in [\"Morgon\",\"Dag\",\"Kväll\"] %} \n  {% if
                    ljusstyrka >= 2000 %} 3200\n  {% else %} 2500\n  {% endif %} \n{%
                    else %} 2500 {% endif %}\n"
              - delay: 00:00:01
        - conditions:
          - condition: state
            entity_id: input_boolean.vagglampor_badrummet_dimma_upp
            state: 'off'
          sequence:
          - repeat:
              while:
              - condition: template
                value_template: '{{ not is_state_attr(''sensor.last_deconz_event'',
                  ''event'', ''1003'') }}

                  '
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_badrummet
                data:
                  brightness_step_pct: -10
                  transition: 1
                  kelvin: "{% set ljusstyrka = states(\"sensor.utomhus_baksidan_ljusstyrka\")
                    | int(default=0) %} {% set mode = states(\"input_select.house_time_modes\")
                    %}\n{% if mode in [\"Morgon\",\"Dag\",\"Kväll\"] %} \n  {% if
                    ljusstyrka >= 2000 %} 3200\n  {% else %} 2500\n  {% endif %} \n{%
                    else %} 2500 {% endif %}\n"
              - delay: 00:00:01
    - conditions:
      - condition: template
        value_template: '{{ trigger.event.data.event == 1003 }}'
      sequence:
      - action: input_boolean.toggle
        target:
          entity_id: input_boolean.vagglampor_badrummet_dimma_upp
