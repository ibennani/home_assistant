          Elevation {{ states('sensor.sun_elevation') | string | replace('.', ',') }} grader.
          Azimuth {{ states("sensor.sun_azimuth") | string | replace('.', ',') }} grader.
        data:
          ttl: 0
          priority: high     
          scriptet: Husläge till dag   


