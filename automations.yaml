# Dimma upp fasadbelysningen när någon ringer på dörren
# samt dimma ner när ytterdörren stängts
# Fungerar bara om lamporna redan är tända och det är hyfsat mörkt ute
- alias: "Belysning: Hantera fasadbelysning vid dörrhändelser"
  id: '791834867498409650165'
  mode: restart
  trigger:
    - trigger: state
      entity_id: event.front_door_ding
      id: "ring_pa_dorren"

    - trigger: state
      entity_id: binary_sensor.ytterdorren
      from: "on"
      to: "off"
      id: "dorren_stängs"

  condition:
    - condition: template
      value_template: >
        {{ is_state('light.fasadbelysningen', 'on') 
        and states('sensor.utomhus_framsidan_ljusstyrka') | int < 100 }}

  action:
    - choose:
    # När någon ringer på dörren, dimmma fasadbelysningen till max
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'ring_pa_dorren' }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fasadbelysningen
              data:
                brightness: 255
                transition: 1

    # När dörren sedan stängs så dimmas fasadbelysningen ner igen
        - conditions:
            - condition: template
              value_template: >
                {{ trigger.id == 'dorren_stängs'
                  and state_attr('light.fasadbelysningen', 'brightness') == 255 }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.fasadbelysningen
              data:
                transition: 1
                brightness: 12



# Styr lamporna i hallen
- alias: "Belysning: Styr lamporna i hallen"
  id: '7918019809348674'
  mode: restart
  trigger:
    - trigger: state
      entity_id: event.front_door_ding
    - trigger: state
      entity_id: binary_sensor.hallen_rorelse
      to: "on"
    - trigger: state
      entity_id: binary_sensor.hallen_rorelse
      to: "off"
      for: "00:00:30"
  action:
    - action: var.set
      data_template:
        entity_id: var.hallspottarna_aktuell_ljusstyrka
        value: >
          {% if 
            (trigger.entity_id == 'event.front_door_ding' and
            is_state('binary_sensor.hallen_rorelse', 'off')) or
            (trigger.entity_id == 'binary_sensor.hallen_rorelse' and
            trigger.to_state.state == 'on' and 
            not is_state('event.front_door_ding', 'unavailable')) and 
            (state_attr("light.takspottarna_hallen_level", "brightness") | float(default=0) / 2.55) | round(0, "floor", default=0) < 
            states("input_number.settings_hallen_ljusstyrka_nu") | int(default=0) %}
              {{ state_attr("light.takspottarna_hallen_level", "brightness") }}
          {% else %}
              0
          {% endif %}
    - action: homeassistant.turn_on
      data_template:
        entity_id: light.takspottarna_hallen_level
        brightness_pct: >
          {% if is_state("input_boolean.stadning_pagar", "on") %} 
            100
          {% elif trigger.entity_id == "event.front_door_ding" %} 
            {{ states("input_number.settings_hallen_ljusstyrka_nu") | int(default=0) }}
          {% elif trigger.entity_id == "binary_sensor.hallen_rorelse" and trigger.to_state.state == "on" %} 
            {{ states("input_number.settings_hallen_ljusstyrka_nu") | int(default=0) }}
          {% elif trigger.entity_id == "binary_sensor.hallen_rorelse" and trigger.to_state.state == "off" %} 
            {% if is_state("input_select.house_time_modes", "Natt") %} 
              0
            {% elif is_state("zone.home", "0") %} 
              0
            {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) < 50 %} 
              0            
            {% else %} 
              5
            {% endif %}
          {% else %} 
            {{ states("input_number.settings_hallen_ljusstyrka_nu") | int(default=0) }}
          {% endif %}
        transition: >
          {% if trigger.entity_id == "event.front_door_ding" or 
                (trigger.entity_id == "binary_sensor.hallen_rorelse" and 
                  trigger.to_state.state == "on") %} 
            0
          {% else %} 
            10
          {% endif %}





