# Lås utterdörren automatiskt vid vissa tider och vissa förutsättningar
- alias: "Ytterdörren: Lås ytterdörren automatiskt"
  id: "qqqkmdg5egö530ödlgvjefg0"
  mode: restart
  triggers:
    # Lås alltid om ingen är hemma eller om bara en person är hemma
    - trigger: template 
      value_template: >
        {{ is_state("binary_sensor.ytterdorren","off") 
          and states("zone.home") in ["0","1"] }}
    # Lås alltid på nätterna
    - trigger: template 
      value_template: >
        {{ is_state("binary_sensor.ytterdorren","off") 
          and is_state("input_select.house_time_modes","Natt") }}
    # Lås alltid när det är mörkt ute (dvs när ljuset är under 300 lux)
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.ytterdorren","off") 
          and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 300 }}
    # Lås när vi inte är lediga
    - trigger: template
      value_template: >
        {{ is_state("binary_sensor.ytterdorren","off") 
          and is_state("input_boolean.vacation_mode","off") 
          and 
              (( now().strftime('%u') | int in [1,2,3,4,5] 
              and ( now().strftime('%R') < "16:00" or now().strftime('%R') >= "21:00") )
            or 
              ( now().strftime('%u') | int in [6,7] 
              and (now().strftime('%R') < "09:00" or now().strftime('%R') >= "21:00") )) }}
  action:
    - action: script.turn_on
      target:
        entity_id: script.las_ytterdorren
