  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: "HEMMET {{ now().strftime('%R') }}: \nRörelse på balkongen\n"
      data:
        ttl: 0
        priority: high
- id: sdfsksdgsd5616sd6s068sg
  alias: 'Belysning: Styr belysningen i badrummet'
  triggers:
  - trigger: state
    id: tand
    entity_id: binary_sensor.badrummet_rorelse
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: badrumsdorr_stangd
    entity_id: binary_sensor.badrumsdorren
    to: 'off'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: slack
    entity_id: binary_sensor.badrummet_rorelse
    to: 'off'
    for: 00:02:30
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: duschdorr_oppnad
    entity_id: binary_sensor.duschdorren
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: duschdorr_stangd
    entity_id: binary_sensor.duschdorren
    to: 'off'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: badrumsdorr_oppnad
    entity_id: binary_sensor.badrumsdorren
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: dusch_bekraftad
    entity_id: input_select.nagon_duschar
    to: Någon duschar
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: duschstatus_ingen
    entity_id: input_select.nagon_duschar
    to: Ingen duschar
    not_from:
    - unavailable
    - unknown
  - trigger: homeassistant
    id: ha_start
    event: start
  - trigger: state
    id: stadning
    entity_id: input_boolean.stadning_pagar
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.stadning_pagar
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.badrummet_alla_lampor
        data:
          brightness_pct: 100
          transition: 0
      - stop: Städning aktiv
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''tand'', ''badrumsdorr_stangd'', ''badrumsdorr_oppnad'']
          }}'
      - condition: template
        value_template: "{%- set now_ts = as_timestamp(now()) -%} {%- set door = states.binary_sensor.badrumsdorren
          -%} {%- set main_lights_off = (\n  is_state('light.takspottar_badrummet', 'off')\n  and is_state('light.led_badrummet_handfatet', 'off')\n  and is_state('light.led_badrummet_kommoden', 'off')\n  and is_state('light.spegeln_badrummet', 'off')\n) -%}\n{%- if trigger.id in ['badrumsdorr_stangd', 'badrumsdorr_oppnad'] -%}\n{{\n  is_state('binary_sensor.badrummet_rorelse', 'on')\n  and main_lights_off\n  and not is_state('timer.badrum_slackning_pagar', 'active')\n}}\n{%- else -%}\n{{\n  is_state('timer.badrum_slackning_pagar', 'active')\n  or (\n    is_state('binary_sensor.badrummet_rorelse', 'on')\n    and main_lights_off\n    and (\n      is_state('binary_sensor.badrumsdorren', 'on')\n      or (\n        is_state('binary_sensor.badrumsdorren', 'off')\n        and (now_ts - as_timestamp(door.last_changed)) < 10\n        and (now_ts - as_timestamp(states.binary_sensor.badrummet_rorelse.last_changed)) < 1\n      )\n    )\n  )\n}}\n{%- endif -%}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''timer.badrum_slackning_pagar'', ''active'') }}'
          sequence:
          - action: timer.cancel
            target:
              entity_id: timer.badrum_slackning_pagar
        default:
        - variables:
            is_night: '{{ is_state(''input_select.house_time_modes'', ''Natt'') }}'
            lux: "{{ states('sensor.utomhus_framsidan_ljusstyrka') | int(0) }}"
            is_cleaning: '{{ is_state(''input_boolean.stadning_pagar'', ''on'') }}'
            day_brightness: "{% if is_cleaning %}100{% elif lux < 300 %}30{% elif lux <= 2000 %}35{% elif lux <= 13000 %}40{% else %}99{% endif %}"
        - choose:
          - conditions:
            - condition: template
              value_template: '{{ is_night }}'
            sequence:
            - action: light.turn_on
              target:
                entity_id:
                - light.led_strip_i_duschen
                - light.led_badrummet_handfatet
                - light.led_badrummet_kommoden
              data:
                brightness_pct: 1
                transition: 0
          default:
          - action: light.turn_on
            target:
              entity_id:
              - light.takspottar_badrummet
              - light.led_badrummet_handfatet
              - light.led_badrummet_kommoden
            data:
              brightness_pct: '{{ day_brightness }}'
              transition: 0
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''slack'' }}'
      - condition: template
        value_template: >-
          {% set lights = [
            'light.takspottar_badrummet',
            'light.led_badrummet_handfatet',
            'light.led_badrummet_kommoden',
            'light.takspott_duschen',
            'light.led_strip_i_duschen'
          ] %}
          {% set ns = namespace(n=0) %}
          {% for l in lights %}
            {% if is_state(l, 'on') and (state_attr(l, 'brightness') | int(0)) >= 254 %}
              {% set ns.n = ns.n + 1 %}
            {% endif %}
          {% endfor %}
          {{ is_state('input_boolean.stadning_pagar', 'off')
             and not is_state('timer.badrum_slackning_pagar', 'active')
             and is_state('binary_sensor.badrumsdorren', 'on')
             and ns.n < 2 }}
      sequence:
      - action: timer.start
        target:
          entity_id: timer.badrum_slackning_pagar
        data:
          duration: 00:00:15
      - action: light.turn_off
        target:
          entity_id:
          - light.takspottar_badrummet
          - light.led_badrummet_handfatet
          - light.led_badrummet_kommoden
          - light.led_strip_i_duschen
          - light.takspott_duschen
          - light.spegeln_badrummet
        data:
          transition: 10
      - action: input_select.select_option
        target:
          entity_id: input_select.badrummet_vem
        data:
          option: Någon
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''badrumsdorr_oppnad'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''timer.badrum_slackning_pagar'', ''active'') }}'
          sequence:
          - action: timer.cancel
            target:
              entity_id: timer.badrum_slackning_pagar
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschdorr_oppnad'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''timer.badrum_slackning_pagar'', ''active'') }}'
          sequence:
          - action: timer.cancel
            target:
              entity_id: timer.badrum_slackning_pagar
      - choose:
        - conditions:
          - condition: template
            value_template: "{{
  is_state('input_select.nagon_duschar', 'Ingen duschar')
  and not is_state('input_select.house_time_modes', 'Natt')
  and is_state('light.takspott_duschen', 'off')
  and is_state('light.led_strip_i_duschen', 'off')
}}"
          sequence:
          - action: script.badrum_besok_eller_default
            data:
              endast_dusch_ljus: true
              transition: 0
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''dusch_bekraftad'' }}'
      - condition: template
        value_template: '{{ is_state(''input_boolean.badrum_dusch_snapshot_finns'', ''off'') }}'
      sequence:
      - variables:
          person_key: >-
            {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
            {{ m.get(states('input_select.badrummet_vem'), 'invalid') }}
          profil_session: "{{ person_key != 'invalid' }}"
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ profil_session }}'
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.badrum_dusch_profil_session
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.badrum_dusch_snapshot_finns
          - choose:
            - conditions:
              - condition: state
                entity_id: binary_sensor.duschdorren
                state: 'off'
              sequence:
              - action: script.badrum_dusch_eller_default
                data:
                  transition: 5
        default:
        - action: scene.create
          data:
            scene_id: badrum_fore_duschslackning
            snapshot_entities:
            - light.takspottar_badrummet
            - light.spegeln_badrummet
            - light.led_badrummet_handfatet
            - light.led_badrummet_kommoden
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.badrum_dusch_snapshot_finns
        - choose:
          - conditions:
            - condition: state
              entity_id: binary_sensor.duschdorren
              state: 'off'
            sequence:
            - action: script.badrum_default_dusch
              data:
                transition: 5
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschstatus_ingen'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''timer.badrum_slackning_pagar'', ''active'') }}'
          sequence:
          - action: timer.cancel
            target:
              entity_id: timer.badrum_slackning_pagar
      - choose:
        - conditions:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.badrum_dusch_snapshot_finns', 'on')
              and is_state('input_boolean.badrum_dusch_profil_session', 'off') }}
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.badrum_fore_duschslackning
            data:
              transition: 0
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.duschslackning_aktiv
          - input_boolean.badrum_dusch_snapshot_finns
          - input_boolean.badrum_dusch_ljus_last
          - input_boolean.badrum_dusch_profil_session
      - action: timer.cancel
        target:
          entity_id: timer.badrum_dusch_120s
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''ha_start'' }}'
      - condition: template
        value_template: "{{ is_state('input_select.nagon_duschar', 'Någon duschar') or is_state('input_boolean.badrum_dusch_snapshot_finns', 'on') }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''input_select.nagon_duschar'', ''Någon duschar'') and is_state(''input_boolean.duschslackning_aktiv'', ''on'') and is_state(''input_boolean.badrum_dusch_profil_session'', ''off'') }}'
          - condition: state
            entity_id: binary_sensor.duschdorren
            state: 'off'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.spegeln_badrummet
              - light.takspottar_badrummet
              - light.led_badrummet_handfatet
              - light.led_badrummet_kommoden
            data:
              transition: 5
        - conditions:
          - condition: template
            value_template: '{{ is_state(''input_select.nagon_duschar'', ''Någon duschar'') and is_state(''input_boolean.badrum_dusch_profil_session'', ''on'') }}'
          - condition: state
            entity_id: binary_sensor.duschdorren
            state: 'off'
          sequence:
          - action: script.badrum_dusch_eller_default
            data:
              transition: 5
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.duschslackning_aktiv
        - conditions:
          - condition: template
            value_template: >-
              {{ is_state('input_boolean.badrum_dusch_snapshot_finns', 'on')
              and is_state('input_select.nagon_duschar', 'Ingen duschar')
              and is_state('input_boolean.badrum_dusch_profil_session', 'off') }}
          sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.badrum_fore_duschslackning
            data:
              transition: 0
          - action: input_boolean.turn_off
            target:
              entity_id:
              - input_boolean.duschslackning_aktiv
              - input_boolean.badrum_dusch_snapshot_finns
  mode: restart
- id: badrum_dusch_fas3_dorr_cykel
  alias: 'Belysning: Duschsession dörrcykel (fas 3)'
  description: 'Under bekräftad duschsession. Öppen duschdörr → besök/default. Stängd
    → 60 s → släck utanför duschen om ingen närvaro-minne och inget klivit-ur-mönster.
    Närvaro-minne (3 min) och klivit-ur (öppen ≥12 s med rörelse, eller ≥25 s) skyddar
    efter avslutad dusch med stängd badrumsdörr.

    '
  triggers:
  - trigger: state
    id: duschdorr_oppnad
    entity_id: binary_sensor.duschdorren
    to: 'on'
    not_from:
    - unavailable
    - unknown
  - trigger: state
    id: duschdorr_stangd
    entity_id: binary_sensor.duschdorren
    to: 'off'
    not_from:
    - unavailable
    - unknown
  conditions:
  - condition: template
    value_template: "{{ is_state('input_select.nagon_duschar', 'Någon duschar') and is_state('input_boolean.badrum_dusch_snapshot_finns', 'on') }}"
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschdorr_oppnad'' }}'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id:
          - input_boolean.badrum_dusch_ljus_last
          - input_boolean.badrum_klivit_ur_dusch
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ is_state('input_boolean.badrum_dusch_profil_session', 'on') }}"
          sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.duschslackning_aktiv
          - action: script.badrum_besok_eller_default
            data:
              transition: 0
        default:
        - action: scene.turn_on
          target:
            entity_id: scene.badrum_fore_duschslackning
          data:
            transition: 0
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.duschslackning_aktiv
        - choose:
          - conditions:
            - condition: template
              value_template: "{{
  not is_state('input_select.house_time_modes', 'Natt')
  and is_state('light.takspott_duschen', 'off')
  and is_state('light.led_strip_i_duschen', 'off')
}}"
            sequence:
            - action: script.badrum_besok_eller_default
              data:
                endast_dusch_ljus: true
                transition: 0
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''duschdorr_stangd'' }}'
      - condition: state
        entity_id: input_boolean.badrum_dusch_ljus_last
        state: 'off'
      sequence:
      - variables:
          oppning_sek: >-
            {% set raw = states('input_datetime.duschdorr_oppnad_ts') %}
            {% set open_ts = as_timestamp(raw) if raw not in ['unknown','unavailable','none','None',''] else 0 %}
            {% if open_ts > 0 %}{{ (as_timestamp(now()) - open_ts) | int }}{% else %}0{% endif %}
          rorelse_efter_oppning: >-
            {% set raw = states('input_datetime.duschdorr_oppnad_ts') %}
            {% set open_ts = as_timestamp(raw) if raw not in ['unknown','unavailable','none','None',''] else 0 %}
            {% if open_ts > 0 %}
              {{ as_timestamp(states.binary_sensor.badrummet_rorelse.last_changed) >= open_ts }}
            {% else %}false{% endif %}
      - choose:
        - conditions:
          - condition: template
            value_template: >-
              {{ (oppning_sek | int >= 12 and rorelse_efter_oppning | bool)
                 or oppning_sek | int >= 25 }}
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.badrum_klivit_ur_dusch
        default:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.badrum_klivit_ur_dusch
      - delay: '00:01:00'
      - condition: state
        entity_id: input_select.nagon_duschar
        state: Någon duschar
      - condition: state
        entity_id: input_boolean.badrum_dusch_snapshot_finns
        state: 'on'
      - condition: state
        entity_id: binary_sensor.duschdorren
        state: 'off'
      - condition: state
        entity_id: input_boolean.badrum_dusch_ljus_last
        state: 'off'
      - choose:
        - conditions:
          - condition: or
            conditions:
            - condition: state
              entity_id: binary_sensor.badrummet_rorelse
              state: 'on'
            - condition: state
              entity_id: binary_sensor.badrum_narvaro_minne
              state: 'on'
            - condition: state
              entity_id: input_boolean.badrum_klivit_ur_dusch
              state: 'on'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: "{{ is_state('input_boolean.badrum_dusch_profil_session', 'on') }}"
              sequence:
              - action: script.badrum_besok_eller_default
                data:
                  transition: 0
            default:
            - action: scene.turn_on
              target:
                entity_id: scene.badrum_fore_duschslackning
              data:
                transition: 0
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.duschslackning_aktiv
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.badrum_dusch_ljus_last
        default:
        - choose:
          - conditions:
            - condition: template
              value_template: "{{ is_state('input_boolean.badrum_dusch_profil_session', 'on') }}"
            sequence:
            - action: script.badrum_dusch_eller_default
              data:
                transition: 5
            - action: input_boolean.turn_on
              target:
                entity_id: input_boolean.duschslackning_aktiv
          default:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.duschslackning_aktiv
          - action: light.turn_off
            target:
              entity_id:
              - light.spegeln_badrummet
              - light.takspottar_badrummet
              - light.led_badrummet_handfatet
              - light.led_badrummet_kommoden
            data:
              transition: 5
  mode: restart
- id: badrum_dusch_fas3_rorelse
  alias: 'Belysning: Duschsession rörelse utanför dusch (fas 3)'
  description: 'Under bekräftad duschsession: rörelse när duschsläckning är aktiv → besök/default
    eller snapshot. Separat från dörrcykeln så 60 s-fördröjning inte avbryts.

    '
  triggers:
  - trigger: state
    entity_id: binary_sensor.badrummet_rorelse
    to: 'on'
