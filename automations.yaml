# Detta sker när någon kommer hem
- alias: "HA: Någon kommer hem"
  id: '79183401080608674'
  triggers: 
    - trigger: template
      value_template: >
        {{  states("zone.home") | int(default = 0) > 0
        and is_state("input_boolean.stadning_pagar","off") }}
  action:
    - action: input_select.select_option      
      target: 
        entity_id: input_select.koket_belysning
      data:
        option: >
          {% if states("input_select.koket_belysning") in ["Mysigt","Släckt"]
            and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 2000 %} Mysigt
          {% else %} {{ states("input_select.koket_belysning") }}
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.hallen_stall_in_belysningen
    - action: > 
        {% if is_state("input_select.house_time_modes","Morgon") %} script.morgonbelysning
        {% elif is_state("input_select.house_time_modes","Dag") %} 
          {% if   states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 
              and (states("zone.home") | int(default = 0) > 0  or is_state("input_boolean.gaster_hemma","on") )
              and states("var.morgoninfo_koket_redan_upplast") %} script.kvallsbelysning
          {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 
              and is_state("input_boolean.julbelysning","on") 
              and (states("zone.home") | int(default = 0) > 0  or is_state("input_boolean.gaster_hemma","on") )%} script.kvallsbelysning
          {% else %} script.dagsbelysning
          {% endif %}
        {% elif is_state("input_select.house_time_modes","Kväll") %} script.kvallsbelysning
        {% elif is_state("input_select.house_time_modes","Natt") %} script.nattbelysning
        {% else %} script.do_nothing
        {% endif %}
    - action: >
        {% if states("media_player.playstation_4") in ["standby","unavailable"] %} media_player.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id: 
        - media_player.appletv
        - media_player.playstation_4


### Styr mediacentret i vardagsrummet (TV, PS4, AppleTV, Chromecast audio, Chromecast i Sony-TV och receivern) ###
- alias: "Media: Styr mediacentret i vardagsrummet (TV, PS4, AppleTV, Chromecast audio, Chromecast i Sony-TV och receivern)"
  id: '79183401610860586sdfsagdgr4574'
  triggers:
    - trigger: template # Stäng av allt när inget används
      value_template: >
        {{  states("media_player.appletv") in ["standby","off","unavailable","unknown"]
        and states("media_player.playstation_4") in ["standby","off","unavailable","unknown"]
        and states("media_player.pucken_bakom_stereon_i_vardagsrummet") in ["off","unavailable","unknown"]
        and states("media_player.kd_65xd8505") in ["off","unavailable","unknown"]  }}
      for: "00:00:03"
    # AppleTV är avstängt
    - trigger: template
      value_template: >
        {{ not states("media_player.appletv") in ["standby","off","unavailable","unknown"] }}
      for: "00:00:03"
    # PS4 är avstänt
    - trigger: template
      value_template: >
        {{ not states("media_player.playstation_4") in ["standby","off","unavailable","unknown","idle"] }}
      for: "00:00:03"
    # Pucken bakom stereon i vardagsrummet är avstängd
    - trigger: template
      value_template: >
        {{ not states("media_player.pucken_bakom_stereon_i_vardagsrummet") in ["off","unavailable"] }}
      for: "00:00:03"
    # TV:n i vardagsrummet är avstängd
    - trigger: template
      value_template: >
        {{ not states("media_player.kd_65xd8505") in ["off","unavailable"] }}
      for: "00:00:03"
    # Ljust ute
    - trigger: template
      value_template: >
        {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} true {% else %} false {% endif %}
      for: "00:00:03"
    # Mörkt ute
    - trigger: template
      value_template: >
        {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 %} true {% else %} false {% endif %}
      for: "00:00:03"
  action:
    - choose:
        - conditions:
            - condition: template # Alla devices är avstängda
              value_template: >
                {{  states("media_player.appletv") in ["standby","off","unavailable","unknown"]
                and states("media_player.playstation_4") in ["standby","off","unavailable","unknown"]
                and states("media_player.pucken_bakom_stereon_i_vardagsrummet") in ["off","unavailable","unknown"]
                and states("media_player.kd_65xd8505") in ["off","unavailable","unknown"]  }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.vardagsrummet_belysning
              data:
                option: >
                  {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} Tänt
                  {% elif is_state("input_boolean.julbelysning","on") %} Tänt
                  {% else %} Släckt
                  {% endif %}
            - action: media_player.turn_off
              target:              
                entity_id: 
                  - remote.sony_tv_i_vardagsrummet
                  - media_player.sony_tv_i_vardagsrummet
                  - media_player.denon_avr_x2800h
        - conditions:
            - condition: template # Apple TV har startats
              value_template: >
                {{ not states("media_player.appletv") in ["standby","off","unavailable","unknown"] }}
          sequence:
            - action: input_select.select_option
              target:
                entity_id: input_select.vardagsrummet_belysning
              data:
                option: >
                  {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000  %} TV
                  {% elif is_state("input_boolean.julbelysning","on") %} TV
                  {% else %} Släckt
                  {% endif %}
            - action: media_player.turn_on
              target:
                entity_id: 
                  - remote.appletv
                  - remote.sony_tv_i_vardagsrummet
                  - media_player.sony_tv_i_vardagsrummet
            - wait_template: >
                {{ not states("media_player.sony_tv_i_vardagsrummet") in ["standby","off","unavailable","unknown"]}}
              timeout: "00:00:30"
              continue_on_timeout: false
            - action: media_player.select_source
              data:
                entity_id: media_player.denon_avr_x2800h
                source: "AppleTV"
            - action: media_player.turn_on
              target:
                entity_id: media_player.sony_tv_i_vardagsrummet
