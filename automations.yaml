# Kör ett script som styr belysningen i Isabelles rum. 
# Triggas av input_boolean som styrs av andra händelser
- alias: "Belysning: Kör script som styr belysningen i Isabelles rum"
  id: "fsaldsjss050980sf08sdgs5g98dfgssdd3333sdf98e"
  mode: restart
  triggers:
    trigger: state
    entity_id:
      - input_select.isabelles_rum_belysning
  action:
    - action: script.turn_on
      target:
        entity_id: script.isabelles_rum_stall_in_belysningen
    # Styr även ljusslingan på balkongen när man styr belysningen i Isabelles rum
    - action: >
        {% set current_week = now().strftime('%W') | int %}
        {% set current_weekday = now().strftime('%u') | int %}
        {% set current_time = now().strftime('%H') | int %}

        {% if states("input_select.isabelles_rum_belysning") in ["Lamporna i fönstret","Sängen","Myslampan","Släckt"] %} light.turn_off
        {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 1000
          and not is_state("input_select.house_time_modes","Natt") 
          and ((current_week == 46 and current_weekday == 5 and current_time >= 12) or
              (current_week == 46 and current_weekday > 5) or
              (current_week > 46 or current_week < 10) or
              (current_week == 10 and current_weekday < 7)) %} light.turn_on
        {% else %} light.turn_off
        {% endif %}
      entity_id: light.ljusslingan_pa_balkongen


