# Tänd / släck strålkastaren om något rör sig på framsidan
# Ring-rörelsen rapporteras som event (event.front_door_motion), inte on/off.
# Släckning kräver 3 min utan rörelse och att båda dörrarna är stängda.
- alias: "Belysning: Tänd och Släck strålkastaren vid rörelse på framsidan"
  id: '7918151123333574'
  mode: single
  triggers:
    - trigger: state
      entity_id: event.front_door_motion
      id: rorelse
    - trigger: time_pattern
      minutes: "/1"
      id: kontroll
    - trigger: state
      entity_id:
        - binary_sensor.ytterdorren
        - binary_sensor.altandorr_koket
      to: "off"
      id: dorr_stangs
  actions:
    - choose:
        - conditions:
            - condition: trigger
              id: rorelse
            - condition: state
              entity_id: input_select.house_alarm_modes
              state:
                - Nattlarm
                - Huset är larmat
            - condition: numeric_state
              entity_id: sensor.utomhus_framsidan_ljusstyrka
              below: 300
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.stralkastaren
        - conditions:
            - condition: trigger
              id:
                - kontroll
                - dorr_stangs
            - condition: state
              entity_id: light.stralkastaren
              state: "on"
            - condition: state
              entity_id: binary_sensor.ytterdorren
              state: "off"
            - condition: state
              entity_id: binary_sensor.altandorr_koket
              state: "off"
            - condition: template
              value_template: >
                {{ (now() - states.event.front_door_motion.last_changed).total_seconds() > 180 }}
          sequence:
            - action: light.turn_off
              target:
                entity_id: light.stralkastaren


# Vattenslang på framsidan vid rörelse nattetid när huset är larmat
- alias: "Bevattning: Vattenslang vid rörelse på framsidan nattetid"
  id: '7918151123333575'
  mode: single
  triggers:
    - trigger: state
      entity_id: event.front_door_motion
  conditions:
    - condition: state
      entity_id: input_select.house_time_modes
      state: Natt
    - condition: state
      entity_id: input_select.house_alarm_modes
      state:
        - Nattlarm
        - Huset är larmat
    - condition: state
      entity_id: switch.vattenslang_framsidan
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.vattenslang_framsidan
    - delay: "00:00:10"
    - action: switch.turn_off
      target:
        entity_id: switch.vattenslang_framsidan


# Tänd / släck lampan på baksidan vid rörelse på baksidan
# Arloo-kamerans rörelsesensor är i state "on" så länge rörelse registeras
# och blir "off" så fort kameran slutar spela in.
- alias: "Belysning: Tänd och släck lampan på baksidan vid rörelse på baksidan"
  id: '7918344'
  mode: restart
  triggers:
    - trigger: template
      value_template: > 
        {% set wc_fonster = states.binary_sensor.baksidan_rorelse_wc_fonster %}
        {% set ljusstyrka = states.sensor.utomhus_baksidan_ljusstyrka.state | int %}
        {% set alarm_mode = states('input_select.house_alarm_modes') %}
        {{ (wc_fonster.state == "on" 
            and ljusstyrka < 100 
            and alarm_mode in ["Nattlarm", "Huset är larmat"])
          or (wc_fonster.state == "off" 
            and (now() - wc_fonster.last_changed).total_seconds() > 180) }}
  action:
    - action: >
        {% if is_state("binary_sensor.baksidan_rorelse_wc_fonster","on") %} light.turn_on
        {% else %} light.turn_off
        {% endif %}
      entity_id: light.lampan_baksidan      
      data:
        brightness_pct: >
          {% if is_state("binary_sensor.baksidan_rorelse_wc_fonster","on") %} 100
          {% else %} 0
          {% endif %}





# Låt belysningen i övre WC och i badrummet blinka till lite när något rör sig på framsidan
# Tänd om det är släckt och dimma ner om det är tänt.
- alias: "Belysning: Blinka i WC och badrummet vid rörelse på framsidan"
  id: '8348674'
  mode: queued
  triggers:
    - trigger: state
      entity_id: event.front_door_motion
  actions:
    - action: var.set
      data:
        entity_id: var.current_brightness_level_badrummet
        value: "{{ state_attr('light.vagglampor_badrummet', 'brightness') if is_state('light.vagglampor_badrummet', 'on') else 0 }}"
    - action: var.set
      data:
        entity_id: var.current_brightness_level_wc
        value: "{{ state_attr('light.taklampa_wc', 'brightness') if is_state('light.taklampa_wc', 'on') else 0 }}"
    - action: light.turn_on
      entity_id: light.vagglampor_badrummet
      data:
        brightness: >
          {% set level = states("var.current_brightness_level_badrummet") | int(default = 0) %}
          {% if level > 125 %} 0
          {% elif level <= 125 and is_state("input_select.house_time_modes", "Natt") %} 150
          {% else %} 240
          {% endif %}
    - action: light.turn_on
      entity_id: light.taklampa_wc
      data:
        brightness: >
          {% set level = states("var.current_brightness_level_wc") | int(default = 0) %}
          {% if level > 125 %} 0
          {% elif level <= 125 and is_state("input_select.house_time_modes", "Natt") %} 150
          {% else %} 240
          {% endif %}
    - delay: "00:00:01"
    - action: light.turn_on
      entity_id: light.vagglampor_badrummet
      data:
        brightness: "{{ states('var.current_brightness_level_badrummet') | int(default=0) }}"
    - action: light.turn_on
      entity_id: light.taklampa_wc
      data:
        brightness: "{{ states('var.current_brightness_level_wc') | int(default=0) }}"
    - delay: "00:00:01"
    - action: light.turn_on
      entity_id: light.vagglampor_badrummet
      data:
        brightness: "{{ states('var.current_brightness_level_badrummet') | int(default=0) }}"
    - action: light.turn_on
      entity_id: light.taklampa_wc
      data:
        brightness: "{{ states('var.current_brightness_level_wc') | int(default=0) }}"
    - delay: "00:00:01"
    - action: light.turn_on
      entity_id: light.vagglampor_badrummet
      data:
        brightness: "{{ states('var.current_brightness_level_badrummet') | int(default=0) }}"
    - action: light.turn_on
      entity_id: light.taklampa_wc
      data:
        brightness: "{{ states('var.current_brightness_level_wc') | int(default=0) }}"



# Blinka mysbelysningen i Albins rum när det ringer på dörren och Erik är hemma.
