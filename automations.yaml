        \ {% endif %}\n{% else %}\n  0\n{% endif %}\n"
      transition: "{% set städning = is_state('input_boolean.stadning_pagar', 'on')
        %} {% set tid = states('input_select.house_time_modes') %} {% set utelux =
        states('sensor.utomhus_framsidan_ljusstyrka') | int(default=0) %} {% set ytterdorren
        = is_state('binary_sensor.ytterdorren', 'on') %} {% set trigger_entity = trigger.entity_id
        %} {% set trigger_state = trigger.to_state.state if trigger.entity_id == \"binary_sensor.hallen_rorelse\"
        else \"\" %} {% set ingen_hemma = is_state('zone.home', '0') %} {% if städning
        %}\n  0\n{% elif ingen_hemma %}\n  1\n{% elif tid == \"Dag\" and utelux >=
