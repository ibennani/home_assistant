    - sensor.smart_energy_plug_in_switch_electric_consumption_w_2  # Brudkistan
    - sensor.smart_energy_plug_in_switch_electric_consumption_w_5  # Eriks myslampa

    # Funktionsbelysning
    - sensor.rgbw_controller_2_electric_consumption_w_3  # WC spegelskåp och handfat
    - sensor.dimmer_2_power_5                            # Spegeln i badrummet

    # Utomhus
    - sensor.dimmer_2_power_8   # Utomhus framsidan 2
    - sensor.dimmer_2_power_9   # Utomhus framsidan 1
    - sensor.dimmer_2_power_10  # Strålkastaren
