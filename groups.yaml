    - sensor.dimmer_2_power_16  # Taklampan i Ilias rum
    - sensor.dimmer_2_power_11  # Taklampan i vardagsrummet
    - sensor.dimmer_2_power_2   # Taklampan i övre trappan
    - sensor.dimmer_2_power_21  # Taklampan i sovrummet
    - sensor.wc_taklampa_power_24  # Taklampa WC
    - sensor.dimmer_2_power_13  # Taklampan i Annas rum
    - sensor.dimmer_2_power_19  # Takspottarna i kökstaket
    - sensor.dimmer_2_power_20  # Takspottarna vid trappan
    - sensor.dimmer_2_power_12  # Takspottarna vid köksluckorna
    - sensor.dimmer_2_power     # Bakom spisen
    - sensor.dimmer_2_power_6   # Lamporna i köksfönstret
    - sensor.dimmer_2_power_22  # Arbetsbänken i köket
    - sensor.dimmer_2_power_4   # Takspottarna i skafferiet
    - sensor.dimmer_2_power_18  # Takspottarna i hallen
    - sensor.dimmer_2_power_3   # Taklampan i nedre trappan
    - sensor.dimmer_2_power_14  # Taklampan ovanför Eriks fönster
    - sensor.dimmer_2_power_15  # Taklampan ovanför Eriks säng
    - sensor.dimmer_2_power_23  # Tvättstugan
    - sensor.takspottar_badrummet_power  # Takspottarna i badrummet
    - sensor.takspott_duschen_power      # Takspotten i duschen
    - sensor.led_badrummet_energi        # LED-belysning i badrummet
    - sensor.takspottarna_i_forradet_power  # Förrådet

    # Mysbelysning
    - sensor.smart_energy_plug_in_switch_electric_consumption_w    # Ilias fönster
    - sensor.smart_energy_plug_in_switch_electric_consumption_w_4  # Ilias myslampa
    - sensor.smart_energy_plug_in_switch_electric_consumption_w_3  # Lamporna ovanför Ilias säng
    - sensor.lampan_balkongdorren_energi                           # Lampan vid balkongdörren
    - sensor.smart_energy_plug_in_switch_electric_consumption_w_6  # Annas fönster
    - sensor.led_ovanfor_lilla_arbetsbanken_electric_consumption_w # LED ovanför lilla arbetsbänken
