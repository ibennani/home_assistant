### Värden som styr rullgardinerna ###
### Dessa värden i kombination avgör när rullgardinerna på framsidan ska åka ner 
### Bägge värdena behövs för att säkra att rullgardinerna åker ner när det blir ljust i övervåningen. 

# azimuth-vinklel för rullgardinerna
  settings_rullgardiner_framsidan_azimuth:
    name: "Azimuth (dra ner)"
    min: 200
    max: 359
    step: 1
    mode: box

# elevation-vinklel för rullgardinerna
  settings_rullgardiner_framsidan_elevation:
    name: "Elevation (dra ner)"
    min: 0
    max: 90
    step: 1
    mode: box


### När ska Eriks rullgardin dras ner resp åka upp

# azimuth-vinklel för när rullgardinen ska dras upp
  settings_rullgardiner_eriks_rum_azimuth_upp:
    name: "Azimuth (dra upp)"
    min: 100
    max: 200
    step: 1
    mode: box

# elevation-vinklel för rullgardinen i Eriks rum ska dras ner
  settings_rullgardiner_eriks_rum_elevation_ner:
    name: "Elevation (dra ner)"
    min: 0
    max: 50
    step: 1
    mode: box


