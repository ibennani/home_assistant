# binary_sensor
#######################################################  

binary_sensor:


# Tre templates som anger om det är soligt. 
# Används bland annat för att styra rullgardiner och viss belysning. 
- platform: template
  sensors:
    soligt:
      friendly_name: "Det är soligt"
      delay_off:
        minutes: 15
      value_template: >-
        {{ states('sensor.utomhus_framsidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int
        or states('sensor.utomhus_baksidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int}}
      icon_template: >-
        {% if states('sensor.utomhus_framsidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int 
            or states('sensor.utomhus_baksidan_ljusstyrka') | int >= states('input_number.settings_ljusstyrka_soligt_ute') | int  %}
          mdi:weather-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}        

- platform: template
  sensors:
    soligt_framsidan:
      friendly_name: "Det är soligt på framsidan"
      delay_off:
        minutes: 15
      value_template: >-
        {{ states('sensor.utomhus_framsidan_ljusstyrka') | int >= 13000 }}
      icon_template: >-
        {% if states('sensor.utomhus_framsidan_ljusstyrka') | int >= 13000 %}
          mdi:weather-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}           

- platform: template
  sensors:
    soligt_baksidan:
      friendly_name: "Det är soligt på baksidan"
      delay_off:
        minutes: 15
      value_template: >-
        {{ states('sensor.utomhus_baksidan_ljusstyrka') | int >= 13000 }}
      icon_template: >-
        {% if states('sensor.utomhus_baksidan_ljusstyrka') | int >= 13000 %}
          mdi:weather-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}           

# Det lyser in solljus genom fönstren (styr rullgardinerna)
- platform: template
  sensors:
    solen_lyser_in_genom_fonstren_pa_framsidan:
      friendly_name: "Solen lyser in genom fönstren på framsidan"
      value_template: >
        {{ is_state("input_select.house_time_modes","Dag")
        and is_state("binary_sensor.soligt_framsidan","on")
        and (states("sensor.sun_azimuth") | float > states("input_number.settings_rullgardiner_framsidan_azimuth") | int
        or states("sensor.sun_elevation") | float < states("input_number.settings_rullgardiner_framsidan_elevation") | int) }}
    solen_lyser_in_genom_fonstren_pa_baksidan:
      friendly_name: "Solen lyser in genom fönstren på baksidan"
      value_template: >
        {{ is_state("input_select.house_time_modes","Dag") 
        and is_state("binary_sensor.soligt_baksidan","on")
        and states("sensor.sun_azimuth") | int < states("input_number.settings_rullgardiner_eriks_rum_azimuth_upp") | int
        and states("sensor.sun_elevation") | int > states("input_number.settings_rullgardiner_eriks_rum_elevation_ner") | int }}
    ljust_pa_framsidan_dagtid_pa_vintern:
      friendly_name: "Det är ljust på framsidan dagtid (vinter och snö)"
      value_template: >
        {{ is_state("input_select.house_time_modes","Dag") 
            and states("sensor.netatmo_bennani_vs_utomhus_temperature") | int < -1 
            and states("sensor.utomhus_framsidan_ljusstyrka") | int > 8000 }}


# Brevlådans lucka
- platform: template
  sensors: 
    brevladans_lucka:
      friendly_name: "Brevlådans lucka"
      value_template: >
        {{ is_state("sensor.brevladans_lucka","22") }}


# # Finns det någon sammhällsinformatin att rapportera
# - platform: template
#   sensors:
#     krisinformation_finns:
#       friendly_name: "Krisinformation finns"
#       value_template: >
#         {{ is_state('sensor.krisinformation_stockholm', 'News') or is_state('sensor.krisinformation_sverige', 'News') }}


# En sensor som anger om vi har julpynt uppe (fredag före 1:a advent - söndag på eller efter trettondagen nästa år)
- platform: template
  sensors: 
    julbelysning:
      friendly_name: julbelysning
      value_template: >
        {% set year = now().year %}
        {% set christmas_day = strptime(year ~ '-12-25', '%Y-%m-%d') %}
        {% set first_advent = christmas_day - timedelta(days=(christmas_day.weekday() + 22)) %}
        {% set friday_before_first_advent = first_advent - timedelta(days=2) %}
        {% set next_year = now().year + 1 %}
        {% set jan_6 = strptime(next_year ~ '-01-06', '%Y-%m-%d') %}
        {% set end_date = jan_6 if jan_6.weekday() == 6 else (jan_6 + timedelta(days=(6 - jan_6.weekday()))) %}
        
        {{ now().replace(tzinfo=None) >= friday_before_first_advent and now().replace(tzinfo=None) <= end_date }}
    

- platform: template
  sensors:
    tvattmaskinen_aktiv:
      friendly_name: "Tvättmaskinen är aktiv"
      device_class: running
      value_template: >
        {% set power = states('sensor.tvattmaskinen_switch_power') | float %}
        {% if power >= 600 %}
          true
        {% elif power <= 5 %}
          false
        {% else %}
          states('binary_sensor.tvattmaskinen_aktiv') == 'on'
        {% endif %}
      delay_on: "00:03:00"
      delay_off: "00:02:00"

