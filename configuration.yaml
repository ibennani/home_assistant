#######################################################
# Home Assistant grundconfiguration
#######################################################

homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: 59.237731498047985
  longitude: 18.087033927440647
  #radius: 45
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 61
  # metric for Metric, imperial for Imperial
  unit_system: metric
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: Europe/Stockholm  
  currency: SEK
  external_url: "https://85gdgmd5j5v1zlxo4dmkybhmvol6ozqk.ui.nabu.casa/"
  internal_url: "http://192.168.0.222:8123"
# Ska användas för att ange var man kan skriva till filer, dvs var dessa filer hamnar. 
  allowlist_external_dirs:
    - '/'
    - '/config/'
    - '/config/www/'



