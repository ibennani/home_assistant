# Hur ljust är det ute? Det kan vara soligt, ljust, mörkt eller nattljus
  - platform: template
    sensors:
      ljust_utomhus_framsidan:
        friendly_name: "Hur ljust är det på framsidan?"
        value_template: >
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_soligt_ute") | int %} soligt
          {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_soligt_ute") | int 
            and states("sensor.utomhus_framsidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_ljust_ute") | int %} ljust
          {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_ljust_ute") | int 
            and states("sensor.utomhus_framsidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_morkt_ute") | int %} {{ states("sensor.ljust_utomhus_framsidan") }}
          {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_morkt_ute") | int
            and states("sensor.utomhus_framsidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_nattljus_ute") | int %} mörkt
          {% else %} nattljus
          {% endif %} 
      ljust_utomhus_baksidan:
        friendly_name: "Hur ljust är det på baksidan?"
        value_template: >
          {% if states("sensor.utomhus_baksidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_soligt_ute") | int %} soligt
          {% elif states("sensor.utomhus_baksidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_soligt_ute") | int 
            and states("sensor.utomhus_baksidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_ljust_ute") | int %} ljust
          {% elif states("sensor.utomhus_baksidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_ljust_ute") | int 
            and states("sensor.utomhus_baksidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_morkt_ute") | int %} {{ states("sensor.ljust_utomhus_framsidan") }}
          {% elif states("sensor.utomhus_baksidan_ljusstyrka") | int <= states("input_number.settings_ljusstyrka_morkt_ute") | int
            and states("sensor.utomhus_baksidan_ljusstyrka") | int > states("input_number.settings_ljusstyrka_nattljus_ute") | int %} mörkt
          {% else %} nattljus
          {% endif %} 

