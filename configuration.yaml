    longitude: 18.087033927440647
    radius: 80
    icon: mdi:home


# Spara bara x antal dagar i databasen (så den inte blir gigantisk)
recorder:
  purge_keep_days: 7

  
#######################################################
# Diverse integrationer som inte görs via UI
#######################################################

# Git-synk: anropas av Cursor Cloud via MCP (shell_command.git_pull / script.git_synka_config)
# reset --hard: /config ska spegla GitHub main (lokala ocommittade YAML-ändringar skrivs över)
shell_command:
  git_pull: >-
    cd /config && git fetch origin main
    && git reset --hard origin/main
    2>&1 | tee -a /config/git-pull.log
    && echo "--- $(date -Iseconds) ---" >> /config/git-pull.log

