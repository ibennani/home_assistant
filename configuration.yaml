# Differens i ljusstyrka mellan framsidan och baksidan. Alltid positiva värden
  - platform: template
    sensors:
      utomhus_ljusstyrka_differens:
        friendly_name: "Differens i ljusstyrka mellan framsidan och baksidan. Alltid positiva värden"
        value_template: >-
          {{ ((states('sensor.utomhus_framsidan_ljusstyrka') | int) - (states('sensor.utomhus_baksidan_ljusstyrka') | int)) | abs }}
# Differens i procent för ljusstyrkan mellan framsidan och baksidan. Alltid positiva värden
  - platform: template
    sensors:
      utomhus_ljusstyrka_differens_procent:
        friendly_name: "Differens i procent för ljusstyrkan mellan framsidan och baksidan. Alltid positiva värden"
        unit_of_measurement: "%"
        value_template: >-
          {% set front = states('sensor.utomhus_baksidan_ljusstyrka') | float %}
          {% set back = states('sensor.utomhus_framsidan_ljusstyrka') | float %}
          {% if front == 0 and back == 0 %}
            0
          {% elif front == 0 or back == 0 %}
            100
          {% else %}
            {% set difference = front - back if front > back else back - front %}
            {{ ((difference / ((front + back) / 2)) * 100) | round(1) }}
          {% endif %}
# Genomsnittlig ljusstyrka mellan framsidan och baksidan. Alltid positiva värden
      utomhus_ljusstyrka_genomsnitt:
        friendly_name: "Genomsnittlig ljusstyrka mellan framsidan och baksidan. Alltid positiva värden"
        value_template: >-
          {{ ((states('sensor.utomhus_baksidan_ljusstyrka') | int + states('sensor.utomhus_framsidan_ljusstyrka') | int) / 2) | int }}


