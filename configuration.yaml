#######################################################
# Home Assistant grundconfiguration
#######################################################

homeassistant:
  # Name of the location where Home Assistant is running
  name: Home
  # Location required to calculate the time the sun rises and sets
  latitude: 59.237731498047985
  longitude: 18.087033927440647
  # Impacts weather/sunrise data (altitude above sea level in meters)
  elevation: 61
  # metric for Metric, imperial for Imperial
  unit_system: metric
  # Pick yours from here: http://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  time_zone: Europe/Stockholm
  currency: SEK
  external_url: "https://85gdgmd5j5v1zlxo4dmkybhmvol6ozqk.ui.nabu.casa/"
  internal_url: "http://192.168.0.222:8123"
  # Ska användas för att ange var man kan skriva till filer, dvs var dessa filer hamnar.
  allowlist_external_dirs:
    - "/"
    - "/config/"
    - "/config/www/"

#######################################################
# Standardprylar som måste vara med om man tar bort "default_config:"
#######################################################

automation: !include automations.yaml
cloud:
config:
energy:
frontend:
group: !include groups.yaml
history:
input_boolean: !include input_boolean.yaml
input_datetime: !include input_datetime.yaml
input_number: !include input_number.yaml
input_select: !include input_select.yaml
input_text: !include input_text.yaml
lovelace: !include includes/lovelace.yaml
logbook:
media_source:
mobile_app:
my:
person:
script: !include scripts.yaml
scene: !include scenes.yaml
sun:
system_health:
zeroconf:

#######################################################
# Includes (flyttade domäner)
#######################################################

binary_sensor: !include includes/binary_sensor.yaml
sensor: !include includes/sensor.yaml
light: !include includes/light.yaml
media_player: !include includes/media_player.yaml
notify: !include includes/notify.yaml
tts: !include includes/tts.yaml
zone: !include includes/zone.yaml
timer: !include includes/timer.yaml
var: !include includes/var.yaml
utility_meter: !include includes/utility_meter.yaml
intent_script: !include includes/intent_script.yaml
template: !include includes/template.yaml

#######################################################
# Spara bara x antal dagar i databasen (så den inte blir gigantisk)
#######################################################

recorder:
  purge_keep_days: 7
  exclude:
    entity_globs:
      - sensor.*_active_notification_count

#######################################################
# Diverse integrationer som inte görs via UI
#######################################################

# Git-synk: anropas av Cursor Cloud via MCP (shell_command.git_pull / script.git_synka_config)
shell_command:
  git_pull: >-
    cd /config && git fetch origin main
    && git reset --hard origin/main
    2>&1 | tee -a /config/git-pull.log
    && echo "--- $(date -Iseconds) ---" >> /config/git-pull.log

rest_command:
  sl_farsta_pendeltag:
    url: https://transport.integration.sl.se/v1/sites/9180/departures?transport=TRAIN&forecast=60
    method: GET

#######################################################
# Media
#######################################################

# Gör det möjligt att strömma video, t.ex ifrån kameror.
stream:

# Live-TV
svt_play:
tv4_play:

assist_pipeline:
ssdp:
