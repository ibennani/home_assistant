# Använd detta script när vi ska äta och PS4 är på.
# förvarnar om att maten är klar och att PS4 stängs av om 30 sekunder.
# Väntar sedan i 30 sekunder och stänger av PS4
stang_av_ps4_efter_forvarning:
  alias: "Stäng av PS4 efter förvarning"
  mode: restart
  sequence:
    - condition: template
      value_template: >
        {{ states("input_select.koket_belysning") == "Måltid" }}

    - condition: template
      value_template: >
        {{ not states("media_player.playstation_4") in ["standby", "unavailable", "unknown"]
          and not states("media_player.sony_tv_i_vardagsrummet") in ["off", "unavailable"] }}

    - variables:
        tider: [120, 90, 60, 30, 15, 10, 5, 0]
        texter: [
          "Om två minuter kommer PS4 att stängas av.",
          "Stänger av PS4 om en och en halv minut.",
          "Stänger av PS4 om en minut.",
          "Stänger av PS4 om 30 sekunder.",
          "Stänger av PS4 om 15 sekunder.",
          "Stänger av PS4 om 10 sekunder.",
          "Stänger av PS4 om 5 sekunder.",
          "Nu stänger jag av PS4."
        ]

    - action: script.las_text_i_valfri_device
      data:
        hogtalare: media_player.googlehome_vardagsrummet
        meddelande: "Hallå där uppe i vardagsrummet. {{ message_text }}. Det har blivit dags att avsluta spelet. "
        volym: "{{ states('input_number.google_home_volume_setting_notiser') | int(default=0) / 100 }}"
        voice: "MattiasNeural"

    - delay: "00:00:01"

    - repeat:
        count: "{{ tider | length }}"
        sequence:
          - condition: template
            value_template: >
              {{ states("input_select.koket_belysning") == "Måltid" }}
          - action: script.las_text_i_valfri_device
            data:
              hogtalare: media_player.googlehome_vardagsrummet
              meddelande: "{{ texter[repeat.index] }}"
              volym: "{{ states('input_number.google_home_volume_setting_notiser') | int(default=0) / 100 }}"
              voice: "MattiasNeural"
          - delay: >
              {{ (tider[repeat.index] - tider[repeat.index + 1]) if repeat.index + 1 < tider | length else 0 }}

    - condition: template
      value_template: >
        {{ not states("media_player.playstation_4") in ["standby", "unavailable", "unknown"]
          and states("input_select.koket_belysning") == "Måltid" }}

    - action: media_player.turn_off
      target:
        entity_id: media_player.playstation_4



