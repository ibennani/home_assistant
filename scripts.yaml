    #       {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 1000 %} 9
    #       {% else %} 0
    #       {% endif %}  
    
    - repeat: # Vissa lampor kan inte dimmas ner direkt till 1 %. Här ändras ljusstyrkan från 9 % till 1 %
        for_each:
          - light.takspottarna_koksluckorna_level
          - light.takspottarna_trappan_level
          - light.spottarna_bakom_spisen_level
          - light.takspottarna_kokstaket_level
        sequence:
          - action: light.turn_on
            target:
              entity_id: "{{ repeat.item }}"
            data:
              brightness_pct: >
                {% set brightness = (state_attr(repeat.item, "brightness") | float(default=0) / 2.55) | int(default=0) %}
                {% if brightness < 10 and brightness > 0 %}
                  1
                {% else %}
                  {{ brightness }}
                {% endif %}
  
  



# Starta TV i vardagsrummet 
starta_tv_i_vardagsrummet:
  alias: Starta TV i vardagsrummet
  mode: queued
  description: Starta TV i vardagsrummet
  sequence:
    - action: svt_play.play_channel
      entity_id: media_player.kd_65xd8505
      data:
        channel: svt1
    - delay: '00:00:30'
    - action: media_player.volume_set
      data:
        entity_id: media_player.denon_avr_x2800h
        volume_level: "0.65"


# Släck alla lampor
turn_off_all_lights:
  alias: Släck alla lampor
  mode: queued
  sequence:
  - action: light.turn_off
    entity_id: all


# styr belysning när vi lämnat hemmet, olika beroende på tid på dygnet.
