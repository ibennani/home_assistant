            {% elif is_state("input_select.koket_belysning","Dämpat") %} 0
            {% elif is_state("input_select.koket_belysning","---") %} 
              {{ (state_attr("light.koksfonstret","brightness") | float(default = 0) / 2.55 ) | int(default = 0) }}            
            {% else %} 0
            {% endif %}              
          {% else %} 0
          {% endif %}     
        transition: >
          {% if rapid_transition == "on" %} 1 
          {% else %} 15
          {% endif %}  

    - action: light.turn_on
      entity_id:
