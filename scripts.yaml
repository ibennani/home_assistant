          {% if   states("input_select.albins_rum_belysning") in ["Tänt"] %} 50
          {% elif states("input_select.albins_rum_belysning") in ["Taklamporna"] %} 0
          {% elif states("input_select.albins_rum_belysning") in ["Läsning"] %} 100
          {% elif states("input_select.albins_rum_belysning") in ["Mysigt"] %} 1
          {% elif states("input_select.albins_rum_belysning") in ["Minimalt"] %} 0
          {% elif states("input_select.albins_rum_belysning") in ["Släckt"] %} 0
          {% elif states("input_select.albins_rum_belysning") in ["Städning"] %} 100
          {% endif %}
        color_temp: > 
          {% if   states("input_select.albins_rum_belysning") in ["Tänt"] %} 500
          {% elif states("input_select.albins_rum_belysning") in ["Taklamporna"] %} 500
          {% elif states("input_select.albins_rum_belysning") in ["Läsning"] %} 153
          {% elif states("input_select.albins_rum_belysning") in ["Mysigt"] %} 500
          {% elif states("input_select.albins_rum_belysning") in ["Minimalt"] %} 500
          {% elif states("input_select.albins_rum_belysning") in ["Släckt"] %} 500
          {% elif states("input_select.albins_rum_belysning") in ["Städning"] %} 153
          {% endif %}
        transition: 1
      target: 
        entity_id: light.led_strip_ovanfor_fotoljen
