      %} light.turn_off {% elif states("input_select.vardagsrummet_belysning") in
      ["Städning","PS4"] %} script.do_nothing {% else %} light.turn_on {% endif %}

      '
    entity_id:
    - light.lampan_bakom_tv
  - action: '{% if   is_state("input_select.vardagsrummet_belysning","Släckt") %}
      light.turn_off {% elif states("input_select.vardagsrummet_belysning") in ["Städning","PS4","TV"]
      %} script.do_nothing {% else %} light.turn_on {% endif %}

      '
    entity_id:
    - light.karvarna_i_vardagsrummet
  - action: "{% if states(\"input_select.vardagsrummet_belysning\") in [\"Tänt\"]
      %} light.turn_on {% elif states(\"input_select.vardagsrummet_belysning\") in
      [\"Städning\",\"TV\",\"PS4\"] %} {{ states(\"light.lampan_vid_balkongdorren\")
      }} {% else %} light.turn_off {% endif %} \n"
    entity_id:
    - light.lampan_vid_balkongdorren
  - action: light.turn_on
    entity_id:
    - light.taklampa_vardagsrummet
    data:
      brightness_pct: "{% if is_state(\"input_boolean.stadning_pagar\", \"on\") or states(\"input_select.vardagsrummet_belysning\") == \"Städning\" %} 100\n{% elif states(\"input_select.vardagsrummet_belysning\") == \"PS4\" %} 5\n{% else %} 0 {% endif %}\n"
