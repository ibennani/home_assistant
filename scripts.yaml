do_nothing:
  alias: Gör ingenting
  mode: parallel
  sequence: []
koket_stall_in_belysningen:
  alias: Ställ in belysningen i köket
  mode: restart
  description: Ställ in belysningen i köket
  sequence:
  - variables:
      front_section: '{{ states(''sensor.ljusstyrka_framsidan_sektioner'') | int(0)
        }}'
      house_mode: '{{ states(''input_select.house_time_modes'') }}'
      scene: '{{ states(''input_select.koket_belysning'') }}'
      stadning: '{{ is_state(''input_boolean.stadning_pagar'', ''on'') }}'
      jul: '{{ is_state(''input_boolean.julbelysning'', ''on'') }}'
      someone_home: '{{ (states(''zone.home'') | int(0)) > 0 }}'
      transition_seconds: '{{ 1 if (rapid_transition | default(''off'')) == ''on''
        else 15 }}'
  - action: light.turn_on
    target:
      entity_id:
      - light.led_lister_ovanfor_arbetsbankarna
    data:
      brightness_pct: "{% if stadning %} 100 {% elif house_mode in [\"Morgon\",\"Dag\",\"Kväll\"]
        %}\n  {% if scene == \"Normalt\" %}\n    {% if front_section <= 2 %} 75\n
        \   {% elif front_section == 3 %} 85\n    {% elif front_section == 4 %} 100\n
        \   {% else %} 100\n    {% endif %}\n  {% elif scene == \"Måltid\" %} 0\n
        \ {% elif scene == \"Buffé\" %} 10\n  {% elif scene == \"Maxbelysning\" %}
        100\n  {% elif scene == \"Spelkväll\" %} 0\n  {% elif scene == \"Mysigt\"
        %} 0\n  {% elif scene == \"Morgon\" %}\n    {% if front_section == 0 %} 30\n
        \   {% elif front_section <= 2 %} 40\n    {% elif front_section == 3 %} 60\n
        \   {% elif front_section == 4 %} 70\n    {% else %} 100\n    {% endif %}\n
        \ {% elif scene == \"Släckt\" %} 0\n  {% elif scene == \"Dämpat\" %} 0\n  {%
        elif scene == \"---\" %}\n    {{ (state_attr(\"light.led_lister_ovanfor_arbetsbankarna\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% else %} 0\n  {% endif %}\n{% elif house_mode
        == \"Natt\" %} 0 {% else %} 0 {% endif %}\n"
      transition: '{{ transition_seconds }}'
  - action: light.turn_on
    target:
      entity_id:
      - light.stjarnan_i_trappan
    data:
      brightness_pct: '{% if is_state("light.koksbelysningen","on") %} 100 {% else
        %} 0 {% endif %}

        '
  - action: light.turn_on
    target:
      entity_id:
      - light.koksfonstret
    data:
      brightness_pct: "{% if scene == \"Normalt\" %}\n  {% if front_section <= 4 %}
        20\n  {% else %} 0\n  {% endif %}\n{% elif scene in [\"Måltid\",\"Buffé\"]
        %}\n  {% if front_section <= 3 %} 15\n  {% elif front_section <= 4 %} 20\n
        \ {% else %} 0\n  {% endif %}\n{% elif scene in [\"Maxbelysning\",\"Spelkväll\"]
        %}\n  {% if front_section <= 4 %} 20\n  {% else %} 0\n  {% endif %}\n{% elif
        scene == \"Mysigt\" %}\n  {% if front_section <= 1 %} 10\n  {% elif front_section
        == 2 %} 15\n  {% elif front_section <= 4 %} 20\n  {% else %} 0\n  {% endif
        %}\n{% elif scene == \"Morgon\" %}\n  {% if front_section <= 4 %} 20\n  {%
        else %} 0\n  {% endif %}\n{% elif scene == \"Släckt\" %} 0\n{% elif scene
        == \"Dämpat\" %} 0\n{% elif scene == \"---\" %}\n  {{ (state_attr(\"light.koksfonstret\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n{% else %} 0\n{% endif %}\n"
      transition: '{{ transition_seconds }}'
  - action: light.turn_on
    target:
      entity_id:
      - light.koksbelysningen
    data:
      brightness_pct: "{% if stadning %} 100 {% elif house_mode == \"Morgon\" %}\n
        \ {% if scene == \"Normalt\" %}\n    {% if front_section <= 1 %} 50\n    {%
        elif front_section == 2 %} 55\n    {% elif front_section == 3 %} 60\n    {%
        elif front_section == 4 %} 65\n    {% else %} 100\n    {% endif %}\n  {% elif
        scene in [\"Måltid\",\"Buffé\"] %}\n    {% if front_section <= 1 %} 10\n    {%
        elif front_section == 2 %} 15\n    {% elif front_section == 3 %} 20\n    {%
        elif front_section == 4 %} 30\n    {% elif front_section == 5 %} 35\n    {%
        elif front_section == 6 %} 40\n    {% elif front_section <= 9 %} 50\n    {%
        else %} 100\n    {% endif %}\n  {% elif scene == \"Spelkväll\" %} 0\n  {%
        elif scene == \"Maxbelysning\" %}\n    {% if front_section <= 2 %} 65\n    {%
        elif front_section <= 4 %} 75\n    {% elif front_section == 5 %} 85\n    {%
        else %} 100\n    {% endif %}\n  {% elif scene == \"Mysigt\" %}\n    {% if
        front_section <= 4 %} 9\n    {% else %} 0\n    {% endif %}\n  {% elif scene
        == \"Morgon\" %}\n    {% if front_section <= 2 %} 9\n    {% elif front_section
        == 3 %} 20\n    {% elif front_section == 4 %} 25\n    {% elif front_section
        == 5 %} 50\n    {% else %} 100\n    {% endif %}\n  {% elif scene == \"Släckt\"
        %} 0\n  {% elif scene == \"Dämpat\" %} 9\n  {% elif scene == \"---\" %}\n
        \   {{ (state_attr(\"light.koksbelysningen\",\"brightness\") | float(0) /
        2.55) | int(0) }}\n  {% else %}\n    {{ (state_attr(\"light.koksbelysningen\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% endif %}\n{% elif house_mode in [\"Dag\",\"Kväll\"]
        %}\n  {% if scene == \"Normalt\" %}\n    {% if front_section <= 2 %} 65\n
        \   {% elif front_section == 3 %} 70\n    {% elif front_section == 4 %} 80\n
        \   {% else %} 100\n    {% endif %}\n  {% elif scene in [\"Måltid\",\"Buffé\"]
        %}\n    {% if front_section == 0 %} 9\n    {% elif front_section == 1 %} 10\n
        \   {% elif front_section == 2 %} 15\n    {% elif front_section == 3 %} 20\n
        \   {% elif front_section == 4 %} 30\n    {% elif front_section == 5 %} 35\n
        \   {% elif front_section == 6 %} 40\n    {% elif front_section <= 9 %} 45\n
        \   {% else %} 0\n    {% endif %}\n  {% elif scene == \"Spelkväll\" %} 0\n
        \ {% elif scene == \"Maxbelysning\" %}\n    {% if front_section <= 2 %} 60\n
        \   {% elif front_section <= 4 %} 75\n    {% elif front_section == 5 %} 85\n
        \   {% else %} 100\n    {% endif %}\n  {% elif scene == \"Mysigt\" %}\n    {%
        if front_section <= 4 %} 9\n    {% else %} 0\n    {% endif %}\n  {% elif scene
        == \"Morgon\" %}\n    {% if front_section <= 2 %} 25\n    {% elif front_section
        == 3 %} 40\n    {% elif front_section == 4 %} 55\n    {% elif front_section
        == 5 %} 65\n    {% else %} 100\n    {% endif %}\n  {% elif scene == \"Släckt\"
        %} 0\n  {% elif scene == \"Dämpat\" %} 9\n  {% elif scene == \"---\" %}\n
        \   {{ (state_attr(\"light.koksbelysningen\",\"brightness\") | float(0) /
        2.55) | int(0) }}\n  {% else %}\n    {{ (state_attr(\"light.koksbelysningen\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% endif %}\n{% elif house_mode == \"Natt\"
        %}\n  {% if scene == \"Normalt\" %} 60\n  {% elif scene in [\"Måltid\",\"Buffé\"]
        %} 9\n  {% elif scene == \"Mysigt\" %}\n    {{ (state_attr(\"light.koksbelysningen\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% elif scene == \"Maxbelysning\" %} 65\n
        \ {% elif scene == \"Släckt\" %} 0\n  {% elif scene == \"Dämpat\" %} 9\n  {%
        elif scene == \"---\" %}\n    {{ (state_attr(\"light.koksbelysningen\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% else %} 0\n  {% endif %}\n{% else %}
        0 {% endif %}\n"
      transition: '{{ transition_seconds }}'
  - action: "{% if house_mode in [\"Morgon\",\"Dag\",\"Kväll\"] %}\n  {% if scene
      == \"Släckt\" %}\n    light.turn_off\n  {% elif jul and someone_home %}\n    light.turn_on\n
      \ {% elif front_section <= 4 and scene in [\"Normalt\",\"Morgon\",\"Måltid\",\"Buffé\",\"Mysigt\",\"Maxbelysning\",\"Spelkväll\"]
      %}\n    light.turn_on\n  {% else %}\n    light.turn_off\n  {% endif %}\n{% elif
      house_mode == \"Natt\" %}\n  {% if scene == \"Normalt\" %}\n    light.turn_on\n
      \ {% elif scene in [\"Måltid\",\"Buffé\"] %}\n    light.turn_on\n  {% elif scene
      == \"Mysigt\" %}\n    light.turn_off\n  {% elif scene in [\"Maxbelysning\",\"Spelkväll\"]
      %}\n    light.turn_on\n  {% elif scene in [\"Släckt\",\"Dämpat\"] %}\n    light.turn_off\n
      \ {% else %}\n    script.do_nothing\n  {% endif %}\n{% else %}\n  script.do_nothing\n{%
      endif %}\n"
    target:
      entity_id:
      - light.lampan_vid_fotoljen
      - light.elljusstaken_i_koksfonstret
  - action: "{% if front_section <= 5 and scene in [\"Normalt\",\"Måltid\",\"Buffé\",\"Maxbelysning\",\"Spelkväll\",\"Mysigt\"]
      %}\n  light.turn_on\n{% elif scene in [\"Släckt\",\"Dämpat\"] %}\n  light.turn_off\n{%
      else %}\n  script.do_nothing\n{% endif %}\n"
    target:
      entity_id:
      - light.hoga_skapet_i_koket
  - action: light.turn_on
    target:
      entity_id:
      - light.takspottarna_kokstaket_level
    data:
      brightness_pct: "{% if stadning %} 100 {% elif house_mode in [\"Morgon\",\"Kväll\"]
        %}\n  {% if scene == \"Normalt\" %} 20\n  {% elif scene in [\"Måltid\",\"Buffé\"]
        %}\n    {% if front_section == 0 %} 10\n    {% elif front_section == 1 %}
        10\n    {% elif front_section == 2 %} 12\n    {% elif front_section == 3 %}
        15\n    {% elif front_section == 4 %} 25\n    {% else %} 30\n    {% endif
        %}\n  {% elif scene in [\"Maxbelysning\",\"Spelkväll\"] %}\n    {% if front_section
        <= 2 %} 50\n    {% elif front_section == 3 %} 60\n    {% elif front_section
        <= 4 %} 75\n    {% elif front_section == 5 %} 85\n    {% else %} 100\n    {%
        endif %}\n  {% elif scene == \"Mysigt\" %} 0\n  {% elif scene == \"Morgon\"
        %}\n    {% if front_section == 0 %} 10\n    {% elif front_section <= 1 %}
        15\n    {% elif front_section == 2 %} 20\n    {% elif front_section == 3 %}
        25\n    {% elif front_section == 4 %} 30\n    {% elif front_section == 5 %}
        35\n    {% else %} 40\n    {% endif %}\n  {% elif scene in [\"Släckt\",\"Dämpat\"]
        %} 0\n  {% else %} 0\n  {% endif %}\n{% elif house_mode == \"Dag\" %}\n  {%
        if scene == \"Normalt\" %} 0\n  {% elif scene in [\"Maxbelysning\",\"Spelkväll\"]
        %}\n    {% if front_section <= 2 %} 50\n    {% elif front_section == 3 %}
        60\n    {% elif front_section <= 4 %} 75\n    {% elif front_section == 5 %}
        85\n    {% else %} 100\n    {% endif %}\n  {% elif scene in [\"Måltid\",\"Buffé\"]
        %}\n    {% if front_section == 0 %} 15\n    {% elif front_section == 1 %}
        15\n    {% elif front_section == 2 %} 15\n    {% elif front_section == 3 %}
        20\n    {% elif front_section == 4 %} 25\n    {% elif front_section == 5 %}
        30\n    {% elif front_section >= 6 %} 40\n    {% else %} 40\n    {% endif
        %}\n  {% elif scene == \"Mysigt\" %} 0\n  {% elif scene == \"Morgon\" %}\n
        \   {{ (state_attr(\"light.takspottarna_kokstaket_level\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% elif scene in [\"Släckt\",\"Dämpat\"]
        %} 0\n  {% elif scene == \"---\" %}\n    {{ (state_attr(\"light.takspottarna_kokstaket_level\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% else %} 0\n  {% endif %}\n{% elif house_mode
        == \"Natt\" %}\n  {% if scene == \"Normalt\" %} 10\n  {% elif scene in [\"Måltid\",\"Buffé\"]
        %} 10\n  {% elif scene == \"Mysigt\" %} 0\n  {% elif scene in [\"Maxbelysning\",\"Spelkväll\"]
        %} 60\n  {% elif scene in [\"Släckt\",\"Dämpat\"] %} 0\n  {% elif scene ==
        \"---\" %}\n    {{ (state_attr(\"light.takspottarna_kokstaket_level\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% else %} 0\n  {% endif %}\n{% else %}
        0 {% endif %}\n"
      transition: '{{ transition_seconds }}'
  - action: light.turn_on
    target:
      entity_id:
      - light.koket_arbetsbanken
    data:
      brightness_pct: "{% if stadning %} 100 {% elif house_mode in [\"Morgon\",\"Dag\",\"Kväll\"]
        %}\n  {% if scene == \"Normalt\" %}\n    {% if front_section <= 2 %} 40\n
        \   {% elif front_section == 3 %} 50\n    {% elif front_section == 4 %} 70\n
        \   {% elif front_section == 5 %} 80\n    {% else %} 100\n    {% endif %}\n
        \ {% elif scene == \"Måltid\" %}\n    {% if front_section <= 2 %} 0\n    {%
        elif front_section <= 4 %}\n      {% if jul %} 0 {% else %} 15 {% endif %}\n
        \   {% else %} 25\n    {% endif %}\n  {% elif scene == \"Buffé\" %}\n    {%
        if front_section >= 3 %} 25 {% else %} 15 {% endif %}\n  {% elif scene ==
        \"Spelkväll\" %} 0\n  {% elif scene == \"Maxbelysning\" %}\n    {% if front_section
        <= 2 %} 50\n    {% elif front_section == 3 %} 60\n    {% elif front_section
        <= 4 %} 75\n    {% elif front_section == 5 %} 85\n    {% else %} 100\n    {%
        endif %}\n  {% elif scene == \"Mysigt\" %} 0\n  {% elif scene == \"Morgon\"
        %}\n    {% if front_section <= 2 %} 25\n    {% elif front_section == 3 %}
        40\n    {% elif front_section == 4 %} 55\n    {% elif front_section == 5 %}
        65\n    {% elif front_section == 6 %} 75\n    {% else %} 100\n    {% endif
        %}\n  {% elif scene in [\"Släckt\",\"Dämpat\"] %} 0\n  {% elif scene == \"---\"
        %}\n    {{ (state_attr(\"light.koket_arbetsbanken\",\"brightness\") | float(0)
        / 2.55) | int(0) }}\n  {% else %}\n    {{ (state_attr(\"light.koket_arbetsbanken\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% endif %}\n{% elif house_mode == \"Natt\"
        %}\n  {% if scene == \"Normalt\" %} 30\n  {% elif scene == \"Måltid\" %}\n
        \   {% if front_section >= 3 %} 25 {% else %} 0 {% endif %}\n  {% elif scene
        == \"Buffé\" %}\n    {% if front_section >= 3 %} 25 {% else %} 15 {% endif
        %}\n  {% elif scene == \"Mysigt\" %} 0\n  {% elif scene == \"Maxbelysning\"
        %} 40\n  {% elif scene == \"Spelkväll\" %} 0\n  {% elif scene in [\"Släckt\",\"Dämpat\"]
        %} 0\n  {% elif scene == \"---\" %}\n    {{ (state_attr(\"light.koket_arbetsbanken\",\"brightness\")
        | float(0) / 2.55) | int(0) }}\n  {% else %} 0\n  {% endif %}\n{% else %}
        0 {% endif %}\n"
      transition: '{{ transition_seconds }}'
  - delay: 00:00:02
  - action: "{% if house_mode == \"Natt\"\n  and scene == \"Dämpat\"\n  and is_state(\"light.koksbelysningen\",\"off\")
      %} light.turn_on\n{% else %} script.do_nothing {% endif %}\n"
    target:
      entity_id:
      - light.takspottarna_trappan_level
      - light.spottarna_bakom_spisen_level
    data:
      brightness_pct: "{% if is_state(\"group.rorelse_i_allmanna_utrymmen\",\"off\")\n
        \ and (as_timestamp(now()) - as_timestamp(state_attr('group.rorelse_i_allmanna_utrymmen', 'last_changed') or now()))
        | int(0) > (60 * 15) %} 0\n{% else %} 9 {% endif %}\n"
  - action: '{% if scene == "Dämpat" %} light.turn_off {% else %} script.do_nothing
      {% endif %}

      '
    target:
      entity_id:
      - light.takspottarna_koksluckorna_level
  - repeat:
      for_each:
      - light.takspottarna_koksluckorna_level
      - light.takspottarna_trappan_level
      - light.spottarna_bakom_spisen_level
      - light.takspottarna_kokstaket_level
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ repeat.item }}'
        data:
          brightness_pct: '{% set pct = ((state_attr(repeat.item, "brightness") |
            float(0)) / 2.55) | int(0) %} {% if pct == 9 %} 1 {% else %} {{ pct }}
            {% endif %}

            '
starta_tv_i_vardagsrummet:
  alias: Starta TV i vardagsrummet
  mode: queued
  description: Starta TV i vardagsrummet
  sequence:
  - action: svt_play.play_channel
    entity_id: media_player.kd_65xd8505
    data:
      channel: svt1
  - delay: 00:00:30
  - action: media_player.volume_set
    data:
      entity_id: media_player.denon_avr_x2800h
      volume_level: '0.65'
turn_off_all_lights:
  alias: Släck alla lampor
  mode: queued
  sequence:
  - action: light.turn_off
    entity_id: all
styr_belysningen_nar_alla_gatt_hemifran:
  alias: Styr belysningen när alla gått hemifrån
  mode: restart
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.isabelles_rum_belysning
    data:
      option: '{% if   is_state("input_boolean.stastadning_pagar","on") %} Städning
        {% elif states("input_select.house_time_modes") in ["Morgon","Dag","Natt"]
        %} Släckt {% else %} Tänt {% endif %}

        '
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.vardagsrummet_belysning
    data:
      option: "{% if   is_state(\"input_boolean.stastadning_pagar\",\"on\") %} Städning
        {% elif states(\"input_select.house_time_modes\") in [\"Morgon\",\"Dag\",\"Natt\"]
        %} Släckt {% else %} Tänt {% endif %}        \n"
  - action: script.turn_on
    target:
      entity_id: script.vardagsrummet_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: '{% if states("input_select.house_time_modes") in ["Morgon","Dag","Natt"]
        %} Släckt {% else %} Tänt {% endif %}

        '
  - action: script.turn_on
    target:
      entity_id: script.sovrummet_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: '{% if states("input_select.house_time_modes") in ["Morgon","Dag","Natt"]
        %} Släckt {% else %} Tänt {% endif %}

        '
  - action: script.turn_on
    target:
      entity_id: script.eriks_rum_stall_in_belysningen
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.koket_belysning
    data:
      option: "{% if states(\"input_select.house_time_modes\") in [\"Morgon\",\"Dag\",\"Natt\"]
        %} Släckt {% else %} Mysigt {% endif %}          \n"
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
    data:
      variables:
        rapid_transition: 'on'
  - action: input_select.select_option
    target:
      entity_id: input_select.albins_rum_belysning
    data:
      option: '{% if states("input_select.house_time_modes") in ["Morgon","Dag","Natt"]
        %} Släckt {% else %} Mysigt {% endif %}

        '
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
  - action: input_select.select_option
    entity_id: input_select.nedre_trappan_belysning
    data:
      option: Släckt
  - action: light.turn_off
    entity_id:
    - light.badrummet_alla_lampor
    - light.taklampa_tvattstugan
    - light.takspottarna_i_forradet
morgonbelysning:
  alias: Morgonbelysning
  mode: restart
  description: Starta morgonbelysning
  sequence:
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.vardagsrummet_belysning
    data:
      option: "{% if is_state(\"input_boolean.vacation_mode\",\"on\")\n  or now().strftime('%w')
        | int(default = 0) in [6,7]\n  or is_state(\"calendar.helgdagar\",\"0\") %}
        {{ states(\"input_select.vardagsrummet_belysning\") }}\n{% else %} Tänt {%
        endif %}\n"
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: '{{ states("input_select.sovrummet_belysning") }}

        '
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: '{{ states("input_select.eriks_rum_belysning") }}

        '
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
  - action: input_select.select_option
    target:
      entity_id: input_select.koket_belysning
    data:
      option: "{% set uptime = as_timestamp(now()) - as_timestamp(states('sensor.time_online')
        | default(now())) %} {% set nuvarande = states('input_select.koket_belysning')
        %} {% if uptime < 30 or nuvarande in ['unknown', 'unavailable', 'none', '']
        %}\n  {{ nuvarande if nuvarande not in ['unknown', 'unavailable', 'none',
        ''] else 'Normalt' }}\n{% elif is_state(\"var.morgoninfo_koket_redan_upplast\",\"false\")
        and states('input_select.house_time_modes') == 'Morgon' %}\n  Dämpat\n{% elif
        states('input_select.house_time_modes') == 'Kväll' and (is_state(\"zone.home\",\"0\")
        or nuvarande == \"Släckt\") %}\n  Mysigt\n{% elif states('input_select.house_time_modes')
        == 'Natt' and is_state(\"group.rorelse_i_allmanna_utrymmen\",\"off\") %}\n
        \ Släckt\n{% else %}\n  {{ nuvarande }}\n{% endif %}"
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
    data:
      variables:
        rapid_transition: 'on'
  - action: input_select.select_option
    entity_id: input_select.nedre_trappan_belysning
