          {% else %} Tänt
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.eriks_rum_stall_in_belysningen         
    # Styr belysningen i övre trappan
    - action: script.turn_on
      target:
        entity_id: script.ovre_trappan_stall_in_belysningen
    # Styr belysningen i köket
    - action: input_select.select_option
      target:
        entity_id: input_select.koket_belysning
      data:
        option: >
          {% if states("input_select.house_time_modes") in ["Morgon","Dag","Natt"] %} Släckt
          {% else %} Mysigt
          {% endif %}          
    - action: script.turn_on
      target:
        entity_id: script.koket_stall_in_belysningen
      data:
        variables:
          rapid_transition: "on"
    # Styr belysningen nere på Albins rum
    - action: input_select.select_option
      target:
        entity_id: input_select.albins_rum_belysning
      data:
        option: >
          {% if states("input_select.house_time_modes") in ["Morgon","Dag","Natt"] %} Släckt
          {% else %} Mysigt
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.koket_stall_in_belysningen          
    # Styr belysningen i skafferiet
    - action: script.turn_on
      target:
        entity_id: script.skafferiet_stall_in_belysningen
    # Styr belysningen i hallen
    - action: script.turn_on
      target:
        entity_id: script.hallen_stall_in_belysningen   
    # Styr taklampan i nedre trappan    
    - action: script.turn_on
      target:
        entity_id: script.nedre_trappan_stall_in_belysningen       
    # Övrig belysning
    - action: light.turn_off
      entity_id:
        - light.vagglampor_badrummet
        - light.taklampan_badrummet
        - light.forradet
