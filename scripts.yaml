        %} 0\n  {% elif scene == \"Morgon\" %}\n    {% if front_section == 0 %} 30\n
        \   {% elif front_section <= 2 %} 40\n    {% elif front_section == 3 %} 60\n
        \   {% elif front_section == 4 %} 70\n    {% else %} 100\n    {% endif %}\n
        \ {% elif scene == \"Släckt\" %} 0\n  {% elif scene == \"Dämpat\" %} 0\n  {%
        elif scene == \"---\" %}\n    {{ (state_attr(\"light.led_lister_ovanfor_arbetsbankarna\",\"brightness\")
