            {% if ljusstyrka > 2000 %}
              {% if is_state("input_boolean.julbelysning", "on") %}
                30
              {% else %}
                0
              {% endif %}
            {% elif ljusstyrka > 1000 %}
              {% if is_state("input_boolean.julbelysning", "on") %}
                30
              {% else %}
                0
              {% endif %}
            {% elif ljusstyrka > 300 %}
              25
            {% elif ljusstyrka > 100 %}
              20
            {% elif ljusstyrka > 10 %}
              15
            {% else %}
              10
            {% endif %}
          {% else %}
            0
          {% endif %}
        transition: 3


# Ställ in belysningen i sovrummet
sovrummet_stall_in_belysningen:
  alias: Ställ in belysningen i sovrummet
  mode: restart
  sequence:
    # Justera taklampans ljusstyrka beroende på belysningsläge
    - action: light.turn_on
      entity_id: light.taklampa_sovrummet_level
      data:
        brightness: >
          {% set current_brightness = state_attr("light.taklampa_sovrummet_level", "brightness") | float(default=0.0) / 2.55 %}
          {% set mode = states("input_select.sovrummet_belysning") %}
          {% if mode == "Städning" %}
            255
          {% elif mode in ["Mysigt", "Släckt"] %}
            0
          {% else %}
            {{ current_brightness | int }}
          {% endif %}

    # Hantera lampan vid Ilias säng
    - action: >
        {% set mode = states("input_select.sovrummet_belysning") %}
        {% set time_mode = states("input_select.house_time_modes") %}
        {% if mode == "Släckt" %}
          light.turn_off
        {% elif mode == "Städning" %}
          light.turn_on
        {% elif time_mode in ["Morgon", "Dag", "Kväll"] %}
          {% if mode in ["Tänt", "Sänglamporna"] %}
            light.turn_on
          {% else %}
            light.turn_off
          {% endif %}
        {% elif time_mode == "Natt" %}
          {% if mode in ["Tänt", "Sänglamporna"] and not is_state("device_tracker.ilias_s23_ultra", "home") %}
            light.turn_off
          {% elif mode == "Mysigt" %}
            light.turn_off
          {% else %}
            light.turn_on
          {% endif %}
        {% else %}
          light.turn_off
        {% endif %}
      entity_id: light.lampan_vid_ilias_sang

    # Hantera lampan vid Annas säng
    - action: >
        {% set mode = states("input_select.sovrummet_belysning") %}
        {% set time_mode = states("input_select.house_time_modes") %}
        {% if mode == "Släckt" %}
          light.turn_off
        {% elif mode == "Städning" %}
          light.turn_on
        {% elif time_mode in ["Morgon", "Dag", "Kväll"] %}
          {% if mode in ["Tänt", "Sänglamporna"] %}
            light.turn_on
          {% else %}
            light.turn_off
          {% endif %}
        {% elif time_mode == "Natt" %}
          {% if mode in ["Tänt", "Sänglamporna"] and not is_state("device_tracker.anna_s22_ultra", "home") %}
            light.turn_off
          {% elif mode == "Mysigt" %}
            light.turn_off
          {% else %}
            light.turn_on
          {% endif %}
        {% else %}
          light.turn_off
        {% endif %}
      entity_id: light.lampan_vid_annas_sang

    # Fönsterlampa: På om Tänt, Mysigt eller Städning, annars av
    - action: >
        {% if states("input_select.sovrummet_belysning") in ["Tänt", "Mysigt", "Städning"] %}
          light.turn_on
        {% else %}
          light.turn_off
        {% endif %}
      entity_id: light.lampan_i_sovrumsfonstret

    # Garderobslampor och smyckesskåp: Släcks bara om "Släckt" *och* inte dagtid
    - action: >
        {% if is_state("input_select.sovrummet_belysning", "Släckt") and not is_state("input_select.house_time_modes", "Dag") %}
          light.turn_off
        {% else %}
          script.do_nothing
        {% endif %}
      entity_id:
        - light.lamporna_i_garderoben
        - light.smyckeskapet




# Ställ in belysningen i Eriks rum
eriks_rum_stall_in_belysningen:
  alias: Ställ in belysningen i Eriks rum
  mode: restart
  sequence:
    - action: >
        {% if states("input_select.eriks_rum_belysning") in ["Släckt","Mysigt"] %} light.turn_off
        {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna normalbelysning","Trådkorgarna maxbelysning"] %}
          {% if states("input_select.house_time_modes") in ["Morgon","Kväll"] %} light.turn_on
          {% elif is_state("input_select.house_time_modes","Dag") %}
            {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) >= 2000 %} light.turn_off
            {% else %} light.turn_on
            {% endif %}
          {% else %} light.turn_off
          {% endif %}
        {% else %} light.turn_on
        {% endif %}
      entity_id:
        - light.lampan_i_eriks_fonster
        - light.klotlampan_pa_hyllan
    - action: light.turn_on
      entity_id:
        - light.taklampan_eriks_rum_level
      data:
        brightness_pct: >
          {% set oforandrat_ljus = (state_attr("light.taklampan_eriks_rum_level","brightness") | float(default = 0.0) / 2.55 ) | float(default = 0.0) %}
          {% if   states("input_select.eriks_rum_belysning") in ["Städning"] %} 100 
          {% elif states("input_select.eriks_rum_belysning") in ["Släckt"] %} 0
          {% elif states("input_select.eriks_rum_belysning") in ["Mysigt"] %} 0
          {% elif states("input_select.eriks_rum_belysning") in ["Tänt"] %} {{ oforandrat_ljus }}
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna normalbelysning"] %} {{ oforandrat_ljus }}
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna maxbelysning"] %} {{ oforandrat_ljus }}
          {% elif is_state("zone.home","0") 
              and is_state("input_select.house_time_modes","Kväll")
              and states("input_select.eriks_rum_belysning") in ["Tänt"]  %} 10
          {% else %} {{ oforandrat_ljus }}
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.stall_in_ljuset_i_eriks_myshorna
    - action: light.turn_on
      entity_id: 
        - light.led_bakom_meshkorgarna
      data: 
        brightness_pct: >
          {% if   is_state("input_boolean.stadning_pagar","on") %} 100 
          {% elif states("input_select.eriks_rum_belysning") in ["Städning"] %} 255
          {% elif states("input_select.eriks_rum_belysning") in ["Tänt"] %} 1
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna normalbelysning"] %} 1
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna maxbelysning"] %} 20
          {% elif states("input_select.eriks_rum_belysning") in ["Mysigt"] %} 0
          {% elif states("input_select.eriks_rum_belysning") in ["Släckt"] %} 0
          {% endif %}
        color_temp: > 
          {% if is_state("input_boolean.stadning_pagar","on") %} 153
          {% elif states("input_select.eriks_rum_belysning") in ["Städning"] %} 153
          {% elif states("input_select.eriks_rum_belysning") in ["Tänt"] %} 500
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna normalbelysning"] %} 500
          {% elif states("input_select.eriks_rum_belysning") in ["Trådkorgarna maxbelysning"] %} 153
          {% elif states("input_select.eriks_rum_belysning") in ["Mysigt"] %} 500
          {% elif states("input_select.eriks_rum_belysning") in ["Släckt"] %} 500
          {% endif %}
        transition: 2
      
        
# Ställ in ljuset Eriks myshörna 
stall_in_ljuset_i_eriks_myshorna:
  alias: Ställ in ljuset i Eriks myshörna
  mode: restart
  sequence: 
    - action: light.turn_on
      entity_id:
        - light.eriks_myshorna
      data:
        brightness_pct: >
          {% if states("input_select.eriks_rum_belysning") in ["Städning"] %} 100 
          {% elif is_state("input_select.eriks_rum_belysning","Trådkorgarna maxbelysning") %} 100
          {% elif states("input_select.eriks_rum_belysning") in ["Tänt","Trådkorgarna normalbelysning"] %} 
          {% set ljus_baksidan = states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) %}
            {% if ljus_baksidan >= 2000 %} 50
            {% elif ljus_baksidan >= 1000 and ljus_baksidan < 2000 %} 25
            {% elif ljus_baksidan < 1000 %} 15
            {% else %} 0
            {% endif %}
          {% elif is_state("input_select.eriks_rum_belysning","Mysigt") %} 15
          {% else %} 0 
          {% endif %}
        color_temp: >
          {% if states("input_select.eriks_rum_belysning") in ["Städning"] %} 255 
          {% elif is_state("input_select.eriks_rum_belysning","Trådkorgarna normalbelysning") %} 500
          {% elif is_state("input_select.eriks_rum_belysning","Trådkorgarna maxbelysning") %} 255
          {% elif is_state("input_select.eriks_rum_belysning","Tänt") %} 500
          {% elif is_state("input_select.eriks_rum_belysning","Mysigt") %} 500
          {% else %} 500
          {% endif %}
        transition: 1  



# Ställ in belysningen i nedre trappan
nedre_trappan_stall_in_belysningen:
  alias: Ställ in belysningen i nedre trappan
  mode: restart
  sequence:
    - choose:

        # När städning pågår, sätt på max ljusstyrka
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_boolean.stadning_pagar", "on") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 100   
            - action: light.turn_on
              target:
                entity_id: light.lampan_brudkistan

        # Släck när ingen är hemma.
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("zone.home", "0") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: >
                  {% if states("input_select.house_time_modes") in ["Kväll"] %} 1
                  {% else %} 0
                  {% endif %}
            - action: >
                {% if states("input_select.house_time_modes") in ["Kväll"] %} light.turn_on
                {% else %} light.turn_off
                {% endif %}
              target:
                entity_id: light.lampan_brudkistan

        # När julbelysningen är på (en toggle) så ska taklampan vara släkt. 
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_boolean.julbelysning", "on") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 0
            - action: light.turn_on
              target:
                entity_id: light.lampan_brudkistan

        # När Ilias är ensam hemma och rör sig vid nedre trappan, 
        # tänd lampan, men bara om solen INTE lyser ner i det utrymmet
        - conditions:
            - condition: template
              value_template: >                
                {% set sun_azimuth = states("sensor.sun_azimuth") | int(default=0) %}
                {% set light_level = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
                {% set solen_lyser_ner = (sun_azimuth >= 280 or sun_azimuth <= 305) or light_level >= 2000 %}

                {{ is_state("zone.home", "1") 
                  and state_attr("zone.home", "persons")[0] == "person.ilias_bennani"
                  and states("input_select.house_time_modes") in ["Morgon", "Dag"]
                  and is_state("binary_sensor.nedre_trappan_rorelse","on") 
                  and solen_lyser_ner }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 30
            - action: light.turn_on
              target:
                entity_id: light.lampan_brudkistan
              data:
                brightness: 0            

        # När Ilias är ensam hemma och inte har rört sig vid nedre trappan på ett tag,
        # släck taklampan i nedre trappan
        - conditions:
            - condition: template
              value_template: >
                {% set motion_inactive = is_state("binary_sensor.nedre_trappan_rorelse", "off")  %}

                {{ is_state("zone.home", "1") 
                  and state_attr("zone.home", "persons")[0] == "person.ilias_bennani"
                  and states("input_select.house_time_modes") in ["Morgon", "Dag"]
                  and motion_inactive }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 0
            - action: light.turn_off
              target:
                entity_id: light.lampan_brudkistan

        # När ingen har rört sig vid nedre trappan på ett tag,
        - conditions:
            - condition: template
              value_template: >
                {% set sun_azimuth = states("sensor.sun_azimuth") | int(default=0) %}
                {% set light_level = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
                {% set solen_lyser_ner = (sun_azimuth >= 280 or sun_azimuth <= 305) or light_level >= 2000 %}

                {% set motion_inactive = is_state("binary_sensor.nedre_trappan_rorelse", "off") 
                  and (as_timestamp(now()) - as_timestamp(states.binary_sensor.nedre_trappan_rorelse.last_changed) | int(default=0) > 60 * 30) %}

                {{not is_state("zone.home", "0") 
                  and states("input_select.house_time_modes") in ["Morgon", "Dag"]
                  and solen_lyser_ner
                  and motion_inactive }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: >
                  {% set sun_azimuth = states("sensor.sun_azimuth") | int(default=0) %}
                  {% set light_level = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
                  {% set solen_lyser_ner = light_level >= 2000 %}

                  {% set motion_inactive = is_state("binary_sensor.nedre_trappan_rorelse", "off") 
                    and (as_timestamp(now()) - as_timestamp(states.binary_sensor.nedre_trappan_rorelse.last_changed) | int(default=0) > 60 * 30) %}

                  {% if not is_state("zone.home", "0") 
                        and states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"]
                        and solen_lyser_ner
                        and motion_inactive %} 0
                  {% else %} 1
                  {% endif %}
            - action: >
                {% if states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"]
                  and light_level <= 2000 %} light.turn_on
                {% else %} light.turn_off
                {% endif %}  
              target:
                entity_id: light.lampan_brudkistan

        # # När taklampan nedre trappan är på max ljusstyrka, men inte på natten
        # - conditions:
        #     - condition: template
        #       value_template: >
        #         {{ state_attr('light.taklampan_nedre_trappan_level', 'brightness') | int(default=0) == 255 
        #         and states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] 
        #         and not states("zone.home","0") }}
        #   sequence:
        #     - action: light.turn_on
        #       target:
        #         entity_id: light.taklampan_nedre_trappan_level
        #       data:
        #         brightness: >
        #           {{ state_attr('light.taklampan_nedre_trappan_level', 'brightness') | int(default=0) }}
        #     - action: >
        #         {% if states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"]
        #           and light_level <= 2000 %} light.turn_on
        #         {% else %} light.turn_off
        #         {% endif %}  
        #       target:
        #         entity_id: light.lampan_brudkistan

        # När det är morgon
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_select.house_time_modes", "Morgon") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: > 
                  {% if light_level <= 2000 %} light.1
                  {% else %} 0
                  {% endif %}  
            - action: > 
                {% if light_level <= 2000 %} light.turn_on
                {% else %} light.turn_off
                {% endif %}  
              target:
                entity_id: light.lampan_brudkistan

        # När det är dag 
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_select.house_time_modes", "Dag") 
                and (states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) < 2000) }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: > 
                  {% if light_level <= 2000 %} light.1
                  {% else %} 0
                  {% endif %}  
            - action: > 
                {% if light_level <= 2000 %} light.turn_on
                {% else %} light.turn_off
                {% endif %}  
              target:
                entity_id: light.lampan_brudkistan

        # När det är kväll
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_select.house_time_modes", "Kväll") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 1
            - action: light.turn_on
              target:
                entity_id: light.lampan_brudkistan
              data:
                brightness: 1

        # När det är natt
        - conditions:
            - condition: template
              value_template: >
                {{ is_state("input_select.house_time_modes", "Natt") }}
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.taklampan_nedre_trappan_level
              data:
                brightness_pct: 0
            - action: light.turn_off
              target:
                entity_id: light.lampan_brudkistan
                
      # När inga aldra villkor passar, lämna ljustyrkan oförändrad. 
      default:
        - action: light.turn_on
          target:
            entity_id: light.taklampan_nedre_trappan_level
          data:
            brightness_pct: >
              {% set oforandrat_ljus = (state_attr("light.taklampan_nedre_trappan_level", "brightness") | float(default=0.0) / 2.55) | float(default=0.0) %}
              {{ oforandrat_ljus }}




