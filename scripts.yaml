koket_styr_lage_efter_huslage:
  alias: Köket - styr läge efter husläge
  mode: restart
  description: Väntar på återställt köksläge och applicerar belysning. Vid omstart ändras inte input_select.
  fields:
    bevara_kokslage:
      name: Bevara köksläge
      description: Ändra inte input_select (t.ex. vid HA-omstart)
      default: false
      selector:
        boolean: {}
    nattlage:
      name: Nattläge
      description: Använd nattlogik för köksläge (Släckt/Dämpat)
      default: false
      selector:
        boolean: {}
    rapid_transition:
      name: Snabb övergång
      default: false
      selector:
        boolean: {}
  sequence:
  - wait_for_trigger:
    - trigger: state
      entity_id: input_select.koket_belysning
      not_to:
      - unavailable
      - unknown
    timeout: '00:00:15'
    continue_on_timeout: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ bevara_kokslage | default(false) }}'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.koket_stall_in_belysningen
        data:
          variables:
            rapid_transition: "{% if rapid_transition | default(false) %}on{% else %}off{% endif %}"
    - conditions:
      - condition: template
        value_template: '{{ nattlage | default(false) }}'
      sequence:
      - action: input_select.select_option
        target:
          entity_id: input_select.koket_belysning
        data:
          option: "{% if (is_state(\"group.rorelse_i_koket\",\"off\")\n  and (as_timestamp(now())
            - as_timestamp(state_attr('group.rorelse_i_koket', 'last_changed') or now()) | int(default =
            0) > 60 * 10)) %} Släckt\n{% else %} Dämpat {% endif %}\n"
      - action: script.turn_on
        target:
          entity_id: script.koket_stall_in_belysningen
        data:
          variables:
            rapid_transition: "{% if rapid_transition | default(false) %}on{% else %}off{% endif %}"
    default:
    - action: input_select.select_option
      target:
        entity_id: input_select.koket_belysning
      data:
        option: "{% set nuvarande = states('input_select.koket_belysning') %}{% if is_state(\"var.morgoninfo_koket_redan_upplast\",\"false\")
          and states('input_select.house_time_modes') == 'Morgon' %}Dämpat{% elif states('input_select.house_time_modes')
          == 'Kväll' and (is_state(\"zone.home\",\"0\") or nuvarande == \"Släckt\") %}Mysigt{%
          elif states('input_select.house_time_modes') == 'Natt' and is_state(\"group.rorelse_i_allmanna_utrymmen\",\"off\")
          %}Släckt{% else %}{{ nuvarande }}{% endif %}"
    - action: script.turn_on
      target:
        entity_id: script.koket_stall_in_belysningen
      data:
        variables:
          rapid_transition: "{% if rapid_transition | default(false) %}on{% else %}off{% endif %}"
starta_tv_i_vardagsrummet:
