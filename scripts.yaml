# Ändra belysningen i huet när det är morgon
morgonbelysning:
  alias: Morgonbelysning
  mode: restart
  description: Starta morgonbelysning
  sequence:
    # Styr belysningen i Isabelles rum
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_kontrollera_belysningen_logiken
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
    # Styr belysningen i vardagsrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.vardagsrummet_belysning
    data:
      option: >
        {% if is_state("input_boolean.vacation_mode","on")
          or now().strftime('%w') | int(default = 0) in [6,7]
          or is_state("calendar.helgdagar","0") %} {{ states("input_select.vardagsrummet_belysning") }}
        {% else %} Tänt
        {% endif %}
    # Styr belysningen i sovrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: >
        {{ states("input_select.sovrummet_belysning") }}
    # Styr belysningen i Eriks rum
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: >
        {{ states("input_select.eriks_rum_belysning") }}
    # Styr belysningen i övre trappan
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
    # Styr belysningen i skafferiet
  - action: script.turn_on
    target:
      entity_id: script.skafferiet_stall_in_belysningen
    # Styr belysningen i hallen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
    # Styr belysningen i köket
  - action: input_select.select_option
    target:
      entity_id: input_select.koket_belysning
    data:
      option: >
        {% if is_state("var.morgoninfo_koket_redan_upplast","false") %} Dämpat
        {% else %} {{ state("input_select.koket_belysning") }}
        {% endif %}
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
    data:
      variables:
        rapid_transition: "on" 
    # Styr belysningen i nedre trappan
  - action: script.turn_on
    target:
      entity_id: script.nedre_trappan_stall_in_belysningen




# Ändra belysningen i huet när det är dag
dagsbelysning:
  alias: Dagsbelysning
  mode: restart
  description: Starta dagsbelysning
  sequence:
    # Styr belysningen i Isabelles rum
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_kontrollera_belysningen_logiken
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
    # Styr belysningen i vardagsrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.vardagsrummet_belysning
    data:
      option: Släckt
    # Styr belysningen i sovrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: Släckt
  # Styr belysningen i Eriks rum
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: >
        {% if is_state("device_tracker.anna_s22_ultra","home") 
          and s_state("var.morgoninfo_koket_redan_upplast","true") %} Trådkorgarna normalbelysning
        {% else %} Släckt
        {% endif %}
    # Styr belysningen i övre trappan
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
    # Styr belysningen i skafferiet
  - action: script.turn_on
    target:
      entity_id: script.skafferiet_stall_in_belysningen
    # Styr belysningen i hallen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
  #   # Styr belysningen i köket
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
  # Styr belysningen i Albins rum
  - action: input_select.select_option
    target:
      entity_id: input_select.albins_rum_belysning
    data:
      option: >
        {% if is_state("device_tracker.erik_s23","home") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif is_state("input_boolean.gaster_hemma","on") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif is_state("input_boolean.stadning_pagar","on") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif (is_state("binary_sensor.albins_rum_rorelse","off")
              and (as_timestamp(now()) - as_timestamp(states.binary_sensor.albins_rum_rorelse.last_changed) | int(default = 0) > 60 * 3)) %} Släckt
        {% else %}
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} 
            {% if states("input_select.albins_rum_belysning") in ["Tänt","Taklamporna"] %} Tänt
            {% elif states("input_select.albins_rum_belysning") in ["Mysigt","Släckt"] %} Mysigt
            {% else %} Mysigt
            {% endif %}
          {% else %} Släckt
          {% endif %}
        {% endif %}
    # Styr takspottarna i nedre trappan
  - action: script.turn_on
    target:
      entity_id: script.nedre_trappan_stall_in_belysningen


# Ändra belysningen i huet när det är kväll
kvallsbelysning:
  alias: Kvällsbelysning
  mode: restart
  description: Starta kvällsbelysning
  sequence:
    # Styr belysningen i Isabelles rum
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_kontrollera_belysningen_logiken
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
    # Styr belysningen i vardagsrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.vardagsrummet_belysning
    data:
      option: >
        {% if states("sensor.crosstrainer_plug_current_power") | float > 5 %} Träning
        {% elif states("input_select.vardagsrummet_belysning") in ["Dämpat","Träning","Städning","PS4","TV"] %} {{ states("input_select.vardagsrummet_belysning") }}
        {% else %} Tänt
        {% endif %}
    # Styr belysningen i sovrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: >
        {% if is_state("zone.home","0") %} Tänt
        {% else %}
          {% if not is_state("cover.rullgardin_sovrummet","closed") 
            and is_state("var.morgoninfo_koket_redan_upplast","true") %} Tänt
          {% else %} {{ states("input_select.sovrummet_belysning") }}
          {% endif %}
        {% endif %}
    # Styr belysningen i Eriks rum
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: >
        {% if is_state("input_boolean.stadning_pagar","true") %} {{ states("input_select.eriks_rum_belysning") }}
        {% elif is_state("var.morgoninfo_koket_redan_upplast","true") and now().strftime('%R') > "07:15" %} 
          {% if states("input_select.house_time_modes") in ["Dag"] %}
            {% if not states("input_select.eriks_rum_belysning") in ["Städning","Trådkorgarna maxbelysning"] %} Tänt
            {% else %} {{ states("input_select.eriks_rum_belysning") }}
            {% endif %}        
          {% elif states("input_select.house_time_modes") in ["Kväll"] %}
            {% if not states("input_select.eriks_rum_belysning") in ["Städning","Trådkorgarna maxbelysning"] %} Tänt
            {% else %} {{ states("input_select.eriks_rum_belysning") }}
            {% endif %} 
          {% else %} {{ states("input_select.eriks_rum_belysning") }}
          {% endif %}
        {% else %} {{ states("input_select.eriks_rum_belysning") }}
        {% endif %}
    # Styr belysningen i övre trappan
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
    # Styr belysningen i skafferiet
  - action: script.turn_on
    target:
      entity_id: script.skafferiet_stall_in_belysningen
    # Styr belysningen i hallen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
    # Styr belysningen i köket
    # Mysigt om det är kväll och ingen är hemma. Detta för att undvika ett släckt kök på kvällarna. 
  - action: input_select.select_option
    target:
      entity_id: input_select.koket_belysning
    data:
      option: >
        {% if   (is_state("zone.home","0") or is_state("input_select.koket_belysning","Släckt"))
            and is_state("input_select.house_time_modes","Kväll") %} Mysigt
        {% else %} {{ states("input_select.koket_belysning") }}
        {% endif %}
  - delay: "00:00:01"
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
    data:
      variables:
        rapid_transition: "on"
    # Styr belysningen i Albins rum
  - action: input_select.select_option
    target:
      entity_id: input_select.albins_rum_belysning
    data:
      option: >
        {% if is_state("zone.home","0") %} Tänt
        {% elif is_state("input_boolean.gaster_hemma","on") 
            or is_state("input_boolean.stadning_pagar","on")
            or is_state("var.morgoninfo_koket_redan_upplast","false") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif is_state("cover.rullgardin_albins_rum","closed") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif is_state("binary_sensor.albins_rum_rorelse","off") 
            and (as_timestamp(now()) - as_timestamp(states.binary_sensor.albins_rum_rorelse.last_changed) | int(default = 0) > 60 * 3) %} Mysigt
        {% elif states("input_select.albins_rum_belysning") in ["Tänt","Taklamporna"] %} Tänt
        {% elif states("input_select.albins_rum_belysning") in ["Mysigt","Släckt"] %} Mysigt
        {% else %} Mysigt
        {% endif %}
  - action: light.turn_on
    entity_id:
    - light.takspottarna_hallen_level
    data:
      brightness_pct: >
        {% if is_state("binary_sensor.hallen_rorelse","on") %} {{ (state_attr("light.takspottarna_hallen_level","brightness") | float(default = 0) / 2.55 ) | int(default = 0)  }} 
        {% else %} 5
        {% endif %}
    # Styr belysningen i nedre trappan
  - action: script.turn_on
    target:
      entity_id: script.nedre_trappan_stall_in_belysningen



# Ändra belysningen i huet när det är natt
nattbelysning:
  alias: Nattbelysning
  mode: restart
  description: Starta nattbelysning
  sequence:
    # Styr belysningen i Isabelles rum
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_kontrollera_belysningen_logiken
  - action: script.turn_on
    target:
      entity_id: script.isabelles_rum_stall_in_belysningen
    # Släck lamporna i vardagsrummet om ingen varit där på en stund
  - action: input_select.select_option
    data:
      entity_id: input_select.vardagsrummet_belysning
      option: >
        {% if is_state("media_player.denon_avr_x2800h","off")
          and (as_timestamp(now()) - as_timestamp(states.media_player.denon_avr_x2800h.last_changed)) | int(default = 0) > (60 * 10)
          and is_state("group.rorelse_i_vardagsrummet","off") 
          and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_vardagsrummet.last_changed)) | int(default = 0) > (60 * 10) %} Släckt
        {% else %} {{ states("input_select.vardagsrummet_belysning") }}
        {% endif %}
    # Styr belysningen i sovrummet
  - action: input_select.select_option
    target:
      entity_id: input_select.sovrummet_belysning
    data:
      option: >
        {% if  is_state("device_tracker.ilias_s23_ultra","home")
            or is_state("device_tracker.anna_s22_ultra","home") %} {{ states("input_select.sovrummet_belysning") }}
        {% else %} Släckt
        {% endif %}
    # Styr belysningen i Eriks rum
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: >
        {% if is_state("zone.home","0") %} Släckt
        {% elif is_state("input_select.eriks_rum_belysning","Släckt") %} Släckt
        {% else %} Släckt
        {% endif %}
    # Styr belysningen i skafferiet
  - action: script.turn_on
    target:
      entity_id: script.skafferiet_stall_in_belysningen
    # Styr belysningen i övre trappan
  - action: script.turn_on
    target:
      entity_id: script.ovre_trappan_stall_in_belysningen
    # Styr belysningen i hallen
  - action: script.turn_on
    target:
      entity_id: script.hallen_stall_in_belysningen
    # Styr belysningen i köket
  - action: input_select.select_option
    target:
      entity_id: input_select.koket_belysning
    data:
      option: >
        {% if (is_state("group.rorelse_i_koket","off")
          and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_koket.last_changed) | int(default = 0) > 60 * 10)) %} Släckt
        {% else %} Dämpat
        {% endif %}
  - action: script.turn_on
    target:
      entity_id: script.koket_stall_in_belysningen
    data:
      variables:
        rapid_transition: "on"
    # Styr belysningen i Albins rum
  - action: input_select.select_option
    target:
      entity_id: input_select.albins_rum_belysning
    data:
      option: >
        {% if is_state("device_tracker.erik_s23","home") and not is_state("input_select.albins_rum_belysning","Släckt") %} Minimalt
        {% elif is_state("input_boolean.gaster_hemma","on") %} {{ states("input_select.albins_rum_belysning") }}
        {% elif (is_state("binary_sensor.albins_rum_rorelse","off")
              and (as_timestamp(now()) - as_timestamp(states.binary_sensor.albins_rum_rorelse.last_changed) | int(default = 0) > 60 * 3)) %} Släckt
        {% else %} Släckt
        {% endif %}
    # Styr belysningen i nedre trappan
  - action: script.turn_on
    target:
      entity_id: script.nedre_trappan_stall_in_belysningen



