# Omvandla aktuell tid till något som går att förstå, t.ex. fem i tre istället för 14:55
skapa_begriplig_tid:
  alias: "Omvandla aktuell tid till något som går att förstå"
  mode: queued
  sequence:
    - action: input_text.set_value
      data:
        entity_id: input_text.aktuell_tid_begriplig
        value: >-
          Klockan är {{- " " -}} 
          {%- set timme = now().strftime("%H") | int(default = 0)  -%} 
          {%- set minut = now().strftime("%M") | int(default = 0)  -%} 
            
          {%- if (timme == 0 ) -%} 
            {%- if minut < 25 -%} {%- set timme_text = 12 | int(default = 0)  -%}
            {%- else -%} {%- set timme_text = 1 | int(default = 0)   -%}
            {%- endif -%}
          {%- elif timme < 12 -%} 
            {%- if minut < 25 -%} {%- set timme_text = timme -%}
            {%- else -%} {%- set timme_text = (timme + 1) -%}
            {%- endif -%}
          {%- elif timme == 12 -%} 
            {%- if minut < 25 -%} {%- set timme_text = timme -%}
            {%- else -%} {%- set timme_text = (timme - 11) -%}
            {%- endif -%}
          {%- else -%}
            {%- if minut < 25 -%} {%- set timme_text = (timme - 12) -%}
            {%- else -%} {%- set timme_text = (timme - 11) -%}
            {%- endif -%}
          {%- endif -%}
          
          {%- if   minut == 00 -%} {{- timme_text -}}
          {%- elif minut == 5  -%} fem över {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 10 -%} tio över {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 15 -%} kvart över {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 20 -%} tjugo över {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 25 -%} fem i halv {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 30 -%} halv {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 35 -%} fem över halv {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 40 -%} tjugo i {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 45 -%} kvart i {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 50 -%} tio i {{- " " -}}  {{- timme_text -}}
          {%- elif minut == 55 -%} fem i {{- " " -}}  {{- timme_text -}}
          {%- else -%}
            {%- if minut > 9 -%} {{- timme | string + " " -}} och {{ minut }}
            {%- else -%} {{- timme | string + " " -}} 0{{ minut }}
            {%- endif -%}
          {%- endif -%}
          {{- " " }}
  

# Generera en text som skapar en väderprognos
skapa_dagens_vaderprognos:
  alias: "Skapa dagens väderprognos"
  mode: queued
  sequence:
    - action: input_text.set_value
      target:
        entity_id: input_text.aktuellt_vader_begriplig
      data:
        value: "***"
    - variables:
        i:  
        vaderdata: {}  # Initierar vaderdata som en tom dictionary
    - action: weather.get_forecasts
      target:
        entity_id: weather.smhi_farsta
      data:
        type: daily
      response_variable: vaderprognos
    - variables:
        i: >
          {% set given_date = vaderprognos['weather.smhi_farsta'].forecast[0].datetime.split('T')[0] %}
          {% set today_date = now().date() | string %}
          {% if given_date == today_date %} {{ 0 | int }}
          {% else %} {{ 1 | int }}
          {% endif %}
    - variables:
        vaderdata:
          condition: >
            {% set condition = vaderprognos['weather.smhi_farsta'].forecast[i].condition %}
            {% if condition == 'clear-night' %} klar natt
            {% elif condition == 'cloudy' %} mulet
            {% elif condition == 'fog' %} dimma
            {% elif condition == 'hail' %} hagel
            {% elif condition == 'lightning' %} åska
            {% elif condition == 'lightning-rainy' %} åska och regn
            {% elif condition == 'partlycloudy' %} halvklart
            {% elif condition == 'pouring' %} ösregn
            {% elif condition == 'rainy' %} regnigt
            {% elif condition == 'snowy' %} snöfall
            {% elif condition == 'snowy-rainy' %} snöblandat regn
            {% elif condition == 'sunny' %} soligt
            {% elif condition == 'windy' %} blåsigt
            {% elif condition == 'windy-variant' %} varierande vind
            {% elif condition == 'exceptional' %} exceptionellt väder
            {% else %} okänt väder
            {% endif %}
          templow: "{{ vaderprognos['weather.smhi_farsta'].forecast[i].templow | int(default=0) }}"
          temphigh: "{{ vaderprognos['weather.smhi_farsta'].forecast[i].temperature | int(default=0) }}"
          precipitation: "{{ vaderprognos['weather.smhi_farsta'].forecast[i].precipitation | int(default=0) }}"
  # Skapa texten som ska användas
    - action: input_text.set_value
      target:
        entity_id: input_text.dagens_vader_begriplig
      data:
        value: "Idag kommer det bli {{ vaderdata.condition }} och
          temperaturen varierar mellan {{ vaderdata.templow }} och {{ vaderdata.temphigh }} grader"
    - action: >
        {% if vaderdata.precipitation > 0 %} input_text.set_value
        {% else %} script.do_nothing
        {% endif %}
      target:
        entity_id: input_text.dagens_vader_begriplig
      data:
        value: "{{ states('input_text.dagens_vader_begriplig') }}, och det kan komma {{ vaderdata.precipitation }} milimeter regn"






