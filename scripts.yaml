          {% if is_state("group.rorelse_i_allmanna_utrymmen","off") 
            and (as_timestamp(now()) - as_timestamp(states.group.rorelse_i_allmanna_utrymmen.last_changed)) | int(default = 0) > (60 * 15) %} 0
          {% else %} 9          
          {% endif %}
    - action: > # Om läget "dämpat" är valt ska spottarna vid köksluckorna släckas
        {% if is_state("input_select.koket_belysning","Dämpat") %} light.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id:
        - light.takspottarna_koksluckorna_level
