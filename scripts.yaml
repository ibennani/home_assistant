# Gör detta när huset är larmet och något triggar larmet
om_huslarmet_triggas:
  alias: "Gör detta när huslarmet triggas"
  sequence:     
    - action: switch.turn_on
      entity_id:
        - siren.brandvarnare_ovre_trappan   
    - action: notify.foraldrar
      data:
        message: >-
          HEMMET {{ now().strftime('%R') }}:

          *** HUSLARM ***  
          {%- set ns = namespace(triggered_sensors_str='', triggered_count=1) %}
          {%- for entity_id in 
            [
              'binary_sensor.balkongdorren',
              'binary_sensor.altandorr_baksidan',
              'binary_sensor.altandorr_koket',
              'binary_sensor.ytterdorren',
              'binary_sensor.isabelles_fonster',
              'binary_sensor.vardagsrummet_fonster',
              'binary_sensor.wc_fonster',
              'binary_sensor.eriks_fonster',
              'binary_sensor.albins_fonster',
              'binary_sensor.badrummet_fonster',
              'binary_sensor.isabelles_rum_rorelse',
              'binary_sensor.isabelles_skrivbord_rorelse',
              'binary_sensor.vardagsrummet_rorelse',
              'binary_sensor.vardagsrummet_soffan_rorelse',
              'binary_sensor.ovre_trappan_rorelse',
              'binary_sensor.sovrummet_rorelse',
              'binary_sensor.wc_rorelse',
              'binary_sensor.eriks_rum_rorelse',
              'binary_sensor.koket_rorelse',
              'binary_sensor.koket_arbetsbanken_rorelse',
              'binary_sensor.koksbordet_rorelse',
              'binary_sensor.hallen_rorelse',
              'binary_sensor.nedre_trappan_rorelse',
              'binary_sensor.albins_rum_rorelse',
              'binary_sensor.tvattstugan_rorelse'
            ]
          %}
            {%- set sensor = states[entity_id] %}
            {%- if sensor.state == 'on' %}
              {%- set friendly_name = sensor.attributes.friendly_name %}
              {%- if ns.triggered_sensors_str != '' %}
                {%- set ns.triggered_sensors_str = ns.triggered_sensors_str + ',\n' + friendly_name %}
                {%- set ns.triggered_count = ns.triggered_count + 1 %}
              {%- else %}
                {%- set ns.triggered_sensors_str = friendly_name %}
              {%- endif %}
            {%- endif %}
          {%- endfor %}

          {% if ns.triggered_count == 1 -%} {{- ns.triggered_count }} sensor har triggats:
          {% else %} {{- ns.triggered_count }} sensorer har triggats:
          {% endif %}
          {{- ns.triggered_sensors_str }}
        
        data:
          ttl: 0
          priority: high


# Räkna ut när diskmaskinen ska starta (billigast pris)
# Svaret sparas som hh:mm i input_text.diskmaskin_tid_fjarrstart
find_lowest_price_hour:
  alias: "Hitta billigaste timmen"
  sequence:
    - variables:
        # Aktuell tid som ISO 8601-sträng
        now_iso: "{{ now().isoformat() }}"
        # Hämta dagens priser från sensorn
        today_prices: >
          {{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_today') or [] }}
        # Hämta morgondagens priser från sensorn
        tomorrow_prices: >
          {{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'raw_tomorrow') or [] }}
        # Kontrollera om morgondagens priser är giltiga
        tomorrow_valid: "{{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'tomorrow_valid') }}"
        # Kombinera priserna om morgondagens priser är giltiga
        all_prices: >
          {% if tomorrow_valid and tomorrow_prices | length > 0 %}
            {{ today_prices + tomorrow_prices }}
          {% else %}
            {{ today_prices }}
          {% endif %}
        # Verifiera att all_prices är en lista av dictionaries
        all_prices_parsed: >
          {{ all_prices | selectattr('start', 'defined') | selectattr('value', 'defined') | list }}
        # Filtrera priser efter nuvarande tid
        relevant_prices: >
          {{ all_prices_parsed | selectattr('start', '>=', now_iso) | list }}
        # Hitta billigaste timmen bland de relevanta priserna
        lowest_price_hour: >
          {% if relevant_prices | length > 0 %}
            {% set min_price = none %}
            {% set min_time = none %}
            {% for price in relevant_prices %}
              {% if min_price == none or price['value'] < min_price %}
                {% set min_price = price['value'] %}
                {% set min_time = price['start'] %}
              {% endif %}
            {% endfor %}
            {{ min_time.split('T')[1][:5] if min_time else "Ingen data" }}
          {% else %}
            Ingen data
          {% endif %}
    - action: input_text.set_value
      target:
        entity_id: input_text.diskmaskin_tid_fjarrstart
      data:
        value: "{{ lowest_price_hour }}"



