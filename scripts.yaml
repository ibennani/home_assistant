        target:
          entity_id: light.taklampan_ilias_rum_level
      - action: '{% if fonster_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_ilias_fonster
      - action: '{% if sang_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_ilias_sang
      - action: '{% if mys_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.ilias_myslampa
    - conditions:
      - condition: template
        value_template: '{{ ilias_mode == ''Lamporna i fönstret'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_ilias_rum_level
      - action: '{% if sang_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_ilias_sang
      - action: '{% if mys_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.ilias_myslampa
      - action: '{% if fonster_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_ilias_fonster
    - conditions:
      - condition: template
        value_template: '{{ ilias_mode == ''Sängen'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_ilias_rum_level
      - action: '{% if fonster_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_ilias_fonster
      - action: '{% if mys_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.ilias_myslampa
      - action: '{% if sang_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_ilias_sang
    - conditions:
      - condition: template
        value_template: '{{ ilias_mode == ''Myslampan'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_ilias_rum_level
      - action: '{% if fonster_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_ilias_fonster
      - action: '{% if sang_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_ilias_sang
      - action: '{% if mys_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.ilias_myslampa
    default:
