las_test:
  alias: Testuppläsning
  mode: restart
  sequence:
  - action: script.las_text_i_valfri_device
    data:
      hogtalare: media_player.googlehome_ilias_rum
      meddelande: Nu har posten kommit.
      volym: 0.2
      voice: MattiasNeural
las_text_i_valfri_device:
  alias: Läs upp text i valfri högtalare eller grupp
  mode: restart
  description: Läs upp i valfri puck, högtalare eller grupp av högtalare
  sequence:
  - action: "{% if hogtalare in [\"media_player.googlehome_infopuckarna\",\n                    \"media_player.googlehome_alla_puckar\",\n
      \                   \"media_player.alla_hogtalare\",\n                    \"media_player.de_basta_hogtalarna\"]
      %} script.do_nothing\n{% else %} script.tysta_kopplingspling_vid_casting {%
      endif %}\n"
    data:
      hogtalare: '{{ hogtalare }}'
  - action: media_player.volume_set
    data:
      entity_id: '{% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.infopuckarna_ha_grupp
        {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar_ha_grupp
        {% elif hogtalare == "media_player.alla_hogtalare" %} media_player.alla_hogtalare_ha_grupp
        {% elif hogtalare == "media_player.de_basta_hogtalarna" %} media_player.de_basta_hogtalarna_ha_grupp
        {% else %} {{ hogtalare }} {% endif %}

        '
      volume_level: '{{ volym }}'
  - wait_template: '{{ not is_state('''' ~ hogtalare ~ '''',''unavailable'') }}

      '
    timeout: 00:00:30
    continue_on_timeout: false
  - action: tts.speak
    target:
      entity_id: tts.home_assistant_cloud
    data:
      media_player_entity_id: '{{ hogtalare }}

        '
      message: '{{ meddelande }}'
      options:
        voice: '{{ voice }}'
      language: '{% if sprak == "" %} sv-SE {% else %} {{ sprak }} {% endif %}

        '
  - wait_template: '{{ is_state('''' ~ hogtalare ~ '''',''playing'') }}

      '
    timeout: 00:00:30
    continue_on_timeout: false
  - wait_template: '{{ is_state('''' ~ hogtalare ~ '''', ''idle'') and not is_state(''''
      ~ hogtalare ~ '''', ''playing'') }}

      '
    timeout: 00:00:30
    continue_on_timeout: false
  - action: media_player.volume_set
    data:
      entity_id: '{% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.infopuckarna
        {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar
        {% else %} {{ hogtalare }} {% endif %}

        '
      volume_level: '{{ (states("input_number.google_home_volume_setting_notiser")
        | float(default = 0) / 100) }}'
tysta_kopplingspling_vid_casting:
  alias: Tysta kopplingspling vid casting
  mode: parallel
  description: Ta bort plinget som hörs i början när man castar till en Chromecast
    eller Google home nest
  sequence:
  - variables:
      cast_target: '{% if hogtalare == "media_player.googlehome_infopuckarna" %}media_player.googlehome_infopuckarna{%
        elif hogtalare == "media_player.googlehome_alla_puckar" %}media_player.alla_puckar_ha_grupp{%
        elif hogtalare == "media_player.alla_hogtalare" %}media_player.alla_hogtalare{%
        elif hogtalare == "media_player.de_basta_hogtalarna" %}media_player.de_basta_hogtalarna{%
        else %}{{ hogtalare }}{% endif %}'
  - action: media_player.volume_mute
    data:
      is_volume_muted: true
    target:
      entity_id: '{{ cast_target }}'
  - action: media_player.turn_on
    target:
      entity_id: '{{ cast_target }}'
  - wait_template: '{{ state_attr(cast_target, ''is_volume_muted'') == true }}'
    timeout: 00:00:15
    continue_on_timeout: true
  - wait_template: '{{ is_state(cast_target, ''idle'') or is_state(cast_target, ''off'') }}'
    timeout: 00:00:30
    continue_on_timeout: true
  - condition: template
    value_template: '{{ is_state(cast_target, ''idle'') or is_state(cast_target, ''off'') }}'
  - delay: '00:00:00.600'
  - action: media_player.volume_mute
    data:
      entity_id: '{{ cast_target }}'
      is_volume_muted: false
stjarnan_i_trappan_loopa_farger:
  alias: Stjärnan i trappan loopa färger
  mode: restart
  sequence:
  - repeat:
      while:
      - condition: state
        entity_id: light.stjarnan_i_trappan
        state: 'on'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.stjarnan_i_trappan
        data:
          rgb_color: "{% set colors_old = ['red','orange', 'blue', 'green', 'violet']
            %} {% set colors = ['255, 164, 74','255, 218, 110','255, 190, 45','255, 43,
            0'] %} {{ colors|random }}        \n"
          transition: 2
          brightness_pct: "{% if is_state(\"light.koksbelysningen\",\"off\") %} 0 {% elif
            is_state(\"zone.home\",\"0\") %} 0 {% elif is_state(\"input_select.house_time_modes\",\"Morgon\")
            %} \n  {% if state_attr(\"light.takspottarna_koksluckorna_level\",\"brightness\")
            | int(default = 0) < 1 %} 0\n  {% else %} 100\n  {% endif %}           \n{%
            elif is_state(\"input_select.house_time_modes\",\"Dag\") %} \n  {% if states(\"sensor.utomhus_framsidan_ljusstyrka\")
            | int(default = 0) < 1 %} 0\n  {% else %} 100\n  {% endif %} \n{% elif is_state(\"input_select.house_time_modes\",\"Kväll\")
            %} \n  {% if state_attr(\"light.takspottarna_koksluckorna_level\",\"brightness\")
            | int(default = 0)  < 1 %} 0\n  {% else %} 100\n  {% endif %} \n{% elif is_state(\"input_select.house_time_modes\",\"Natt\")
            %} 0 {% else %} 0 {% endif %}        \n"
      - delay:
          seconds: 3
vardagsrummet_stall_in_belysningen:
  alias: Ställ in belysningen i vardagsrummet
  mode: restart
  sequence:
  - action: '{% if   states("input_select.vardagsrummet_belysning") in ["Dämpat","Släckt"]
      %} light.turn_off {% elif states("input_select.vardagsrummet_belysning") in
