        | float(default = 0.0) / 2.55 ) | float(default = 0.0) %} {% if   states(\"input_select.eriks_rum_belysning\")
        in [\"Städning\"] or is_state(\"input_boolean.stadning_pagar\", \"on\") %} 100  {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Släckt\"] %} 0 {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Mysigt\"] %} 0 {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Tänt\"] %} {{ oforandrat_ljus }} {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Trådkorgarna normalbelysning\"] %} {{ oforandrat_ljus }} {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Trådkorgarna maxbelysning\"] %} {{ oforandrat_ljus }} {% elif is_state(\"zone.home\",\"0\")
        \n    and is_state(\"input_select.house_time_modes\",\"Kväll\")\n    and states(\"input_select.eriks_rum_belysning\")
        in [\"Tänt\"]  %} 10\n{% else %} {{ oforandrat_ljus }} {% endif %}\n"
