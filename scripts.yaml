                  {% endif %}
                {% endif %}              
    # Stäng av vad som än spelas
      - conditions:
          - condition: template
            value_template: >
              {{ powerswitch == "off" }}  
        sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.chromecast_audio_kitchen
            data:
              option: Tyst
          - action: media_player.turn_off
            target:
              entity_id: media_player.hogtalarna_i_koket




# Styr taklampan i Isabelels rum
isabelles_rum_styr_taklampan:
  alias: "Styr taklampan i Isabelles rum"
  mode: restart
  sequence:
    - action: light.turn_on
      entity_id: light.taklampan_isabelles_rum_level
      data: 
        brightness_pct: >
          {% if is_state("input_select.house_time_modes","Morgon") %} 
            {% if event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","off") %} 35
            {% elif event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","on") %} 0
            {% elif is_state("zone.home","0") %} 0
            {% else %} {{ ((state_attr("light.taklampan_isabelles_rum_level","brightness") | int(default = 0)  + 1) / 2.55) | int(default = 0)  }}
            {% endif %}
          {% elif is_state("input_select.house_time_modes","Dag") %} 
            {% if event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","off") %} 
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 2000 %} 55
              {% else %} 100
              {% endif %}
            {% elif event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","on") %} 0            
            {% elif is_state("zone.home","0") %} 0
            {% else %} {{ ((state_attr("light.taklampan_isabelles_rum_level","brightness") | int(default = 0)  + 1) / 2.55) | int(default = 0)  }}
            {% endif %}              
          {% elif is_state("input_select.house_time_modes","Kväll") %} 
            {% if event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","off") %} 55
            {% elif event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","on") %} 0
            {% elif is_state("zone.home","0") %} 55
            {% else %} {{ ((state_attr("light.taklampan_isabelles_rum_level","brightness") | int(default = 0)  + 1) / 2.55) | int(default = 0)  }}
            {% endif %}
          {% elif is_state("input_select.house_time_modes","Natt") %} 
            {% if event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","off") %} 15
            {% elif event_data == 1002 and is_state("light.taklampan_isabelles_rum_level","on") %} 0            
            {% elif is_state("zone.home","0") %} 0
            {% else %} {{ ((state_attr("light.taklampan_isabelles_rum_level","brightness") | int(default = 0)  + 1) / 2.55) | int(default = 0)  }}
            {% endif %}
          {% else %} 0
          {% endif %}  
        transition: >
          {% if event_data == 1002 %} 0
          {% else %} 1
          {% endif %}
    - action: > # Tänd på max vid dubbeltryck på knappen
        {% if event_data == 1004 %} light.turn_on
        {% else %} script.do_nothing
        {% endif %}
      entity_id: light.taklampan_isabelles_rum_level
      data: 
        brightness_pct: 100
        transition: 0          


# Kontrollera belysningen i Isabelles rum
# Avgör vilket värde som ska väljas i input_select.isabelles_rum_belysning 
# All logik ligger här
isabelles_rum_kontrollera_belysningen_logiken:
  alias: "Vilkoren som styr belysningen i Isabelles rum"
  mode: restart
  sequence:
    - action: input_select.select_option
      target:
        entity_id: input_select.isabelles_rum_belysning
      data:
        option: >
          {% set ljuslage = states("input_select.isabelles_rum_belysning") %}
          {% set utomhus_ljus = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
          {% set tid = states("input_select.house_time_modes") %}
          {% set gaster_hemma = is_state("input_boolean.gaster_hemma", "on") %}
          {% set isabelle_hemma = is_state("device_tracker.annelies_iphone", "home") %}
          {% set ilias_hemma = is_state("device_tracker.ilias_s23_ultra", "home") %}
          {% set laddare_typ = states("sensor.ilias_s23_ultra_charger_type") %}
          {% set julbelysning = is_state("input_boolean.julbelysning","on") %}
          {% set stadning = is_state("input_boolean.stastadning_pagar","on") %}
          
          {% if external_trigger_type == "mobillarmet_morgon_vardagar" 
            and not gaster_hemma 
            and ilias_hemma 
            and not isabelle_hemma %}
              Tänt
          
          {% elif tid == "Morgon" %}
              {% if gaster_hemma or isabelle_hemma %}
                  {{ ljuslage }}
              {% elif stadning %} Städning
              {% elif ilias_hemma %}
                  {% if laddare_typ == "ac" %}
                      {{ ljuslage }}
                  {% else %}
                      {% if is_state("var.morgoninfo_koket_redan_upplast", "true") %}
                          Tänt
                      {% else %}
                          {{ ljuslage }}
                      {% endif %}
                  {% endif %}
              {% else %}
                  Tänt
              {% endif %}
          
          {% elif tid == "Dag" %}
              {% if gaster_hemma or isabelle_hemma %}
                  {% if ljuslage in ["Tänt", "Sängen"] %}
                      Sängen
                  {% else %}
                      Släckt
                  {% endif %}
              {% elif ilias_hemma %}
                  {% if laddare_typ == "ac" %}
                      {% if ljuslage in ["Tänt", "Sängen"] %}
                          Sängen
                      {% else %}
                          Släckt
                      {% endif %}
                  {% else %}
                      {% if utomhus_ljus >= 2000 and julbelysning %}
                          Tänt
                      {% elif utomhus_ljus >= 2000 and not julbelysning %}
                          Släckt
                      {% else %}
                          Tänt
                      {% endif %}
                  {% endif %}
              {% else %}
                  {% if utomhus_ljus >= 2000 and julbelysning %}
                      Tänt
                  {% elif utomhus_ljus >= 2000 and not julbelysning %}
                      Släckt
                  {% else %}
                      Tänt
                  {% endif %}
              {% endif %}
          
          {% elif tid == "Kväll" %}
              {% if ilias_hemma and laddare_typ == "ac" and now().strftime('%R') >= "21:30" %}
                  Släckt
              {% else %}
                  Tänt
              {% endif %}
          
          {% elif tid == "Natt" %}
              {% if gaster_hemma %}
                  {{ ljuslage }}
              {% elif isabelle_hemma %}
                  Myslampan
              {% elif ilias_hemma %}
                  {% if laddare_typ == "ac" %}
                      Släckt
                  {% else %}
                      {% if ljuslage == "Släckt" %}
                          Släckt
                      {% else %}
                          Myslampan
                      {% endif %}
                  {% endif %}
              {% else %}
                  Släckt
              {% endif %}          
          {% else %}
              Släckt
          {% endif %}
                
    # - action: notify.mobile_app_ilias_s23_ultra
    #   data:
    #     message: |
    #       HEMMET {{ now().strftime('%R') }}: 
    #       Data i scriptet:
    #       external_trigger_type  {{ external_trigger_type }}
    #     data:
    #       ttl: 0
    #       priority: high
        


