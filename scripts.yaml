# Gör ingenting. Bra att använda vid else.
do_nothing:
  alias: Gör ingenting
  mode: parallel
  sequence: []


# Ställ in belysningen i skafferiet
skafferiet_stall_in_belysningen:
  alias: Ställ in belysningen i skafferiet
  mode: queued
  description: Justera belysningen i skafferiet
  sequence:
  - action: homeassistant.turn_on
    entity_id: light.takspottarna_skafferiet_level
    data:
      brightness: >
        {% if is_state("zone.home","0") %} 0
        {% elif is_state("binary_sensor.skafferidorren","on") %}
          {% if is_state("input_select.house_time_modes","Morgon") %} {{ states("input_number.settings_skafferiet_ljusstyrka_morgon_oppet") | int(default = 0)  }}
          {% elif is_state("input_select.house_time_modes","Dag") %} 
            {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 %} {{ states("input_number.settings_skafferiet_ljusstyrka_dag_oppet") | int(default = 0)  }} 
            {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_oppet") | int(default = 0)  }} 
            {% endif %}          
          {% elif is_state("input_select.house_time_modes","Kväll") %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_oppet") | int(default = 0)  }} 
          {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_natt_oppet") | int(default = 0)  }} 
          {% endif %}
        {% else %}
          {% if is_state("input_select.house_time_modes","Morgon") %} {{ states("input_number.settings_skafferiet_ljusstyrka_morgon_stangt") | int(default = 0)  }}
          {% elif is_state("input_select.house_time_modes","Dag") %} 
            {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 %} {{ states("input_number.settings_skafferiet_ljusstyrka_dag_stangt") | int(default = 0)  }} 
            {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_stangt") | int(default = 0)  }} 
            {% endif %}          
          {% elif is_state("input_select.house_time_modes","Kväll") %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_stangt") | int(default = 0)  }} 
          {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_natt_stangt") | int(default = 0) }}
          {% endif %}
        {% endif %}
  - action: input_number.set_value
    entity_id: input_number.settings_skafferiet_ljusstyrka_nu_oppet
    data:    
      value: >
        {% if is_state("input_select.house_time_modes","Morgon") %} {{ states("input_number.settings_skafferiet_ljusstyrka_morgon_oppet") | int(default = 0)  }}
        {% elif is_state("input_select.house_time_modes","Dag") %} 
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 %} {{ states("input_number.settings_skafferiet_ljusstyrka_dag_oppet") | int(default = 0)  }} 
          {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_oppet") | int(default = 0)  }}  
          {% endif %}
        {% elif is_state("input_select.house_time_modes","Kväll") %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_oppet") | int(default = 0)  }}  
        {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_natt_oppet") | int(default = 0)  }} 
        {% endif %}
  - action: input_number.set_value
    entity_id: input_number.settings_skafferiet_ljusstyrka_nu_stangt
    data:    
      value: >
        {% if is_state("input_select.house_time_modes","Morgon") %} {{ states("input_number.settings_skafferiet_ljusstyrka_morgon_stangt") | int(default = 0)  }} 
        {% elif is_state("input_select.house_time_modes","Dag") %} 
          {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 2000 %} {{ states("input_number.settings_skafferiet_ljusstyrka_dag_stangt") | int(default = 0)  }}
          {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_stangt") | int(default = 0)  }}  
          {% endif %}
        {% elif is_state("input_select.house_time_modes","Kväll") %} {{ states("input_number.settings_skafferiet_ljusstyrka_kvall_stangt") | int(default = 0)  }}  
        {% else %} {{ states("input_number.settings_skafferiet_ljusstyrka_natt_stangt") | int(default = 0)  }}  
        {% endif %}


# Ställ in belysningen i hallen
hallen_stall_in_belysningen:
  alias: Ställ in belysningen i hallen
  mode: queued
  description: Justera belysningen i hallen
  sequence:
    - action: input_number.set_value
      target:
        entity_id: input_number.settings_hallen_ljusstyrka_nu
      data:
        value: >
          {% if is_state("input_boolean.stadning_pagar", "on") %}
            100
          {% elif is_state("zone.home", "0") %}
            0
          {% elif is_state("input_select.house_time_modes", "Morgon") %}
            {{ states("input_number.settings_hallen_ljusstyrka_morgon") | int(default=0) }}
          {% elif is_state("input_select.house_time_modes", "Dag") %}
            {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) >= 2000 %}
              {{ states("input_number.settings_hallen_ljusstyrka_dag") | int(default=0) }}
            {% else %}
              {{ states("input_number.settings_hallen_ljusstyrka_kvall") | int(default=0) }}
            {% endif %}
          {% elif is_state("input_select.house_time_modes", "Kväll") %}
            {{ states("input_number.settings_hallen_ljusstyrka_kvall") | int(default=0) }}
          {% else %}
            {{ states("input_number.settings_hallen_ljusstyrka_natt") | int(default=0) }}
          {% endif %}
          
    - action: light.turn_on
      target:
        entity_id: light.takspottarna_hallen_level
      data:
        brightness_pct: >
          {% set ljus_nu = states("input_number.settings_hallen_ljusstyrka_nu") | int(default=0) %}
          {% set ljus_framsidan = states("sensor.utomhus_framsidan_ljusstyrka") | int(default=0) %}
          
          {% if is_state("zone.home", "0") %}
            0
          {% elif is_state("binary_sensor.hallen_rorelse", "on") %}
            {{ ljus_nu }}
          {% else %}
            {% if 50 < ljus_framsidan < 10000 %}
              5
            {% else %}
              0
            {% endif %}
          {% endif %}
    



# Ställ in belysningen i köket
koket_stall_in_belysningen:
  alias: Ställ in belysningen i köket
  mode: restart
  description: Ställ in belysningen i köket 
  sequence:
    - action: light.turn_on
      entity_id: 
        - light.led_lister_ovanfor_arbetsbankarna
      data:
        brightness_pct: >
          {% if is_state("input_boolean.stadning_pagar","on")%} 100 
          {% elif is_state("var.morgoninfo_koket_redan_upplast","false") %} 0
          {% elif states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] %}
            {% if is_state("input_select.koket_belysning","Normalt") %}
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 100 %} 75
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 100 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 300 %} 75
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 300 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 1000 %} 85
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 1000 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 2000 %} 100
              {% else %} 100
              {% endif %}
            {% elif is_state("input_select.koket_belysning","Måltid") %} 0
            {% elif is_state("input_select.koket_belysning","Buffé") %} 10
            {% elif is_state("input_select.koket_belysning","Maxbelysning") %} 100              
            {% elif is_state("input_select.koket_belysning","Spelkväll") %} 0              
            {% elif is_state("input_select.koket_belysning","Mysigt") %} 0            
            {% elif is_state("input_select.koket_belysning","Morgon") %}
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 10 %} 30
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 10 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 100 %} 40
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 100 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 300 %} 40
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 300 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 1000 %} 60
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) >= 1000 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0)  < 2000 %} 70
              {% else %} 100
              {% endif %} 
            {% elif is_state("input_select.koket_belysning","Släckt") %} 0
            {% elif is_state("input_select.koket_belysning","Dämpat") %} 0
            {% elif is_state("input_select.koket_belysning","---") %} 
              {{ (state_attr("light.led_lister_ovanfor_arbetsbankarna","brightness") | float(default = 0) / 2.55 ) | int(default = 0) }}
            {% else %} 0
            {% endif %}
          {% elif is_state("input_select.house_time_modes","Natt") %} 0
          {% else %} 0
          {% endif %}
        transition: >
          {% if rapid_transition == "on" %} 1 
          {% else %} 15
          {% endif %}       
          
    - action: light.turn_on
      entity_id: 
        - light.stjarnan_i_trappan
      data:
        brightness_pct: >          
          {% if is_state("light.koksbelysningen","on") %} 100
          {% else %} 0
          {% endif %}

    - action: light.turn_on
      entity_id: 
        - light.koksfonstret
      data:
        brightness_pct: >          
          {% if states("input_select.house_time_modes") in ["Morgon","Dag","Kväll"] %}
            {% if is_state("var.morgoninfo_koket_redan_upplast","false") %} 0
            {% elif is_state("input_select.koket_belysning","Normalt") %}
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} 20
              {% else  %} 0
              {% endif %}
            {% elif states("input_select.koket_belysning") in ["Måltid","Buffé"] %} 
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 300 %} 15
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) > 300 
                  and states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} 20
              {% else  %} 0
              {% endif %}
            {% elif states("input_select.koket_belysning") in ["Maxbelysning","Spelkväll"] %}
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) < 2000 %} 20
              {% else  %} 0
              {% endif %}
            {% elif is_state("input_select.koket_belysning","Mysigt") %} 
              {% if states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) <= 100 %} 10
              {% elif states("sensor.utomhus_framsidan_ljusstyrka") | int(default = 0) > 100 
