skapa_dagens_vaderprognos:
  alias: Skapa dagens väderprognos
  mode: queued
  sequence:
  - action: input_text.set_value
    target:
      entity_id: input_text.aktuellt_vader_begriplig
    data:
      value: '***'
  - variables:
      i:
      vaderdata: {}
  - action: weather.get_forecasts
    target:
      entity_id: weather.smhi_farsta
    data:
      type: daily
    response_variable: vaderprognos
  - variables:
      i: '{% set given_date = vaderprognos[''weather.smhi_farsta''].forecast[0].datetime.split(''T'')[0]
        %} {% set today_date = now().date() | string %} {% if given_date == today_date
        %} {{ 0 | int }} {% else %} {{ 1 | int }} {% endif %}

        '
  - variables:
      vaderdata:
        condition: '{% set condition = vaderprognos[''weather.smhi_farsta''].forecast[i].condition
          %} {% if condition == ''clear-night'' %} klar natt {% elif condition ==
          ''cloudy'' %} mulet {% elif condition == ''fog'' %} dimma {% elif condition
          == ''hail'' %} hagel {% elif condition == ''lightning'' %} åska {% elif
          condition == ''lightning-rainy'' %} åska och regn {% elif condition == ''partlycloudy''
          %} halvklart {% elif condition == ''pouring'' %} ösregn {% elif condition
          == ''rainy'' %} regnigt {% elif condition == ''snowy'' %} snöfall {% elif
          condition == ''snowy-rainy'' %} snöblandat regn {% elif condition == ''sunny''
          %} soligt {% elif condition == ''windy'' %} blåsigt {% elif condition ==
          ''windy-variant'' %} varierande vind {% elif condition == ''exceptional''
          %} exceptionellt väder {% else %} okänt väder {% endif %}

          '
        templow: '{{ vaderprognos[''weather.smhi_farsta''].forecast[i].templow | int(default=0)
          }}'
        temphigh: '{{ vaderprognos[''weather.smhi_farsta''].forecast[i].temperature
          | int(default=0) }}'
        precipitation: '{{ vaderprognos[''weather.smhi_farsta''].forecast[i].precipitation
          | int(default=0) }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.dagens_vader_begriplig
    data:
      value: Idag kommer det bli {{ vaderdata.condition }} och temperaturen varierar
        mellan {{ vaderdata.templow }} och {{ vaderdata.temphigh }} grader
  - action: '{% if vaderdata.precipitation > 0 %} input_text.set_value {% else %}
      script.do_nothing {% endif %}

      '
    target:
      entity_id: input_text.dagens_vader_begriplig
    data:
      value: '{{ states(''input_text.dagens_vader_begriplig'') }}, och det kan komma
        {{ vaderdata.precipitation }} milimeter regn'
