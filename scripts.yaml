isabelles_rum_styr_belysningen:
  alias: Ställ in belysningen i Isabelles rum
  mode: restart
  sequence:
  - condition: template
    value_template: '{{ states(''input_select.isabelles_rum_belysning'') not in [''unknown'',
      ''unavailable'', ''none'', ''''] }}'
  - variables:
      isabelles_mode: '{{ states(''input_select.isabelles_rum_belysning'') | trim
        }}'
      light_tak: light.taklampan_isabelles_rum_level
      light_fonster: light.lamporna_i_isabelles_fonster
      light_sang: light.lamporna_ovanfor_isabelles_sang
      light_mys: light.isabelles_myslampa
      tak_available: '{{ states(light_tak) not in [''unavailable'', ''unknown''] }}'
      fonster_available: '{{ states(light_fonster) not in [''unavailable'', ''unknown'']
        }}'
      sang_available: '{{ states(light_sang) not in [''unavailable'', ''unknown'']
        }}'
      mys_available: '{{ states(light_mys) not in [''unavailable'', ''unknown''] }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ isabelles_mode == ''Städning'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_isabelles_rum_level
        data:
          brightness_pct: 100
    - conditions:
      - condition: template
        value_template: '{{ isabelles_mode == ''Tänt'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_isabelles_rum_level
      - action: '{% if fonster_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_isabelles_fonster
      - action: '{% if sang_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_isabelles_sang
      - action: '{% if mys_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.isabelles_myslampa
    - conditions:
      - condition: template
        value_template: '{{ isabelles_mode == ''Lamporna i fönstret'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_isabelles_rum_level
      - action: '{% if sang_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_isabelles_sang
      - action: '{% if mys_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.isabelles_myslampa
      - action: '{% if fonster_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_isabelles_fonster
    - conditions:
      - condition: template
        value_template: '{{ isabelles_mode == ''Sängen'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_isabelles_rum_level
      - action: '{% if fonster_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_isabelles_fonster
      - action: '{% if mys_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.isabelles_myslampa
      - action: '{% if sang_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_isabelles_sang
    - conditions:
      - condition: template
        value_template: '{{ isabelles_mode == ''Myslampan'' }}'
      sequence:
      - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.taklampan_isabelles_rum_level
      - action: '{% if fonster_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_i_isabelles_fonster
      - action: '{% if sang_available %} light.turn_off {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.lamporna_ovanfor_isabelles_sang
      - action: '{% if mys_available %} light.turn_on {% else %} script.do_nothing
          {% endif %}'
        target:
          entity_id: light.isabelles_myslampa
    default:
    - action: '{% if tak_available %} light.turn_off {% else %} script.do_nothing
        {% endif %}'
      target:
        entity_id: light.taklampan_isabelles_rum_level
    - action: '{% if fonster_available %} light.turn_off {% else %} script.do_nothing
        {% endif %}'
      target:
        entity_id: light.lamporna_i_isabelles_fonster
    - action: '{% if sang_available %} light.turn_off {% else %} script.do_nothing
        {% endif %}'
      target:
        entity_id: light.lamporna_ovanfor_isabelles_sang
    - action: '{% if mys_available %} light.turn_off {% else %} script.do_nothing
        {% endif %}'
      target:
        entity_id: light.isabelles_myslampa
media_lyssna_pa_radio:
  alias: 'Media: Lyssna på radio'
  mode: restart
  fields:
    mediadevice:
      description: 'Var radion ska spelas (måste matcha option i input_select.play_radiostation_target)

        '
      example: Morgonhögtalarna
    volym:
      description: 'Valfri volym (0.0–1.0). Om inte angiven startar radion tyst (0.0).

        '
      example: 0.1
  sequence:
  - variables:
      speaker_entity: "{% if speaker_option == 'Högtalarna i köket' %}\n  media_player.hogtalarna_i_koket\n{%
        elif speaker_option == 'Morgonhögtalarna' %}\n  media_player.morgonhogtalarna\n{%
        elif speaker_option == 'Pucken i Isabelles rum' %}\n  media_player.googlehome_isabelles_rum\n{%
        else %}\n  {{ none }}\n{% endif %}\n"
  - action: input_select.select_option
    target:
      entity_id: input_select.play_radiostation_target
    data:
      option: '{{ speaker_option }}'
  - action: media_player.volume_set
    target:
      entity_id: '{{ speaker_entity }}'
    data:
      volume_level: '{{ volym | default(0) }}'
  - action: input_select.select_option
    target:
      entity_id: input_select.play_radiostation
    data:
      option: "{% set day = now().weekday() + 1 %} {% set t = now().strftime('%H:%M:%S')
        %}\n{% if day in range(1, 6) %}\n  {% if t < '06:00:00' %}\n    Sveriges Radio
        P4 Stockholm\n  {% elif t < '11:00:00' %}\n    Sveriges Radio P1\n  {% elif
        t < '16:00:00' %}\n    Sveriges Radio P4 Stockholm\n  {% elif t < '18:15:00'
        %}\n    Sveriges Radio P1\n  {% else %}\n    Sveriges Radio P4 Stockholm\n
        \ {% endif %}\n{% elif day == 6 %}\n  Sveriges Radio P4 Stockholm\n{% else
