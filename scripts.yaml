# Ställ in belysningen i övre trappan
ovre_trappan_stall_in_belysningen:
  alias: Ställ in belysningen i övre trappan
  mode: restart
  sequence:
    - action: light.turn_on
      entity_id: light.taklampan_ovre_trappan_level
      data:
