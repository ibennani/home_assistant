      %}\n    {% if states(\"sensor.utomhus_baksidan_ljusstyrka\") | int(default=0)
      >= 2000 %} light.turn_off\n    {% else %} light.turn_on\n    {% endif %}\n  {%
      else %} light.turn_off\n  {% endif %}\n{% else %} light.turn_on {% endif %}\n"
