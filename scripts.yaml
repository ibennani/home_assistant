badrum_spara_profil:
  alias: Badrum spara ljusprofil från lampor
  description: Sparar nuvarande ljusläge för badrummets lampor till vald persons profil.
  mode: single
  fields:
    lage:
      description: besok eller dusch
      required: true
      selector:
        select:
          options:
            - besok
            - dusch
  sequence:
  - variables:
      person: "{{ states('input_select.badrum_profil_valj') }}"
      key: >-
        {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
        {{ m.get(person, 'invalid') }}
      pct_tak: >-
        {% if is_state('light.takspottar_badrummet', 'on') %}
        {{ ((state_attr('light.takspottar_badrummet', 'brightness') | int(255) * 100 / 255) | round(0) | int) }}
        {% else %}0{% endif %}
      pct_handfat: >-
        {% if is_state('light.led_badrummet_handfatet', 'on') %}
        {{ ((state_attr('light.led_badrummet_handfatet', 'brightness') | int(255) * 100 / 255) | round(0) | int) }}
        {% else %}0{% endif %}
      pct_kommod: >-
        {% if is_state('light.led_badrummet_kommoden', 'on') %}
        {{ ((state_attr('light.led_badrummet_kommoden', 'brightness') | int(255) * 100 / 255) | round(0) | int) }}
        {% else %}0{% endif %}
      pct_spegel: "{{ 100 if is_state('light.spegeln_badrummet', 'on') else 0 }}"
      pct_dusch_tak: >-
        {% if is_state('light.takspott_duschen', 'on') %}
        {{ ((state_attr('light.takspott_duschen', 'brightness') | int(255) * 100 / 255) | round(0) | int) }}
        {% else %}0{% endif %}
      pct_dusch_strip: >-
        {% if is_state('light.led_strip_i_duschen', 'on') %}
        {{ ((state_attr('light.led_strip_i_duschen', 'brightness') | int(255) * 100 / 255) | round(0) | int) }}
        {% else %}0{% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ lage == 'besok' }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_tak_pct' }}"
        data:
          value: "{{ pct_tak }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_handfat_pct' }}"
        data:
          value: "{{ pct_handfat }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_kommod_pct' }}"
        data:
          value: "{{ pct_kommod }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_spegel_pct' }}"
        data:
          value: "{{ pct_spegel }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_dusch_tak_pct' }}"
        data:
          value: "{{ pct_dusch_tak }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_besok_dusch_strip_pct' }}"
        data:
          value: "{{ pct_dusch_strip }}"
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ 'input_boolean.badrum_' ~ key ~ '_besok_profil' }}"
    - conditions:
      - condition: template
        value_template: "{{ lage == 'dusch' }}"
      sequence:
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_badrum_tak_pct' }}"
        data:
          value: "{{ pct_tak }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_handfat_pct' }}"
        data:
          value: "{{ pct_handfat }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_kommod_pct' }}"
        data:
          value: "{{ pct_kommod }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_spegel_pct' }}"
        data:
          value: "{{ pct_spegel }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_tak_pct' }}"
        data:
          value: "{{ pct_dusch_tak }}"
      - action: input_number.set_value
        target:
          entity_id: "{{ 'input_number.badrum_' ~ key ~ '_dusch_strip_pct' }}"
        data:
          value: "{{ pct_dusch_strip }}"
      - action: input_boolean.turn_on
        target:
          entity_id: "{{ 'input_boolean.badrum_' ~ key ~ '_dusch_profil' }}"
  - action: logbook.log
    data:
      name: Badrumsprofil
      message: >-
        Sparade {{ person }} {{ lage }}-profil (badrum {{ pct_tak }}/{{ pct_handfat }}/{{ pct_kommod }}/{{ pct_spegel }}%;
        dusch {{ pct_dusch_tak }}/{{ pct_dusch_strip }}%).
badrum_visa_profil:
  alias: Badrum visa sparad ljusprofil på lampor
  description: Tillämpar sparad profil på badrummets lampor för vald person.
  mode: single
  fields:
    lage:
      description: besok eller dusch
      required: true
      selector:
        select:
          options:
            - besok
            - dusch
  sequence:
  - variables:
      person: "{{ states('input_select.badrum_profil_valj') }}"
      key: >-
        {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
        {{ m.get(person, 'invalid') }}
      profil_finns: >-
        {% if key == 'invalid' %}false
        {% elif lage == 'besok' %}
        {% set nums = [
          'input_number.badrum_' ~ key ~ '_besok_tak_pct',
          'input_number.badrum_' ~ key ~ '_besok_handfat_pct',
          'input_number.badrum_' ~ key ~ '_besok_kommod_pct',
          'input_number.badrum_' ~ key ~ '_besok_spegel_pct',
          'input_number.badrum_' ~ key ~ '_besok_dusch_tak_pct',
          'input_number.badrum_' ~ key ~ '_besok_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ key ~ '_besok_profil', 'on') or ns.v }}
        {% else %}
        {% set nums = [
          'input_number.badrum_' ~ key ~ '_dusch_badrum_tak_pct',
          'input_number.badrum_' ~ key ~ '_dusch_handfat_pct',
          'input_number.badrum_' ~ key ~ '_dusch_kommod_pct',
          'input_number.badrum_' ~ key ~ '_dusch_spegel_pct',
          'input_number.badrum_' ~ key ~ '_dusch_tak_pct',
          'input_number.badrum_' ~ key ~ '_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ key ~ '_dusch_profil', 'on') or ns.v }}
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ profil_finns }}"
      sequence:
      - action: script.badrum_tillampa_profil
        data:
          lage: "{{ lage }}"
          person: "{{ person }}"
      - action: logbook.log
        data:
          name: Badrumsprofil
          message: Visade {{ person }} {{ lage }}-profil på lamporna.
    default:
    - action: logbook.log
      data:
        name: Badrumsprofil
        message: Ingen sparad {{ lage }}-profil för {{ person }}.
badrum_tom_profil:
  alias: Badrum töm sparad ljusprofil
  description: Tar bort sparad besöks- eller duschprofil för vald person.
  mode: single
