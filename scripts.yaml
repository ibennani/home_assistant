            %} \n  {% if state_attr(\"light.takspottarna_koksluckorna_level\",\"brightness\")
            | int(default = 0)  < 1 %} 0\n  {% else %} 100\n  {% endif %} \n{% elif is_state(\"input_select.house_time_modes\",\"Natt\")
            %} 0 {% else %} 0 {% endif %}        \n"
