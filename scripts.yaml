      then:
        - action: notify.mobile_app_ilias_s23_ultra
          data:
            message: "HEMMET {{ now().strftime('%R') }}: Gräsklipparen är i regnfördröjning och startade inte. Stäng av regnfördröjning i Worx-appen eller vänta tills den gått ut."
