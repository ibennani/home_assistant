      time_mode = states(\"input_select.house_time_modes\") %} {% if mode == \"Släckt\"
      %}\n  light.turn_off\n{% elif mode == \"Städning\" %}\n  light.turn_on\n{% elif
      time_mode in [\"Morgon\", \"Dag\", \"Kväll\"] %}\n  {% if mode in [\"Tänt\",
      \"Sänglamporna\"] %}\n    light.turn_on\n  {% else %}\n    light.turn_off\n
      \ {% endif %}\n{% elif time_mode == \"Natt\" %}\n  {% if mode in [\"Tänt\",
      \"Sänglamporna\"] and not is_state(\"device_tracker.ilias_s23_ultra\", \"home\")
      %}\n    light.turn_off\n  {% elif mode == \"Mysigt\" %}\n    light.turn_off\n
      \ {% else %}\n    light.turn_on\n  {% endif %}\n{% else %}\n  light.turn_off\n{%
      endif %}\n"
    entity_id: light.lampan_vid_ilias_sang
  - action: "{% set mode = states(\"input_select.sovrummet_belysning\") %} {% set
      time_mode = states(\"input_select.house_time_modes\") %} {% if mode == \"Släckt\"
      %}\n  light.turn_off\n{% elif mode == \"Städning\" %}\n  light.turn_on\n{% elif
      time_mode in [\"Morgon\", \"Dag\", \"Kväll\"] %}\n  {% if mode in [\"Tänt\",
      \"Sänglamporna\"] %}\n    light.turn_on\n  {% else %}\n    light.turn_off\n
      \ {% endif %}\n{% elif time_mode == \"Natt\" %}\n  {% if mode in [\"Tänt\",
      \"Sänglamporna\"] and not is_state(\"device_tracker.anna_s22_ultra\", \"home\")
      %}\n    light.turn_off\n  {% elif mode == \"Mysigt\" %}\n    light.turn_off\n
      \ {% else %}\n    light.turn_on\n  {% endif %}\n{% else %}\n  light.turn_off\n{%
      endif %}\n"
    entity_id: light.lampan_vid_annas_sang
  - action: "{% if states(\"input_select.sovrummet_belysning\") in [\"Tänt\", \"Mysigt\",
      \"Städning\"] %}\n  light.turn_on\n{% else %}\n  light.turn_off\n{% endif %}\n"
    entity_id: light.lampan_i_sovrumsfonstret
  - action: "{% if is_state(\"input_select.sovrummet_belysning\", \"Släckt\") and
      not is_state(\"input_select.house_time_modes\", \"Dag\") %}\n  light.turn_off\n{%
      else %}\n  script.do_nothing\n{% endif %}\n"
    entity_id:
    - light.lamporna_i_garderoben
    - light.smyckeskapet
annas_rum_stall_in_belysningen:
  alias: Ställ in belysningen i Annas rum
  mode: restart
  sequence:
  - action: "{% if states(\"input_select.annas_rum_belysning\") in [\"Släckt\",\"Mysigt\"]
      %} light.turn_off {% elif states(\"input_select.annas_rum_belysning\") in [\"Trådkorgarna
      normalbelysning\",\"Trådkorgarna maxbelysning\"] %}\n  {% if states(\"input_select.house_time_modes\")
      in [\"Morgon\",\"Kväll\"] %} light.turn_on\n  {% elif is_state(\"input_select.house_time_modes\",\"Dag\")
      %}\n    {% if states(\"sensor.utomhus_baksidan_ljusstyrka\") | int(default=0)
      >= 2000 %} light.turn_off\n    {% else %} light.turn_on\n    {% endif %}\n  {%
      else %} light.turn_off\n  {% endif %}\n{% else %} light.turn_on {% endif %}\n"
    entity_id:
    - light.lampan_i_annas_fonster
    - light.klotlampan_pa_hyllan
  - action: light.turn_on
    entity_id:
    - light.taklampan_annas_rum_level
    data:
      brightness_pct: "{% set oforandrat_ljus = (state_attr(\"light.taklampan_annas_rum_level\",\"brightness\")
        | float(default = 0.0) / 2.55 ) | float(default = 0.0) %} {% if   states(\"input_select.annas_rum_belysning\")
        in [\"Städning\"] or is_state(\"input_boolean.stadning_pagar\", \"on\") %} 100  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Släckt\"] %} 0 {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Mysigt\"] %} 0 {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Tänt\"] %} {{ oforandrat_ljus }} {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Trådkorgarna normalbelysning\"] %} {{ oforandrat_ljus }} {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Trådkorgarna maxbelysning\"] %} {{ oforandrat_ljus }} {% elif is_state(\"zone.home\",\"0\")
        \n    and is_state(\"input_select.house_time_modes\",\"Kväll\")\n    and states(\"input_select.annas_rum_belysning\")
        in [\"Tänt\"]  %} 10\n{% else %} {{ oforandrat_ljus }} {% endif %}\n"
  - action: script.turn_on
    target:
      entity_id: script.stall_in_ljuset_i_annas_myshorna
  - action: light.turn_on
    entity_id:
    - light.led_bakom_meshkorgarna
    data:
      brightness_pct: '{% if is_state("input_boolean.stadning_pagar","on") %} 100   {%
        elif states("input_select.annas_rum_belysning") in ["Städning"] %} 100  {%
        elif states("input_select.annas_rum_belysning") in ["Tänt"] %} 1  {% elif
        states("input_select.annas_rum_belysning") in ["Trådkorgarna normalbelysning"]
        %} 1  {% elif states("input_select.annas_rum_belysning") in ["Trådkorgarna
        maxbelysning"] %} 20   {% elif states("input_select.annas_rum_belysning")
        in ["Mysigt"] %} 0  {% elif states("input_select.annas_rum_belysning") in
        ["Släckt"] %} 0  {% endif %}

        '
      rgbw_color: "{% if is_state(\"input_boolean.stadning_pagar\",\"on\") %} [0,
        0, 0, 255]  {% elif states(\"input_select.annas_rum_belysning\") in [\"Städning\"]
        %} [0, 0, 0, 255]  {% elif states(\"input_select.annas_rum_belysning\") in
        [\"Tänt\"] %} [0, 0, 0, 150]  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Trådkorgarna normalbelysning\"] %} [0, 0, 0, 150]  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Trådkorgarna maxbelysning\"] %} [0, 0, 0, 255]  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Mysigt\"] %} [0, 0, 0, 100]  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Släckt\"] %} [0, 0, 0, 100]  {% endif %} \n"
      transition: 2
stall_in_ljuset_i_annas_myshorna:
  alias: Ställ in ljuset i Annas myshörna
  mode: restart
  sequence:
  - action: light.turn_on
    entity_id:
    - light.annas_myshorna
    data:
      brightness_pct: "{% if states(\"input_select.annas_rum_belysning\") in [\"Städning\"]
        %} 100  {% elif is_state(\"input_select.annas_rum_belysning\",\"Trådkorgarna
        maxbelysning\") %} 100  {% elif states(\"input_select.annas_rum_belysning\")
        in [\"Tänt\",\"Trådkorgarna normalbelysning\"] %}\n  {% set ljus_baksidan
        = states(\"sensor.utomhus_baksidan_ljusstyrka\") | int(default=0) %}\n  {%
        if ljus_baksidan >= 2000 %} 50\n  {% elif ljus_baksidan >= 1000 and ljus_baksidan
        < 2000 %} 25\n  {% elif ljus_baksidan < 1000 %} 15\n  {% else %} 0\n  {% endif
        %}\n{% elif is_state(\"input_select.annas_rum_belysning\",\"Mysigt\") %} 15
        \ {% else %} 0  {% endif %}\n"
      color_temp_kelvin: '{% if states("input_select.annas_rum_belysning") in ["Städning"]
        %} 3900  {% elif is_state("input_select.annas_rum_belysning","Trådkorgarna
        normalbelysning") %} 2000  {% elif is_state("input_select.annas_rum_belysning","Trådkorgarna
        maxbelysning") %} 3900  {% elif is_state("input_select.annas_rum_belysning","Tänt")
        %} 2000  {% elif is_state("input_select.annas_rum_belysning","Mysigt") %}
        2000  {% else %} 2000 {% endif %}

        '
      transition: 1
nedre_trappan_stall_in_belysningen:
  alias: 'Belysning: Ställ in belysningen i nedre trappan'
  mode: queued
  sequence:
  - variables:
      mode: '{{ states(''input_select.nedre_trappan_belysning'') }}'
      huslage: '{{ states(''input_select.house_time_modes'') }}'
      eriks_rum: '{{ states(''input_select.eriks_rum_belysning'') }}'
      jul: '{{ is_state(''input_boolean.julbelysning'',''on'') }}'
      lux: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) }}'
      ingen_rorelse_5min: '{{ is_state(''binary_sensor.nedre_trappan_rorelse'',''off'')
        and ((now() - (state_attr(''binary_sensor.nedre_trappan_rorelse'', ''last_changed'') or now())).total_seconds()
        > 5 * 60) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Städning'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.taklampan_nedre_trappan_level
        data:
          brightness_pct: 100
      - action: light.turn_on
        target:
          entity_id: light.lampan_brudkistan
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Släckt'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.taklampan_nedre_trappan_level
          - light.lampan_brudkistan
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Tänt'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''zone.home'',''0'') }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ huslage == ''Kväll'' }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_nedre_trappan_level
                data:
                  brightness_pct: 1
            default:
            - action: light.turn_off
              target:
                entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_off
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Natt'' }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.taklampan_nedre_trappan_level
              - light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ jul and huslage in [''Morgon'',''Dag'',''Kväll'']
              }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Morgon'' and lux < 2000 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.taklampan_nedre_trappan_level
            data:
              brightness_pct: 1
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Dag'' }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ lux < 2000 }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_nedre_trappan_level
                data:
                  brightness_pct: 1
            default:
            - action: light.turn_off
              target:
                entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Kväll'' and eriks_rum in [''Minimalt'',''Släckt'']
              }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.taklampan_nedre_trappan_level
              - light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Kväll'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.taklampan_nedre_trappan_level
            data:
              brightness_pct: 1
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        default:
        - action: light.turn_off
          target:
            entity_id:
            - light.taklampan_nedre_trappan_level
            - light.lampan_brudkistan
    default:
    - action: light.turn_off
      target:
        entity_id:
        - light.taklampan_nedre_trappan_level
        - light.lampan_brudkistan
eriks_rum_satt_lage:
  alias: Sätt belysningsläge i Eriks rum
  mode: restart
  description: Sätter input_select och applicerar läget på lamporna (skydd när Erik hemma och gardin nere)
  fields:
    lage:
      description: Belysningsläge i Eriks rum
      example: Mysigt
    force:
      name: Tvinga
      description: Kringgår automat-skydd för lampstyrning (manuell kontroll)
      default: false
      selector:
        boolean: {}
  sequence:
  - variables:
      far_styra_lampor: >-
        {{ (force | default(false) | bool)
           or is_state('binary_sensor.eriks_rum_automation_far_styra_lampor', 'on') }}
      effective_lage: >-
        {% if far_styra_lampor %}
          {{ lage }}
        {% else %}
          {{ states('input_select.eriks_rum_belysning') }}
        {% endif %}
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: '{{ effective_lage }}'
  - action: script.turn_on
    target:
      entity_id: script.eriks_rum_stall_in_belysningen
    data:
      variables:
        force: '{{ force | default(false) }}'
eriks_rum_satt_lage_ui:
  alias: Uppdatera bara belysningsläge i Eriks rum
  mode: queued
  description: Sätter input_select utan att styra lamporna (används vid väggbrytare)
  fields:
    lage:
      description: Belysningsläge i Eriks rum
      example: Tänt
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.eriks_rum_uppdaterar_lage
  - action: input_select.select_option
    target:
      entity_id: input_select.eriks_rum_belysning
    data:
      option: '{{ lage }}'
  - delay: '00:00:02'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.eriks_rum_uppdaterar_lage
# YAML-nyckel måste matcha unique_id i entitetsregistret (albins → eriks rename).
albins_rum_stall_in_belysningen:
  alias: Ställ in belysningen i Eriks rum
  mode: restart
  fields:
    force:
      name: Tvinga lampstyrning
      description: Kringgår skydd (manuell fjärr, väggbrytare, UI)
      default: false
      selector:
        boolean: {}
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: >-
          {{ (force | default(false) | bool)
             or is_state('binary_sensor.eriks_rum_automation_far_styra_lampor', 'on') }}
      sequence:
      - choose:
        - conditions:
          - condition: template
