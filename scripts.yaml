        %} 100  {% elif is_state(\"input_select.eriks_rum_belysning\",\"Trådkorgarna
        maxbelysning\") %} 100  {% elif states(\"input_select.eriks_rum_belysning\")
        in [\"Tänt\",\"Trådkorgarna normalbelysning\"] %}\n  {% set ljus_baksidan
        = states(\"sensor.utomhus_baksidan_ljusstyrka\") | int(default=0) %}\n  {%
        if ljus_baksidan >= 2000 %} 50\n  {% elif ljus_baksidan >= 1000 and ljus_baksidan
        < 2000 %} 25\n  {% elif ljus_baksidan < 1000 %} 15\n  {% else %} 0\n  {% endif
        %}\n{% elif is_state(\"input_select.eriks_rum_belysning\",\"Mysigt\") %} 15
        \ {% else %} 0  {% endif %}\n"
      color_temp_kelvin: '{% if states("input_select.eriks_rum_belysning") in ["Städning"]
        %} 3900  {% elif is_state("input_select.eriks_rum_belysning","Trådkorgarna
        normalbelysning") %} 2000  {% elif is_state("input_select.eriks_rum_belysning","Trådkorgarna
        maxbelysning") %} 3900  {% elif is_state("input_select.eriks_rum_belysning","Tänt")
        %} 2000  {% elif is_state("input_select.eriks_rum_belysning","Mysigt") %}
        2000  {% else %} 2000 {% endif %}

        '
      transition: 1
nedre_trappan_stall_in_belysningen:
  alias: 'Belysning: Ställ in belysningen i nedre trappan'
  mode: queued
  sequence:
  - variables:
      mode: '{{ states(''input_select.nedre_trappan_belysning'') }}'
      huslage: '{{ states(''input_select.house_time_modes'') }}'
      albins_rum: '{{ states(''input_select.albins_rum_belysning'') }}'
      jul: '{{ is_state(''input_boolean.julbelysning'',''on'') }}'
      lux: '{{ states(''sensor.utomhus_framsidan_ljusstyrka'') | int(0) }}'
      ingen_rorelse_5min: '{{ is_state(''binary_sensor.nedre_trappan_rorelse'',''off'')
        and ((now() - (state_attr(''binary_sensor.nedre_trappan_rorelse'', ''last_changed'') or now())).total_seconds()
        > 5 * 60) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Städning'' }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.taklampan_nedre_trappan_level
        data:
          brightness_pct: 100
      - action: light.turn_on
        target:
          entity_id: light.lampan_brudkistan
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Släckt'' }}'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.taklampan_nedre_trappan_level
          - light.lampan_brudkistan
    - conditions:
      - condition: template
        value_template: '{{ mode == ''Tänt'' }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_state(''zone.home'',''0'') }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ huslage == ''Kväll'' }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_nedre_trappan_level
                data:
                  brightness_pct: 1
            default:
            - action: light.turn_off
              target:
                entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_off
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Natt'' }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.taklampan_nedre_trappan_level
              - light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ jul and huslage in [''Morgon'',''Dag'',''Kväll'']
              }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Morgon'' and lux < 2000 }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.taklampan_nedre_trappan_level
            data:
              brightness_pct: 1
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Dag'' }}'
          sequence:
          - choose:
            - conditions:
              - condition: template
                value_template: '{{ lux < 2000 }}'
              sequence:
              - action: light.turn_on
                target:
                  entity_id: light.taklampan_nedre_trappan_level
                data:
                  brightness_pct: 1
            default:
            - action: light.turn_off
              target:
                entity_id: light.taklampan_nedre_trappan_level
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Kväll'' and albins_rum in [''Minimalt'',''Släckt'']
              }}'
          sequence:
          - action: light.turn_off
            target:
              entity_id:
              - light.taklampan_nedre_trappan_level
              - light.lampan_brudkistan
        - conditions:
          - condition: template
            value_template: '{{ huslage == ''Kväll'' }}'
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.taklampan_nedre_trappan_level
            data:
              brightness_pct: 1
          - action: light.turn_on
            target:
              entity_id: light.lampan_brudkistan
        default:
        - action: light.turn_off
          target:
            entity_id:
            - light.taklampan_nedre_trappan_level
            - light.lampan_brudkistan
    default:
    - action: light.turn_off
      target:
        entity_id:
        - light.taklampan_nedre_trappan_level
        - light.lampan_brudkistan
albins_rum_stall_in_belysningen:
