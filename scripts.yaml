          entity_id: "{{ 'input_boolean.badrum_' ~ key ~ '_dusch_profil' }}"
      - action: input_number.set_value
        target:
          entity_id:
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_badrum_tak_pct' }}"
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_handfat_pct' }}"
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_kommod_pct' }}"
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_spegel_pct' }}"
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_tak_pct' }}"
          - "{{ 'input_number.badrum_' ~ key ~ '_dusch_strip_pct' }}"
        data:
          value: 0
  - action: logbook.log
    data:
      name: Badrumsprofil
      message: Tömde {{ person }} {{ lage }}-profil.
badrum_tillampa_profil:
  alias: Badrum tillämpa sparad ljusprofil
  description: Tillämpar sparad normalt- eller duschprofil för vald person.
  mode: single
  fields:
    lage:
      description: besok eller dusch
      required: true
      selector:
        select:
          options:
            - besok
            - dusch
    endast_dusch_ljus:
      description: Endast dusch-tak och strip
      required: false
      default: false
      selector:
        boolean:
    utan_dusch_ljus:
      description: Endast badrumslampor (ej dusch)
      required: false
      default: false
      selector:
        boolean:
    transition:
      description: Fade i sekunder
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
    person:
      description: Valfri person (Anna, Erik, Ilias). Om tom används badrummet_vem.
      required: false
      selector:
        select:
          options:
            - Anna
            - Ilias
            - Erik
  sequence:
  - variables:
      person_val: "{{ person | default(states('input_select.badrummet_vem'), true) }}"
      key: >-
        {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
        {{ m.get(person_val, 'invalid') }}
      bara_dusch: "{{ endast_dusch_ljus | default(false) }}"
      utan_dusch: "{{ utan_dusch_ljus | default(false) }}"
      fade: "{{ transition | default(0) | int }}"
      profil_finns: >-
        {% if key == 'invalid' %}false
        {% elif lage == 'besok' %}
        {% set nums = [
          'input_number.badrum_' ~ key ~ '_besok_tak_pct',
          'input_number.badrum_' ~ key ~ '_besok_handfat_pct',
          'input_number.badrum_' ~ key ~ '_besok_kommod_pct',
          'input_number.badrum_' ~ key ~ '_besok_spegel_pct',
          'input_number.badrum_' ~ key ~ '_besok_dusch_tak_pct',
          'input_number.badrum_' ~ key ~ '_besok_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ key ~ '_besok_profil', 'on') or ns.v }}
        {% else %}
        {% set nums = [
          'input_number.badrum_' ~ key ~ '_dusch_badrum_tak_pct',
          'input_number.badrum_' ~ key ~ '_dusch_handfat_pct',
          'input_number.badrum_' ~ key ~ '_dusch_kommod_pct',
          'input_number.badrum_' ~ key ~ '_dusch_spegel_pct',
          'input_number.badrum_' ~ key ~ '_dusch_tak_pct',
          'input_number.badrum_' ~ key ~ '_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ key ~ '_dusch_profil', 'on') or ns.v }}
        {% endif %}
  - condition: template
    value_template: "{{ profil_finns }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ lage == 'besok' }}"
      sequence:
      - variables:
          pct_badrum_tak: "{{ states('input_number.badrum_' ~ key ~ '_besok_tak_pct') | int(0) }}"
          pct_handfat: "{{ states('input_number.badrum_' ~ key ~ '_besok_handfat_pct') | int(0) }}"
          pct_kommod: "{{ states('input_number.badrum_' ~ key ~ '_besok_kommod_pct') | int(0) }}"
          pct_spegel: "{{ states('input_number.badrum_' ~ key ~ '_besok_spegel_pct') | int(0) }}"
          pct_dusch_tak: "{{ states('input_number.badrum_' ~ key ~ '_besok_dusch_tak_pct') | int(0) }}"
          pct_dusch_strip: "{{ states('input_number.badrum_' ~ key ~ '_besok_dusch_strip_pct') | int(0) }}"
    default:
    - variables:
        pct_badrum_tak: "{{ states('input_number.badrum_' ~ key ~ '_dusch_badrum_tak_pct') | int(0) }}"
        pct_handfat: "{{ states('input_number.badrum_' ~ key ~ '_dusch_handfat_pct') | int(0) }}"
        pct_kommod: "{{ states('input_number.badrum_' ~ key ~ '_dusch_kommod_pct') | int(0) }}"
        pct_spegel: "{{ states('input_number.badrum_' ~ key ~ '_dusch_spegel_pct') | int(0) }}"
        pct_dusch_tak: "{{ states('input_number.badrum_' ~ key ~ '_dusch_tak_pct') | int(0) }}"
        pct_dusch_strip: "{{ states('input_number.badrum_' ~ key ~ '_dusch_strip_pct') | int(0) }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ not bara_dusch }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_badrum_tak | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.takspottar_badrummet
            data:
              brightness_pct: "{{ pct_badrum_tak }}"
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.takspottar_badrummet
          data:
            transition: "{{ fade }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_handfat | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.led_badrummet_handfatet
            data:
              brightness_pct: "{{ pct_handfat }}"
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.led_badrummet_handfatet
          data:
            transition: "{{ fade }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_kommod | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.led_badrummet_kommoden
            data:
              brightness_pct: "{{ pct_kommod }}"
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.led_badrummet_kommoden
          data:
            transition: "{{ fade }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_spegel | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.spegeln_badrummet
            data:
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.spegeln_badrummet
          data:
            transition: "{{ fade }}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ not utan_dusch }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_dusch_tak | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.takspott_duschen
            data:
              brightness_pct: "{{ pct_dusch_tak }}"
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.takspott_duschen
          data:
            transition: "{{ fade }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ pct_dusch_strip | int > 0 }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.led_strip_i_duschen
            data:
              brightness_pct: "{{ pct_dusch_strip }}"
              transition: "{{ fade }}"
        default:
        - action: light.turn_off
          target:
            entity_id: light.led_strip_i_duschen
          data:
            transition: "{{ fade }}"
  - action: logbook.log
    data:
      name: Badrumsprofil
      message: Tillämpade {{ person_val }} {{ lage }}-profil i badrummet.
badrum_default_besok:
  alias: Badrum default besöksbelysning (lux/natt)
  description: Lux/natt för badrumslampor; valfritt även dusch-tak/strip.
  mode: single
  fields:
    transition:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
    endast_dusch_ljus:
      required: false
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      fade: "{{ transition | default(0) | int }}"
      bara_dusch: "{{ endast_dusch_ljus | default(false) }}"
      is_night: '{{ is_state(''input_select.house_time_modes'', ''Natt'') }}'
      lux: "{{ states('sensor.utomhus_framsidan_ljusstyrka') | int(0) }}"
      is_cleaning: '{{ is_state(''input_boolean.stadning_pagar'', ''on'') }}'
      day_brightness: "{% if is_cleaning %}100{% elif lux < 300 %}30{% elif lux <= 2000 %}35{% elif lux <= 13000 %}40{% else %}99{% endif %}"
      dusch_brightness: '{{ 20 if (lux | int(0)) < 2000 else 30 }}'
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ bara_dusch }}"
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ not is_night }}"
          sequence:
          - action: light.turn_on
            target:
              entity_id:
              - light.takspott_duschen
              - light.led_strip_i_duschen
            data:
              brightness_pct: '{{ dusch_brightness }}'
              transition: "{{ fade }}"
    default:
    - choose:
      - conditions:
        - condition: template
          value_template: '{{ is_night }}'
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.led_badrummet_kommoden
          data:
            brightness_pct: 2
            transition: "{{ fade }}"
      default:
      - action: light.turn_on
        target:
          entity_id:
          - light.takspottar_badrummet
          - light.led_badrummet_handfatet
          - light.led_badrummet_kommoden
        data:
          brightness_pct: '{{ day_brightness }}'
          transition: "{{ fade }}"
    - choose:
      - conditions:
        - condition: template
          value_template: "{{ not is_night }}"
        sequence:
        - action: light.turn_on
          target:
            entity_id:
            - light.takspott_duschen
            - light.led_strip_i_duschen
          data:
            brightness_pct: '{{ dusch_brightness }}'
            transition: "{{ fade }}"
badrum_default_dusch:
  alias: Badrum default duschläge (duschslackning)
  description: Släcker badrumslampor utanför duschen; duschlampor oförändrade.
  mode: single
  fields:
    transition:
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
  sequence:
  - variables:
      fade: "{{ transition | default(5) | int }}"
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.duschslackning_aktiv
  - action: light.turn_off
    target:
      entity_id:
      - light.spegeln_badrummet
      - light.takspottar_badrummet
      - light.led_badrummet_handfatet
      - light.led_badrummet_kommoden
    data:
      transition: "{{ fade }}"
badrum_besok_eller_default:
  alias: Badrum besök — profil eller default
  description: Sparad besöksprofil om den finns, annars lux/natt-default.
  mode: single
  fields:
    transition:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 30
          step: 1
    endast_dusch_ljus:
      required: false
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      person_key: >-
        {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
        {{ m.get(states('input_select.badrummet_vem'), 'invalid') }}
      besok_profil_finns: >-
        {% if person_key == 'invalid' %}false
        {% else %}
        {% set nums = [
          'input_number.badrum_' ~ person_key ~ '_besok_tak_pct',
          'input_number.badrum_' ~ person_key ~ '_besok_handfat_pct',
          'input_number.badrum_' ~ person_key ~ '_besok_kommod_pct',
          'input_number.badrum_' ~ person_key ~ '_besok_spegel_pct',
          'input_number.badrum_' ~ person_key ~ '_besok_dusch_tak_pct',
          'input_number.badrum_' ~ person_key ~ '_besok_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ person_key ~ '_besok_profil', 'on') or ns.v }}
        {% endif %}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.duschslackning_aktiv
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ besok_profil_finns }}"
      sequence:
      - action: script.badrum_tillampa_profil
        data:
          lage: besok
          endast_dusch_ljus: "{{ endast_dusch_ljus | default(false) }}"
          transition: "{{ transition | default(0) | int }}"
    default:
    - action: script.badrum_default_besok
      data:
        endast_dusch_ljus: "{{ endast_dusch_ljus | default(false) }}"
        transition: "{{ transition | default(0) | int }}"
badrum_dusch_eller_default:
  alias: Badrum dusch — profil eller default
  description: Sparad duschprofil om den finns, annars duschslackning.
  mode: single
  fields:
    transition:
      required: false
      default: 5
      selector:
        number:
          min: 0
          max: 30
          step: 1
  sequence:
  - variables:
      person_key: >-
        {% set m = {'Anna': 'anna', 'Ilias': 'ilias', 'Erik': 'erik'} %}
        {{ m.get(states('input_select.badrummet_vem'), 'invalid') }}
      dusch_profil_finns: >-
        {% if person_key == 'invalid' %}false
        {% else %}
        {% set nums = [
          'input_number.badrum_' ~ person_key ~ '_dusch_badrum_tak_pct',
          'input_number.badrum_' ~ person_key ~ '_dusch_handfat_pct',
          'input_number.badrum_' ~ person_key ~ '_dusch_kommod_pct',
          'input_number.badrum_' ~ person_key ~ '_dusch_spegel_pct',
          'input_number.badrum_' ~ person_key ~ '_dusch_tak_pct',
          'input_number.badrum_' ~ person_key ~ '_dusch_strip_pct'
        ] %}
        {% set ns = namespace(v=false) %}
        {% for e in nums %}{% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}{% endfor %}
        {{ is_state('input_boolean.badrum_' ~ person_key ~ '_dusch_profil', 'on') or ns.v }}
        {% endif %}
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ dusch_profil_finns }}"
      sequence:
      - action: script.badrum_tillampa_profil
        data:
          lage: dusch
          transition: "{{ transition | default(5) | int }}"
    default:
    - action: script.badrum_default_dusch
      data:
        transition: "{{ transition | default(5) | int }}"
badrum_synka_profil_flaggor:
  alias: Badrum synka profil-flaggor från sparade värden
  description: Återställer input_boolean profil-flaggor från input_number efter omstart.
  mode: single
  sequence:
  - repeat:
      for_each:
        - key: anna
        - key: ilias
        - key: erik
      sequence:
      - variables:
          besok_nums: >-
            {{ [
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_tak_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_handfat_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_kommod_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_spegel_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_dusch_tak_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_besok_dusch_strip_pct'
            ] }}
          dusch_nums: >-
            {{ [
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_badrum_tak_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_handfat_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_kommod_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_spegel_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_tak_pct',
              'input_number.badrum_' ~ repeat.item.key ~ '_dusch_strip_pct'
            ] }}
          besok_har: >-
            {% set ns = namespace(v=false) %}
            {% for e in besok_nums %}
              {% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}
            {% endfor %}
            {{ ns.v }}
          dusch_har: >-
            {% set ns = namespace(v=false) %}
            {% for e in dusch_nums %}
              {% if states(e) | float(0) > 0 %}{% set ns.v = true %}{% endif %}
            {% endfor %}
            {{ ns.v }}
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ besok_har }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ 'input_boolean.badrum_' ~ repeat.item.key ~ '_besok_profil' }}"
        default:
        - action: input_boolean.turn_off
          target:
            entity_id: "{{ 'input_boolean.badrum_' ~ repeat.item.key ~ '_besok_profil' }}"
      - choose:
        - conditions:
          - condition: template
            value_template: "{{ dusch_har }}"
          sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: "{{ 'input_boolean.badrum_' ~ repeat.item.key ~ '_dusch_profil' }}"
        default:
        - action: input_boolean.turn_off
          target:
            entity_id: "{{ 'input_boolean.badrum_' ~ repeat.item.key ~ '_dusch_profil' }}"
spion_uppdatera_ilias_position:
  alias: 'Spion: Uppdatera Ilias GPS-position'
  mode: single
  sequence:
  - action: notify.mobile_app_ilias_s23_ultra
    data:
      message: request_location_update
      data:
        priority: high
        ttl: 0
  - action: browser_mod.notification
    data:
      message: Uppdaterar positioner
