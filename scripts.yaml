        {% if states("input_select.albins_rum_belysning") in ["Släckt"]
          and now().strftime('%R') >= "21:00" %} light.turn_off
        {% else %} script.do_nothing
        {% endif %}
      entity_id:
        - light.taklampan_nedre_trappan_level
      


# Ställ in belysningen i badrummet
badrummet_stall_in_belysningen:
  alias: Ställ in belysningen i badrummet
  mode: restart
  sequence:
    - action: light.turn_on
      entity_id: light.vagglampor_badrummet
      data:
        brightness_pct: >
          {% if is_state("input_boolean.stadning_pagar", "on") %} 100
          {% elif is_state("input_boolean.stadning_pagar", "off") and is_state("input_select.house_time_modes", "Natt") and states("sensor.utomhus_baksidan_ljusstyrka") | int(default=0) < 50 %} 0
          {% else %}
            {% if is_state("input_select.house_time_modes","Morgon") %}
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) < 100 %} 20
              {% else %} 40
              {% endif %}
            {% elif is_state("input_select.house_time_modes","Dag") %} 
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) > 2000 %} 100
              {% else %} 50
              {% endif %}
            {% elif is_state("input_select.house_time_modes","Kväll") %} 
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) > 300 %} 50
              {% else %} 40
              {% endif %}
            {% elif is_state("input_select.house_time_modes","Natt") %} 
              {% if states("sensor.utomhus_baksidan_ljusstyrka") | int(default = 0) > 300 %} 50
              {% else %} 15
              {% endif %}
            {% else %} 40
            {% endif %}
          {% endif %}
        transition: >
            {{ transition }} 
    - action: light.turn_on  
      target: 
        entity_id: light.taklampan_badrummet
      data: 
        brightness_pct: >
          {% if state_attr('light.vagglampor_badrummet', 'brightness') | int >= (255 * 0.3) %}
            {{ (state_attr('light.vagglampor_badrummet', 'brightness') / 255 * 100) | int }}
          {% else %}
            0
          {% endif %}
        transition: 1        



