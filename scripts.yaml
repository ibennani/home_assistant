  alias: "Styr belysningen när alla gått hemifrån"
  mode: restart 
  sequence: 
    # Isabelles rum
    - action: input_select.select_option
      target:
        entity_id: input_select.isabelles_rum_belysning
      data:
        option: >
          {% if   is_state("input_boolean.stastadning_pagar","on") %} Städning
          {% elif states("input_select.house_time_modes") in ["Morgon","Dag","Natt"] %} Släckt
