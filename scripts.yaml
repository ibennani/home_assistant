        | int(default=0) %}\n  {% if ljusstyrka > 2000 %}\n    {% if is_state(\"input_boolean.julbelysning\",
        \"on\") %}\n      30\n    {% else %}\n      0\n    {% endif %}\n  {% elif
        ljusstyrka > 1000 %}\n    {% if is_state(\"input_boolean.julbelysning\", \"on\")
        %}\n      30\n    {% else %}\n      0\n    {% endif %}\n  {% elif ljusstyrka
        > 300 %}\n    25\n  {% elif ljusstyrka > 100 %}\n    20\n  {% elif ljusstyrka
        > 10 %}\n    15\n  {% else %}\n    10\n  {% endif %}\n{% else %}\n  0\n{%
        endif %}\n"
      transition: 3
sovrummet_stall_in_belysningen:
  alias: Ställ in belysningen i sovrummet
  mode: restart
  sequence:
  - action: light.turn_on
    entity_id: light.taklampa_sovrummet_level
    data:
      brightness: "{% set current_brightness = state_attr(\"light.taklampa_sovrummet_level\",
        \"brightness\") | float(default=0.0) / 2.55 %} {% set mode = states(\"input_select.sovrummet_belysning\")
        %} {% if mode == \"Städning\" or is_state(\"input_boolean.stadning_pagar\", \"on\") %}\n  255\n{% elif mode in [\"Mysigt\", \"Släckt\"]
