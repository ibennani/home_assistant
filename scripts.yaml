          {% else %} Tänt
          {% endif %}
    - action: script.turn_on
      target:
        entity_id: script.sovrummet_stall_in_belysningen
    # Eriks rum
    - action: input_select.select_option
      target:
        entity_id: input_select.eriks_rum_belysning
      data:
