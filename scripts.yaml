# Läs upp text i valfri högtalare eller grupp
las_text_i_valfri_device:
  alias: "Läs upp text i valfri högtalare eller grupp"
  mode: restart
  description: Läs upp i valfri puck, högtalare eller grupp av högtalare
  sequence:    
    - action: >
        {% if hogtalare in ["media_player.googlehome_infopuckarna",
                            "media_player.googlehome_alla_puckar",
                            "media_player.alla_hogtalare",
                            "media_player.de_basta_hogtalarna"] %} script.do_nothing
        {% else %} script.tysta_kopplingspling_vid_casting
        {% endif %}
      data:
        hogtalare: '{{ hogtalare }}'
    - action: media_player.volume_set
      data: 
        entity_id: >
          {% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.infopuckarna_ha_grupp
          {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar_ha_grupp
          {% elif hogtalare == "media_player.alla_hogtalare" %} media_player.alla_hogtalare_ha_grupp
          {% elif hogtalare == "media_player.de_basta_hogtalarna" %} media_player.de_basta_hogtalarna_ha_grupp
          {% else %} {{ hogtalare }}
          {% endif %}
        volume_level: "{{ volym }}"            

    - wait_template: >
        {{ not is_state('' ~ hogtalare ~ '','unavailable') }}
      timeout: "00:00:30"
      continue_on_timeout: false

    - action: tts.speak 
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: >
          {{ hogtalare }}
        message:  >-
          {{ meddelande }}
        options:
          voice: '{{ voice }}'
        language: >
          {% if sprak == "" %} sv-SE
          {% else %} {{ sprak }}
          {% endif %}
  #  - delay: "00:00:01"    
    # - wait_template: >
    #     {{ states('media_player.' ~ hogtalare) == 'idle' and 
    #       state_attr('media_player.' ~ hogtalare, 'previous_state') == 'playing' }}
    #   timeout: "00:00:30"
    #   continue_on_timeout: false

    - wait_template: >
        {{ is_state('' ~ hogtalare ~ '','playing') }}
      timeout: "00:00:30"
      continue_on_timeout: false

    - wait_template: >
        {{ is_state('' ~ hogtalare ~ '', 'idle') and not is_state('' ~ hogtalare ~ '', 'playing') }}
      timeout: "00:00:30"
      continue_on_timeout: false

    - action: media_player.volume_set
      data: 
        entity_id: >
          {% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.infopuckarna
          {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar
          {% else %} {{ hogtalare }}
          {% endif %}
        volume_level: '{{ (states("input_number.google_home_volume_setting_notiser") | float(default = 0) / 100) }}'



        
# Ta bort plinget som hörs i början när man castar till en Chromecast eller Google home nest
tysta_kopplingspling_vid_casting:
  alias: "Tysta kopplingspling vid casting"
  mode: parallel
  description: Ta bort plinget som hörs i början när man castar till en Chromecast eller Google home nest
  sequence:    
    - action: media_player.volume_mute
      data:
        is_volume_muted: true
      target:
        entity_id: >
          {% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.googlehome_infopuckarna
          {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar_ha_grupp
          {% elif hogtalare == "media_player.alla_hogtalare" %} media_player.alla_hogtalare
          {% elif hogtalare == "media_player.de_basta_hogtalarna" %} media_player.de_basta_hogtalarna
          {% else %} {{ hogtalare }}
          {% endif %}
    - action: media_player.turn_on
      target:
        entity_id: >
          {% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.googlehome_infopuckarna
          {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar_ha_grupp
          {% elif hogtalare == "media_player.alla_hogtalare" %} media_player.alla_hogtalare
          {% elif hogtalare == "media_player.de_basta_hogtalarna" %} media_player.de_basta_hogtalarna
          {% else %} {{ hogtalare }}
          {% endif %}
    - wait_template: "{{ state_attr( hogtalare , 'is_volume_muted' ) == true }}"   
    - wait_template: "{{ is_state( hogtalare , 'idle') }}"
    - condition: template
      value_template: >
        {{ is_state( hogtalare , 'idle') }}
    - delay: "00:00:00.600"
    - action: media_player.volume_mute
      data:
        entity_id: >
          {% if hogtalare == "media_player.googlehome_infopuckarna" %} media_player.googlehome_infopuckarna
          {% elif hogtalare == "media_player.googlehome_alla_puckar" %} media_player.alla_puckar_ha_grupp
          {% elif hogtalare == "media_player.alla_hogtalare" %} media_player.alla_hogtalare
          {% elif hogtalare == "media_player.de_basta_hogtalarna" %} media_player.de_basta_hogtalarna
          {% else %} {{ hogtalare }}
          {% endif %}
        is_volume_muted: false   



