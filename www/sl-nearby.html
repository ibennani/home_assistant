<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SL närmaste hållplatser</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: var(--ha-font-family-body, Roboto, sans-serif);
    }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--card-background-color, #1c1c1c);
      color: var(--primary-text-color, #e0e0e0);
    }
    .wrap { min-height: 100%; padding-bottom: 32px; }
    .header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 14px 16px;
      font-size: 0.9rem;
      color: var(--secondary-text-color, #9e9e9e);
      background: var(--card-background-color, #1c1c1c);
      border-bottom: 1px solid var(--divider-color, rgba(255,255,255,.12));
    }
    .header strong { color: var(--primary-text-color, #e0e0e0); }
    .status {
      padding: 16px;
      color: var(--secondary-text-color, #9e9e9e);
    }
    .status.error { color: var(--error-color, #f44336); }
    .stop-accordion { border-top: 1px solid var(--divider-color, rgba(255,255,255,.12)); }
    .stop-summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
    }
    .stop-summary::-webkit-details-marker { display: none; }
    .stop-summary::after { content: "▾"; color: var(--secondary-text-color, #9e9e9e); }
    details[open] > .stop-summary::after { transform: rotate(180deg); }
    .stop-name { font-weight: 500; }
    .stop-distance { color: var(--secondary-text-color, #9e9e9e); white-space: nowrap; }
    .stop-body { padding: 0 8px 12px; }
    .departures-empty, .departures-error { padding: 8px 16px 12px; color: var(--secondary-text-color, #9e9e9e); }
    .departures-error { color: var(--error-color, #f44336); }
    .row { margin-top: 8px; display: flex; justify-content: space-between; }
    .col { display: flex; flex-direction: column; justify-content: center; }
    .col.icon { flex-basis: 40px; }
    .main { flex: 2; }
    .row.header { opacity: .7; font-size: .95rem; }
    .line-icon {
      border-radius: 3px;
      padding: 3px;
      min-width: 22px;
      height: 22px;
      font-weight: 500;
      display: inline-block;
      text-align: center;
      color: #fff;
    }
    .bus_red { background: #9e0e13; }
    .train { background: #ec619f; }
    .tram { background: #985141; }
    .metro { background: #0061eb; }
    .stop-info {
      margin: 0 8px 8px;
      padding: 8px 12px 0;
      font-size: smaller;
      color: #fad370;
      border-top: 1px solid var(--divider-color, rgba(255,255,255,.12));
    }
    .cancelled-time { color: #e53935; font-weight: 600; }
    .left { text-align: left; }
    .right { text-align: right; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="status">Startar…</div>
  </div>
  <script>
    (function () {
      var SCRIPT_ENTITY = "script.sl_hamta_avgangar_for_hallplats";
      var params = new URLSearchParams(window.location.search);
      var locationEntity = params.get("entity") || "person.ilias_bennani";
      var homeZoneEntity = params.get("home") || "zone.home";
      var maxStops = Number(params.get("max") || 20);
      var forecastMinutes = Number(params.get("forecast") || 60);
      var maxGpsDistanceM = Number(params.get("max_gps_km") || 80) * 1000;
      var cache = {};
      var inflight = {};
      var sites = null;
      var sitesError = null;
      var openSiteId = null;
      var lastListKey = null;
      var locationNote = "";
      var hassRef = null;

      function getHass() {
        if (hassRef && hassRef.states) return hassRef;
        var tryHass = function (candidate) {
          return candidate && candidate.states ? candidate : null;
        };
        try {
          var direct = tryHass(window.parent && window.parent.hass) || tryHass(window.top && window.top.hass);
          if (direct) { hassRef = direct; return direct; }
        } catch (e) {}
        var roots = [];
        try {
          if (window.parent) roots.push(window.parent);
          if (window.top && window.top !== window.parent) roots.push(window.top);
        } catch (e2) {}
        for (var r = 0; r < roots.length; r++) {
          try {
            var doc = roots[r].document;
            if (!doc) continue;
            var ha = doc.querySelector("home-assistant");
            if (tryHass(ha && ha.hass)) { hassRef = ha.hass; return ha.hass; }
            ha = doc.querySelector("home-assistant-main");
            if (tryHass(ha && ha.hass)) { hassRef = ha.hass; return ha.hass; }
          } catch (e3) {}
        }
        return null;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function readCoords(hass, entityId) {
        var state = hass.states[entityId];
        if (!state || !state.attributes) return null;
        var lat = Number(state.attributes.latitude);
        var lon = Number(state.attributes.longitude);
        if (!isFinite(lat) || !isFinite(lon)) return null;
        return { lat: lat, lon: lon };
      }

      function getSearchLocation(hass) {
        var personLoc = readCoords(hass, locationEntity);
        var homeLoc = readCoords(hass, homeZoneEntity);
        if (!personLoc && homeLoc) {
          locationNote = "Använder hemzon (ingen GPS från " + locationEntity + ")";
          return homeLoc;
        }
        if (!personLoc) return null;
        if (homeLoc) {
          var distFromHome = haversineMeters(personLoc.lat, personLoc.lon, homeLoc.lat, homeLoc.lon);
          if (distFromHome > maxGpsDistanceM) {
            locationNote = "GPS långt från hem — visar hållplatser nära hemzon";
            return homeLoc;
          }
        }
        locationNote = "Position från " + locationEntity;
        return personLoc;
      }

      function haversineMeters(lat1, lon1, lat2, lon2) {
        var toRad = function (v) { return (v * Math.PI) / 180; };
        var dLat = toRad(lat2 - lat1);
        var dLon = toRad(lon2 - lon1);
        var a = Math.pow(Math.sin(dLat / 2), 2) +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.pow(Math.sin(dLon / 2), 2);
        return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function formatDistance(meters) {
        if (meters < 1000) return Math.round(meters) + " m";
        return (meters / 1000).toFixed(1) + " km";
      }

      function formatClock(iso) {
        try {
          return new Date(iso).toLocaleTimeString("sv-SE", { hour: "numeric", minute: "numeric" });
        } catch (e) {
          return "";
        }
      }

      function lineClass(mode, designation, group) {
        if (mode === "BUS") return group === "blåbuss" ? "bus bus_" + designation + " blue" : "bus_red";
        if (mode === "METRO") return "metro";
        if (mode === "TRAIN") return "train";
        if (mode === "TRAM") return "tram";
        return "train";
      }

      function prepareDepartures(list) {
        var now = Date.now();
        var out = [];
        for (var i = 0; i < list.length; i++) {
          var dep = list[i];
          var expected = dep.expected || dep.scheduled;
          var expectedMs = expected ? new Date(expected).getTime() : Number.POSITIVE_INFINITY;
          if (isFinite(expectedMs) && expectedMs + 5 * 60 * 1000 < now) continue;
          out.push({ dep: dep, expectedMs: expectedMs });
        }
        out.sort(function (a, b) { return a.expectedMs - b.expectedMs; });
        return out;
      }

      function extractPayload(result) {
        if (!result) return {};
        if (result.service_response) {
          var sr = result.service_response;
          if (sr[SCRIPT_ENTITY]) return sr[SCRIPT_ENTITY];
          var keys = Object.keys(sr);
          if (keys.length === 1) return sr[keys[0]];
        }
        if (result.response) return result.response;
        if (result.departures || result.stop_deviations) return result;
        if (result.result && result.result.response) return result.result.response;
        return {};
      }

      function callDepartures(hass, siteId) {
        var serviceData = {
          entity_id: SCRIPT_ENTITY,
          variables: { site_id: String(siteId) },
        };
        if (hass.callApi) {
          return hass.callApi("POST", "services/script/turn_on?return_response", serviceData).then(extractPayload);
        }
        if (hass.connection && hass.connection.sendMessagePromise) {
          return hass.connection.sendMessagePromise({
            type: "call_service",
            domain: "script",
            service: "turn_on",
            service_data: serviceData,
            return_response: true,
          }).then(extractPayload);
        }
        if (hass.callService) {
          return hass.callService("script", "turn_on", serviceData, undefined, true).then(extractPayload);
        }
        return Promise.reject(new Error("Kunde inte anropa Home Assistant"));
      }

      function renderDepartures(siteId) {
        var entry = cache[String(siteId)];
        if (!entry) return '<div class="departures-empty">Öppna för att hämta avgångar…</div>';
        if (entry.loading) return '<div class="departures-empty">Hämtar avgångar…</div>';
        if (entry.error) return '<div class="departures-error">' + escapeHtml(entry.error) + "</div>";

        var html = "";
        if (entry.stop_deviations && entry.stop_deviations.length) {
          html += '<div class="stop-info">';
          for (var i = 0; i < entry.stop_deviations.length; i++) {
            var dev = entry.stop_deviations[i];
            html += "<div>" + escapeHtml(dev.message || dev.text || dev.title || "") + "</div>";
          }
          html += "</div>";
        }

        var deps = prepareDepartures(entry.departures || []);
        if (!deps.length) {
          return html + '<div class="departures-empty">Inga avgångar inom ' + forecastMinutes + " min.</div>";
        }

        html += '<div class="departures"><div class="row header"><div class="col icon"></div><div class="col main left">Linje</div><div class="col right">Avgång</div></div>';
        for (var j = 0; j < deps.length; j++) {
          var d = deps[j].dep;
          var line = d.line || {};
          var cancelled = String(d.state || "").toUpperCase() === "CANCELLED";
          var timeHtml = cancelled
            ? '<span class="cancelled-time">Inställd</span>'
            : formatClock(d.expected || d.scheduled);
          html +=
            '<div class="row"><div class="col icon"><span class="line-icon ' +
            lineClass(line.transport_mode, line.designation, line.group_of_lines) +
            '">' + escapeHtml(line.designation || "") + "</span></div>" +
            '<div class="col main left">' + escapeHtml(d.destination || "") + "</div>" +
            '<div class="col right">' + timeHtml + "</div></div>";
        }
        html += "</div>";
        return html;
      }

      function nearestStops(hass) {
        var loc = getSearchLocation(hass);
        if (!loc || !sites || !sites.length) return [];
        var list = [];
        for (var i = 0; i < sites.length; i++) {
          var s = sites[i];
          list.push({
            id: s.id,
            name: s.name,
            distance_m: haversineMeters(loc.lat, loc.lon, s.lat, s.lon),
          });
        }
        list.sort(function (a, b) { return a.distance_m - b.distance_m; });
        return list.slice(0, maxStops);
      }

      function updateDeparturePanel(siteId) {
        var panel = document.querySelector('.stop-accordion[data-site-id="' + siteId + '"] .stop-body');
        if (panel) panel.innerHTML = renderDepartures(siteId);
      }

      function renderStopList(hass) {
        var app = document.getElementById("app");
        if (!hass) {
          app.innerHTML = '<div class="status error">Kunde inte nå Home Assistant. Öppna via dashboarden.</div>';
          return;
        }
        if (sitesError) {
          app.innerHTML = '<div class="status error">' + escapeHtml(sitesError) + "</div>";
          return;
        }
        if (!sites) {
          app.innerHTML = '<div class="status">Laddar hållplatser…</div>';
          return;
        }
        var loc = getSearchLocation(hass);
        if (!loc) {
          app.innerHTML = '<div class="status">Ingen GPS-position från ' + escapeHtml(locationEntity) + ".</div>";
          return;
        }
        var stops = nearestStops(hass);
        if (!stops.length) {
          app.innerHTML = '<div class="status">Inga hållplatser hittades.</div>';
          return;
        }

        var listKey = stops.map(function (s) { return s.id; }).join(",");
        if (listKey === lastListKey && app.querySelector(".stop-accordion")) {
          var header = app.querySelector(".header");
          if (header) {
            header.innerHTML = "<strong>" + stops.length + " hållplatser</strong> — " + escapeHtml(locationNote);
          }
          for (var u = 0; u < stops.length; u++) {
            var distEl = app.querySelector('.stop-accordion[data-site-id="' + stops[u].id + '"] .stop-distance');
            if (distEl) distEl.textContent = formatDistance(stops[u].distance_m);
          }
          return;
        }
        lastListKey = listKey;

        var scrollY = window.scrollY || 0;
        var html = '<div class="header"><strong>' + stops.length + " hållplatser</strong> — " + escapeHtml(locationNote) + "</div>";
        for (var i = 0; i < stops.length; i++) {
          var stop = stops[i];
          html +=
            '<details class="stop-accordion" data-site-id="' + stop.id + '"' +
            (openSiteId === stop.id ? " open" : "") + ">" +
            '<summary class="stop-summary"><span class="stop-name">' + escapeHtml(stop.name) +
            '</span><span class="stop-distance">' + formatDistance(stop.distance_m) + "</span></summary>" +
            '<div class="stop-body">' + renderDepartures(stop.id) + "</div></details>";
        }
        app.innerHTML = html;
        window.scrollTo(0, scrollY);

        var nodes = app.querySelectorAll(".stop-accordion");
        for (var n = 0; n < nodes.length; n++) {
          nodes[n].addEventListener("toggle", onToggle);
        }
      }

      function onToggle(ev) {
        var details = ev.currentTarget;
        var siteId = Number(details.getAttribute("data-site-id"));
        if (!details.open) {
          if (openSiteId === siteId) openSiteId = null;
          return;
        }
        openSiteId = siteId;
        loadDepartures(getHass(), siteId);
      }

      function loadDepartures(hass, siteId) {
        if (!hass) return;
        var key = String(siteId);
        if (inflight[key]) return;
        var existing = cache[key];
        if (existing && (existing.departures || existing.error)) {
          updateDeparturePanel(siteId);
          return;
        }

        inflight[key] = true;
        cache[key] = { loading: true };
        updateDeparturePanel(siteId);

        callDepartures(hass, siteId).then(function (payload) {
          cache[key] = {
            loading: false,
            departures: payload.departures || [],
            stop_deviations: payload.stop_deviations || [],
          };
          updateDeparturePanel(siteId);
        }).catch(function (err) {
          var message = "Kunde inte hämta avgångar";
          if (err && err.message) message = err.message;
          else if (typeof err === "string") message = err;
          cache[key] = { loading: false, error: message };
          updateDeparturePanel(siteId);
        }).then(function () {
          inflight[key] = false;
        });
      }

      function loadSites() {
        return fetch("/local/sl-sites.json?v=20260727i")
          .then(function (r) {
            if (!r.ok) throw new Error("Kunde inte läsa sl-sites.json (" + r.status + ")");
            return r.json();
          })
          .then(function (data) {
            if (!Array.isArray(data)) throw new Error("sl-sites.json har oväntat format");
            sites = data;
          })
          .catch(function (err) {
            sitesError = err.message || String(err);
            sites = [];
          });
      }

      function tick() {
        if (openSiteId !== null) return;
        renderStopList(getHass());
      }

      loadSites().then(function () {
        renderStopList(getHass());
        setInterval(tick, 60000);
      });
    })();
  </script>
</body>
</html>
