<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SL närmaste hållplatser</title>
  <style>
    :root {
      color-scheme: dark light;
      font-family: var(--ha-font-family-body, Roboto, sans-serif);
    }
    body {
      margin: 0;
      padding: 0;
      background: var(--card-background-color, #1c1c1c);
      color: var(--primary-text-color, #e0e0e0);
    }
    .wrap { min-height: 100vh; }
    .status {
      padding: 16px;
      color: var(--secondary-text-color, #9e9e9e);
    }
    .status.error { color: var(--error-color, #f44336); }
    .stop-accordion { border-top: 1px solid var(--divider-color, rgba(255,255,255,.12)); }
    .stop-summary {
      list-style: none;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      cursor: pointer;
    }
    .stop-summary::-webkit-details-marker { display: none; }
    .stop-summary::after { content: "▾"; color: var(--secondary-text-color, #9e9e9e); }
    details[open] > .stop-summary::after { transform: rotate(180deg); }
    .stop-name { font-weight: 500; }
    .stop-distance { color: var(--secondary-text-color, #9e9e9e); white-space: nowrap; }
    .stop-body { padding: 0 8px 12px; }
    .departures-empty, .departures-error { padding: 8px 16px 12px; color: var(--secondary-text-color, #9e9e9e); }
    .departures-error { color: var(--error-color, #f44336); }
    .row { margin-top: 8px; display: flex; justify-content: space-between; }
    .col { display: flex; flex-direction: column; justify-content: center; }
    .col.icon { flex-basis: 40px; }
    .main { flex: 2; }
    .row.header { opacity: .7; font-size: .95rem; }
    .line-icon {
      border-radius: 3px;
      padding: 3px;
      min-width: 22px;
      height: 22px;
      font-weight: 500;
      display: inline-block;
      text-align: center;
      color: #fff;
    }
    .bus_red { background: #9e0e13; }
    .train { background: #ec619f; }
    .tram { background: #985141; }
    .stop-info {
      margin: 0 8px 8px;
      padding: 8px 12px 0;
      font-size: smaller;
      color: #fad370;
      border-top: 1px solid var(--divider-color, rgba(255,255,255,.12));
    }
    .cancelled-time { color: #e53935; font-weight: 600; }
    .warning-message { color: #ff9800; font-size: smaller; }
    .left { text-align: left; }
    .right { text-align: right; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="status">Startar…</div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var locationEntity = params.get("entity") || "person.ilias_bennani";
      var maxStops = Number(params.get("max") || 20);
      var forecastMinutes = Number(params.get("forecast") || 60);
      var cache = {};
      var sites = null;
      var sitesError = null;
      var openSiteId = null;

      function getHass() {
        try {
          var doc = window.parent && window.parent.document;
          if (!doc) return null;
          var ha = doc.querySelector("home-assistant");
          if (ha && ha.hass) return ha.hass;
          ha = doc.querySelector("home-assistant-main");
          if (ha && ha.hass) return ha.hass;
        } catch (e) {}
        return null;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getLocation(hass) {
        var state = hass.states[locationEntity];
        if (!state || !state.attributes) return null;
        var lat = Number(state.attributes.latitude);
        var lon = Number(state.attributes.longitude);
        if (!isFinite(lat) || !isFinite(lon)) return null;
        return { lat: lat, lon: lon };
      }

      function haversineMeters(lat1, lon1, lat2, lon2) {
        var toRad = function (v) { return (v * Math.PI) / 180; };
        var dLat = toRad(lat2 - lat1);
        var dLon = toRad(lon2 - lon1);
        var a = Math.pow(Math.sin(dLat / 2), 2) +
          Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.pow(Math.sin(dLon / 2), 2);
        return 6371000 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function formatDistance(meters) {
        if (meters < 1000) return Math.round(meters) + " m";
        return (meters / 1000).toFixed(1) + " km";
      }

      function formatClock(iso) {
        try {
          return new Date(iso).toLocaleTimeString("sv-SE", { hour: "numeric", minute: "numeric" });
        } catch (e) {
          return "";
        }
      }

      function lineClass(mode, designation, group) {
        if (mode === "BUS") return group === "blåbuss" ? "bus bus_" + designation + " blue" : "bus_red";
        if (mode === "TRAIN") return "train";
        if (mode === "TRAM") return "tram";
        return "train";
      }

      function prepareDepartures(list) {
        var now = Date.now();
        var out = [];
        for (var i = 0; i < list.length; i++) {
          var dep = list[i];
          var expected = dep.expected || dep.scheduled;
          var expectedMs = expected ? new Date(expected).getTime() : Number.POSITIVE_INFINITY;
          if (isFinite(expectedMs) && expectedMs + 5 * 60 * 1000 < now) continue;
          out.push({ dep: dep, expectedMs: expectedMs });
        }
        out.sort(function (a, b) { return a.expectedMs - b.expectedMs; });
        return out;
      }

      function renderDepartures(siteId) {
        var entry = cache[String(siteId)];
        if (!entry) return '<div class="departures-empty">Öppna för att hämta avgångar…</div>';
        if (entry.loading) return '<div class="departures-empty">Hämtar avgångar…</div>';
        if (entry.error) return '<div class="departures-error">' + escapeHtml(entry.error) + "</div>";

        var html = "";
        if (entry.stop_deviations && entry.stop_deviations.length) {
          html += '<div class="stop-info">';
          for (var i = 0; i < entry.stop_deviations.length; i++) {
            var dev = entry.stop_deviations[i];
            html += "<div>" + escapeHtml(dev.message || dev.text || dev.title || "") + "</div>";
          }
          html += "</div>";
        }

        var deps = prepareDepartures(entry.departures || []);
        if (!deps.length) {
          return html + '<div class="departures-empty">Inga avgångar inom ' + forecastMinutes + " min.</div>";
        }

        html += '<div class="departures"><div class="row header"><div class="col icon"></div><div class="col main left">Linje</div><div class="col right">Avgång</div></div>';
        for (var j = 0; j < deps.length; j++) {
          var d = deps[j].dep;
          var line = d.line || {};
          var cancelled = String(d.state || "").toUpperCase() === "CANCELLED";
          var timeHtml = cancelled
            ? '<span class="cancelled-time">Inställd</span>'
            : formatClock(d.expected || d.scheduled);
          html +=
            '<div class="row"><div class="col icon"><span class="line-icon ' +
            lineClass(line.transport_mode, line.designation, line.group_of_lines) +
            '">' + escapeHtml(line.designation || "") + '</span></div>' +
            '<div class="col main left">' + escapeHtml(d.destination || "") + '</div>' +
            '<div class="col right">' + timeHtml + "</div></div>";
        }
        html += "</div>";
        return html;
      }

      function nearestStops(hass) {
        var loc = getLocation(hass);
        if (!loc || !sites || !sites.length) return [];
        var list = [];
        for (var i = 0; i < sites.length; i++) {
          var s = sites[i];
          list.push({
            id: s.id,
            name: s.name,
            distance_m: haversineMeters(loc.lat, loc.lon, s.lat, s.lon),
          });
        }
        list.sort(function (a, b) { return a.distance_m - b.distance_m; });
        return list.slice(0, maxStops);
      }

      function render(hass) {
        var app = document.getElementById("app");
        if (!hass) {
          app.innerHTML = '<div class="status error">Kunde inte nå Home Assistant. Öppna via dashboarden.</div>';
          return;
        }
        if (sitesError) {
          app.innerHTML = '<div class="status error">' + escapeHtml(sitesError) + "</div>";
          return;
        }
        if (!sites) {
          app.innerHTML = '<div class="status">Laddar hållplatser…</div>';
          return;
        }
        var loc = getLocation(hass);
        if (!loc) {
          app.innerHTML = '<div class="status">Ingen GPS-position från ' + escapeHtml(locationEntity) + ".</div>";
          return;
        }
        var stops = nearestStops(hass);
        if (!stops.length) {
          app.innerHTML = '<div class="status">Inga hållplatser hittades.</div>';
          return;
        }

        var html = "";
        for (var i = 0; i < stops.length; i++) {
          var stop = stops[i];
          html +=
            '<details class="stop-accordion" data-site-id="' + stop.id + '"' +
            (openSiteId === stop.id ? " open" : "") + ">" +
            '<summary class="stop-summary"><span class="stop-name">' + escapeHtml(stop.name) +
            '</span><span class="stop-distance">' + formatDistance(stop.distance_m) + "</span></summary>" +
            '<div class="stop-body">' + renderDepartures(stop.id) + "</div></details>";
        }
        app.innerHTML = html;

        var nodes = app.querySelectorAll(".stop-accordion");
        for (var n = 0; n < nodes.length; n++) {
          nodes[n].addEventListener("toggle", function (ev) {
            var details = ev.currentTarget;
            var siteId = Number(details.getAttribute("data-site-id"));
            if (!details.open) {
              if (openSiteId === siteId) openSiteId = null;
              return;
            }
            openSiteId = siteId;
            loadDepartures(hass, siteId);
          });
        }
      }

      function loadDepartures(hass, siteId) {
        var key = String(siteId);
        if (cache[key] && !cache[key].loading && cache[key].departures) return;
        cache[key] = { loading: true };
        render(hass);
        hass.callService(
          "script",
          "turn_on",
          {
            entity_id: "script.sl_hamta_avgangar_for_hallplats",
            variables: { site_id: String(siteId) },
          },
          undefined,
          true
        ).then(function (result) {
          var payload = (result && result.response) || result || {};
          cache[key] = {
            loading: false,
            departures: payload.departures || [],
            stop_deviations: payload.stop_deviations || [],
          };
          render(hass);
        }).catch(function (err) {
          cache[key] = { loading: false, error: (err && err.message) || "Kunde inte hämta avgångar" };
          render(hass);
        });
      }

      function loadSites() {
        return fetch("/local/sl-sites.json")
          .then(function (r) {
            if (!r.ok) throw new Error("Kunde inte läsa sl-sites.json (" + r.status + ")");
            return r.json();
          })
          .then(function (data) {
            sites = data;
          })
          .catch(function (err) {
            sitesError = err.message || String(err);
            sites = [];
          });
      }

      function tick() {
        var hass = getHass();
        render(hass);
      }

      loadSites().then(function () {
        tick();
        setInterval(tick, 15000);
      });
    })();
  </script>
</body>
</html>
