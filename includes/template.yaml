        - sensor.dimmer_2_power_2
        - sensor.dimmer_2_power_21
        - sensor.wc_taklampa_power_24
        - sensor.dimmer_2_power_13
        - sensor.dimmer_2_power_19
        - sensor.dimmer_2_power_20
        - sensor.dimmer_2_power_12
        - sensor.dimmer_2_power
        - sensor.dimmer_2_power_6
        - sensor.dimmer_2_power_22
        - sensor.dimmer_2_power_4
        - sensor.dimmer_2_power_18
        - sensor.dimmer_2_power_3
