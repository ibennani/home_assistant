###############################################################################
# SENSORER (Standard Mall-sensorer)
###############################################################################

- sensor:

    # ---- Sol ----------------------------------------------------------------
    - name: Sunset time
      unique_id: sunset_time
      state: "{{ as_timestamp(state_attr('sun.sun','next_setting')) | timestamp_custom('%H:%M') }}"

    - name: sunrise_time
      unique_id: sunrise_time
      state: "{{ as_timestamp(state_attr('sun.sun','next_rising')) | timestamp_custom('%H:%M') }}"

    - name: Sol elevation
      unique_id: sun_elevation
      state: "{{ state_attr('sun.sun','elevation') }}"

    - name: sun_azimuth
      unique_id: sun_azimuth
      state: "{{ state_attr('sun.sun','azimuth') }}"

    - name: sun_next_noon
      unique_id: sun_next_noon
      state: "{{ as_timestamp(state_attr('sun.sun','next_noon')) | timestamp_custom('%H:%M') }}"

    - name: sun_next_midnight
      unique_id: sun_next_midnight
      state: "{{ as_timestamp(state_attr('sun.sun','next_midnight')) | timestamp_custom('%H:%M') }}"

    - name: sun_next_dawn
      unique_id: sun_next_dawn
      state: "{{ as_timestamp(state_attr('sun.sun','next_dawn')) | timestamp_custom('%H:%M') }}"

    - name: sun_next_dusk
      unique_id: sun_next_dusk
      state: "{{ as_timestamp(state_attr('sun.sun','next_dusk')) | timestamp_custom('%H:%M') }}"

    # Väderkort: en decimal för visning (källan har ofta två)
    - name: Framsidan temperatur visning
      unique_id: framsidan_temperatur_visning
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      state: "{{ states('sensor.framsidan_temperatur') | float(0) | round(1) }}"

    # ---- Ljusstyrka utomhus -------------------------------------------------
    - name: utomhus_ljusstyrka_differens
      unique_id: utomhus_ljusstyrka_differens
      state: >
        {{ (states('sensor.utomhus_framsidan_ljusstyrka') | int(0)
            - states('sensor.utomhus_baksidan_ljusstyrka') | int(0)) | abs }}

    - name: utomhus_ljusstyrka_differens_procent
      unique_id: utomhus_ljusstyrka_differens_procent
      unit_of_measurement: "%"
      state: >-
        {% set f = states('sensor.utomhus_framsidan_ljusstyrka') | float(0) %}
        {% set b = states('sensor.utomhus_baksidan_ljusstyrka') | float(0) %}
        {% if f == 0 and b == 0 %}
          0
        {% else %}
          {{ (((f - b) | abs / ((f + b) / 2)) * 100) | round(1) }}
        {% endif %}

    - name: utomhus_ljusstyrka_genomsnitt
      unique_id: utomhus_ljusstyrka_genomsnitt
      state: >
        {{ ((states('sensor.utomhus_baksidan_ljusstyrka') | int(0)
            + states('sensor.utomhus_framsidan_ljusstyrka') | int(0)) / 2) | int }}

    - name: Ljusstyrka framsidan maximal
      unique_id: 05s6df0a1sg0asg8dd1asgr1aaasgddda
      unit_of_measurement: lx
      state: >-
        {% set framsidan = states('sensor.utomhus_framsidan_ljusstyrka') | float(0) %}
        {% set fonstret = states('sensor.ilias_fonster_ljusstyrka') | float(0) %}
        {% if is_state('light.ljusslingan_pa_balkongen', 'on') %}
          {{ framsidan }}
        {% else %}
          {{ [framsidan, fonstret] | max }}
        {% endif %}

    - name: Nordpool elpris SE3 denna timme
      unique_id: elpriset_denna_timme
      state: >-
        {% set tid = now().strftime('%H') | int %}
        {{ state_attr('sensor.nordpool_kwh_se3_sek_3_10_025', 'today')[tid] }}

    - name: El-kostnad denna timme
      unique_id: elkostnad_denna_timme
      state: >-
        {{ states('sensor.accumulated_consumption_current_hour_eksharadsgatan_6') | float(0) }}

    - name: Lufttryck inomhus
      unique_id: indoor_pressure_mean_05s6df0a1sg0asg81asg8r00aaasdf
      unit_of_measurement: hPa
      state: >-
        {% set sensors = [
          states('sensor.ilias_rum_lufttryck') | float(0),
          states('sensor.netatmo_bennani_vs_inomhus_pressure') | float(0),
          states('sensor.sovrummet_lufttryck') | float(0),
          states('sensor.wc_lufttryck') | float(0),
          states('sensor.annas_rum_lufttryck') | float(0),
          states('sensor.koket_lufttryck') | float(0),
          states('sensor.skafferiet_lufttryck') | float(0),
          states('sensor.eriks_rum_lufttryck') | float(0),
          states('sensor.badrummet_lufttryck') | float(0),
          states('sensor.tvattstugan_lufttryck') | float(0),
          states('sensor.forradet_lufttryck') | float(0)
        ] %}
        {{ sensors | select('is_number') | average | round(1) }}

    - name: Lufttryck inomhus min
      unique_id: indoor_pressure_min_05s6df0a1sg0asg81asg8r0aasgsa
      unit_of_measurement: hPa
      state: >-
        {% set sensors = [
          states('sensor.ilias_rum_lufttryck') | float(0),
          states('sensor.netatmo_bennani_vs_inomhus_pressure') | float(0),
          states('sensor.sovrummet_lufttryck') | float(0),
          states('sensor.wc_lufttryck') | float(0),
          states('sensor.annas_rum_lufttryck') | float(0),
          states('sensor.koket_lufttryck') | float(0),
          states('sensor.skafferiet_lufttryck') | float(0),
          states('sensor.eriks_rum_lufttryck') | float(0),
          states('sensor.badrummet_lufttryck') | float(0),
          states('sensor.tvattstugan_lufttryck') | float(0),
          states('sensor.forradet_lufttryck') | float(0)
        ] %}
        {{ sensors | select('is_number') | min | round(1) }}

    - name: Lufttryck inomhus max
      unique_id: indoor_pressure_max_05s6df0a1sg0asg8dd1asgr1aaasg
      unit_of_measurement: hPa
      state: >-
        {% set sensors = [
          states('sensor.ilias_rum_lufttryck') | float(0),
          states('sensor.netatmo_bennani_vs_inomhus_pressure') | float(0),
          states('sensor.sovrummet_lufttryck') | float(0),
          states('sensor.wc_lufttryck') | float(0),
          states('sensor.annas_rum_lufttryck') | float(0),
          states('sensor.koket_lufttryck') | float(0),
          states('sensor.skafferiet_lufttryck') | float(0),
          states('sensor.eriks_rum_lufttryck') | float(0),
          states('sensor.badrummet_lufttryck') | float(0),
          states('sensor.tvattstugan_lufttryck') | float(0),
          states('sensor.forradet_lufttryck') | float(0)
        ] %}
        {{ sensors | select('is_number') | max | round(1) }}

    - name: Ljusstyrkan på framsidan i lux uppdelad på olika sektioner
      unique_id: ljusstyrka_framsidan_sektioner
      state: >
        {% set lux = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% if lux < 10 %}0
        {% elif lux < 100 %}1
        {% elif lux < 300 %}2
        {% elif lux < 1000 %}3
        {% elif lux < 2000 %}4
        {% elif lux < 4000 %}5
        {% elif lux < 6000 %}6
        {% elif lux < 8000 %}7
        {% elif lux < 13000 %}8
        {% elif lux < 20000 %}9
        {% elif lux < 23000 %}10
        {% else %}11
        {% endif %}
      attributes:
        lux: "{{ states('sensor.utomhus_framsidan_ljusstyrka') | int(0) }}"

    - name: Ljusstyrkan på baksidan i lux uppdelad på olika sektioner
      unique_id: ljusstyrka_baksidan_sektioner
      state: >
        {% set lux = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}
        {% if lux < 10 %}0
        {% elif lux < 100 %}1
        {% elif lux < 300 %}2
        {% elif lux < 1000 %}3
        {% elif lux < 2000 %}4
        {% elif lux < 4000 %}5
        {% elif lux < 6000 %}6
        {% elif lux < 8000 %}7
        {% elif lux < 13000 %}8
        {% elif lux < 20000 %}9
        {% elif lux < 23000 %}10
        {% else %}11
        {% endif %}
      attributes:
        lux: "{{ states('sensor.utomhus_baksidan_ljusstyrka') | int(0) }}"


    - name: "Hur ljust är det på framsidan?"
      unique_id: ljust_utomhus_framsidan
      state: >
        {% set lux = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% if lux < 10 %}Stjärnklart (nästan mörker)
        {% elif lux < 100 %}Mörkt
        {% elif lux < 300 %}Skymning
        {% elif lux < 1000 %}Dunkelt
        {% elif lux < 2000 %}Normal inomhusbelysning
        {% elif lux < 4000 %}Molnigt
        {% elif lux < 6000 %}Mulet
        {% elif lux < 8000 %}Halvklart
        {% elif lux < 13000 %}Klart
        {% elif lux < 20000 %}Soligt
        {% elif lux < 23000 %}Strålande solsken
        {% else %}Extremt starkt solljus
        {% endif %}
      attributes:
        lux: "{{ states('sensor.utomhus_framsidan_ljusstyrka') | int(0) }}"

    - name: "Hur ljust är det på baksidan?"
      unique_id: ljust_utomhus_baksidan
      state: >
        {% set lux = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}
        {% if lux < 10 %}Stjärnklart (nästan mörker)
        {% elif lux < 100 %}Mörkt
        {% elif lux < 300 %}Skymning
        {% elif lux < 1000 %}Dunkelt
        {% elif lux < 2000 %}Normal inomhusbelysning
        {% elif lux < 4000 %}Molnigt
        {% elif lux < 6000 %}Mulet
        {% elif lux < 8000 %}Halvklart
        {% elif lux < 13000 %}Klart
        {% elif lux < 20000 %}Soligt
        {% elif lux < 23000 %}Strålande solsken
        {% else %}Extremt starkt solljus
        {% endif %}
      attributes:
        lux: "{{ states('sensor.utomhus_baksidan_ljusstyrka') | int(0) }}"

