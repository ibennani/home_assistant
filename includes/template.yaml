# 1. Energin – Belysning (Aggregerad kWh)
- trigger:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id:
        - sensor.dimmer_2_electric_consumption_kwh_16
        - sensor.dimmer_2_electric_consumption_kwh_11
        - sensor.dimmer_2_electric_consumption_kwh_2
        - sensor.dimmer_2_electric_consumption_kwh_21
        - sensor.wc_taklampa_electric_consumption_kwh_24
        - sensor.dimmer_2_electric_consumption_kwh_13
        - sensor.dimmer_2_electric_consumption_kwh_18
        - sensor.dimmer_2_electric_consumption_kwh_12
        - sensor.dimmer_2_electric_consumption_kwh
        - sensor.dimmer_2_electric_consumption_kwh_20
        - sensor.dimmer_2_electric_consumption_kwh_22
        - sensor.dimmer_2_electric_consumption_kwh_19
        - sensor.dimmer_2_electric_consumption_kwh_4
        - sensor.dimmer_2_electric_consumption_kwh_3
        - sensor.dimmer_2_electric_consumption_kwh_14
        - sensor.dimmer_2_electric_consumption_kwh_15
        - sensor.takspottarna_i_forradet_electric_consumption_kwh
        - sensor.takspottar_badrummet_electric_consumption_kwh
        - sensor.takspott_duschen_electric_consumption_kwh
        - sensor.dimmer_2_electric_consumption_kwh_23
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh_3
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh_6
        - sensor.led_ovanfor_lilla_arbetsbanken_electric_consumption_kwh
        - sensor.rgbw_controller_2_electric_consumption_kwh_2
        - sensor.dimmer_2_electric_consumption_kwh_6
        - sensor.consumption_742
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh_2
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh_5
        - sensor.rgbw_controller_2_electric_consumption_kwh_3
        - sensor.dimmer_2_electric_consumption_kwh_5
        - sensor.dimmer_2_electric_consumption_kwh_10
        - sensor.dimmer_2_electric_consumption_kwh_9
        - sensor.dimmer_2_electric_consumption_kwh_8
        - sensor.dimmer_2_electric_consumption_kwh_17
        - sensor.smart_energy_plug_in_switch_electric_consumption_kwh_4
  sensor:
    - name: "Belysning energi totalt"
      unique_id: belysning_energi_totalt_kwh
      unit_of_measurement: "kWh"
      device_class: energy
      state_class: total_increasing
      state: >-
        {% set entities = ['sensor.dimmer_2_electric_consumption_kwh_16','sensor.dimmer_2_electric_consumption_kwh_11','sensor.dimmer_2_electric_consumption_kwh_2','sensor.dimmer_2_electric_consumption_kwh_21','sensor.wc_taklampa_electric_consumption_kwh_24','sensor.dimmer_2_electric_consumption_kwh_13','sensor.dimmer_2_electric_consumption_kwh_18','sensor.dimmer_2_electric_consumption_kwh_12','sensor.dimmer_2_electric_consumption_kwh','sensor.dimmer_2_electric_consumption_kwh_20','sensor.dimmer_2_electric_consumption_kwh_22','sensor.dimmer_2_electric_consumption_kwh_19','sensor.dimmer_2_electric_consumption_kwh_4','sensor.dimmer_2_electric_consumption_kwh_3','sensor.dimmer_2_electric_consumption_kwh_14','sensor.dimmer_2_electric_consumption_kwh_15','sensor.takspottarna_i_forradet_electric_consumption_kwh','sensor.takspottar_badrummet_electric_consumption_kwh','sensor.takspott_duschen_electric_consumption_kwh','sensor.dimmer_2_electric_consumption_kwh_23','sensor.smart_energy_plug_in_switch_electric_consumption_kwh','sensor.smart_energy_plug_in_switch_electric_consumption_kwh_3','sensor.smart_energy_plug_in_switch_electric_consumption_kwh_6','sensor.led_ovanfor_lilla_arbetsbanken_electric_consumption_kwh','sensor.rgbw_controller_2_electric_consumption_kwh_2','sensor.dimmer_2_electric_consumption_kwh_6','sensor.consumption_742','sensor.smart_energy_plug_in_switch_electric_consumption_kwh_2','sensor.smart_energy_plug_in_switch_electric_consumption_kwh_5','sensor.rgbw_controller_2_electric_consumption_kwh_3','sensor.dimmer_2_electric_consumption_kwh_5','sensor.dimmer_2_electric_consumption_kwh_10','sensor.dimmer_2_electric_consumption_kwh_9','sensor.dimmer_2_electric_consumption_kwh_8','sensor.dimmer_2_electric_consumption_kwh_17','sensor.smart_energy_plug_in_switch_electric_consumption_kwh_4'] %}
        {% set ns = namespace(total=0.0) %}
        {% for e in entities %}
          {% set ns.total = ns.total + (states(e) | float(0)) %}
        {% endfor %}
        {{ ns.total | round(3) }}

# 2. Belysning – effekt just nu (W), summerar group.energi_just_nu_kallor
