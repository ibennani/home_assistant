    # ---- Personer / hemma ---------------------------------------------------
    - name: Hur många personer är hemma
      unique_id: people_home_count
      unit_of_measurement: "st"
      state: >-
        {{ states.device_tracker
            | selectattr('state','eq','home')
            | rejectattr('entity_id','in',
                state_attr('group.family_phones','entity_id') | default([]))
            | list
            | count }}

    - name: Hur många familjemedlemmar är hemma
      unique_id: family_people_home_count
      unit_of_measurement: "personer"
      state: >-
        {{ states
            | selectattr('entity_id','in',
                state_attr('group.family_phones','entity_id') | default([]))
            | selectattr('state','eq','home')
            | list
            | count }}

    # ---- Disk / luftavfuktare -----------------------------------------------
    - name: Diskmaskinen diskar
      unique_id: diskmaskinen_diskar
      state: >-
        {% set p = states('sensor.diskmaskin_switch_power') | float(0) %}
        {% set klar = states('input_number.settings_diskmaskinen_energi_klar') | float(0) %}
        {% if p > 60 %}
          true
        {% elif p > klar and is_state('sensor.diskmaskinen_diskar','true') %}
          true
        {% else %}
          false
        {% endif %}

    - name: Luftavfuktaren torkar
      unique_id: luftavfuktaren_torkar
      state: >-
        {% set p = states('sensor.luftavfuktare_switch_power') | float(0) %}
        {% set klar = states('input_number.settings_luftavfuktaren_energi_klar') | float(0) %}
        {% if p > 100 %}
          true
        {% elif p > klar and is_state('sensor.luftavfuktaren_torkar','true') %}
          true
        {% else %}
          false
        {% endif %}

    - name: diskmaskin current operation mode
      unique_id: diskmaskin_current_operation_mode
      state: >-
        {% set s = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_operationstate') %}
        {{ (s.split('.')[-1]) if s not in ['unknown','unavailable','none',''] else 'Unknown' }}

    # ---- Media --------------------------------------------------------------
    - name: Sony-tv current source
      unique_id: sony_tv_current_source
      state: >-
        {% if is_state('media_player.sony_tv_i_vardagsrummet','off') %}
          off
        {% else %}
          {{ state_attr('media_player.sony_tv_i_vardagsrummet','media_content_id') }}
        {% endif %}

    - name: Google Home current volume
      unique_id: google_home_current_volume
      state: >-
        {% if is_state('media_player.googlehome_koket','off') %}
          off
        {% else %}
          {{ (state_attr('media_player.googlehome_koket','volume_level')
              | float(0) * 100) | round(0) }}
        {% endif %}

    - name: "Öppnade fönster och dörrar"
      unique_id: opened_doors_and_windows_count
      unit_of_measurement: st
      state: >
        {{
          expand('group.opened_doors_and_windows')
          | selectattr('state', 'eq', 'on')
          | list
          | count
        }}

    - name: "Öppna fönster och dörrar"
      unique_id: oppna_fonster_och_dorrar
      icon: mdi:door-open
      state: >
        {{
          expand('group.opened_doors_and_windows')
          | selectattr('state', 'eq', 'on')
          | list
          | count
        }}


    # Batteri- och offlinevarningar för dashboard + mobilnotis
    - name: Batterivarningar
      unique_id: batterivarningar
      state: >
        {%- set ignored = expand('group.ignored_offline_sensors') | map(attribute='entity_id') | list -%}
        {%- set temp_dev_ns = namespace(ids=[]) -%}
        {%- for x in expand('group.temp_sensors_with_bad_battery_indicators')
            if x.state == 'unavailable'
            or (((as_timestamp(now()) - (as_timestamp(x.last_updated)) | int(0)) / (12 * 3600)) | int(0) > 0 ) -%}
        {%- set dev_id = device_id(x.entity_id) -%}
        {%- if dev_id %}{% set temp_dev_ns.ids = temp_dev_ns.ids + [dev_id] %}{% endif -%}
        {%- endfor -%}
        {%- set ns = namespace(n=0) -%}
        {%- for entity_id in states.group.battery_levels.attributes.entity_id
            if states(entity_id) not in ['unknown', 'unavailable']
            and states(entity_id) | int(0) < 30 -%}
        {%- set ns.n = ns.n + 1 -%}
        {%- endfor -%}
        {%- for x in expand('group.temp_sensors_with_bad_battery_indicators')
            if x.state == 'unavailable'
            or (((as_timestamp(now()) - (as_timestamp(x.last_updated)) | int(0)) / (12 * 3600)) | int(0) > 0 ) -%}
        {%- set ns.n = ns.n + 1 -%}
        {%- endfor -%}
        {%- for x in expand('group.battery_levels')
            if x.state == 'unavailable'
            and x.entity_id not in ignored
            and device_id(x.entity_id) not in temp_dev_ns.ids -%}
        {%- set ns.n = ns.n + 1 -%}
        {%- endfor -%}
        {{ ns.n }}
      attributes:
        message: >
          {% macro batterivarning_namn(entity_id) -%}
            {%- set generic = ['batteri', 'temperatur', 'battery', 'humidity', 'pressure'] -%}
            {%- set fn = state_attr(entity_id, 'friendly_name') | default(entity_id) -%}
            {%- set dev = device_attr(entity_id, 'name') -%}
            {%- if fn | lower in generic and dev -%}
              {{ dev }}
            {%- elif fn | lower in generic -%}
              {{ entity_id.split('.')[1] | replace('_', ' ') | title }}
            {%- else -%}
              {{ fn }}
            {%- endif -%}
          {%- endmacro %}
          {% set ignored = expand('group.ignored_offline_sensors') | map(attribute='entity_id') | list %}
          {% set ns = namespace(items=[]) %}
          {% for entity_id in states.group.battery_levels.attributes.entity_id
              if states(entity_id) not in ['unknown', 'unavailable']
              and states(entity_id) | int(0) < 30 %}
          {% set ns.items = ns.items + ['* ' ~ batterivarning_namn(entity_id) ~ ': ' ~ states(entity_id) ~ ' %'] %}
          {% endfor %}
          {% set temp_ns = namespace(device_ids=[]) %}
          {% for x in expand('group.temp_sensors_with_bad_battery_indicators')
              if x.state == 'unavailable'
              or (((as_timestamp(now()) - (as_timestamp(x.last_updated)) | int(0)) / (12 * 3600)) | int(0) > 0 ) %}
          {% set status = 'offline' if x.state == 'unavailable' else 'offline (ingen data på 12h+)' %}
          {% set ns.items = ns.items + ['* ' ~ batterivarning_namn(x.entity_id) ~ ': ' ~ status] %}
          {% set dev_id = device_id(x.entity_id) %}
          {% if dev_id %}
          {% set temp_ns.device_ids = temp_ns.device_ids + [dev_id] %}
          {% endif %}
          {% endfor %}
          {% for x in expand('group.battery_levels')
              if x.state == 'unavailable'
              and x.entity_id not in ignored
              and device_id(x.entity_id) not in temp_ns.device_ids %}
          {% set ns.items = ns.items + ['* ' ~ batterivarning_namn(x.entity_id) ~ ': offline'] %}
          {% endfor %}
          {{ ns.items | join('\n') }}


###############################################################################
# BINARY SENSORS (Standard Mall-sensorer)
###############################################################################

- binary_sensor:

    # ---- Hushåll ------------------------------------------------------------
    - name: Brevlådans lucka
      unique_id: brevladans_lucka
      state: "{{ is_state('sensor.brevladans_lucka','22') }}"

    - name: Tvättmaskinen aktiv
      unique_id: tvattmaskinen_aktiv
      device_class: running
      delay_on: "00:03:00"
      delay_off: "00:02:00"
      state: "{{ states('sensor.tvattmaskinen_switch_power') | float(0) > 5 }}"

    - name: Badrum fullt upplyst manuellt
      unique_id: badrum_fullt_upplyst_manuellt
      icon: mdi:ceiling-light-multiple
      state: >-
        {% set dim = [
          'light.takspottar_badrummet',
          'light.led_badrummet_handfatet',
          'light.led_badrummet_kommoden',
          'light.takspott_duschen',
          'light.led_strip_i_duschen'
        ] %}
        {% set ns = namespace(ok=true) %}
        {% if not is_state('light.spegeln_badrummet', 'on') %}{% set ns.ok = false %}{% endif %}
        {% for e in dim %}
          {% if not is_state(e, 'on') %}{% set ns.ok = false %}{% endif %}
          {% if state_attr(e, 'brightness') | int(0) < 250 %}{% set ns.ok = false %}{% endif %}
        {% endfor %}
        {{ ns.ok }}

    # ---- Kalender -----------------------------------------------------------
    - name: "Julbelysning"
      unique_id: julbelysningen
      icon: >-
        {{ "mdi:string-lights" if this.state == "on" else "mdi:string-lights-off" }}

      state: >-
        {% set n = now() %}
        {% set season_year = n.year - 1 if (n.month == 1 and n.day <= 6) else n.year %}

        {# Första advent = söndagen mellan 27 nov och 3 dec (inklusive) #}
        {% set base = strptime(season_year ~ "-11-27", "%Y-%m-%d") %}
        {% set ns = namespace(first_advent=None) %}
        {% for i in range(0, 7) %}
          {% set d = base + timedelta(days=i) %}
          {% if ns.first_advent is none and d.weekday() == 6 %}
            {% set ns.first_advent = d %}
          {% endif %}
        {% endfor %}

        {% set start_dt    = ns.first_advent - timedelta(days=2) + timedelta(hours=13) %}
        {% set end_excl_dt = strptime((season_year + 1) ~ "-01-07 00:00:00", "%Y-%m-%d %H:%M:%S") %}

        {{ as_timestamp(n) >= as_timestamp(start_dt)
          and as_timestamp(n) < as_timestamp(end_excl_dt) }}

      attributes:
        season_year: >-
          {% set n = now() %}
          {{ n.year - 1 if (n.month == 1 and n.day <= 6) else n.year }}


