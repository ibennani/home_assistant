# 3. Solen på baksidan (Med tidsfördröjning och minnes-attribut)
- triggers:
    # Räkna om när ljusstyrkan på baksidan ändras.
    - trigger: state
      entity_id: sensor.utomhus_baksidan_ljusstyrka

    # Räkna om när solens azimuth ändras.
    - trigger: state
      entity_id: sensor.sun_azimuth

    # Behövs för att 15-minutersregeln ska kunna löpa ut.
    - trigger: time_pattern
      minutes: "/1"

  binary_sensor:
    - name: "Solen lyser in genom fönstren på baksidan"
      unique_id: solen_lyser_in_genom_fonstren_pa_baksidan

      state: >
        {% set brightness = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}
        {% set azimuth = states('sensor.sun_azimuth') | float(0) %}

        {% set sun_window_active = azimuth < 190 %}
        {% set brightness_high = brightness >= 13000 %}
        {% set brightness_below_since_ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}

        {% if not sun_window_active %}
          false
        {% elif brightness_high %}
          true
        {% elif brightness_below_since_ts > 0 %}
          {{ (now_ts - brightness_below_since_ts) < 900 }}
        {% else %}
          true
        {% endif %}

      attributes:
        # Unix-tidpunkt när ljusstyrkan först gick under gränsen medan solen var i rätt azimuth-intervall.
        brightness_below_since_ts: >
          {% set brightness = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}
          {% set azimuth = states('sensor.sun_azimuth') | float(0) %}

          {% set sun_window_active = azimuth < 190 %}
          {% set brightness_high = brightness >= 13000 %}
          {% set previous = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}

          {% if not sun_window_active or brightness_high %}
            0
          {% elif previous > 0 %}
            {{ previous }}
          {% else %}
            {{ as_timestamp(now()) }}
          {% endif %}

        # Endast för felsökning i Developer Tools.
        brightness_below_since_local: >
          {% set ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
          {% if ts > 0 %}
            {{ ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
          {% else %}
            {{ '' }}
          {% endif %}

      icon: >
        {% set brightness = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}
        {% set azimuth = states('sensor.sun_azimuth') | float(0) %}

        {% set sun_window_active = azimuth < 190 %}
        {% set brightness_high = brightness >= 13000 %}
        {% set brightness_below_since_ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}

        {% if sun_window_active and (
          brightness_high or
          (brightness_below_since_ts > 0 and (now_ts - brightness_below_since_ts) < 900)
        ) %}
          mdi:sun-wireless
        {% else %}
          mdi:sun-off-outline
        {% endif %}

# 3. Solen på framsidan
# På: solfönster aktivt och lux >= 13 000.
# Av: lux under 13 000 i minst 15 minuter i sträck (korta toppar nollställer timern).
- triggers:
    - trigger: state
      entity_id: sensor.utomhus_framsidan_ljusstyrka

    - trigger: state
      entity_id: sensor.sun_azimuth

    - trigger: state
      entity_id: sensor.sun_elevation

    # Behövs för att 15-minutersregeln ska kunna löpa ut.
    - trigger: time_pattern
      minutes: "/1"

  binary_sensor:
    - name: "Solen lyser in genom fönstren på framsidan"
      unique_id: solen_lyser_in_genom_fonstren_pa_framsidan

      state: >
        {% set brightness = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% set azimuth = states('sensor.sun_azimuth') | float(0) %}
        {% set elevation = states('sensor.sun_elevation') | float(0) %}
        {% set lux_threshold = 13000 %}
        {% set hold_seconds = 900 %}

        {% set sun_window_active = azimuth >= 225 and elevation <= 35 %}
        {% set brightness_high = brightness >= lux_threshold %}
        {% set below_since_ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set was_on = this.state == 'on' %}

        {% if not sun_window_active %}
          false
        {% elif brightness_high %}
          true
        {% elif below_since_ts > 0 %}
          {{ (now_ts - below_since_ts) < hold_seconds }}
        {% elif was_on %}
          true
        {% else %}
          false
        {% endif %}

      attributes:
        brightness_below_since_ts: >
          {% set brightness = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
          {% set azimuth = states('sensor.sun_azimuth') | float(0) %}
          {% set elevation = states('sensor.sun_elevation') | float(0) %}
          {% set lux_threshold = 13000 %}

          {% set sun_window_active = azimuth >= 225 and elevation <= 35 %}
          {% set brightness_high = brightness >= lux_threshold %}
          {% set previous = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
          {% set was_on = this.state == 'on' %}

          {% if not sun_window_active or brightness_high %}
            0
          {% elif previous > 0 %}
            {{ previous }}
          {% elif was_on and brightness < lux_threshold %}
            {{ as_timestamp(now()) }}
          {% else %}
            0
          {% endif %}

        brightness_below_since_local: >
          {% set ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
          {% if ts > 0 %}
            {{ ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
          {% else %}
            {{ '' }}
          {% endif %}

      icon: >
        {% set brightness = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% set azimuth = states('sensor.sun_azimuth') | float(0) %}
        {% set elevation = states('sensor.sun_elevation') | float(0) %}
        {% set lux_threshold = 13000 %}
        {% set hold_seconds = 900 %}

        {% set sun_window_active = azimuth >= 225 and elevation <= 35 %}
        {% set brightness_high = brightness >= lux_threshold %}
        {% set below_since_ts = this.attributes.brightness_below_since_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}
        {% set was_on = this.state == 'on' %}

        {% if sun_window_active and (
          brightness_high or
          (below_since_ts > 0 and (now_ts - below_since_ts) < hold_seconds) or
          (was_on and not brightness_high and below_since_ts == 0)
        ) %}
          mdi:sun-wireless
        {% else %}
          mdi:sun-off-outline
        {% endif %}

# 4. Ljust på framsidan dagtid på vintern (Med tidsfördröjning och minnes-attribut)
- triggers:
    # Räkna om när ljusstyrkan ändras.
    - trigger: state
      entity_id: sensor.utomhus_framsidan_ljusstyrka

    # Räkna om när temperaturen ändras.
    - trigger: state
      entity_id: sensor.netatmo_bennani_vs_utomhus_temperature

    # Behövs för att 15-minutersregeln ska kunna löpa ut.
    - trigger: time_pattern
      minutes: "/1"

  binary_sensor:
    - name: "Ljust på framsidan dagtid på vintern"
      unique_id: ljust_pa_framsidan_dagtid_pa_vintern

      state: >
        {% set brightness = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% set temp = states('sensor.netatmo_bennani_vs_utomhus_temperature') | float(0) %}
        {% set active = brightness >= 10000 and temp <= -5 %}
        {% set last_active_ts = this.attributes.last_active_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}

        {% if active %}
          true
        {% elif last_active_ts > 0 %}
          {{ (now_ts - last_active_ts) < 900 }}
        {% else %}
          false
        {% endif %}

      attributes:
        # Unix-tidpunkt när villkoret senast var aktivt.
        last_active_ts: >
          {% set brightness = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
          {% set temp = states('sensor.netatmo_bennani_vs_utomhus_temperature') | float(0) %}
          {% set active = brightness >= 10000 and temp <= -5 %}
          {% set previous = this.attributes.last_active_ts | default(0, true) | float(0) %}

          {% if active %}
            {{ as_timestamp(now()) }}
          {% elif previous > 0 %}
            {{ previous }}
          {% else %}
            0
          {% endif %}

# 5. Generell sol-sensor (Soligt ute) med tidsfördröjning
- triggers:
    # Räkna om när ljusstyrkan på framsidan ändras.
    - trigger: state
      entity_id: sensor.utomhus_framsidan_ljusstyrka

    # Räkna om när ljusstyrkan på baksidan ändras.
    - trigger: state
      entity_id: sensor.utomhus_baksidan_ljusstyrka

    # Räkna om när tröskelvärdet ändras.
    - trigger: state
      entity_id: input_number.settings_ljusstyrka_soligt_ute

    # Behövs för att 15-minutersregeln ska kunna löpa ut.
    - trigger: time_pattern
      minutes: "/1"

  binary_sensor:
    - name: "soligt"
      unique_id: soligt

      state: >
        {% set threshold = states('input_number.settings_ljusstyrka_soligt_ute') | int(0) %}
        {% set front = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% set back = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}

        {% set bright = front >= threshold or back >= threshold %}
        {% set last_bright_ts = this.attributes.last_bright_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}

        {% if bright %}
          true
        {% elif last_bright_ts > 0 %}
          {{ (now_ts - last_bright_ts) < 900 }}
        {% else %}
          false
        {% endif %}

      attributes:
        # Unix-tidpunkt när någon av ljussensorerna senast låg över tröskelvärdet.
        last_bright_ts: >
          {% set threshold = states('input_number.settings_ljusstyrka_soligt_ute') | int(0) %}
          {% set front = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
          {% set back = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}

          {% set bright = front >= threshold or back >= threshold %}
          {% set previous = this.attributes.last_bright_ts | default(0, true) | float(0) %}

          {% if bright %}
            {{ as_timestamp(now()) }}
          {% elif previous > 0 %}
            {{ previous }}
          {% else %}
            0
          {% endif %}

      icon: >
        {% set threshold = states('input_number.settings_ljusstyrka_soligt_ute') | int(0) %}
        {% set front = states('sensor.utomhus_framsidan_ljusstyrka') | int(0) %}
        {% set back = states('sensor.utomhus_baksidan_ljusstyrka') | int(0) %}

        {% set bright = front >= threshold or back >= threshold %}
        {% set last_bright_ts = this.attributes.last_bright_ts | default(0, true) | float(0) %}
        {% set now_ts = as_timestamp(now()) %}

        {% if bright or (last_bright_ts > 0 and (now_ts - last_bright_ts) < 900) %}
          mdi:weather-sunny
        {% else %}
          mdi:weather-cloudy
        {% endif %}

# Kollektivtrafik — buss 742 mot Huddinge sjukhus (Ekshäradsgatan)
- trigger:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: sensor.departure_sensor_eksharadsgatan_departures
      attribute: departures
  sensor:
    - name: Ekshäradsgatan buss 742 departures
      unique_id: eksharadsgatan_buss_742_departures
      state: >
        {% set deps = state_attr('sensor.departure_sensor_eksharadsgatan_departures', 'departures') | default([]) %}
        {% set ns = namespace(n=0) %}
        {% for d in deps %}
          {% if d.line.designation == '742' and d.direction_code == '2' and d.destination == 'Huddinge sjukhus' %}
            {% set ns.n = ns.n + 1 %}
          {% endif %}
        {% endfor %}
        {{ ns.n }}
      attributes:
        departures: >
          {% set deps = state_attr('sensor.departure_sensor_eksharadsgatan_departures', 'departures') | default([]) %}
          {% set ns = namespace(items=[]) %}
          {% for d in deps %}
            {% if d.line.designation == '742' and d.direction_code == '2' and d.destination == 'Huddinge sjukhus' %}
              {% set ns.items = ns.items + [d] %}
            {% endif %}
          {% endfor %}
          {{ ns.items }}

# Kollektivtrafik — pendeltåg filtrerat från Farsta strand (endast tåg linje 4x, riktning 2)
- trigger:
    - trigger: homeassistant
      event: start
    - trigger: state
      entity_id: sensor.departure_sensor_farsta_strand_station_departures
  sensor:
    - name: Farsta strand pendeltåg departures
      unique_id: farsta_strand_pendeltag_departures
      state: >
        {% set deps = state_attr('sensor.departure_sensor_farsta_strand_station_departures', 'departures') | default([]) %}
        {{ deps
           | selectattr('line.transport_mode', 'eq', 'TRAIN')
           | selectattr('direction_code', 'eq', '2')
           | selectattr('line.designation', 'match', '^4')
           | list | length }}
      attributes:
        departures: >
          {% set deps = state_attr('sensor.departure_sensor_farsta_strand_station_departures', 'departures') | default([]) %}
          {{ deps
             | selectattr('line.transport_mode', 'eq', 'TRAIN')
             | selectattr('direction_code', 'eq', '2')
             | selectattr('line.designation', 'match', '^4')
             | list }}