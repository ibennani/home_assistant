# SL Transport API — används av script.sl_hamta_site_avgangar (sl-nearby-stops-card)
sl_site_departures:
  url: "https://transport.integration.sl.se/v1/sites/{{ site_id }}/departures?forecast={{ forecast | default(60) }}"
  method: GET

# SL Journey Planner — hållplatser kvar på en avgång (sl-nearby-card)
# incl_mot_* styrs från kortet utifrån avgångens trafikslag (buss kräver t.ex. bara mot_5)
sl_journey_stops:
  url: >
    https://journeyplanner.integration.sl.se/v2/trips?type_origin=any&name_origin=909100100000{{ origin_site }}&type_destination=any&name_destination={{ dest_gid }}&calc_number_of_trips=3&incl_mot_0={{ incl_mot_0 | default('true') }}&incl_mot_2={{ incl_mot_2 | default('true') }}&incl_mot_3={{ incl_mot_3 | default('true') }}&incl_mot_4={{ incl_mot_4 | default('true') }}&incl_mot_5={{ incl_mot_5 | default('true') }}&incl_mot_9={{ incl_mot_9 | default('true') }}
  method: GET

# SL Journey Planner — slå upp hållplats-id från namn
sl_stop_finder:
  url: "https://journeyplanner.integration.sl.se/v2/stop-finder?name_sf={{ name }}&type_sf=any&any_obj_filter_sf=2"
  method: GET

# SL Journey Planner — restid mellan två hållplatser (t.ex. Huddinge → Farsta strand)
sl_journey_to_site:
  url: >
    https://journeyplanner.integration.sl.se/v2/trips?type_origin=any&name_origin=909100100000{{ origin_site }}&type_destination=any&name_destination=909100100000{{ dest_site }}&calc_number_of_trips=3&incl_mot_5=false&itdDate={{ itd_date }}&itdTime={{ itd_time }}
  method: GET

# Gångtid mellan två koordinater (OSRM, används av sl-nearby-card)
sl_walking_route:
  url: "https://router.project-osrm.org/route/v1/foot/{{ origin_lon }},{{ origin_lat }};{{ dest_lon }},{{ dest_lat }}?overview=false"
  method: GET

# SL Journey Planner — dörr till dörr (hållplats → koordinat, t.ex. Huddinge centrum → hem)
sl_journey_door_to_door:
  url: >
    https://journeyplanner.integration.sl.se/v2/trips?type_origin=any&name_origin=909100100000{{ origin_site }}&type_destination=coord&name_destination={{ dest_lon }}:{{ dest_lat }}:WGS84[dd.ddddd]&calc_number_of_trips=1&incl_mot_5=false&useRealtime=true&itdDate={{ itd_date }}&itdTime={{ itd_time }}
  method: GET
