- sensor:
    name: EdgeRouter DHCP klienter
    unique_id: edgerouter_dhcp_clients_raw
    command: python3 /config/scripts/edgerouter-dhcp-clients.py
    scan_interval: 60
    command_timeout: 120
    value_template: "{{ value_json.count | default(0) }}"
    json_attributes:
      - data

- sensor:
    name: UniFi WLAN klienter
    unique_id: unifi_wlan_clients_raw
    command: python3 /config/scripts/unifi-wlan-clients.py
    scan_interval: 60
    command_timeout: 20
    value_template: "{{ value_json.count | default(0) }}"
    json_attributes:
      - data

- sensor:
    name: Tvattmaskin kostnad vid klar runner
    unique_id: tvattmaskin_kostnad_vid_klar_runner
    command: python3 /config/scripts/tvattmaskin-berakna-kostnad-klar.py
    scan_interval: 864000
    command_timeout: 110
    value_template: "{{ value | default('ok') }}"
