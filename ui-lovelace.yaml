          - entity: button.bosch_sma67md06e_68a40e70cb46_stop
      - type: entities
        title: Diskmaskinens sensorer
        entities: 
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_selected_program
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_active_program
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_energyforecast
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_waterforecast
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_status_operationstate
          - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_setting_powerstate

      - type: custom:config-template-card
        entities:
          - sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
          - sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime
          - select.bosch_sma67md06e_68a40e70cb46_programs
        card:
          type: conditional
          conditions:
            - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
              state_not: "unavailable"
          card:
            type: vertical-stack
            cards:
              - type: markdown
                title: Diskmaskinen är igång
                content: >
                  {% set sluttid = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime') %}
                  {% set sluttid_ts = as_timestamp(sluttid) %}
                  {% set nu_ts = as_timestamp(now()) %}
                  {% set tid_kvar = sluttid_ts - nu_ts %}
                  {% set timmar = (tid_kvar // 3600) | int %}
                  {% set minuter = (tid_kvar % 3600) // 60 %}
                  {% set program = states('select.bosch_sma67md06e_68a40e70cb46_programs').split('.')[-1] %}
                  {% set program_formaterat = program | regex_replace(find='(\\D+)(\\d+)', replace='\\1 \\2') %}
                  Diskmaskinen är klar klockan {{ sluttid_ts | timestamp_custom('%R', true) }} (om {{ timmar }}:{{ '%02d' | format(minuter) }}).
                  Program: {{ program_formaterat }}
                variables:
                  value: states['sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress'].state
                condition: "{{ value | float(false) is not none and 0 <= value | float < 100 }}"
              - type: custom:bar-card
                entities:
                  - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
                    direction: right
                    max: 100
                    min: 0
                    positions:
                      icon: 'off'
                      indicator: 'off'
                      name: 'off'
                      value: 'inside'
                    height: 40px
                    width: 100%
                    tap_action:
                      action: none
      
      - type: custom:config-template-card
        entities:
          - sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative
          - sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime
          - select.bosch_sma67md06e_68a40e70cb46_programs
        card:
          type: conditional
          conditions:
            - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative
              state_not: "0:00"
          card:
            type: markdown
            title: Diskmaskinen startar med fördröjning
            content: >
              {% set fordrojning = states("sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative") %}
              {% set sluttid_raw = states("sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime") %}
              {% set nu = now() %}
              {% set start_tid = (nu + fordrojning | regex_replace(find=':', replace='h', count=1) | parse_duration).timestamp() %}
              {% set sluttid = start_tid + (sluttid_raw | regex_replace(find=':', replace='h', count=1) | parse_duration).seconds %}
              {% set program = states('select.bosch_sma67md06e_68a40e70cb46_programs').split('.')[-1] %}
              {% set program_formaterat = program | regex_replace(find='(\\D+)(\\d+)', replace='\\1 \\2') %}
              Diskmaskinen kommer starta kl {{ start_tid | timestamp_custom('%H:%M', true) }} 
              och vara klar kl {{ sluttid | timestamp_custom('%H:%M', true) }}.
              Program: {{ program_formaterat }}
        variables:
          start_in: states['sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_startinrelative'].state
          remaining_time: states['sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime']
        condition: "{{ start_in | float > 0 }}"
      
      - type: custom:config-template-card
        entities:
          - sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
          - select.bosch_sma67md06e_68a40e70cb46_programs
        card:
          type: conditional
          conditions:
            - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
              state: "unavailable"
          card:
            type: markdown
            title: Diskmaskinen står stilla
            content: >
              Inget är igång eller kommer starta senare.
              {% set program = states('select.bosch_sma67md06e_68a40e70cb46_programs').split('.')[-1] %}
              {% set program_formaterat = program | regex_replace(find='(\\D+)(\\d+)', replace='\\1 \\2') %}
#              Program: {{ program_formaterat }}
        variables:
          value: states['sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress'].state
        condition: "{{ value == 'unavailable' }}"
      

        
        
        
