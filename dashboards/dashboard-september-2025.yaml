        temperature_precision: 1
      forecast_action:
        hold_action:
          action: more-info
      current:
        secondary_info_attribute: cloud_coverage
        temperature_entity: sensor.framsidan_temperatur_visning
        temperature_precision: 1
    - &diskmaskin_status_kort
      type: vertical-stack
      cards:
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.diskmaskin_current_operation_mode
          state: Run
        card:
          type: vertical-stack
          cards:
          - type: markdown
            title: Diskmaskinen är igång
            content: |
              {% set sluttid_raw = states('sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_remainingprogramtime') %}
              {% set sluttid_ts = as_timestamp(sluttid_raw) if sluttid_raw not in ['unknown','unavailable','none',''] else none %}
              {% set tid_kvar = (sluttid_ts - as_timestamp(now())) if sluttid_ts is not none else none %}
              {% if tid_kvar is not none and tid_kvar < 0 %}{% set tid_kvar = 0 %}{% endif %}
              {% set timmar = (tid_kvar // 3600) | int if tid_kvar is not none else none %}
              {% set minuter = ((tid_kvar % 3600) // 60) | int if tid_kvar is not none else none %}
              {% set program_raw = states('select.bosch_sma67md06e_68a40e70cb46_programs') %}
              {% set program = program_raw.split('.')[-1] if program_raw not in ['unknown','unavailable','none',''] else 'Okänt program' %}
              {% set program_formaterat = program | regex_replace(find='(\\D+)(\\d+)', replace='\\1 \\2') %}
              {% if timmar is not none and minuter is not none %}
                {% if timmar > 0 %}
                  {% set tid_kvar_text = timmar ~ ' h ' ~ minuter ~ ' min' %}
                {% else %}
                  {% set tid_kvar_text = minuter ~ ' min' %}
                {% endif %}
              {% else %}
                {% set tid_kvar_text = none %}
              {% endif %}
              <table role="presentation" width="100%">
                <tr><td>Program: <strong>{{ program_formaterat }}°</strong>.</td></tr>
                <tr><td style="padding-top:8px;">
                  {%- if tid_kvar_text and sluttid_ts is not none -%}
                  Klar om {{ tid_kvar_text }} (kl {{ sluttid_ts | timestamp_custom('%H:%M', true) }}).
                  {%- elif sluttid_ts is not none -%}
                  Klar kl {{ sluttid_ts | timestamp_custom('%H:%M', true) }}.
                  {%- endif -%}
                </td></tr>
              </table>
          - type: custom:bar-card
            style: |-
              bar-card-backgroundbar {
                background: #042b06 !important;
                filter: none !important;
                opacity: 1 !important;
              }
              bar-card-currentbar {
                background: linear-gradient(
                  to var(--bar-direction, right),
                  #055e09 var(--bar-percent),
                  #042b06 var(--bar-percent)
                ) !important;
              }
            entities:
            - entity: sensor.bosch_sma67md06e_68a40e70cb46_bsh_common_option_programprogress
              color: '#055e09'
              direction: right
              max: 100
              min: 0
              positions:
                icon: 'off'
                indicator: 'off'
                name: 'off'
                value: inside
              height: 28px
              width: 100%
              tap_action:
                action: none
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.diskmaskin_current_operation_mode
          state: Ready
        card:
          type: markdown
          content: '**Diskmaskinen kommer starta senare**

            '
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.diskmaskin_current_operation_mode
          state: Inactive
        card:
          type: markdown
          content: '**Diskmaskinen står stilla**

            '
