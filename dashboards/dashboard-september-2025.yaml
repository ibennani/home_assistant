          \ {{ sensors | count }} st: Öppnade dörrar och fönster\n{% for sensor in sensors %}\n  * {{ sensor.name }} {% endfor\
          \ %}\n\n<p><a href=\"https://85gdgmd5j5v1zlxo4dmkybhmvol6ozqk.ui.nabu.casa/dashboard-september-2025/larm\">Se fördjupad\
          \ info om larmet och vad som är öppet</a></p>\n"
    - type: custom:weather-forecast-card
