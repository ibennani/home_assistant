            xaxis:
              lines:
                show: true
            strokeDashArray: 0.5
            strokeWidth: 0.5
          tooltip:
            enabled: false
          dataLabels:
            enabled: false
          legend:
            show: false
          xaxis:
            type: datetime
            tickAmount: 8
            labels:
              rotate: 0
              formatter: "EVAL:(value) => {\n  const d = new Date(value);\n  const h = d.getHours();\n  return [0, 6, 12,\
                \ 18].includes(h) ? ('0' + h).slice(-2) + ' ' : '';\n}\n"
          yaxis:
            forceNiceScale: true
            decimalsInFloat: 2
            labels:
              formatter: "EVAL:(val) => {\n  const num = parseFloat(val);\n  return num.toFixed(2).replace('.', ':') + ' kr';\n\
                }\n"
          plotOptions:
            bar:
              grouped: false
              columnWidth: 100%
          fill:
            type: solid
          stroke:
            show: false
          colors:
          - '#888888'
        now:
          show: true
          label: Nu
        header:
          show: true
          title: El-priser idag och imorgon
          show_states: true
          colorize_states: true
          standard_format: false
        graph_span: 2d
        span:
          start: day
        series:
        - entity: sensor.nordpool_kwh_se3_sek_3_10_025
          name: Nu
          unit: ' kr/kWh'
          float_precision: 2
          color: "EVAL:() => {\n  const v = parseFloat(states['sensor.nordpool_kwh_se3_sek_3_10_025']?.state);\n  if (isNaN(v))\
            \   return '#888888';\n  if (v < 0)      return '#809fff';\n  if (v < 0.50)   return '#809fff';\n  if (v < 1.00)\
            \   return '#28fccf';\n  if (v < 1.50)   return '#28fc61';\n  if (v < 2.00)   return '#ebfc28';\n  if (v < 3.00)\
            \   return '#fcd228';\n  if (v < 4.00)   return '#fc9628';\n  if (v < 5.00)   return '#fc3e28';\n  if (v < 6.00)\
            \   return '#fc289d';\n  return '#af28fc';\n}\n"
          data_generator: "const now = new Date();\nconst raw = entity.attributes.raw_today;\nconst arr = Array.isArray(raw)\
            \ ? raw : (typeof raw === 'string' ? JSON.parse(raw) : []);\nconst current = arr.find(e => {\n  const start =\
            \ new Date(e.start);\n  const end = new Date(e.end);\n  return now >= start && now < end;\n});\nif (current) {\n\
            \  const valNum = Math.round(Number(current.value) * 100) / 100; // numeriskt värde\n  return [[now.getTime(),\
            \ valNum]];\n}\nreturn [];\n"
          show:
            legend_value: false
            in_header: true
            header_color_threshold: false
            in_chart: false
          color_threshold:
          - value: -999
            color: '#809fff'
          - value: 0.5
            color: '#28fccf'
          - value: 1
            color: '#28fc61'
          - value: 1.5
            color: '#ebfc28'
          - value: 2
            color: '#fcd228'
          - value: 3
            color: '#fc9628'
          - value: 4
            color: '#fc3e28'
          - value: 5
            color: '#fc289d'
          - value: 6
            color: '#af28fc'
        - entity: sensor.nordpool_kwh_se3_sek_3_10_025
          name: Idag
          type: column
          data_generator: "const raw = entity.attributes.raw_today; const arr = Array.isArray(raw) ? raw : (typeof raw ===\
            \ 'string' ? JSON.parse(raw) : []); const colorFor = (v) => {\n  if (isNaN(v))   return '#888888';\n  if (v <\
            \ 0)      return '#809fff';\n  if (v < 0.50)   return '#809fff';\n  if (v < 1.00)   return '#28fccf';\n  if (v\
            \ < 1.50)   return '#28fc61';\n  if (v < 2.00)   return '#ebfc28';\n  if (v < 3.00)   return '#fcd228';\n  if\
            \ (v < 4.00)   return '#fc9628';\n  if (v < 5.00)   return '#fc3e28';\n  if (v < 6.00)   return '#fc289d';\n \
            \ return '#af28fc';\n}; return arr.map((e) => {\n  const val = Number(e.value);\n  const time = new Date(e.start);\n\
            \  if (Number.isNaN(val) || !time) return null;\n  return { x: time, y: val, fillColor: colorFor(val) };\n}).filter(Boolean);\n"
          show:
            legend_value: false
            in_header: false
            extremas: false
            datalabels: false
          extend_to: end
        - entity: sensor.nordpool_kwh_se3_sek_3_10_025
          name: Imorgon
          type: column
          data_generator: "const raw = entity.attributes.raw_tomorrow; const arr = Array.isArray(raw) ? raw : (typeof raw\
            \ === 'string' ? JSON.parse(raw) : []); const dim = (hex, alpha=0.75) => {\n  const h = hex.replace('#','');\n\
            \  const r = parseInt(h.substring(0,2),16);\n  const g = parseInt(h.substring(2,4),16);\n  const b = parseInt(h.substring(4,6),16);\n\
            \  return `rgba(${r},${g},${b},${alpha})`;\n}; const colorForBase = (v) => {\n  if (isNaN(v))   return '#888888';\n\
            \  if (v < 0)      return '#809fff';\n  if (v < 0.50)   return '#809fff';\n  if (v < 1.00)   return '#28fccf';\n\
            \  if (v < 1.50)   return '#28fc61';\n  if (v < 2.00)   return '#ebfc28';\n  if (v < 3.00)   return '#fcd228';\n\
            \  if (v < 4.00)   return '#fc9628';\n  if (v < 5.00)   return '#fc3e28';\n  if (v < 6.00)   return '#fc289d';\n\
            \  return '#af28fc';\n}; return arr.map((e) => {\n  const val = Number(e.value);\n  const time = new Date(e.start);\n\
            \  if (Number.isNaN(val) || !time) return null;\n  return { x: time, y: val, fillColor: dim(colorForBase(val),\
            \ 0.70) };\n}).filter(Boolean);\n"
          show:
            legend_value: false
            in_header: false
            extremas: false
            datalabels: false
          extend_to: end
    - type: vertical-stack
      title: El-priset idag och imorgon
      cards:
      - type: markdown
        content: "{# =========================\n   Nordpool sammanfattning (Idag + Imorgon om publicerad)\n   - Intervall:\
          \ Natt 00–06 (00:00–05:59), Dagtid 10–20 (10:00–19:59)\n   - Färgmarkering av alla prisvärden enligt given palett\n\
          \   - Priser visas alltid med två decimaler och kolon som decimalskiljare (t.ex. 1:50)\n   =========================\
          \ #}\n\n{# ---------- Färgpalett baserad på prisintervall ---------- #}\n{% macro price_color(v) -%}\n  {% set v\
          \ = (v | float(0)) -%}\n  {%- if v < 0 -%}#809fff\n  {%- elif v < 0.50 -%}#809fff\n  {%- elif v < 1.00 -%}#28fccf\n\
          \  {%- elif v < 1.50 -%}#28fc61\n  {%- elif v < 2.00 -%}#ebfc28\n  {%- elif v < 3.00 -%}#fcd228\n  {%- elif v <\
          \ 4.00 -%}#fc9628\n  {%- elif v < 5.00 -%}#fc3e28\n  {%- elif v < 6.00 -%}#fc289d\n  {%- else -%}#af28fc\n  {%-\
          \ endif -%}\n{%- endmacro %}\n\n{# ---------- Formatterare: alltid 2 decimaler och kolon som decimaltecken ----------\
          \ #}\n{% macro fmt_price(v) -%}\n  {%- set v = (v | float(0)) -%}\n  {%- set s = (\"%.2f\" | format(v)) -%}\n  {{\
          \ s | replace('.', ':') }}\n{%- endmacro %}\n\n{# ---------- Utskrift: färgat pris + \" kr\" ---------- #}\n{% macro\
          \ price_span(v) -%}\n  {%- set v = (v | float(0)) -%}\n  <font color=\"{{ price_color(v) }}\">{{ fmt_price(v) }}\
          \ kr</font>\n{%- endmacro %}\n\n{%- set entity = 'sensor.nordpool_kwh_se3_sek_3_10_025' -%}\n{%- set day_start_hour\
          \ = 10 -%}\n{%- set day_end_hour_exclusive = 20 -%}\n\n# Dagens el-pris:\n{% set raw = state_attr(entity, 'raw_today')\
          \ -%}\n{%- set slots = (raw | from_json) if (raw is string) else (raw or []) -%}\n\n{%- set ns = namespace(\n  sum=0.0,\
          \ cnt=0,\n  sum_night=0.0, cnt_night=0,\n  sum_day=0.0, cnt_day=0,\n\n  min_day=None, min_day_start=None, min_day_end=None,\n\
          \  max_day=None, max_day_start=None, max_day_end=None,\n\n  min_all=None, min_all_start=None, min_all_end=None,\n\
          \  max_all=None, max_all_start=None, max_all_end=None\n) -%}\n\n{%- for s in slots %}\n  {%- set v = (s.value |\
          \ float(0)) -%}\n  {%- set t = as_datetime(s.start) -%}\n\n  {%- set ns.sum = ns.sum + v -%}\n  {%- set ns.cnt =\
          \ ns.cnt + 1 -%}\n\n  {# Natt 00:00–05:59 #}\n  {%- if t and t.hour < 6 -%}\n    {%- set ns.sum_night = ns.sum_night\
          \ + v -%}\n    {%- set ns.cnt_night = ns.cnt_night + 1 -%}\n  {%- endif -%}\n\n  {# Dagtid 10:00–19:59 #}\n  {%-\
          \ if t and day_start_hour <= t.hour < day_end_hour_exclusive -%}\n    {%- set ns.sum_day = ns.sum_day + v -%}\n\
          \    {%- set ns.cnt_day = ns.cnt_day + 1 -%}\n\n    {%- if ns.min_day is none or v < ns.min_day -%}\n      {%- set\
          \ ns.min_day = v -%}\n      {%- set ns.min_day_start = as_datetime(s.start) -%}\n      {%- set ns.min_day_end  \
          \ = as_datetime(s.end) -%}\n    {%- endif -%}\n\n    {%- if ns.max_day is none or v > ns.max_day -%}\n      {%-\
          \ set ns.max_day = v -%}\n      {%- set ns.max_day_start = as_datetime(s.start) -%}\n      {%- set ns.max_day_end\
          \   = as_datetime(s.end) -%}\n    {%- endif -%}\n  {%- endif -%}\n\n  {# Billigast hela dygnet #}\n  {%- if ns.min_all\
          \ is none or v < ns.min_all -%}\n    {%- set ns.min_all = v -%}\n    {%- set ns.min_all_start = as_datetime(s.start)\
          \ -%}\n    {%- set ns.min_all_end   = as_datetime(s.end) -%}\n  {%- endif -%}\n\n  {# Dyrast hela dygnet #}\n  {%-\
          \ if ns.max_all is none or v > ns.max_all -%}\n    {%- set ns.max_all = v -%}\n    {%- set ns.max_all_start = as_datetime(s.start)\
          \ -%}\n    {%- set ns.max_all_end   = as_datetime(s.end) -%}\n  {%- endif -%}\n{%- endfor %}\n\n{%- set avg_all\
          \ = (ns.sum / ns.cnt) if ns.cnt > 0 else 0 -%}\n{%- set avg_night = (ns.sum_night / ns.cnt_night) if ns.cnt_night\
          \ > 0 else 0 -%}\n{%- set avg_day = (ns.sum_day / ns.cnt_day) if ns.cnt_day > 0 else 0 -%}\n\nSnittpris hela dygnet:\
          \ {{ price_span(avg_all) }}.\nSnittpris på natten (00–06): {{ price_span(avg_night) }}.\nSnittpris på dagtid (10–20):\
          \ {{ price_span(avg_day) }}.\n{%- if ns.min_day_start %}\nMinpris på dagtid: Kl {{ ns.min_day_start.strftime('%H:%M')\
          \ }}–{{ ns.min_day_end.strftime('%H:%M') }}, {{ price_span(ns.min_day) }}.\n{%- else %}\nMinpris på dagtid: saknas\
          \ (inga dagtids-slotar).\n{%- endif %}\n{%- if ns.max_day_start %}\nMaxpris på dagtid: Kl {{ ns.max_day_start.strftime('%H:%M')\
          \ }}–{{ ns.max_day_end.strftime('%H:%M') }}, {{ price_span(ns.max_day) }}.\n{%- else %}\nMaxpris på dagtid: saknas\
          \ (inga dagtids-slotar).\n{%- endif %}\n{%- if ns.min_all_start %}\nBilligast hela dygnet: Kl {{ ns.min_all_start.strftime('%H:%M')\
          \ }}–{{ ns.min_all_end.strftime('%H:%M') }}, {{ price_span(ns.min_all) }}.\n{%- endif %}\n{%- if ns.max_all_start\
          \ %}\nDyrast hela dygnet: Kl {{ ns.max_all_start.strftime('%H:%M') }}–{{ ns.max_all_end.strftime('%H:%M') }}, {{\
          \ price_span(ns.max_all) }}.\n{%- endif %}\n\n{%- if is_state_attr(entity, 'tomorrow_valid', true) %}\n\n# Morgondagens\
          \ el-pris:\n{% set raw2 = state_attr(entity, 'raw_tomorrow') -%}\n{%- set slots2 = (raw2 | from_json) if (raw2 is\
          \ string) else (raw2 or []) -%}\n\n{%- set ns2 = namespace(\n  sum=0.0, cnt=0,\n  sum_night=0.0, cnt_night=0,\n\
          \  sum_day=0.0, cnt_day=0,\n\n  min_day=None, min_day_start=None, min_day_end=None,\n  max_day=None, max_day_start=None,\
          \ max_day_end=None,\n\n  min_all=None, min_all_start=None, min_all_end=None,\n  max_all=None, max_all_start=None,\
          \ max_all_end=None\n) -%}\n\n{%- for s in slots2 %}\n  {%- set v = (s.value | float(0)) -%}\n  {%- set t = as_datetime(s.start)\
          \ -%}\n\n  {%- set ns2.sum = ns2.sum + v -%}\n  {%- set ns2.cnt = ns2.cnt + 1 -%}\n\n  {%- if t and t.hour < 6 -%}\n\
          \    {%- set ns2.sum_night = ns2.sum_night + v -%}\n    {%- set ns2.cnt_night = ns2.cnt_night + 1 -%}\n  {%- endif\
          \ -%}\n\n  {%- if t and day_start_hour <= t.hour < day_end_hour_exclusive -%}\n    {%- set ns2.sum_day = ns2.sum_day\
          \ + v -%}\n    {%- set ns2.cnt_day = ns2.cnt_day + 1 -%}\n\n    {%- if ns2.min_day is none or v < ns2.min_day -%}\n\
          \      {%- set ns2.min_day = v -%}\n      {%- set ns2.min_day_start = as_datetime(s.start) -%}\n      {%- set ns2.min_day_end\
          \   = as_datetime(s.end) -%}\n    {%- endif -%}\n\n    {%- if ns2.max_day is none or v > ns2.max_day -%}\n     \
          \ {%- set ns2.max_day = v -%}\n      {%- set ns2.max_day_start = as_datetime(s.start) -%}\n      {%- set ns2.max_day_end\
          \   = as_datetime(s.end) -%}\n    {%- endif -%}\n  {%- endif -%}\n\n  {%- if ns2.min_all is none or v < ns2.min_all\
          \ -%}\n    {%- set ns2.min_all = v -%}\n    {%- set ns2.min_all_start = as_datetime(s.start) -%}\n    {%- set ns2.min_all_end\
          \   = as_datetime(s.end) -%}\n  {%- endif -%}\n\n  {%- if ns2.max_all is none or v > ns2.max_all -%}\n    {%- set\
          \ ns2.max_all = v -%}\n    {%- set ns2.max_all_start = as_datetime(s.start) -%}\n    {%- set ns2.max_all_end   =\
          \ as_datetime(s.end) -%}\n  {%- endif -%}\n{%- endfor %}\n\n{%- set avg2_all = (ns2.sum / ns2.cnt) if ns2.cnt >\
          \ 0 else 0 -%}\n{%- set avg2_night = (ns2.sum_night / ns2.cnt_night) if ns2.cnt_night > 0 else 0 -%}\n{%- set avg2_day\
          \ = (ns2.sum_day / ns2.cnt_day) if ns2.cnt_day > 0 else 0 -%}\n\nSnittpris hela dygnet: {{ price_span(avg2_all)\
          \ }}.\nSnittpris på natten (00–06): {{ price_span(avg2_night) }}.\nSnittpris på dagtid (10–20): {{ price_span(avg2_day)\
          \ }}.\n{%- if ns2.min_day_start %}\nMinpris på dagtid: Kl {{ ns2.min_day_start.strftime('%H:%M') }}–{{ ns2.min_day_end.strftime('%H:%M')\
          \ }}, {{ price_span(ns2.min_day) }}.\n{%- else %}\nMinpris på dagtid: saknas (inga dagtids-slotar).\n{%- endif %}\n\
          {%- if ns2.max_day_start %}\nMaxpris på dagtid: Kl {{ ns2.max_day_start.strftime('%H:%M') }}–{{ ns2.max_day_end.strftime('%H:%M')\
          \ }}, {{ price_span(ns2.max_day) }}.\n{%- else %}\nMaxpris på dagtid: saknas (inga dagtids-slotar).\n{%- endif %}\n\
          {%- if ns2.min_all_start %}\nBilligast hela dygnet: Kl {{ ns2.min_all_start.strftime('%H:%M') }}–{{ ns2.min_all_end.strftime('%H:%M')\
          \ }}, {{ price_span(ns2.min_all) }}.\n{%- endif %}\n{%- if ns2.max_all_start %}\nDyrast hela dygnet: Kl {{ ns2.max_all_start.strftime('%H:%M')\
          \ }}–{{ ns2.max_all_end.strftime('%H:%M') }}, {{ price_span(ns2.max_all) }}.\n{%- endif %}\n\n{%- else %}\n{{ \"\
          \\n\" }}Morgondagens el-priser publiceras idag mellan kl 13:00 och 13:30.\n{%- endif %}\n\n[Se detaljerad info om\
          \ el-förbrukningen](https://85gdgmd5j5v1zlxo4dmkybhmvol6ozqk.ui.nabu.casa/dashboard-september-2025/el-forbrukning)\n"
  header:
