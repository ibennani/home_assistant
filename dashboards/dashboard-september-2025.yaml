        color: '#4dff59'
      - from: 1000
        color: '#beff4d'
      - from: 1500
        color: '#fff426'
      - from: 2000
        color: '#ff9a26'
      - from: 2500
        color: '#ff2626'
      - from: 3000
        color: '#fa2593'
      - from: 3500
        color: '#ff26a5'
      - from: 4000
        color: '#9d26ff'
    - type: custom:apexcharts-card
      apex_config:
        chart:
          animations:
            enabled: false
        annotations:
          xaxis:
          - x: EVAL:new Date(new Date().setHours(24, 0, 0, 0))
            borderColor: '#ff4081'
            strokeDashArray: 0
            label:
              text: Midnatt
              style:
                color: '#ffffff'
                background: '#ff4081'
        grid:
          yaxis:
            lines:
              show: true
          xaxis:
            lines:
              show: true
          strokeDashArray: 0.5
          strokeWidth: 0.5
        tooltip:
          enabled: false
        dataLabels:
          enabled: false
        legend:
          show: false
        xaxis:
          type: datetime
          tickAmount: 8
          labels:
            rotate: 0
            formatter: "EVAL:(value) => {\n  const d = new Date(value);\n  const h = d.getHours();\n  return [0, 6, 12, 18].includes(h)\
              \ ? ('0' + h).slice(-2) + ' ' : '';\n}\n"
        yaxis:
          forceNiceScale: true
          decimalsInFloat: 2
          labels:
            formatter: "EVAL:(val) => {\n  const num = parseFloat(val);\n  return num.toFixed(2).replace('.', ':') + ' kr';\n\
              }\n"
        plotOptions:
          bar:
            grouped: false
            columnWidth: 100%
        fill:
          type: solid
        stroke:
          show: false
        colors:
        - '#888888'
      now:
        show: true
        label: Nu
      header:
        show: true
        title: El-priser idag och imorgon
        show_states: true
        colorize_states: true
        standard_format: false
