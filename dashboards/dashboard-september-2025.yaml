  - type: grid
    cards:
    - type: heading
      heading: Detaljerad information
      heading_style: title
    - type: markdown
      content: "{# ---------- Färgpalett baserad på prisintervall ---------- #}\n{% macro price_color(v) -%}\n  {% set v =\
        \ (v | float(0)) -%}\n  {%- if v < 0 -%}#809fff\n  {%- elif v < 0.50 -%}#809fff\n  {%- elif v < 1.00 -%}#28fccf\n\
        \  {%- elif v < 1.50 -%}#28fc61\n  {%- elif v < 2.00 -%}#ebfc28\n  {%- elif v < 3.00 -%}#fcd228\n  {%- elif v < 4.00\
        \ -%}#fc9628\n  {%- elif v < 5.00 -%}#fc3e28\n  {%- elif v < 6.00 -%}#fc289d\n  {%- else -%}#af28fc\n  {%- endif -%}\n\
        {%- endmacro %}\n\n{# ---------- En rad per slot ---------- #}\n{% macro slot_row(price, idx, mark_now=false) -%}\n\
        \  {%- set v = price | float(0) -%}\n  {%- set sh = \"%02d:%02d\" % ( (idx*15)//60 , (idx*15)%60 ) -%}\n  {%- set\
        \ eh = \"%02d:%02d\" % ( ((idx+1)*15)//60 , ((idx+1)*15)%60 ) -%}\nKl {{ sh }}–{{ eh }}: <font color=\"{{ price_color(v)\
        \ }}\">{{ \"%.2f\" | format(v) }} kr</font>{% if mark_now %} ← Priset just nu{% endif %}\n{%- endmacro %}\n\n{# ----------\
        \ Idag ---------- #}\n{%- set today = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025','today') or [] -%}\n{%- set\
        \ now_idx = ((now().hour*60 + now().minute) // 15) -%}\n**Idag {{ now().strftime('%Y-%m-%d') }}**\n{% for v in today\
        \ %}\n{{ slot_row(v, loop.index0, loop.index0 == now_idx) }}\n{%- if (loop.index % 4) == 0 and not loop.last %}\n\n\
        {% endif %}\n{%- endfor %}\n\n{# ---------- Imorgon ---------- #}\n{%- if is_state_attr('sensor.nordpool_kwh_se3_sek_3_10_025','tomorrow_valid',\
        \ true) -%}\n\n---\n\n{%- set tomorrow = state_attr('sensor.nordpool_kwh_se3_sek_3_10_025','tomorrow') or [] -%}\n\
        **Imorgon {{ (now() + timedelta(days=1)).strftime('%Y-%m-%d') }}**\n{% for v in tomorrow %}\n{{ slot_row(v, loop.index0,\
        \ false) }}\n{%- if (loop.index % 4) == 0 and not loop.last %}\n\n{% endif %}\n{%- endfor %}\n{%- else -%}\n\n---\n\
        \n*Morgondagens el-pris publiceras idag efter kl 13.*\n{%- endif -%}"
      title: El-priset varje kvart
